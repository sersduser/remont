/* ── Смежность помещений [чат 016] ─────────────────────────────
   Зачем: порядок работ зависит не только от технологии, но и от того,
   как комнаты связаны между собой. Полы нельзя залить везде разом —
   иначе к дальней комнате не подойти; порядок считаем обходом графа
   от выхода. Связь всегда двусторонняя: помечая соседа, пишем обе строки. */
const adjMap = () => { const m = {}; (D.adjacency || []).forEach(a => { m[a.code] = a.near || []; }); return m; };
const adjOf  = (code) => adjMap()[code] || [];

async function adjWrite(code, list){
  const r = roomList().find(x => x.code === code);
  const known = (D.adjacency || []).some(a => a.code === code);
  const val = list.join(",");
  if(known) await writeCell("12_Смежность", code, "Смежные", val);
  else await crewAppend("12_Смежность", [{ "Код": code, "Помещение": r ? r.name : code, "Смежные": val, "Примечание": "" }]);
}

async function adjToggle(code, other){
  const a = adjOf(code).slice(), b = adjOf(other).slice();
  const i = a.indexOf(other);
  if(i >= 0){ a.splice(i, 1); const j = b.indexOf(code); if(j >= 0) b.splice(j, 1); }
  else { a.push(other); if(b.indexOf(code) < 0) b.push(code); }
  toast("Сохраняю…", "wait");
  try{
    await adjWrite(code, a);
    await adjWrite(other, b);
    await load();
    render();
    toast("Связь обновлена");
  }catch(e){ toast(e.message, "err"); }
}

function adjChips(code){
  const near = adjOf(code);
  return roomList().filter(r => r.code !== code).map(r => {
    const on = near.indexOf(r.code) >= 0;
    return '<button onclick="adjToggle(\'' + code + '\',\'' + r.code + '\')" style="margin:3px 4px 0 0;padding:6px 10px;border-radius:9px;border:1px solid ' +
      (on ? "#0a84ff" : "#3a3a3c") + ';background:' + (on ? "#0a84ff" : "transparent") + ';color:#fff;font-size:13px">' +
      (on ? "✓ " : "") + esc(String(r.name || r.code).split(" (")[0]) + "</button>";
  }).join("");
}

/* Порядок заливки полов: обход от выхода вглубь, заливаем в обратном
   порядке — дальние первыми, выход последним. Выход — коридор (или самое
   связное помещение, если коридора нет). */
function floorOrder(){
  const rooms = roomList();
  const m = adjMap();
  const links = rooms.reduce((s, r) => s + (m[r.code] || []).length, 0);
  if(!rooms.length || !links) return null;
  const exit = rooms.find(r => /коридор|прихож/i.test(String(r.kind || "") + " " + String(r.name || "")))
    || rooms.slice().sort((a, b) => (m[b.code] || []).length - (m[a.code] || []).length)[0];
  const dist = {}; dist[exit.code] = 0;
  const q = [exit.code];
  while(q.length){
    const c = q.shift();
    (m[c] || []).forEach(n => { if(dist[n] === undefined && rooms.some(r => r.code === n)){ dist[n] = dist[c] + 1; q.push(n); } });
  }
  const known  = rooms.filter(r => dist[r.code] !== undefined).sort((a, b) => dist[b.code] - dist[a.code]);
  const orphan = rooms.filter(r => dist[r.code] === undefined);
  return { exit: exit, order: known, orphan: orphan, dist: dist };
}

const ROOM_FIELDS = [
  { col: "Пол_м2",     label: "Пол, м²",     unit: "м²" },
  { col: "Периметр_м", label: "Периметр, м", unit: "м"  },
  { col: "Высота_м",   label: "Высота, м",   unit: "м"  },
  { col: "Окон_шт",    label: "Окон",        unit: ""   },
  { col: "Дверей_шт",  label: "Дверей",      unit: ""   },
];
/* Типовые площади проёма — выведены из обмеров этого объекта (стены
   листа сходятся с периметр×высота минус проёмы). Панель их только
   ПРЕДЛАГАЕТ: пересчёт стен всегда подтверждает человек. */
const S_WIN = 3.1, S_DOOR = 1.7;

/* ══════════════════════════════════════════════════════════════
   СХЕМА ПРОЁМОВ [чат 031] — дверь и окно перестали быть числом
   Требования Дмитрия: «у многих расходится план с фактом… чтобы создавалась
   собственная схема и потом голосом её можно было регулировать» и «4 замены
   дверей — неправильно: в коридоре 5 дверей, входная не трогается, в зал и
   в третью заменяется, в туалет демонтируется, в ванную переносится».
   Одно число не может нести пять разных ответов, поэтому проём стал вещью.

   Проём — РЕБРО: у него две стороны, и внутренняя дверь принадлежит паре
   помещений, а не одному. Тогда «дверь в кухню заложена» правится один раз
   и видна с обеих сторон — та же логика, что у двустороннего графа
   смежности (решение 016). Разбор — 02_Разборы/16.
   ══════════════════════════════════════════════════════════════ */
const ELEM_FACTS = ["дверь", "окно", "проём", "нет"];
const ELEM_FATES = ["не трогаем", "заменить", "демонтировать", "заложить", "пробить", "перенести", "установить"];
const ELEM_AREA  = { "дверь": S_DOOR, "окно": S_WIN, "проём": S_DOOR };

const elemAll  = () => (D.elements || []);
const elemOf   = (code) => elemAll().filter(e => e.a === code || e.b === code);
const elemSide = (e, code) => (e.a === code ? e.b : e.a);
function elemSideName(e, code){
  const s = elemSide(e, code);
  const r = (D.rooms || []).find(x => x.code === s);
  return r ? String(r.name || s).split(" (")[0] : String(s || "—");
}
/* Расхождение план/факт не хранится полем и не приходит с сервера: признак,
   по которому считается сводная величина, записывается один раз (урок 027 —
   определение «решено» разъехалось между сервером и панелью). */
const elemGap   = (e) => !!(e.plan && e.fact && e.plan !== e.fact);
const elemGaps  = () => elemAll().filter(elemGap);
const elemCount = (code, fact) => elemOf(code).filter(e => e.fact === fact).length;

/* Площадь настоящих проёмов помещения: свои размеры, если заданы, иначе
   типовые. Пока схемы нет — null, и стены считаются прежней формулой. */
function elemArea(code){
  const list = elemOf(code).filter(e => e.fact && e.fact !== "нет");
  if(!elemOf(code).length) return null;
  let s = 0;
  for(const e of list){
    const w = Number(e.w), h = Number(e.h);
    s += (w > 0 && h > 0) ? (w * h) : (ELEM_AREA[e.fact] || 0);
  }
  return Math.round(s * 100) / 100;
}

/* Что схема говорит про числа проёмов помещения. Числа в 06_Помещения
   остаются источником объёмов работ, поэтому схема их не переписывает молча,
   а показывает расхождение и предлагает пересчитать — тот же переспрос, что
   у обмеров (решение 016). */
function elemDelta(r){
  if(!r || !elemOf(r.code).length) return null;
  const w = elemCount(r.code, "окно"), d = elemCount(r.code, "дверь");
  const same = (a, b) => !(a === null || a === undefined || String(a).trim() === "") && Number(a) === b;
  const needW = !same(r.windows, w), needD = !same(r.doors, d);
  return (needW || needD) ? { w: w, d: d, needW: needW, needD: needD } : null;
}


/* ── Объём работ по судьбе проёма [чат 033] ───────────────────────────
   Третий шаг разбора 16. До 033 вид с базой «двери» брал ВСЕ двери помещения,
   поэтому «замена дверей» в коридоре считалась по пяти дверям, из которых
   заменяются две, одна переносится, одна демонтируется и одна не трогается.

   База объёма получает уточнение через двоеточие: источник : роль : сторона.
   «двери:установить:внутр» — сколько внутренних дверей этого помещения нам
   предстоит поставить. Уточнение читается ТОЛЬКО когда у помещения заведена
   схема проёмов; её нет — уточнение отбрасывается и работает прежнее число
   из обмеров (путь «сущности ещё нет», решение 031). */

/* Роль работы → судьбы, которые она обслуживает (разбор 16 §8). Замена и
   перенос раскладываются на демонтаж и установку: старую дверь сняли, новую
   поставили, — поэтому одна и та же дверь попадает в обе работы. */
const ELEM_ROLE = {
  "демонтировать": ["демонтировать", "заменить", "перенести"],
  "установить":    ["установить", "заменить", "перенести"],
  "заменить":      ["заменить"],
  "перенести":     ["перенести"],
  "заложить":      ["заложить"],
  "пробить":       ["пробить"],
  "не трогаем":    ["не трогаем"]
};
/* Источник — чем ограничен отбор по типу. «проёмы» это любое отверстие в
   стене (дверное, оконное, арка): закладывают и пробивают их одинаково, а
   деление по типу здесь потеряло бы заложенную дверь. */
const ELEM_SRC = { "двери": "дверь", "окна": "окно", "проёмы": null };
const ELEM_OUT = ["улица", "подъезд", "шахта"];

/* Тип проёма для отбора: что застали, а если не застали ничего — что было
   по плану. Заложенная дверь (план «дверь», факт «нет») остаётся дверью:
   закладывают именно дверной проём. */
function elemType(e){
  const f = String((e && e.fact) || "").trim();
  return (f && f !== "нет") ? f : String((e && e.plan) || "").trim();
}
const elemOuter = e => ELEM_OUT.indexOf(String((e && e.b) || "")) >= 0 || ELEM_OUT.indexOf(String((e && e.a) || "")) >= 0;

/* Проёмы, которые обслуживает работа с такой базой. Неизвестная роль даёт
   пустой список, а не все проёмы: выдуманное уточнение не должно молча
   превращаться в «посчитать всё».

   Проём считается ОДИН РАЗ — за первой стороной (`a`), а не с обеих. Дверь
   между коридором и залом видна в карточках обоих помещений (она ребро, решение
   031), но снимают и ставят её один раз: считая с обеих сторон, смета удвоила
   бы демонтаж — на боевых данных пилота это и вскрылось. Работы, которым нужны
   обе стороны (облицовка, откосы), живут на прежней базе без уточнения —
   там число проёмов помещения по-прежнему считает дверь с каждой стороны. */
function elemMine(code){ return elemAll().filter(e => e.a === code); }
function elemPick(code, src, role, side){
  const want = ELEM_SRC[src];
  const fates = ELEM_ROLE[role];
  if(!fates) return [];
  return elemMine(code).filter(e =>
    (want === null || elemType(e) === want) &&
    fates.indexOf(String(e.fate || "").trim()) >= 0 &&
    (!side || (side === "наруж" ? elemOuter(e) : !elemOuter(e))));
}

/* Сколько единиц даёт помещение. Мера — штуки, кроме работ в квадратных
   метрах: заделке проёма нужна его площадь, а не число (свои размеры, если
   заданы, иначе типовые — то же правило, что у стен, решение 031). */
function elemVol(code, src, role, side, unit){
  const list = elemPick(code, src, role, side);
  if(/м²|м2/i.test(String(unit || ""))){
    let s = 0;
    for(const e of list){
      const w = Number(e.w), h = Number(e.h);
      s += (w > 0 && h > 0) ? (w * h) : (ELEM_AREA[elemType(e)] || 0);
    }
    return Math.round(s * 100) / 100;
  }
  return list.length;
}

/* Разбор базы: «источник:роль:сторона». null — уточнения нет вовсе, значит
   работает прежний расчёт из обмеров и ни одна старая строка справочника
   поведения не меняет. */
function elemBase(b){
  const seg = String(b == null ? "" : b).split(":").map(x => x.trim());
  if(seg.length < 2) return null;
  if(!Object.prototype.hasOwnProperty.call(ELEM_SRC, seg[0])) return null;
  return { src: seg[0], role: seg[1], side: seg[2] || "" };
}

/* Откуда взялось число: человек должен видеть, что оно не с потолка, и
   понимать ноль — «по схеме: 0 из 5» честнее пустого поля. */
function elemVolHint(kind, room){
  const q = elemBase(kind && kind.base);
  if(!q || !room) return "";
  if(!elemOf(room.code).length) return "схемы проёмов нет — объём по числу";
  const want = ELEM_SRC[q.src];
  const all = elemMine(room.code).filter(e => want === null || elemType(e) === want).length;
  const n = elemPick(room.code, q.src, q.role, q.side).length;
  let tail = "";
  /* Проём соседа: работа по нему уже посчитана там, и человек должен видеть
     где — иначе ноль в его карточке выглядит как потеря работы. */
  if(!n){
    const near = elemAll().filter(e => e.b === room.code && (want === null || elemType(e) === want) &&
      (ELEM_ROLE[q.role] || []).indexOf(String(e.fate || "").trim()) >= 0);
    if(near.length){
      const r = (D.rooms || []).find(x => x.code === near[0].a);
      tail = " · учтено у: " + (r ? String(r.name || near[0].a).split(" (")[0] : near[0].a);
    }
  }
  return "по схеме: " + n + " из " + all + " · " + q.role + tail;
}

/* ── Схема-граф проёмов [чат 033] ─────────────────────────────────────
   Помещения плашками, проёмы линиями: сплошная — дверь, пунктир — открытый
   проём, перечёркнутая — заложено (факт «нет»). Расхождение с планом БТИ
   подсвечено, тык по линии открывает то же окно правки, что список в карточке.

   Раскладка автоматическая и честно условная: у нас есть связность, а не
   геометрия (решение 031). Уровни считаются обходом от входной двери вглубь —
   тем же ходом, каким считается порядок заливки полов, поэтому схема читается
   так же, как человек идёт по квартире. Окна отдельными узлами не рисуются:
   их много и они одинаковы — на плашке стоит счётчик. */
const G_EXT = { "улица": "улица", "подъезд": "подъезд", "шахта": "шахта" };

/* Уровни от входа: сначала помещение с внешней дверью, дальше — вглубь.
   Помещения, до которых по схеме не добраться, кладутся в конец: схема не
   должна прятать то, что не связано, — это само по себе сигнал человеку. */
function graphLevels(){
  const rooms = roomList().map(r => r.code);
  const inside = elemAll().filter(e => rooms.indexOf(e.a) >= 0 && rooms.indexOf(e.b) >= 0);
  const near = {};
  rooms.forEach(c => near[c] = []);
  inside.forEach(e => { near[e.a].push(e.b); near[e.b].push(e.a); });
  const entry = elemAll().find(e => e.b === "подъезд" && rooms.indexOf(e.a) >= 0);
  const start = entry ? entry.a : (rooms[0] || null);
  const lvl = {};
  if(start){
    lvl[start] = 0;
    let wave = [start];
    while(wave.length){
      const next = [];
      wave.forEach(c => (near[c] || []).forEach(n => { if(lvl[n] === undefined){ lvl[n] = lvl[c] + 1; next.push(n); } }));
      wave = next;
    }
  }
  let tail = Math.max(-1, ...Object.values(lvl)) + 1;
  rooms.forEach(c => { if(lvl[c] === undefined) lvl[c] = tail; });
  return lvl;
}

/* Что за линия у проёма: вид зависит от факта, цвет — от судьбы. */
function graphLine(e){
  const f = String(e.fact || "").trim();
  const fate = String(e.fate || "").trim();
  const color = fate === "демонтировать" || fate === "заложить" ? "#ff453a"
    : fate === "заменить" || fate === "перенести" || fate === "установить" || fate === "пробить" ? "#0a84ff"
    : elemGap(e) ? "#ff9f0a" : "#8e8e93";
  const dash = f === "проём" ? "6 5" : (f === "нет" ? "2 6" : "");
  return { color: color, dash: dash, gone: f === "нет" };
}

function graphSvg(){
  const rooms = roomList();
  const els = elemAll();
  if(!rooms.length || !els.length) return "";
  const lvl = graphLevels();
  const byLvl = {};
  rooms.forEach(r => { (byLvl[lvl[r.code]] = byLvl[lvl[r.code]] || []).push(r); });
  const levels = Object.keys(byLvl).map(Number).sort((a, b) => a - b);
  const W = 320, BW = 92, BH = 34, GAPY = 74;
  const pos = {};
  levels.forEach((L, li) => {
    const row = byLvl[L];
    row.forEach((r, i) => {
      pos[r.code] = { x: Math.round((i + 0.5) * (W / row.length)), y: 30 + li * GAPY };
    });
  });
  /* Внешние стороны — маленькие метки над входом: подъезд и шахта рисуются,
     улица нет (это окна, они счётчиком на плашке). */
  const extEls = els.filter(e => (e.b === "подъезд" || e.b === "шахта") && pos[e.a]);
  const H = 30 + (levels.length - 1) * GAPY + BH + (extEls.length ? 46 : 20);
  const shiftY = extEls.length ? 46 : 0;
  const P = c => ({ x: pos[c].x, y: pos[c].y + shiftY });

  const lines = [];
  els.forEach(e => {
    const inside = pos[e.a] && pos[e.b];
    if(!inside && !(pos[e.a] && (e.b === "подъезд" || e.b === "шахта"))) return;
    const g = graphLine(e);
    const a = P(e.a);
    const b = inside ? P(e.b) : { x: a.x, y: 8 };
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    lines.push('<line x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '" stroke="' + g.color +
      '" stroke-width="2"' + (g.dash ? ' stroke-dasharray="' + g.dash + '"' : "") + ' />' +
      (g.gone ? '<line x1="' + (mx - 5) + '" y1="' + (my - 5) + '" x2="' + (mx + 5) + '" y2="' + (my + 5) +
        '" stroke="' + g.color + '" stroke-width="2" />' : "") +
      '<circle cx="' + mx + '" cy="' + my + '" r="9" fill="rgba(0,0,0,.01)" style="cursor:pointer" onclick="elemEdit(\'' + esc(e.id) + '\')"><title>' +
      esc(String(e.name || e.id)) + '</title></circle>');
  });
  if(extEls.length){
    const a = P(extEls[0].a);
    lines.push('<text x="' + a.x + '" y="14" text-anchor="middle" fill="#8e8e93" font-size="10">подъезд</text>');
  }
  const boxes = rooms.map(r => {
    const p = P(r.code);
    const w = elemCount(r.code, "окно");
    const nm = String(r.name || r.code).split(" (")[0];
    const short = nm.length > 13 ? nm.slice(0, 12) + "…" : nm;
    return '<g style="cursor:pointer" onclick="objGoRoom(\'' + esc(r.code) + '\')">' +
      '<rect x="' + (p.x - BW / 2) + '" y="' + (p.y - BH / 2) + '" width="' + BW + '" height="' + BH +
        '" rx="9" fill="#2c2c2e" stroke="#48484a" />' +
      '<text x="' + p.x + '" y="' + (p.y + (w ? -1 : 4)) + '" text-anchor="middle" fill="#fff" font-size="11">' + esc(short) + '</text>' +
      (w ? '<text x="' + p.x + '" y="' + (p.y + 11) + '" text-anchor="middle" fill="#8e8e93" font-size="9">окон ' + w + '</text>' : "") +
      '</g>';
  }).join("");
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + Math.min(H * 1.1, 420) +
    '" style="display:block;margin-top:8px">' + lines.join("") + boxes + '</svg>';
}
const objDocs = () => (D.drafts || []).filter(d => /план/i.test(String(d.kind || "")));
const objPlan = () => { const l = objDocs(); return l.length ? l[l.length - 1] : null; };
const roomList = () => (D.rooms || []);
/* Пробел проёмов [чат 029]. До 029 фильтр смотрел только на null/undefined:
   пустая ячейка, приехавшая строкой, считалась заполненной, а ноль отличить
   от «не задано» было нечем вовсе — отсюда вечная подсказка в помещениях,
   где окон нет физически. Теперь «не задано» — это null, undefined и пустая
   строка, а 0 — обычное заданное значение. */
const roomNeed = v => v === null || v === undefined || String(v).trim() === "";
const roomGapOf = r => [roomNeed(r.windows) ? "окна" : "", roomNeed(r.doors) ? "двери" : ""].filter(Boolean);
const roomGap  = () => roomList().filter(r => roomGapOf(r).length);

/* Стены по обмерам: периметр × высота минус проёмы. Возвращает null,
   пока не хватает данных, — считать «примерно» тут нельзя, число уходит
   в объёмы работ. */
/* ── Контур помещения [чат 092, шаг B'] ─────────────────────────────────────
   Показ обмерного контура из листа 06_Помещения (поле «Контур», формат разбора 22
   §4: длины целыми сантиметрами, "L" у стороны, ПЕРЕД которой поворот налево).
   Механика повторяет серверную (Голос, узел items 062-prod) шаг в шаг: те же
   направления обхода, тот же допуск замыкания, та же коррекция невязки и то же
   шнурование. Иначе панель показывала бы одну площадь, а сервер писал другую —
   формат живёт в двух местах, и расходиться им нельзя. */
function ctrParse(raw){
  const out = {ok:false, sides:[], perim:null, area:null, err:"", gapX:null, gapY:null, tol:null};
  let j = null;
  try { j = (typeof raw === "string") ? JSON.parse(raw) : raw; }
  catch(e){ out.err = "контур записан не как JSON"; return out; }
  if(!j || !Array.isArray(j.s) || !j.s.length) return out;
  const k = (String(j.u || "cm").toLowerCase() === "cm") ? 0.01 : 1;
  const sides = [];
  j.s.forEach(function(x, i){
    const arr = Array.isArray(x) ? x : [x];
    const n = Number(arr[0]);
    if(!isFinite(n) || n <= 0) return;
    /* srcIdx — место стороны в исходном массиве, а не в отфильтрованном [чат 093]:
       нулевые и отрицательные отброшены выше, и правка по порядковому номеру
       показанной стороны попала бы не в ту сторону исходника. */
    sides.push({ len: Math.round(n * k * 1000) / 1000,
                 left: String(arr[1] == null ? "" : arr[1]).trim().toUpperCase() === "L",
                 srcIdx: i });
  });
  out.sides = sides;
  if(sides.length === 2){
    out.perim = Math.round(2 * (sides[0].len + sides[1].len) * 100) / 100;
    out.area  = Math.round(sides[0].len * sides[1].len * 100) / 100;
    out.ok = true; return out;
  }
  if(sides.length < 4){
    if(sides.length === 3) out.err = "три стороны — не контур: прямоугольник задаётся двумя, Г-форма — шестью";
    return out;
  }
  let L = 0, perim = 0;
  sides.forEach(function(s){ perim += s.len; if(s.left) L++; });
  out.perim = Math.round(perim * 100) / 100;
  if(sides.length - 2 * L !== 4){
    out.err = "форма не замыкается: поворотов направо минус налево должно быть 4 (сторон " + sides.length + ", налево " + L + ")";
    return out;
  }
  const DX = [1,0,-1,0], DY = [0,-1,0,1];
  let dir = 0; const vx = [], vy = [];
  sides.forEach(function(s, i){
    if(i > 0) dir = (dir + (s.left ? 3 : 1)) % 4;
    vx.push(s.len * DX[dir]); vy.push(s.len * DY[dir]);
  });
  let sx = 0, sy = 0, tx = 0, ty = 0;
  vx.forEach(function(v){ sx += v; tx += Math.abs(v); });
  vy.forEach(function(v){ sy += v; ty += Math.abs(v); });
  const tol = Math.max(0.05, 0.005 * perim);
  out.gapX = Math.round(Math.abs(sx) * 100) / 100;
  out.gapY = Math.round(Math.abs(sy) * 100) / 100;
  out.tol  = Math.round(tol * 100) / 100;
  if(Math.abs(sx) > tol || Math.abs(sy) > tol){
    out.err = "стороны не сходятся: по горизонтали " + out.gapX + " м, по вертикали " + out.gapY + " м (допуск " + out.tol + " м) — проверьте длины";
    return out;
  }
  const cx = vx.map(function(v){ return tx > 0 ? v - sx * Math.abs(v) / tx : v; });
  const cy = vy.map(function(v){ return ty > 0 ? v - sy * Math.abs(v) / ty : v; });
  const px = [0], py = [0];
  for(let i = 0; i < cx.length; i++){ px.push(px[i] + cx[i]); py.push(py[i] + cy[i]); }
  let s2 = 0;
  for(let a = 0; a < cx.length; a++){ const b = (a + 1) % cx.length; s2 += px[a] * py[b] - px[b] * py[a]; }
  out.area = Math.round(Math.abs(s2) / 2 * 100) / 100;
  out.ok = true;
  return out;
}

/* Строка контура в карточке помещения. Молчит, когда контура нет: поле приезжает
   пустой строкой у всех помещений, кроме размеченных, — это норма, а не дефект. */
function ctrLine(r){
  const raw = (r && (r.contour != null ? r.contour : r["Контур"]));
  if(!String(raw == null ? "" : raw).trim()) return "";
  const c = ctrParse(raw);
  if(!c.sides.length) return c.err ? ('<div class="m" style="margin-top:6px">Контур: ' + esc(c.err) + '</div>') : "";
  /* Тык по стороне открывает правку [чат 093]. Кликабельна каждая сторона,
     в том числе у незамкнутой формы: правка стороны — единственный способ
     починить обход, и запирать её из-за ошибки замыкания значило бы оставить
     человека с сообщением об ошибке и без выхода. */
  const cCode = String((r && r.code != null) ? r.code : "");
  const chain = c.sides.map(function(s){
    const txt = (s.left ? "↰" : "") + Math.round(s.len * 100);
    if(!cCode) return esc(txt);
    return '<span onclick="ctrEdit(&quot;' + esc(cCode) + '&quot;,' + s.srcIdx + ')"' +
           ' style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px">' +
           esc(txt) + '</span>';
  }).join(" · ");
  let html = '<div class="m" style="margin-top:6px">Контур (см): ' + chain;
  if(c.err) return html + ' · <b>' + esc(c.err) + '</b></div>';
  html += '<br>по контуру: пол <b>' + fmt(c.area) + '</b> м² · периметр <b>' + fmt(c.perim) + '</b> м';
  const fa = Number(r.floor_m2), fp = Number(r.perimeter_m);
  const bad = [];
  if(isFinite(fa) && fa > 0 && Math.abs(c.area - fa) > 0.01)
    bad.push("пол расходится на " + fmt(Math.round(Math.abs(c.area - fa) * 100) / 100) + " м² (записано " + fmt(fa) + ")");
  if(isFinite(fp) && fp > 0 && Math.abs(c.perim - fp) > 0.01)
    bad.push("периметр расходится на " + fmt(Math.round(Math.abs(c.perim - fp) * 100) / 100) + " м (записано " + fmt(fp) + ")");
  if(bad.length) html += '<br><b>' + esc(bad.join(" · ")) + '</b>';
  if(c.gapX !== null && (c.gapX > 0 || c.gapY > 0))
    html += '<br>невязка обхода: ' + fmt(c.gapX) + ' / ' + fmt(c.gapY) + ' м при допуске ' + fmt(c.tol) + ' м';
  return html + '</div>';
}

/* ── Правка одной стороны контура [чат 093, шаг B' часть 2] ──────────
   Тык по стороне открывает окно ввода: длина в сантиметрах, предпросмотр того,
   что получится (пол, периметр, замыкание), и запись. Механику обхода правка
   не трогает вовсе — она пересобирает исходный JSON и отдаёт его тому же
   ctrParse, поэтому панель и сервер продолжают считать одинаково. */
function ctrBuildRaw(raw, srcIdx, cm){
  /* Меняется ровно одна сторона: единицы, метки "L", порядок и форма элементов
     остаются как в исходнике. Иначе нормализация «заодно» переписала бы чужие
     стороны округлением, и правка одной стороны стала бы правкой всех. */
  let j = null;
  try { j = JSON.parse(typeof raw === "string" ? raw : JSON.stringify(raw)); }
  catch(e){ return null; }
  if(!j || !Array.isArray(j.s)) return null;
  const i = Number(srcIdx);
  if(!isFinite(i) || i < 0 || i >= j.s.length) return null;
  const n = Number(String(cm).replace(",", "."));
  if(!isFinite(n) || n <= 0) return null;
  const isCm = String(j.u || "cm").toLowerCase() === "cm";
  const val = isCm ? Math.round(n) : Math.round(n) / 100;
  const x = j.s[i];
  if(Array.isArray(x)){ const y = x.slice(); y[0] = val; j.s[i] = y; }
  else j.s[i] = val;
  return JSON.stringify(j);
}

function ctrEdit(code, srcIdx){
  const r = roomList().find(x => x.code === code);
  if(!r){ toast("Помещение не найдено", "err"); return; }
  const raw = (r.contour != null ? r.contour : r["Контур"]);
  const c0 = ctrParse(raw);
  const s0 = c0.sides.filter(function(s){ return s.srcIdx === Number(srcIdx); })[0];
  if(!s0){ toast("Сторона не найдена", "err"); return; }
  const was = Math.round(s0.len * 100);

  const box = document.createElement("div");
  box.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px";
  box.innerHTML =
    '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;font-size:15px">' +
      '<div style="font-weight:700;margin-bottom:8px">' + esc(r.name || r.code) + " · сторона " + was + " см</div>" +
      '<div style="opacity:.75;font-size:14px;margin-bottom:10px">Длина в сантиметрах' +
        (s0.left ? " · перед этой стороной поворот налево" : "") + "</div>" +
      '<input id="ctrIn" type="number" inputmode="decimal" value="' + was + '" style="width:100%;padding:11px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:16px;margin-bottom:10px">' +
      '<div id="ctrPrev" style="opacity:.85;font-size:14px;margin-bottom:12px;min-height:40px"></div>' +
      '<div style="display:flex;gap:8px">' +
        '<button id="ctrNo" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
        '<button id="ctrYes" style="flex:1;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Записать</button>' +
      "</div></div>";
  document.body.appendChild(box);

  const inp = box.querySelector("#ctrIn");
  const prev = box.querySelector("#ctrPrev");
  const yes = box.querySelector("#ctrYes");
  let ready = null;

  /* Предпросмотр считается тем же разбором, что и показ, — человек видит
     ровно то число, которое ляжет в лист. Незамкнутую форму записывать
     нельзя: сервер такую отвергает, и панель не должна создавать состояния,
     которого сервер не создаёт. */
  function preview(){
    const raw2 = ctrBuildRaw(raw, srcIdx, inp.value);
    const c2 = raw2 ? ctrParse(raw2) : null;
    if(!c2 || !c2.sides.length){
      ready = null; yes.disabled = true; yes.style.opacity = ".45";
      prev.innerHTML = '<b>Длина должна быть больше нуля</b>';
      return;
    }
    if(!c2.ok){
      ready = null; yes.disabled = true; yes.style.opacity = ".45";
      prev.innerHTML = '<b>' + esc(c2.err || "контур не собирается") + '</b>';
      return;
    }
    ready = {raw: raw2, c: c2}; yes.disabled = false; yes.style.opacity = "1";
    const fa = Number(r.floor_m2), fp = Number(r.perimeter_m);
    prev.innerHTML =
      "станет: пол <b>" + fmt(c2.area) + "</b> м² · периметр <b>" + fmt(c2.perim) + "</b> м" +
      ((isFinite(fa) && fa > 0) ? "<br>было в листе: пол " + fmt(fa) + " м²" + ((isFinite(fp) && fp > 0) ? " · периметр " + fmt(fp) + " м" : "") : "") +
      ((c2.gapX !== null && (c2.gapX > 0 || c2.gapY > 0))
        ? "<br>невязка обхода: " + fmt(c2.gapX) + " / " + fmt(c2.gapY) + " м при допуске " + fmt(c2.tol) + " м" : "");
  }
  inp.oninput = preview;
  preview();

  box.querySelector("#ctrNo").onclick = () => box.remove();
  yes.onclick = async () => {
    if(!ready) return;
    const p = ready;
    box.remove();
    try{
      /* Порядок записи важен: контур первым. Оборвётся связь после него —
         числа останутся старыми и разойдутся с контуром видимо, строкой
         расхождения; оборвись он последним, лист хранил бы новые числа при
         старом контуре, и расхождение было бы не видно вовсе. */
      await writeCell("06_Помещения", code, "Контур", p.raw);
      await writeCell("06_Помещения", code, "Пол_м2", String(p.c.area).replace(".", ","));
      await writeCell("06_Помещения", code, "Периметр_м", String(p.c.perim).replace(".", ","));
      toast("Контур поправлен");
      await load();
      render();
    }catch(e){ toast(e.message, "err"); }
  };
}

function roomWalls(r){
  const p = Number(r.perimeter_m), h = Number(r.height_m);
  if(!(p > 0) || !(h > 0)) return null;
  /* Незаданные проёмы — это не «ноль проёмов»: Number(null) даёт 0 и молча
     завысил бы стены на площадь окон и дверей. Пока чисел нет — не считаем. */
  const empty = v => v === null || v === undefined || v === "";
  if(empty(r.windows) || empty(r.doors)) return null;
  const w = Number(r.windows), d = Number(r.doors);
  if(!(w >= 0) || !(d >= 0)) return null;
  /* Схема проёмов заведена — вычитаем настоящие проёмы, а не типовые числа
     [чат 031]: у арки между залом и лоджией своя площадь, и до 031 она не
     вычиталась вовсе (аркой не считается ни окно, ни дверь). Своя ширина и
     высота проёма главнее типовой площади. */
  const ea = elemArea(r.code);
  if(ea !== null) return Math.round((p * h - ea) * 100) / 100;
  return Math.round((p * h - w * S_WIN - d * S_DOOR) * 100) / 100;
}

/* Тип картинки — по содержимому, а не по слову сервера [чат 032].
   Ветка /file отдавала настоящий JPEG с заголовком application/octet-stream:
   узел «Ответить файлом» берёт тип из свойства файла Telegram, а оно пустое.
   Сервер починен тем же чатом, но панель не должна зависеть от честности
   заголовка — файлы старых загрузок лежат в Telegram как есть, и заголовок
   у них появится только при перезаливке. Правило шире случая: если содержимое
   можно проверить самому, проверка чужого ярлыка не должна быть единственной. */
const IMG_SIGS = [
  { t: "image/jpeg", b: [0xFF, 0xD8, 0xFF] },
  { t: "image/png",  b: [0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A] },
  { t: "image/gif",  b: [0x47, 0x49, 0x46, 0x38] },
  { t: "image/bmp",  b: [0x42, 0x4D] }
];
function fileCT(r){
  try{ return String((r.headers && r.headers.get("content-type")) || "").split(";")[0].trim().toLowerCase(); }
  catch(e){ return ""; }
}
async function blobHead(blob, n){
  try{
    const part = blob.slice(0, n);
    if(part.arrayBuffer) return new Uint8Array(await part.arrayBuffer());
    return await new Promise(res => {
      const fr = new FileReader();
      fr.onload = () => res(new Uint8Array(fr.result));
      fr.onerror = () => res(new Uint8Array(0));
      fr.readAsArrayBuffer(part);
    });
  }catch(e){ return new Uint8Array(0); }
}
async function sniffImage(blob){
  if(!blob || !blob.size) return "";
  const h = await blobHead(blob, 16);
  for(const s of IMG_SIGS){
    let ok = h.length >= s.b.length;
    for(let i = 0; ok && i < s.b.length; i++) if(h[i] !== s.b[i]) ok = false;
    if(ok) return s.t;
  }
  if(h.length >= 12 && h[0] === 0x52 && h[1] === 0x49 && h[2] === 0x46 && h[3] === 0x46 &&
     h[8] === 0x57 && h[9] === 0x45 && h[10] === 0x42 && h[11] === 0x50) return "image/webp";
  return "";
}

/* ══════════════════════════════════════════════════════════════
   РАЗМЕТКА ПЛАНА БТИ [чат 037, разбор 19]
   Схема-граф рисует связность, а не географию: «корректная, но не то, что
   хотелось бы» (живой проход 02.08). Разметка добавляет недостающий слой —
   место. Человек тыкает пальцем в план, где какая комната и где какая дверь;
   план по-прежнему НЕ распознаётся (маяк §7) — система только запоминает
   тычки.

   Координаты — доли от размера картинки (0…1), а не пиксели: панель
   показывает план в разной ширине на разных телефонах, а доли это переживают.

   Хранение — одной строкой `План_разметка` в `07_Настройки`. Лист открыт
   на дописывание ролям admin и owner с чата 036, правка строки работает
   с давних пор: значит и завести разметку, и менять её можно уже сегодня,
   без единой правки нод (новый лист потребовал бы её — грабля 36). */
const PLAN_MARK_KEY = "План_разметка";
let PLAN_URL = "";                     // blob-адрес загруженного плана
let PMK = null, PMQ = [], PMI = 0;     // рабочая разметка, очередь, место в ней

function planMarks(){
  const raw = (D.settings || {})[PLAN_MARK_KEY];
  const empty = { v: 1, img: "", rooms: {}, elems: {} };
  if(raw == null || String(raw) === "") return empty;
  try{
    const o = JSON.parse(String(raw));
    return { v: o.v || 1, img: String(o.img || ""), rooms: o.rooms || {}, elems: o.elems || {} };
  }catch(e){ return { v: 1, img: "", rooms: {}, elems: {}, broken: true }; }
}
/* Метка в левом верхнем углу — это [0,0], и она существует. Проверять
   наличие ключа, а не истинность значения (родня грабли 22: «пустое —
   не то же самое, что отсутствующее»). */
const planHas = (m, kind, id) => Object.prototype.hasOwnProperty.call(m[kind] || {}, id);
const planMarked = m => Object.keys((m || {}).rooms || {}).length;
/* Подпись помещения без служебного «(пом. N)» — как на графе [чат 039]:
   восемь длинных плашек на одном плане наезжают друг на друга, а номер
   помещения человеку на плане не нужен. У проёмов скобка значимая
   («Зал ↔ Кухня (заложена)») и не срезается. */
const planShort = s => String(s || "").split(" (")[0];

async function planMarksSave(m){
  const val = JSON.stringify({ v: 1, img: m.img || "", rooms: m.rooms || {}, elems: m.elems || {} });
  const S = D.settings || (D.settings = {});
  if(Object.prototype.hasOwnProperty.call(S, PLAN_MARK_KEY)){
    await writeCell("07_Настройки", PLAN_MARK_KEY, "Значение", val);
  }else{
    await crewAppend("07_Настройки", [{ "Параметр": PLAN_MARK_KEY, "Значение": val,
      "Комментарий": "разметка плана БТИ; доли от размера картинки, 0…1" }]);
  }
  S[PLAN_MARK_KEY] = val;
  return true;
}


/* ═════ УРОВЕНЬ C РАЗМЕТКИ · масштаб и контуры (разбор 19 §11) ═════
   Хранение и геометрия собраны в 046 (03_Инструмент, 33+47 проверок),
   экраны — чат 048. Ничего существующего не заменяет: уровни A и B живут
   как жили; уровень C держит две свои строки настроек и не трогает
   План_разметка (§11.3 — старая панель стёрла бы новые поля). */

const PLAN_SCALE_KEY = "План_масштаб";
const PLAN_POLYS_KEY = "План_контуры";

/* Округление координат до 4 знаков — 0,1 % ширины плана, заведомо точнее
   пальца (§11.3). Тем же ходом отсекается мусор вроде 0.30000000000000004. */
const pgRound4 = v => Math.round(Number(v) * 1e4) / 1e4;
const pgPt = p => [pgRound4(p[0]), pgRound4(p[1])];
const pgNum = v => typeof v === "number" && isFinite(v);

/* --- Чтение ------------------------------------------------------------ */

/* Масштаб: { v, img, ar, pts:[[x,y],[x,y]], len_m } либо null.
   null означает «масштаб не задан» — это штатное состояние, а не ошибка:
   уровни A и B живут без него (§11.7, решение 031 «путь этого ещё нет»). */
function planScale(){
  const raw = (D.settings || {})[PLAN_SCALE_KEY];
  if(raw == null || String(raw) === "") return null;
  try{
    const o = JSON.parse(String(raw));
    if(!Array.isArray(o.pts) || o.pts.length < 2) return null;
    if(!pgNum(Number(o.len_m)) || Number(o.len_m) <= 0) return null;
    if(!pgNum(Number(o.ar)) || Number(o.ar) <= 0) return null;
    return { v: o.v || 1, img: String(o.img || ""), ar: Number(o.ar),
             pts: [pgPt(o.pts[0]), pgPt(o.pts[1])], len_m: Number(o.len_m) };
  }catch(e){ return null; }
}

/* Контуры: { v, img, polys: { КОД: [[x,y],…] } }. Битый JSON — пустой объект
   с признаком broken, чтобы экран сказал словами, а не молчал (грабля 3
   памятки: пустой ответ при HTTP 200 = отказ; здесь тот же класс). */
function planPolys(){
  const empty = { v: 1, img: "", polys: {} };
  const raw = (D.settings || {})[PLAN_POLYS_KEY];
  if(raw == null || String(raw) === "") return empty;
  try{
    const o = JSON.parse(String(raw));
    const src = (o && o.polys) || {}, polys = {};
    Object.keys(src).forEach(code => {
      const arr = src[code];
      if(Array.isArray(arr) && arr.length >= 3) polys[code] = arr.map(pgPt);
    });
    return { v: o.v || 1, img: String(o.img || ""), polys: polys };
  }catch(e){ return { v: 1, img: "", polys: {}, broken: true }; }
}

/* Есть ли у помещения контур. Ключ, а не истинность: контур из вершин
   [0,0] существует (§11.8 п. 4). */
const planHasPoly = (pp, code) => Object.prototype.hasOwnProperty.call((pp || {}).polys || {}, String(code));

/* --- Запись ------------------------------------------------------------ */
/* Обе функции повторяют механику planMarksSave: строка есть — правим ячейку,
   строки нет — дописываем. Лист 07_Настройки открыт ролям admin и owner
   с чата 036, правки нод не требуется (грабля 36 не задевается). */

async function planScaleSave(sc){
  if(!sc || !Array.isArray(sc.pts) || sc.pts.length < 2) throw new Error("масштаб: нужны две точки");
  if(!(Number(sc.len_m) > 0)) throw new Error("масштаб: длина должна быть больше нуля");
  if(!(Number(sc.ar) > 0)) throw new Error("масштаб: не задано соотношение сторон снимка");
  const val = JSON.stringify({ v: 1, img: sc.img || "", ar: pgRound4(sc.ar),
                               pts: [pgPt(sc.pts[0]), pgPt(sc.pts[1])], len_m: Number(sc.len_m) });
  const S = D.settings || (D.settings = {});
  if(Object.prototype.hasOwnProperty.call(S, PLAN_SCALE_KEY)){
    await writeCell("07_Настройки", PLAN_SCALE_KEY, "Значение", val);
  }else{
    await crewAppend("07_Настройки", [{ "Параметр": PLAN_SCALE_KEY, "Значение": val,
      "Комментарий": "масштаб плана БТИ: две точки в долях + расстояние между ними в метрах; ar — соотношение сторон снимка" }]);
  }
  S[PLAN_SCALE_KEY] = val;
  return true;
}

async function planPolysSave(pp){
  const src = (pp && pp.polys) || {}, out = {};
  Object.keys(src).forEach(code => {
    const arr = src[code];
    if(Array.isArray(arr) && arr.length >= 3) out[code] = arr.map(pgPt);   // §11.8 п. 3
  });
  const val = JSON.stringify({ v: 1, img: (pp && pp.img) || "", polys: out });
  const S = D.settings || (D.settings = {});
  if(Object.prototype.hasOwnProperty.call(S, PLAN_POLYS_KEY)){
    await writeCell("07_Настройки", PLAN_POLYS_KEY, "Значение", val);
  }else{
    await crewAppend("07_Настройки", [{ "Параметр": PLAN_POLYS_KEY, "Значение": val,
      "Комментарий": "контуры помещений на плане БТИ; доли от размера картинки, 0…1" }]);
  }
  S[PLAN_POLYS_KEY] = val;
  return true;
}

/* --- Свой ли снимок ----------------------------------------------------- */
/* Сменилось фото плана — метки и контуры показываем, но сверку обмеров
   выключаем (§11.3): считать по чужому кадру хуже, чем не считать. */
function planSameImg(store, curImgId){
  if(!store) return false;
  const a = String(store.img == null ? "" : store.img);
  const b = String(curImgId == null ? "" : curImgId);
  if(a === "" || b === "") return true;
  return a === b;
}

/* Геометрия уровня C разметки плана БТИ — разбор 19, §11 (чат REMONT_046).
   Шаг 1 порядка работ §11.9: считает метры и квадратные метры по разметке
   в долях 0…1 и по калибровке масштаба.

   ГЛАВНОЕ ПРАВИЛО (§11.2). Доля по X и доля по Y — разной длины, если снимок
   не квадратный. Все длины приводятся к единицам ШИРИНЫ картинки через
   ar = W/H (натуральные пиксели снимка в момент калибровки). Забыть ar —
   получить правдоподобные числа с ошибкой в десятки процентов.

   Модуль без зависимостей: работает и в браузере (глобальная PLANGEO),
   и в node (module.exports). Экранов не трогает, в лист не пишет. */
(function (root) {
  "use strict";

  var TOL_PCT = 15;          // §11.6: порог расхождения сверки, проценты
  var ROUND = 4;             // §11.3: координаты округляются до 4 знаков

  function num(v) { return typeof v === "number" && isFinite(v); }
  function okPt(p) { return Array.isArray(p) && p.length >= 2 && num(p[0]) && num(p[1]); }
  function round4(v) { return Math.round(v * 1e4) / 1e4; }

  /* Длина отрезка в долях ШИРИНЫ картинки. ar = W/H. */
  function uDist(p, q, ar) {
    if (!okPt(p) || !okPt(q) || !num(ar) || ar <= 0) return NaN;
    var dx = q[0] - p[0], dy = (q[1] - p[1]) / ar;
    return Math.sqrt(dx * dx + dy * dy);
  }

  /* Метров на долю ширины — из калибровки: две точки и известная длина. */
  function mpuFrom(scale) {
    if (!scale || !Array.isArray(scale.pts) || scale.pts.length < 2) return NaN;
    if (!num(scale.len_m) || scale.len_m <= 0) return NaN;
    var u = uDist(scale.pts[0], scale.pts[1], scale.ar);
    if (!num(u) || u <= 0) return NaN;
    return scale.len_m / u;
  }

  /* Площадь полигона по формуле шнурования в координатах-долях (без ar). */
  function areaFrac(poly) {
    if (!Array.isArray(poly) || poly.length < 3) return 0;
    var s = 0, n = poly.length, i, a, b;
    for (i = 0; i < n; i++) {
      a = poly[i]; b = poly[(i + 1) % n];
      if (!okPt(a) || !okPt(b)) return NaN;
      s += a[0] * b[1] - b[0] * a[1];
    }
    return Math.abs(s) / 2;          // §11.8 п. 6: направление обхода не важно
  }

  /* Площадь в м². §11.2: mpu² · A_frac / ar. */
  function polyAreaM2(poly, scale) {
    var mpu = mpuFrom(scale), af = areaFrac(poly);
    if (!num(mpu) || !num(af) || !num(scale.ar) || scale.ar <= 0) return NaN;
    if (!Array.isArray(poly) || poly.length < 3) return 0;   // §11.8 п. 3
    return mpu * mpu * af / scale.ar;
  }

  /* Периметр замкнутого контура в метрах. */
  function polyPerimM(poly, scale) {
    var mpu = mpuFrom(scale);
    if (!num(mpu) || !Array.isArray(poly) || poly.length < 2) return poly && poly.length < 3 ? 0 : NaN;
    var s = 0, n = poly.length, i, d;
    for (i = 0; i < n; i++) {
      d = uDist(poly[i], poly[(i + 1) % n], scale.ar);
      if (!num(d)) return NaN;
      s += d;
    }
    return mpu * s;
  }

  /* Центр тяжести полигона (в долях). Вырожденный (нулевая площадь) —
     среднее вершин, чтобы плашка всё равно куда-то села. */
  function centroid(poly) {
    if (!Array.isArray(poly) || poly.length === 0) return null;
    if (poly.length < 3) {
      var sx = 0, sy = 0, k;
      for (k = 0; k < poly.length; k++) { sx += poly[k][0]; sy += poly[k][1]; }
      return [round4(sx / poly.length), round4(sy / poly.length)];
    }
    var a = 0, cx = 0, cy = 0, n = poly.length, i, p, q, cr;
    for (i = 0; i < n; i++) {
      p = poly[i]; q = poly[(i + 1) % n];
      cr = p[0] * q[1] - q[0] * p[1];
      a += cr; cx += (p[0] + q[0]) * cr; cy += (p[1] + q[1]) * cr;
    }
    if (Math.abs(a) < 1e-12) {
      var mx = 0, my = 0, j;
      for (j = 0; j < n; j++) { mx += poly[j][0]; my += poly[j][1]; }
      return [round4(mx / n), round4(my / n)];
    }
    a = a / 2;
    return [round4(cx / (6 * a)), round4(cy / (6 * a))];
  }

  /* Пересекаются ли несмежные рёбра (§11.8 п. 2). Предупреждение, не запрет. */
  function orient(a, b, c) {
    var v = (b[1] - a[1]) * (c[0] - b[0]) - (b[0] - a[0]) * (c[1] - b[1]);
    return Math.abs(v) < 1e-12 ? 0 : (v > 0 ? 1 : 2);
  }
  function onSeg(a, b, c) {
    return b[0] <= Math.max(a[0], c[0]) + 1e-12 && b[0] >= Math.min(a[0], c[0]) - 1e-12 &&
           b[1] <= Math.max(a[1], c[1]) + 1e-12 && b[1] >= Math.min(a[1], c[1]) - 1e-12;
  }
  function segCross(p1, q1, p2, q2) {
    var o1 = orient(p1, q1, p2), o2 = orient(p1, q1, q2),
        o3 = orient(p2, q2, p1), o4 = orient(p2, q2, q1);
    if (o1 !== o2 && o3 !== o4) return true;
    if (o1 === 0 && onSeg(p1, p2, q1)) return true;
    if (o2 === 0 && onSeg(p1, q2, q1)) return true;
    if (o3 === 0 && onSeg(p2, p1, q2)) return true;
    if (o4 === 0 && onSeg(p2, q1, q2)) return true;
    return false;
  }
  function selfIntersects(poly) {
    if (!Array.isArray(poly) || poly.length < 4) return false;
    var n = poly.length, i, j;
    for (i = 0; i < n; i++) {
      for (j = i + 1; j < n; j++) {
        if (j === i || (j + 1) % n === i || (i + 1) % n === j) continue;   // смежные пропускаем
        if (segCross(poly[i], poly[(i + 1) % n], poly[j], poly[(j + 1) % n])) return true;
      }
    }
    return false;
  }

  /* Разметка от этого ли снимка (§11.3). Пусто с обеих сторон — считаем своим:
     старые значения без img не должны молча выключать сверку. */
  function sameImg(store, curImgId) {
    if (!store) return false;
    var a = String(store.img == null ? "" : store.img);
    var b = String(curImgId == null ? "" : curImgId);
    if (a === "" || b === "") return true;
    return a === b;
  }

  /* Имена полей обмеров. Ответ сервера /data отдаёт латиницей (floor_m2,
     perimeter_m), лист 06_Помещения — по-русски (Пол_м2, Периметр_м).
     Берём то, что нашлось: панель кормит модуль ответом, а сверка выгрузки —
     листом. Грабля 15: имена полей мока обязаны совпадать с боевыми. */
  function pickNum(obj, names) {
    if (!obj) return null;
    for (var i = 0; i < names.length; i++) {
      if (Object.prototype.hasOwnProperty.call(obj, names[i])) return obj[names[i]];
    }
    return null;
  }
  var F_AREA = ["floor_m2", "Пол_м2"];
  var F_PERIM = ["perimeter_m", "Периметр_м"];

  /* Метрики помещения по контуру + сверка с обмерами. */
  function roomMetrics(poly, scale, room, curImgId) {
    var out = { hasPoly: Array.isArray(poly) && poly.length >= 3, area_m2: null, perim_m: null,
                centroid: centroid(poly || []), warn: [], compare: null };
    if (!out.hasPoly) { if (poly && poly.length) out.warn.push("мало вершин"); return out; }
    if (selfIntersects(poly)) out.warn.push("контур пересекает сам себя");
    if (!num(mpuFrom(scale))) { out.warn.push("масштаб не задан"); return out; }
    if (!sameImg(scale, curImgId)) { out.warn.push("масштаб от прежнего снимка"); return out; }
    var a = polyAreaM2(poly, scale), p = polyPerimM(poly, scale);
    if (!num(a) || !num(p)) { out.warn.push("масштаб не задан"); return out; }
    out.area_m2 = Math.round(a * 10) / 10;
    out.perim_m = Math.round(p * 10) / 10;
    out.compare = { area: compare(out.area_m2, pickNum(room, F_AREA)),
                    perim: compare(out.perim_m, pickNum(room, F_PERIM)) };
    return out;
  }

  /* Сверка одной величины. База процента — обмер человека: он источник,
     с которым сравниваем. Обмера нет — сравнивать не с чем, и это не ошибка. */
  function compare(plan, measured) {
    var m = typeof measured === "string" ? Number(String(measured).replace(",", ".")) : measured;
    if (!num(plan)) return { state: "нет плана" };
    if (!num(m) || m <= 0) return { state: "нет обмера", plan: plan };
    var pct = Math.abs(plan - m) / m * 100;
    return { state: pct <= TOL_PCT ? "сходится" : "проверьте",
             plan: plan, measured: Math.round(m * 10) / 10, pct: Math.round(pct * 10) / 10 };
  }

  var API = { uDist: uDist, mpuFrom: mpuFrom, areaFrac: areaFrac, polyAreaM2: polyAreaM2,
              polyPerimM: polyPerimM, centroid: centroid, selfIntersects: selfIntersects,
              sameImg: sameImg, roomMetrics: roomMetrics, compare: compare, pickNum: pickNum,
              round4: round4, TOL_PCT: TOL_PCT };

  if (typeof module !== "undefined" && module.exports) module.exports = API;
  else root.PLANGEO = API;
})(typeof globalThis !== "undefined" ? globalThis : this);

/* --- Экраны уровня C (чат 048) ------------------------------------------ */
/* Число с одной десятичной и запятой — для строк сверки и линейки. Без
   toLocaleString: разделитель тысяч сломал бы шаблоны словаря ([\d,]+). */
const pgFmt1 = v => String(Math.round(Number(v) * 10) / 10).replace(".", ",");

let PSC = null;   // сеанс калибровки: { pts:[[x,y]…], len:"" }
let PPL = null;   // сеанс обводки:   { code, polys:{…копия}, cur:[], last }
let PRL = null;   // сеанс линейки:   { pts:[[x,y]…] }

/* Соотношение сторон снимка в момент калибровки (§11.2): натуральные пиксели
   картинки. Забыть ar — получить правдоподобные числа с ошибкой 30–80 %. */
function planCImgAr(id){
  const img = document.getElementById(id);
  return (img && img.naturalWidth > 0 && img.naturalHeight > 0)
    ? img.naturalWidth / img.naturalHeight : 0;
}

/* Идентификатор текущего снимка плана — тот же, что пишет уровень A. */
function planCImgId(){
  const p = objPlan();
  return p ? String(p.file_id || p.id || "") : "";
}

/* Цвет заливки по типу помещения (§11.5). Палитра — та же семья, что у графа. */
function planCColor(code){
  const r = roomList().filter(x => String(x.code) === String(code))[0] || {};
  const k = String(r.kind || "").toLowerCase();
  if(/кухн/.test(k)) return "#ff9f0a";
  if(/ванн|туал|сануз|душ/.test(k)) return "#0a84ff";
  if(/коридор|прихож|холл|тамбур/.test(k)) return "#8e8e93";
  if(/лодж|балкон/.test(k)) return "#64d2ff";
  return "#30d158";
}

/* SVG-заливка контуров поверх плана (§11.5). Рисуется ПОД слоем линий и
   плашек, поэтому pointer-events нет и клики уходят картинке. */
function planCFills(pp){
  const polys = (pp || {}).polys || {};
  const codes = Object.keys(polys);
  if(!codes.length) return "";
  const shapes = codes.map(code => {
    const pts = polys[code].map(p => (p[0] * 100) + "," + (p[1] * 100)).join(" ");
    const c = planCColor(code);
    return '<polygon points="' + pts + '" fill="' + c + '" fill-opacity="0.22" stroke="' + c +
      '" stroke-width="1.5" vector-effect="non-scaling-stroke" />';
  }).join("");
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"' +
    ' style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">' + shapes + '</svg>';
}

/* Плашка садится в центр тяжести контура (§11.5): подменяем координаты
   комнат центроидами там, где контур есть, и отдаём прежнему planLayer —
   линии проёмов и плашки едут туда сами, слой A/B не правится. Комната
   с контуром, но без метки уровня A, плашку тоже получает: точка при
   контуре становится необязательной. */
function planCAdj(mk, pp){
  const polys = (pp || {}).polys || {};
  const out = { v: (mk || {}).v || 1, img: (mk || {}).img || "", rooms: {}, elems: (mk || {}).elems || {} };
  Object.keys((mk || {}).rooms || {}).forEach(code => { out.rooms[code] = mk.rooms[code]; });
  Object.keys(polys).forEach(code => {
    const c = PLANGEO.centroid(polys[code]);
    if(c) out.rooms[code] = c;
  });
  return out;
}

/* Строка сверки в карточке помещения (§11.5–11.6): «по плану … · в обмерах …».
   Чужой снимок сверку выключает (§11.3); нет обмера — сравнивать не с чем. */
function planCCompareLine(r){
  const pp = planPolys(), sc = planScale();
  const code = String((r || {}).code || "");
  if(!sc || !planHasPoly(pp, code)) return "";
  const cur = planCImgId();
  if(!planSameImg(sc, cur) || !planSameImg(pp, cur)) return "";
  const m = PLANGEO.roomMetrics(pp.polys[code], sc, r, cur);
  const c = m.compare && m.compare.area;
  if(!c || (c.state !== "сходится" && c.state !== "проверьте")) return "";
  const ok = c.state === "сходится";
  const line = ok
    ? "по плану " + pgFmt1(c.plan) + " м² · в обмерах " + pgFmt1(c.measured) + " м² — сходится"
    : "по плану " + pgFmt1(c.plan) + " м² · в обмерах " + pgFmt1(c.measured) + " м² — расходится на " + Math.round(c.pct) + " %";
  return '<div class="m" style="margin-top:4px;color:' + (ok ? "#30d158" : "#ff9f0a") + '">' + line +
    (ok ? "" : "<br>Проверьте контур или обмер") + "</div>";
}

/* Тычок по картинке → доля 0…1 по каждой оси. Координаты относительно самой
   картинки, а не окна — страница прокручивается (урок planMarkTap). */
function planCTapXY(ev){
  const r = ev.currentTarget.getBoundingClientRect();
  if(!r.width || !r.height) return null;
  const x = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
  const y = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
  return [pgRound4(x), pgRound4(y)];
}

const planCDot = (p, col) => '<circle cx="' + (p[0] * 100) + '" cy="' + (p[1] * 100) + '" r="1.6" fill="' +
  col + '" stroke="#000" stroke-width="0.35" />';
const planCSvg = inner => '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"' +
  ' style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">' + inner + '</svg>';

/* ── Калибровка масштаба (§11.4) ───────────────────────────── */

function planScaleStart(){
  if(!PLAN_URL){ toast("План ещё не загрузился", "wait"); return; }
  const sc = planScale();
  PSC = { pts: [], len: sc ? String(sc.len_m) : "" };
  planScaleDraw();
}
function planScaleClose(){
  const b = document.getElementById("pscBox");
  if(b) b.remove();
  PSC = null;
}
function planScaleDraw(){
  let box = document.getElementById("pscBox");
  if(!box){
    box = document.createElement("div");
    box.id = "pscBox";
    box.style.cssText = "position:fixed;inset:0;z-index:9997;background:#000;overflow-y:auto;" +
      "padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px))";
    document.body.appendChild(box);
  }
  const n = PSC.pts.length;
  const lay = n ? planCSvg(
    (n === 2 ? '<line x1="' + (PSC.pts[0][0] * 100) + '" y1="' + (PSC.pts[0][1] * 100) +
      '" x2="' + (PSC.pts[1][0] * 100) + '" y2="' + (PSC.pts[1][1] * 100) +
      '" stroke="#ff9f0a" stroke-width="2.2" vector-effect="non-scaling-stroke" />' : "") +
    PSC.pts.map(p => planCDot(p, "#ff9f0a")).join("")) : "";
  box.innerHTML =
    '<div class="vh" style="color:#fff">Задать масштаб</div>' +
    '<div class="m" style="margin-bottom:6px">Выберите самый длинный отрезок, длину которого знаете точно</div>' +
    '<div class="vs">' + (n < 2 ? "Коснитесь двух точек на плане" : "Расстояние, м") + '</div>' +
    '<div style="position:relative;margin-top:8px">' +
      '<img id="pscImg" src="' + PLAN_URL + '" alt="План БТИ" style="width:100%;display:block;border-radius:12px">' + lay +
    '</div>' +
    '<div style="margin-top:10px">' +
      '<input id="pscLen" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Расстояние, м"' +
      ' value="' + esc(PSC.len) + '" onchange="if(PSC) PSC.len = this.value"' +
      ' style="width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px">' +
    '</div>' +
    '<div class="vrow" style="margin-top:12px">' +
      '<button class="vbtn-cancel" onclick="planScaleClose()">Отмена</button>' +
      (n ? '<button class="vbtn-cancel" onclick="PSC.pts.pop(); planScaleDraw()">Убрать точку</button>' : "") +
      '<button class="vbtn-ok" id="pscOk" onclick="planScaleDone()">Готово</button>' +
    '</div>' +
    '<div class="m" style="margin-top:8px">Тычок ставит метку. Пока не нажато «Готово», в лист не уходит ничего.</div>';
  const img = document.getElementById("pscImg");
  if(img) img.onclick = planScaleTap;
}
function planScaleTap(ev){
  if(!PSC || PSC.pts.length >= 2) return;
  const p = planCTapXY(ev);
  if(!p) return;
  PSC.pts.push(p);
  planScaleDraw();
}
async function planScaleDone(){
  if(!PSC) return;
  if(PSC.pts.length < 2){ toast("Коснитесь двух точек на плане", "err"); return; }
  const el = document.getElementById("pscLen");
  const len = Number(String((el && el.value) || PSC.len || "").replace(",", "."));
  if(!(len > 0)){ toast("Расстояние, м", "err"); return; }
  const ar = planCImgAr("pscImg");
  if(!(ar > 0)){ toast("План ещё не загрузился", "err"); return; }
  const btn = document.getElementById("pscOk");
  if(btn){ btn.disabled = true; btn.textContent = "Записываю…"; }
  try{
    await planScaleSave({ img: planCImgId(), ar: ar, pts: PSC.pts, len_m: len });
    toast("Готово");
    planScaleClose();
    await load();
    render();
  }catch(e){
    toast(e.message, "err");
    if(btn){ btn.disabled = false; btn.textContent = "Готово"; }
  }
}

/* ── Обводка контуров (§11.4) ──────────────────────────────── */

function planPolyStart(){
  if(!PLAN_URL){ toast("План ещё не загрузился", "wait"); return; }
  const pp = planPolys();
  let copy = {};
  try{ copy = JSON.parse(JSON.stringify(pp.polys || {})); }catch(e){ copy = {}; }
  PPL = { code: "", polys: copy, cur: [], last: "" };
  planPolyDraw();
}
function planPolyClose(){
  const b = document.getElementById("pplBox");
  if(b) b.remove();
  PPL = null;
}
function planPolyPick(code){
  if(!PPL) return;
  PPL.code = String(code);
  PPL.cur = [];
  planPolyDraw();
}
function planPolyChips(){
  const rooms = roomList();
  if(!rooms.length) return "";
  return '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">' +
    rooms.map(r => {
      const code = String(r.code);
      const has = Object.prototype.hasOwnProperty.call(PPL.polys, code);
      const on = PPL.code === code;
      return '<button onclick="planPolyPick(\'' + esc(code) + '\')" style="padding:6px 10px;border-radius:9px;' +
        'border:0;background:' + (on ? "#0a84ff" : "#2c2c2e") + ';color:#fff;font-size:13px">' +
        (has ? "✓ " : "") + esc(planShort(r.name || code)) + '</button>';
    }).join("") + '</div>';
}
/* Метрики последнего замкнутого контура — прямо в окне, до записи (§11.4). */
function planPolyMetrics(){
  const last = PPL.last;
  if(!last || !PPL.polys[last]) return "";
  const sc = planScale();
  if(!sc) return '<div class="m" style="margin-top:6px;color:#ff9f0a">Масштаб не задан</div>';
  const room = roomList().filter(r => String(r.code) === last)[0] || {};
  const m = PLANGEO.roomMetrics(PPL.polys[last], sc, room, planCImgId());
  let out = "";
  if(m.warn.indexOf("контур пересекает сам себя") >= 0)
    out += '<div class="m" style="margin-top:6px;color:#ff9f0a">Контур пересекает сам себя</div>';
  if(m.warn.indexOf("масштаб от прежнего снимка") >= 0)
    out += '<div class="m" style="margin-top:6px;color:#ff9f0a">Масштаб от прежнего снимка</div>';
  if(m.area_m2 == null) return out;
  out += '<div class="vs" style="margin-top:6px">' + pgFmt1(m.area_m2) + " м² · " + pgFmt1(m.perim_m) + " м</div>";
  const c = m.compare && m.compare.area;
  if(c && (c.state === "сходится" || c.state === "проверьте")){
    const ok = c.state === "сходится";
    out += '<div class="m" style="color:' + (ok ? "#30d158" : "#ff9f0a") + '">' +
      "по плану " + pgFmt1(c.plan) + " м² · в обмерах " + pgFmt1(c.measured) + " м² — " +
      (ok ? "сходится" : "расходится на " + Math.round(c.pct) + " %") +
      (ok ? "" : "<br>Проверьте контур или обмер") + "</div>";
  }
  return out;
}
function planPolyDraw(){
  let box = document.getElementById("pplBox");
  if(!box){
    box = document.createElement("div");
    box.id = "pplBox";
    box.style.cssText = "position:fixed;inset:0;z-index:9997;background:#000;overflow-y:auto;" +
      "padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px))";
    document.body.appendChild(box);
  }
  const rooms = roomList();
  const leftN = rooms.filter(r => !Object.prototype.hasOwnProperty.call(PPL.polys, String(r.code))).length;
  const cur = PPL.cur, code = PPL.code;
  const room = code ? (rooms.filter(r => String(r.code) === code)[0] || {}) : null;
  const head = code
    ? '<div class="vs">Коснитесь углов помещения: <b>' + esc(planShort((room && room.name) || code)) + '</b></div>' +
      '<div class="m" style="margin-bottom:6px">Отмечено вершин: ' + cur.length + '</div>'
    : '<div class="m" style="margin-bottom:6px">Осталось обвести: ' + leftN + '</div>';
  const curLay =
    (cur.length > 1 ? '<polyline points="' + cur.map(p => (p[0] * 100) + "," + (p[1] * 100)).join(" ") +
      '" fill="none" stroke="#ff9f0a" stroke-width="2" vector-effect="non-scaling-stroke" />' : "") +
    cur.map(p => planCDot(p, "#ff9f0a")).join("");
  box.innerHTML =
    '<div class="vh" style="color:#fff">Обвести помещение</div>' + head +
    '<div style="position:relative">' +
      '<img id="pplImg" src="' + PLAN_URL + '" alt="План БТИ" style="width:100%;display:block;border-radius:12px">' +
      planCFills({ polys: PPL.polys }) +
      (cur.length ? planCSvg(curLay) : "") +
    '</div>' +
    planPolyMetrics() +
    planPolyChips() +
    '<div class="vrow" style="margin-top:12px">' +
      '<button class="vbtn-cancel" onclick="planPolyClose()">Отмена</button>' +
      (cur.length ? '<button class="vbtn-cancel" onclick="PPL.cur.pop(); planPolyDraw()">Убрать точку</button>' : "") +
      (cur.length >= 3 ? '<button class="vbtn-cancel" onclick="planPolyLock()">Замкнуть</button>' : "") +
      '<button class="vbtn-ok" id="pplOk" onclick="planPolyDone()">Готово</button>' +
    '</div>' +
    '<div class="m" style="margin-top:8px">Тычок ставит метку. Пока не нажато «Готово», в лист не уходит ничего.</div>';
  const img = document.getElementById("pplImg");
  if(img) img.onclick = planPolyTap;
}
function planPolyTap(ev){
  if(!PPL || !PPL.code) return;
  const p = planCTapXY(ev);
  if(!p) return;
  PPL.cur.push(p);
  planPolyDraw();
}
/* «Замкнуть»: самопересечение предупреждает, но не запрещает (§11.8 п. 2) —
   человек может обводить сложную комнату и знать, что делает. */
function planPolyLock(){
  if(!PPL || !PPL.code) return;
  if(PPL.cur.length < 3){ toast("Коснитесь углов помещения", "err"); return; }
  if(PLANGEO.selfIntersects(PPL.cur)) toast("Контур пересекает сам себя");
  PPL.polys[PPL.code] = PPL.cur.slice();
  PPL.last = PPL.code;
  PPL.code = "";
  PPL.cur = [];
  planPolyDraw();
}
async function planPolyDone(){
  if(!PPL) return;
  /* Начатый контур с тремя и более вершинами дозамыкается тем же ходом —
     с теми же предупреждениями; одна-две вершины контуром не являются
     и отбрасываются (§11.8 п. 3). */
  if(PPL.code && PPL.cur.length >= 3) planPolyLock();
  const btn = document.getElementById("pplOk");
  if(btn){ btn.disabled = true; btn.textContent = "Записываю…"; }
  try{
    await planPolysSave({ img: planCImgId(), polys: PPL.polys });
    toast("Готово");
    planPolyClose();
    await load();
    render();
  }catch(e){
    toast(e.message, "err");
    if(btn){ btn.disabled = false; btn.textContent = "Готово"; }
  }
}

/* ── Линейка (§11.5): работает только при заданном масштабе ── */

function planRulerStart(){
  if(!PLAN_URL){ toast("План ещё не загрузился", "wait"); return; }
  if(!planScale()){ toast("Масштаб не задан", "err"); return; }
  PRL = { pts: [] };

}
function planRulerClose(){

  if(b) b.remove();

}
function planRulerDraw(){
  let box = document.getElementById("prlBox");
  if(!box){
    box = document.createElement("div");
    box.id = "prlBox";
    box.style.cssText = "position:fixed;inset:0;z-index:9997;background:#000;overflow-y:auto;" +

  if(n === 2 && sc){

    res = isFinite(d) ? '<div class="vs" style="margin-top:8px">' + pgFmt1(d) + " м</div>" : "";
  }
  const lay = n ? planCSvg(
    (n === 2 ? '<line x1="' + (PRL.pts[0][0] * 100) + '" y1="' + (PRL.pts[0][1] * 100) +
      '" x2="' + (PRL.pts[1][0] * 100) + '" y2="' + (PRL.pts[1][1] * 100) +
      '" stroke="#64d2ff" stroke-width="2.2" vector-effect="non-scaling-stroke" />' : "") +
    PRL.pts.map(p => planCDot(p, "#64d2ff")).join("")) : "";
  box.innerHTML =
    '<div class="vh" style="color:#fff">Линейка</div>' +
    '<div class="m" style="margin-bottom:6px">Коснитесь двух точек на плане</div>' +
    '<div style="position:relative">' +
      '<img id="prlImg" src="' + PLAN_URL + '" alt="План БТИ" style="width:100%;display:block;border-radius:12px">' + lay +
    '</div>' + res +
    '<div class="vrow" style="margin-top:12px">' +

  const img = document.getElementById("prlImg");
