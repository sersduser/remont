<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ремонт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:   var(--tg-theme-bg-color, #17212b);
  --sec:  var(--tg-theme-secondary-bg-color, #232e3c);
  --txt:  var(--tg-theme-text-color, #ffffff);
  --hint: var(--tg-theme-hint-color, #7d8b99);
  --btn:  var(--tg-theme-button-color, #5288c1);
  --btxt: var(--tg-theme-button-text-color, #ffffff);
  --ok:#4dcd5e; --warn:#f5a623; --bad:#e5484d; --link:#6ab3f3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  padding:calc(14px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 14px 40px;overscroll-behavior-y:contain}

.hello{font-size:19px;font-weight:600}
.sub{font-size:12px;color:var(--hint);margin-bottom:14px}

.stat{background:var(--sec);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.stat .r{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;gap:10px}
.stat .k{font-size:13px;color:var(--hint)}
.stat .v{font-size:16px;font-weight:600;white-space:nowrap}
.stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)} .stat .v.bad{color:var(--bad)}
.bar{height:6px;background:rgba(125,139,153,.25);border-radius:3px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .4s}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sec);border:none;border-radius:14px;padding:18px 10px;color:var(--txt);
  cursor:pointer;text-align:center;font:inherit;transition:transform .1s}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:27px;display:block;margin-bottom:6px}
.tile .nm{font-size:13px;font-weight:600;line-height:1.25}
.tile .h{font-size:11px;color:var(--hint);margin-top:3px}
.tile.pri{background:var(--btn);color:var(--btxt)}
.tile.pri .h{opacity:.85;color:inherit}

.card{background:var(--sec);border-radius:12px;padding:14px;margin-bottom:10px}
.card .lbl{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;gap:10px;
  border-bottom:1px solid rgba(125,139,153,.16)}
.li:last-child{border:none}
.li .n{font-size:14px;flex:1;min-width:0}
.li .d{font-size:11px;color:var(--hint);margin-top:2px}
.li .v{font-size:14px;font-weight:600;white-space:nowrap}

select,input{background:var(--bg);border:1px solid rgba(125,139,153,.3);color:var(--txt);
  padding:8px 10px;border-radius:9px;font:inherit;font-size:14px;width:100%}
input[type=number]{text-align:center}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row label{font-size:12px;color:var(--hint);flex:0 0 96px}

.filt{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt button{background:var(--sec);border:none;color:var(--hint);padding:7px 13px;border-radius:20px;
  font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.filt button.on{background:var(--btn);color:var(--btxt)}

.work{background:var(--sec);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.work.done{opacity:.55}
.work .t{font-size:14px;font-weight:500;line-height:1.3}
.work .m{font-size:11px;color:var(--hint);margin-top:3px}

.warnbox{background:rgba(245,166,35,.13);border:1px solid rgba(245,166,35,.32);border-radius:12px;
  padding:13px;margin-bottom:12px;font-size:14px;line-height:1.5}
.warnbox b{color:var(--warn)}
.mainbtn{width:100%;background:var(--btn);color:var(--btxt);border:none;border-radius:11px;
  padding:13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:11px}

.load{text-align:center;padding:70px 20px;color:var(--hint)}
.err{background:rgba(229,72,77,.13);border:1px solid rgba(229,72,77,.4);border-radius:12px;
  padding:15px;font-size:14px;line-height:1.55}
.toast{position:fixed;left:14px;right:14px;bottom:18px;background:var(--ok);color:#06240c;
  padding:12px;border-radius:11px;text-align:center;font-weight:600;font-size:14px;
  opacity:0;transform:translateY(12px);transition:.22s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
.toast.bad{background:var(--bad);color:#fff}
.toast.wait{background:var(--sec);color:var(--hint)}
.toast.err{background:var(--bad);color:#fff}

/* ── ГОЛОСОВОЙ ВВОД: модальное окно, индикатор, результат ── */
.vmask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
  justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:.2s}
.vmask.on{opacity:1;pointer-events:auto}
/* Лист подтверждения прокручивается [чат 029]. При длинном разборе (работы по
   коридору — два десятка видов) лист вырастал за экран: кнопки «Отмена» и
   «Записать» оставались внизу за краем, а «Расслышал:» уезжал вверх, и
   проверить распознанное было нечем. */
.vsheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(20px);transition:.24s;
  max-height:88vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* Фильтр «только отмеченные»: прячем невыбранное, не трогая состояние выбора. */
#vlist.selonly .vitem:not(.sel){display:none}
.vfilter{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.vfilter button{flex:1;border:none;border-radius:10px;padding:9px;font:inherit;font-size:13px;
  background:var(--sec);color:var(--txt);cursor:pointer}
.vfilter button.on{background:var(--btn);color:var(--btxt)}
.vmask.on .vsheet{transform:none}
.vsheet .vh{font-size:17px;font-weight:600;margin-bottom:4px}
.vsheet .vs{font-size:12px;color:var(--hint);margin-bottom:14px}

.vrec{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 6px}
.vmic{width:84px;height:84px;border-radius:50%;background:var(--btn);display:flex;align-items:center;
  justify-content:center;font-size:38px}
.vmic.rec{animation:pulse 1.2s ease-out infinite;background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}100%{box-shadow:0 0 0 26px rgba(229,72,77,0)}}
.vtime{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.vwave{display:flex;gap:3px;align-items:center;height:20px}
.vwave i{width:3px;background:var(--hint);border-radius:2px;animation:wv 1s ease-in-out infinite}
.vwave i:nth-child(2){animation-delay:.15s}.vwave i:nth-child(3){animation-delay:.3s}
.vwave i:nth-child(4){animation-delay:.45s}.vwave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:6px}50%{height:20px}}

.vrow{display:flex;gap:10px;margin-top:16px}
.vrow button{flex:1;border:none;border-radius:11px;padding:13px;font:inherit;font-size:15px;
  font-weight:600;cursor:pointer}
.vbtn-ok{background:var(--btn);color:var(--btxt)}
.vbtn-cancel{background:var(--sec);color:var(--txt)}
.vbtn-bad{background:var(--bad);color:#fff}

.vitem{display:flex;gap:11px;align-items:flex-start;background:var(--sec);border-radius:11px;
  padding:12px;margin-bottom:8px;cursor:pointer}
.vitem .vchk{width:22px;height:22px;border-radius:6px;border:2px solid var(--hint);flex:0 0 22px;
  margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.vitem.sel .vchk{background:var(--ok);border-color:var(--ok)}
.vitem .vt{font-size:14px;font-weight:500;line-height:1.3}
.vitem .vd{font-size:12px;color:var(--hint);margin-top:2px}
.vitem .vv{font-size:13px;margin-top:3px}
.vitem .vv b{color:var(--ok)}
.vquote{background:var(--sec);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--hint);
  margin-bottom:12px;line-height:1.45;position:sticky;top:-4px;z-index:2;box-shadow:0 6px 12px -8px rgba(0,0,0,.9)}
.vquote b{color:var(--txt);font-weight:500}
.vspin{width:34px;height:34px;border:3px solid rgba(125,139,153,.3);border-top-color:var(--btn);
  border-radius:50%;animation:spin .8s linear infinite;margin:8px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app"><div class="load">Загружаю…</div></div>
<div class="toast" id="toast"></div>

<!-- Модальное окно голосового ввода -->
<div class="vmask" id="vmask"><div class="vsheet" id="vsheet"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Адрес n8n. Уже прописан — менять не надо.
   ═══════════════════════════════════════════════════════════════ */
const API = "https://n8n.nc-lab.uz/webhook/remont";

/* Идентификация — по ЛИЧНОСТИ из Telegram (initData), а не по ключу в ссылке.
   Сервер проверяет подпись Telegram его публичным ключом (токен бота не нужен)
   и определяет роль по Telegram-ID из листа 09_Доступы. Подменить роль с клиента
   или подставить чужой ключ нельзя. KEY оставлен запасным входом на переходный
   период и для отладки в обычном браузере (вне Telegram initData недоступен).   */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const INIT = (tg && tg.initData) || "";                              // подписанные данные Telegram
/* Ключ объекта [чат 091, D4]. До 091 KEY был константой из ?key= и при работе
   в Telegram вовсе не уезжал на сервер (auth был «или initData, или key»), из-за
   чего сервер всегда попадал в фолбэк «объект единственный». Теперь ключ живёт
   в панели: пришедший в ссылке запоминается, выбранный человеком становится
   активным, и уезжает ВМЕСТЕ с подписью. Сервер к этому готов с 087: объект он
   берёт из key, а роль — из initData, подменить чужой объект нельзя (доступ
   всё равно проверяется по участию в базе).                                  */
const OBJS_LS = "REMONT_OBJS", OBJK_LS = "REMONT_OBJ_KEY";

function objsAll(){
  try{ const a = JSON.parse(localStorage.getItem(OBJS_LS) || "[]");
       return Array.isArray(a) ? a.filter(o => o && o.key) : []; }catch(e){ return []; }
}
function objsWrite(list){
  try{ localStorage.setItem(OBJS_LS, JSON.stringify(list.slice(0, 20))); }catch(e){}
}
function objsRemember(key, title){
  key = String(key || ""); if(!key) return;
  const list = objsAll(), i = list.findIndex(o => o.key === key);
  const rec = { key: key, title: String(title || (i >= 0 ? list[i].title : "") || ""), ts: Date.now(),
                 role: (i >= 0 ? (list[i].role || "") : "") };   /* роль с сервера не теряется [096] */
  if(i >= 0) list[i] = rec; else list.unshift(rec);
  objsWrite(list);
}
function objsActiveKey(){
  try{ return localStorage.getItem(OBJK_LS) || ""; }catch(e){ return ""; }
}
function objsSetActive(key){
  try{ key ? localStorage.setItem(OBJK_LS, key) : localStorage.removeItem(OBJK_LS); }catch(e){}
}
function objsTitle(key){
  const o = objsAll().find(x => x.key === key);
  const t = o && o.title ? String(o.title) : "";
  return t || ("Объект …" + String(key || "").slice(-6));
}

/* ─── D4 · серверный список участий [чат 096] ────────────────────────────
   До этой правки список объектов был памятью панели: в нём жили только те
   ключи, которые она когда-то получала ссылкой или завела сама. Ветка
   `POST /remont/objects` (функция базы `my_objects`, готова файлом в 095)
   отдаёт участия человека по подписи Telegram: объект, имя, роль и ключ,
   которым именно он имеет право входить.

   Два следствия, ради которых D4 и делался: у объектов появляются НАСТОЯЩИЕ
   имена вместо «Объект …a1b2c3», и в списке оказываются объекты, ссылку на
   которые панель никогда не открывала.

   Мина, названная разведкой 095: `objsAll()` отбрасывает записи без `key`,
   поэтому участие без годного ключа в общее хранилище класть НЕЛЬЗЯ — оно
   исчезнет молча, и потеряется ровно тот случай, ради которого всё затеяно.
   Такие участия живут отдельным списком в памяти страницы (`OBJSRV.nokey`) и
   рисуются некликабельной строкой.                                         */
const OBJ_ROLE_RU = { owner: "заказчик", foreman: "бригадир", hand: "исполнитель", admin: "администратор" };

/* state: idle → load → done | absent (ветки ещё нет) | nosign (вне Telegram) */
let OBJSRV = { state: "idle", nokey: [], err: "" };

function objsMerge(list){
  if(!Array.isArray(list)) return;
  const cur = objsAll(), nokey = [];
  for(const r of list){
    if(!r) continue;
    const key = String(r.key || ""), title = String(r.title || ""), role = String(r.role || "");
    if(!key){
      /* ключа нет — в хранилище нельзя (objsAll такие отбрасывает) */
      nokey.push({ id: String(r.object_id || ""), title: title, role: role });
      continue;
    }
    const i = cur.findIndex(o => o.key === key);
    if(i >= 0){
      /* имя с сервера главнее локального: локальное вписано при заведении и могло устареть */
      cur[i] = { key: key, title: title || cur[i].title || "", ts: cur[i].ts || 0, role: role || cur[i].role || "" };
    }else{
      /* панель этот объект не открывала — ts = 0, чтобы он не встал выше живых */
      cur.unshift({ key: key, title: title, ts: 0, role: role });
    }
  }
  objsWrite(cur);
  OBJSRV.nokey = nokey;
}

async function objsrvLoad(){
  const r = await fetch(API + "/objects", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData: INIT, key: KEY }) });
  const txt = await r.text();
  let j = null; try{ j = JSON.parse(txt); }catch(e){}
  /* «Ветки ещё нет» опознаётся по НЕ-JSON ответу, а не по коду 404: этот n8n
     на незарегистрированный webhook отвечает 500 и HTML-страницей «not registered»
     — проверено на проде и на контрольном несуществующем пути [096]. Отказ самой
     ветки приходит телом JSON и человеку показывается. */
  if(!j && (!r.ok || r.status === 404)){ OBJSRV.state = "absent"; return; }
  const list = Array.isArray(j) ? j
             : (j && Array.isArray(j.list)) ? j.list
             : (j && Array.isArray(j.objects)) ? j.objects
             : (j && Array.isArray(j.payload)) ? j.payload : null;
  if(!r.ok || !list){
    OBJSRV.state = "done";
    OBJSRV.err = (j && j.error) ? String(j.error).replace(/\s*\[line \d+\]\s*$/, "")
                                : ("сервер ответил " + r.status);
    return;
  }
  objsMerge(list);
  OBJSRV.state = "done"; OBJSRV.err = "";
}

/* Зовётся при открытии экрана выбора и ровно один раз: экран рисуется из
   локального списка сразу, ответ ветки лишь дополняет его. Своего try/catch
   здесь мало не бывает — общего обработчика отказов у панели нет, и
   непойманный 404 уронил бы отрисовку экрана (проверено чтением, 095). */
function objsrvKick(){
  if(OBJSRV.state !== "idle") return;
  if(!INIT){ OBJSRV.state = "nosign"; return; }   /* ветка живёт только с подписью */
  OBJSRV.state = "load";
  objsrvLoad()
    .catch(function(e){ OBJSRV.state = "done"; OBJSRV.err = "нет связи с сервером"; })
    .then(function(){ if(stack[stack.length - 1] === "objsel") render(); });
}

const KEY_URL = new URLSearchParams(location.search).get("key") || "";
if(KEY_URL){ objsRemember(KEY_URL, ""); objsSetActive(KEY_URL); }
/* Единственный известный ключ панель применяет сама: серверный фолбэк «объект
   один» исчезнет с появлением второго объекта, и молчание панели в этот день
   стало бы отказом на ровном месте. */
const OBJS_ONE = objsAll();
let KEY = KEY_URL || objsActiveKey() || (OBJS_ONE.length === 1 ? OBJS_ONE[0].key : "");

/* Единая сборка параметров доступа [чат 091]: подпись и ключ объекта не
   исключают друг друга. Пустые не пишем — сервер сам подставит '-'. */
function authQS(){
  const p = [];
  if(INIT) p.push("initData=" + encodeURIComponent(INIT));
  if(KEY)  p.push("key=" + encodeURIComponent(KEY));
  return p.join("&");
}

/* Код приглашения в бригаду [чат 012]: приходит в подписанном start_param
   (ссылка t.me/бота?startapp=inv_КОД) или руками через ?invite / поле ввода.
   Сервер доверяет только тому коду, который сам достаёт из initData или body —
   здесь код нужен лишь чтобы показать его в поле и не заставлять печатать. */
const INVITE = String((tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("invite") || "").replace(/^inv_/i, "");
/* Регистр НЕ приводится [чат 083]: серверный код — 10 знаков hex в нижнем
   регистре, и toUpperCase ломал бы каждую новую ссылку. Верхний регистр
   нужен только старой ветке /register — он ставится там, на входе.      */
/* Код ИМЕННО из start_param [чат 089]. INVITE выше берётся ещё и из ?invite —
   это отладочный вход в обычном браузере и ручная подстановка в поле; гасить
   код без спроса можно только тогда, когда он пришёл подписанной ссылкой.
   INV_AUTO_DONE держит попытку в пределах сеанса панели: load() зовётся из
   двух десятков мест, и accept не должен уходить на сервер при каждом. */
const START_INVITE = String((tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "").replace(/^inv_/i, "");
let INV_AUTO_DONE = false;

let D = null;                       // данные с сервера
let stack = ["home"];               // стек навигации
let fRoom = "";                     // активный фильтр по комнате
let hideDone = false;               // глобальный фильтр «скрыть готовое»
const app = document.getElementById("app");
const fmt = n => (Number(n) || 0).toLocaleString("ru-RU", { maximumFractionDigits: 0 });

/* Бот пишет в таблицу произвольные названия материалов. Одна кавычка в имени
   сломала бы разметку — поэтому всё, что пришло с сервера, экранируем.        */
const esc  = t => String(t ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const attr = t => esc(t);

/* ── ЗАГРУЗКА ─────────────────────────────────────────────── */
async function load(){
  try{
    /* Погашение кода из ссылки [чат 089]. До этой правки accept звался только
       из catch — у аккаунта, которого сервер не узнал; знакомому панель молча
       открывалась, а код оставался годным для следующего (used_count = 0 после
       живого прохода 088). Теперь ответ сервера решает, что показать: у типа
       app — ничего (человек и так внутри, а код уже сгорел), у object и crew —
       экран выданного права, у отказа — его причину. */
    const A = await invAuto();
    if(A && A.err){ renderInvite({ err: A.err, code: START_INVITE, auto: true }); return; }
    if(A && A.res && A.res.type !== "app"){
      renderInvite({ phase: "ok", res: A.res });
      if(!A.res.repeat) setTimeout(invOpenPanel, 2200);
      return;
    }
    const auth = authQS();
    const r = await fetch(`${API}/data?${auth}`, { cache: "no-store" });
    const BAD = "Доступ не подтверждён — откройте панель через бота в Telegram.";
    if(r.status === 401 || r.status === 403) throw new Error(BAD);
    if(!r.ok) throw new Error("Сервер не отвечает (HTTP " + r.status + ")");
    /* При неверном ключе n8n обрывает цепочку и отдаёт пустое тело с кодом 200.
       Данные не утекают, но и JSON не приходит — трактуем это как отказ в доступе. */
    const raw = (await r.text()).trim();
    if(!raw) throw new Error(BAD);
    try{ D = JSON.parse(raw); }catch{ throw new Error(BAD); }
    /* Объект без листов [чат 018]: сервер отвечает не отказом, а need_setup —
       панель предлагает создать недостающие листы, вместо тупика «сервер не отвечает». */
    if(D && D.need_setup){ renderSetup(D); return; }
    if(!D || !D.role) throw new Error(BAD);
    render();
    _sig = _snapshot(D);
    langInit();                   // язык: выбор человека → 09_Доступы → Telegram [чат 020]            // калибровка живого обновления
    /* Работник живёт данными контура бригады — тянем их при каждой полной
       загрузке: load() зовётся и при старте, и при откате после ошибки [чат 013] */
    if (D.kind === "hand") crewLoad().then(() => render()).catch(() => {});
  }catch(e){
    /* Незнакомый Telegram — возможно, это работник с приглашением [чат 012]:
       вместо тупика показываем экран регистрации по коду. */
    if(INIT && /не подтверждён/.test(String(e.message || ""))){ renderInvite(); return; }
    app.innerHTML = `<div class="err"><b>Не удалось загрузить.</b><br>${e.message}
      <br><br><span style="color:var(--hint);font-size:13px">Проверьте интернет и откройте ещё раз.</span></div>`;
  }
}

/* ══════════════════════════════════════════════════════════════
   ПРИГЛАШЕНИЕ В БРИГАДУ [чат 012] — регистрация работника.
   Двухфазный разговор с POST /remont/register: check возвращает,
   кого нашли по коду («Вы — Петя, бригада Суботина?»), confirm=1
   вписывает Telegram_ID в Работники и строку в 09_Доступы.
   Ошибки сервер отдаёт пустым телом (граблина 6) — панель честно
   говорит «не подошёл», не различая причин. Замок от двойного тапа. */
let INV_BUSY = false, INV_CODE = "";
const INV_INP = 'style="width:100%;padding:12px;border-radius:12px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:18px;letter-spacing:3px;text-align:center;text-transform:uppercase"';
/* ── ЭКРАН ПРИНЯТИЯ ────────────────────────────────────────────────────
   Один экран на три типа приглашения. Заголовок и текст берутся из ответа
   сервера, а не зашиты («Приглашение в бригаду» было верно ровно для одного
   случая из трёх). first_login отличает нового человека от вернувшегося:
   профиль может быть пуст и у старого аккаунта, поэтому судить по пустоте
   профиля нельзя (контракт 081).                                          */
function renderInvite(s){
  s = s || {};
  const code0 = s.code !== undefined ? s.code : INVITE;
  let body = "", head = "Приглашение", sub = "объект «Ремонт»";

  if(s.phase === "ok"){
    const j = s.res || {};
    head = j.first_login ? "Добро пожаловать" : (j.repeat ? "Вы уже здесь" : "Приглашение принято");
    sub  = INV_T[j.type] ? ("приглашение " + INV_T[j.type]) : "доступ выдан";
    body = '<div class="stat">' +
      (j.purpose ? '<div class="r"><span class="k">Зачем позвали</span><span class="v">' + esc(j.purpose) + '</span></div>' : "") +
      (j.role ? '<div class="r"><span class="k">Ваша роль</span><span class="v">' + esc(INV_ROLE[j.role] || j.role) + '</span></div>' : "") +
      (j.repeat ? '<div class="r"><span class="k" style="font-size:13px;opacity:.65">Повторное нажатие ничего не изменило — доступ уже был выдан.</span><span class="v"></span></div>'
                : '<div class="r"><span class="k" style="font-size:13px;opacity:.65">Доступ выдан. Открываю панель…</span><span class="v"></span></div>') +
      '</div>' +
      '<button class="tile pri" style="width:100%" onclick="invOpenPanel()"><span class="nm">Открыть панель</span></button>';
  } else if(s.phase === "found"){
    head = "Приглашение в бригаду";
    body = '<div class="stat"><span class="k">Код принят. Вы — <b>' + esc(s.name) + '</b>, бригада: <b>' + esc(s.foreman) + '</b>?</span></div>' +
      '<button class="tile pri" style="width:100%;margin-bottom:10px" onclick="invConfirm()"><span class="nm">Да, это я — подключить</span></button>' +
      '<button class="tile" style="width:100%" onclick="renderInvite({code:\'\'})"><span class="nm">Нет, ввести другой код</span></button>';
  } else if(s.phase === "done"){
    head = "Приглашение в бригаду";
    body = '<div class="stat"><span class="k">Готово, ' + esc(s.name) + '! Вы в бригаде. Открываю панель…</span></div>';
  } else {
    body = '<div class="stat"><span class="k">Введите код приглашения. Если вы открыли панель по ссылке-приглашению, код уже подставлен.</span></div>' +
      '<div style="margin:10px 0"><input id="invcode" value="' + attr(code0) + '" ' + INV_INP + ' placeholder="КОД"></div>' +
      (s.err ? '<div class="warnbox">' + esc(s.err) + '</div>' : "") +
      '<button class="tile pri" style="width:100%"' + (INV_BUSY ? " disabled" : "") + ' onclick="invCheck()"><span class="nm">' +
        (INV_BUSY ? "Проверяю…" : "Принять приглашение") + '</span></button>' +
      /* Отказ пришёл на код из ссылки [чат 089]. Причина названа выше, но
         тупика быть не должно: у знакомого аккаунта доступ есть и без этого
         приглашения — истёк код, не право. Кнопка ведёт в панель, и если
         доступа всё же нет, /data вернёт сюда же. */
      (s.auto ? '<button class="tile" style="width:100%;margin-top:10px" onclick="invOpenPanel()"><span class="nm">Открыть панель</span></button>' : "");
  }
  app.innerHTML = '<div class="hello">' + esc(head) + '</div><div class="sub">' + esc(sub) + '</div>' + body;
}

async function invCheck(){
  /* Регистр не трогаем: новый код — hex в нижнем регистре, и toUpperCase
     ломал бы каждую ссылку. Верхний регистр нужен только старой ветке.   */
  const code = String((document.getElementById("invcode") || {}).value || "").trim();
  if(!/^[A-Za-z0-9]{6,64}$/.test(code)){ renderInvite({err: "Код — буквы и цифры, от 6 до 64 знаков.", code}); return; }
  if(INV_BUSY) return;
  INV_BUSY = true;
  try{
    if(INV_NEW !== false){
      const j = await invApi("/invite/accept", { code: code });
      if(!j.absent){
        if(j.error){ renderInvite({err: j.error, code}); return; }
        INV_BUSY = false;
        renderInvite({phase: "ok", res: j});
        /* Не перезагрузка [чат 089]: при живом start_param reload завёл бы
           второй круг автозова и вместо панели показал бы «Вы уже здесь». */
        if(!j.repeat) setTimeout(invOpenPanel, 2200);
        return;
      }
    }
    /* Ветки ещё не на проде — старый двухфазный разговор с /register. */
    const old = code.toUpperCase();
    const r = await fetch(API + "/register", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: INIT, code: old }) });
    const t = (await r.text()).trim();
    let j = null; try{ j = JSON.parse(t); }catch(e){}
    if(j && j.ok && j.phase === "check"){ INV_CODE = old; renderInvite({phase: "found", name: j.name, foreman: j.foreman}); }
    else renderInvite({err: "Код не подошёл: он мог истечь, быть использован или ваш Telegram уже подключён. Попросите новую ссылку.", code});
  }catch(e){ renderInvite({err: "Нет связи с сервером — попробуйте ещё раз.", code}); }
  finally{ INV_BUSY = false; }
}

async function invConfirm(){
  if(INV_BUSY) return;
  INV_BUSY = true;
  try{
    const r = await fetch(API + "/register", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: INIT, code: INV_CODE, confirm: "1" }) });
    const t = (await r.text()).trim();
    let j = null; try{ j = JSON.parse(t); }catch(e){}
    if(j && j.ok && j.phase === "confirm"){ renderInvite({phase: "done", name: j.name}); setTimeout(() => location.reload(), 1600); }
    else renderInvite({err: "Не получилось подключить — попробуйте ещё раз или запросите новую ссылку.", code: INV_CODE});
  }catch(e){ renderInvite({err: "Нет связи с сервером — попробуйте ещё раз.", code: INV_CODE}); }
  finally{ INV_BUSY = false; }
}

/* ── ЗАПИСЬ ───────────────────────────────────────────────────
   Не перечитываем всё после каждой правки — правим локально.
   Иначе на 102 работах экран моргает и уезжает наверх.        */
/* ═══ Зависимости работ · мягкое предупреждение ═══════════════════════
   Предшественники берутся из колонки «Зависит_от» листа 01_Работы
   (приходит в поле deps). Зависимость снята, когда предшественник
   «Готово» или «Снято». Предупреждение НЕ блокирует: карта связей
   черновая, и ошибка в ней не должна стопорить реальную работу.     */
function depCodes(w){
  const raw = String((w && w.deps) || "").trim();
  if (!raw || raw === "—" || raw === "-") return [];
  return raw.split(",").map(s => s.trim()).filter(Boolean);
}
function depBlockers(w){
  if (!D || !D.works || !w) return [];
  return depCodes(w)
    .map(c => D.works.find(x => x.code === c))
    .filter(p => p && p.status !== "Готово" && p.status !== "Снято" && p.status !== "Пропущен");
}
function depAsk(w, blockers){
  return new Promise(resolve => {
    const rows = blockers.map(b =>
      '<div style="margin:8px 0;padding:8px 10px;background:rgba(255,255,255,.07);border-radius:10px">' +
      '<b>' + esc(b.name) + '</b><br><span style="opacity:.65;font-size:13px">' +
      esc(String(b.room || "").split(" (")[0]) + ' · ' + esc(b.status) + '</span></div>').join("");
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px";
    box.innerHTML =
      '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:80vh;overflow:auto;font-size:15px">' +
        '<div style="font-weight:700;margin-bottom:8px">⚠ Предыдущее ещё не принято</div>' +
        '<div style="opacity:.7;font-size:14px;margin-bottom:6px">«' + esc(w.name) + '» обычно делается после того, как принято:</div>' +
        rows +
        '<div style="opacity:.6;font-size:13px;margin:10px 0 14px">Это подсказка, а не запрет. Если на объекте порядок другой — продолжайте.</div>' +
        '<div style="display:flex;gap:8px">' +
          '<button id="depNo" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
          '<button id="depYes" style="flex:1;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Всё равно заявить</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(box);
    box.querySelector("#depNo").onclick  = () => { box.remove(); resolve(false); };
    box.querySelector("#depYes").onclick = () => { box.remove(); resolve(true);  };
  });
}

/* Баланс от приёмки: сколько из выданного аванса уже отработано принятыми
   работами. null — если считать не из чего (нет ни оплат, ни приёмки).  */
function advCalc(field){
  const acc  = accSum(field);
  const S2   = D.settings || {};
  const paid = Number(S2["Оплачено_за_работу_USD"] ?? (D.my_money && D.my_money.received_usd) ?? 0);
  if (!paid && !acc) return null;
  if (!paid)        return { k:"Принято работ",             main: fmt(acc) + " $",
                             sub:"Оплат пока не поступало", pct:0, color:"var(--ok)" };
  if (acc < paid)   return { k:"Отработано аванса",         main: fmt(acc) + " из " + fmt(paid) + " $",
                             sub:"Осталось отработать " + fmt(paid - acc) + " $",
                             pct: Math.max(1, Math.round(acc / paid * 100)), color:"var(--warn)" };
  if (acc === paid) return { k:"Аванс отработан полностью", main: fmt(paid) + " $",
                             sub:"Расчёты сошлись", pct:100, color:"var(--ok)" };
  return              { k:"Аванс отработан, к доплате",     main: fmt(acc - paid) + " $",
                        sub:"Принято на " + fmt(acc) + " $ при оплаченных " + fmt(paid) + " $",
                        pct:100, color:"var(--ok)" };
}

/* ═══ Цены Юрия: подсказка, разнесение, пакетная запись ═══════════════
   Пока колонка «Цена_Юрия_USD» пуста, работник не видит своей витрины
   приёмки. Панель показывает, сколько позиций осталось, принимает ставку
   голосом и умеет разнести общую сумму пропорционально договору.      */
function priceStats(){
  const all = (D.works || []);
  const set = all.filter(w => Number(w.price_contractor_usd) > 0);
  return { all: all.length, set: set.length, empty: all.length - set.length,
           sumSet: set.reduce((s,w) => s + Number(w.price_contractor_usd), 0) };
}
/* ══════════════════════════════════════════════════════════════
   ПРАЙС ИСПОЛНИТЕЛЯ — цены по видам работ из общей базы [чат 007]
   Справочник и прайс лежат в отдельной таблице, общей для всех
   объектов: цена задаётся один раз за вид работы и переезжает на
   следующий объект. Грузится по требованию, а не в каждом опросе —
   сервер отдаёт справочник только когда панель просит его явно.
   ══════════════════════════════════════════════════════════════ */
async function loadCatalog(force){
  if(D.catalog && !force) return true;
  const auth = authQS();
  const r = await fetch(API + '/data?' + auth + '&catalog=1', { cache: 'no-store' });
  const raw = (await r.text()).trim();
  if(!r.ok || !raw) throw new Error('Не удалось загрузить справочник');
  let j; try{ j = JSON.parse(raw); }catch(e){ throw new Error('Не удалось загрузить справочник'); }
  D.catalog = j.catalog || { kinds: [], price: [] };
  return true;
}

/* ══════════════════════════════════════════════════════════════
   ПРОФИЛЬ РЕМОНТА — сборка сметы из обмеров и прайса [чат 007]
   К помещению применяются виды работ; объём считается из его размеров
   по колонке «База_объёма» справочника, цена — из прайса исполнителя.
   Итог дописывается строками в 01_Работы через POST /remont/append.
   [чат 017] Выбор копится СРАЗУ ПО НЕСКОЛЬКИМ помещениям (PROF.plan):
   на встрече пара проходит квартиру подряд, а смета собирается одним
   действием в конце — возврата к таблице между комнатами быть не должно.
   ══════════════════════════════════════════════════════════════ */
let PROF = { room: null, plan: {} };   // текущее помещение и план по всем помещениям: plan[код помещения][код вида] = {vol, manual}

async function openProfile(){
  try{
    if(!D.catalog) toast('Загружаю справочник…');
    await loadCatalog();
    PROF = { room: null, plan: {} };
    go('profile');
  }catch(e){ toast(e.message, 'err'); }
}

function profRoom(){ return (D.rooms || []).find(r => r.code === PROF.room) || null; }
function profPicked(code){                      // выбор одного помещения (по умолчанию — текущего)
  const rc = code || PROF.room;
  if(!rc) return {};
  if(!PROF.plan[rc]) PROF.plan[rc] = {};
  return PROF.plan[rc];
}

// Сколько единиц работы даёт помещение по базе объёма из справочника
function profVol(kind, room){
  if(!kind || !room) return null;
  const part = b => {
    /* Уточнённая база [чат 033]: считаем по судьбам проёмов, когда схема
       заведена. Схемы нет — уточнение отбрасывается и берётся прежнее число
       обмеров, то есть объект без схемы ведёт себя ровно как до 033. */
    const q = elemBase(b);
    if(q){
      if(elemOf(room.code).length) return elemVol(room.code, q.src, q.role, q.side, kind.unit);
      if(q.src === 'двери') return room.doors;
      if(q.src === 'окна')  return room.windows;
      return null;
    }
    if(b === 'пол')       return room.floor_m2;
    if(b === 'потолок')   return room.ceiling_m2;
    if(b === 'стены')     return room.wall_m2;
    if(b === 'периметр')  return room.perimeter_m;
    if(b === 'окна')      return room.windows;
    if(b === 'двери')     return room.doors;
    if(b === 'помещение' || b === 'объект') return 1;
    return null;
  };
  const base = String(kind.base || '').trim();
  if(!base || base === 'вручную') return null;
  /* Поправки помещения [чат 060, разбор 22 §12]: полоса по высоте подменяет
     базу «стены», вычеты снимаются с итога, коэффициент объём не трогает —
     он живёт в цене (приёмка мерит физические метры). Поправок нет — расчёт
     идёт ровно как до 060: modPlan возвращает null и ни одна ветка не меняется. */
  const mp = modPlan(kind, room);
  let sum = 0;
  for(const p of base.split('+')){
    const nm = p.trim();
    const v = (mp && mp.band && nm === 'стены') ? mp.band.area : part(nm);
    if(v === null || v === undefined || v === '') return null;   // нет данных — просим ввести руками
    sum += Number(v) || 0;
  }
  if(mp) sum = modCut(sum, mp);
  return Math.round(sum * 100) / 100;
}

/* ── Ставка вида: типовая и вилка мин–макс [чат 018] ──────────────────────
   Решение Дмитрия: справочник несёт разброс (минимум — типовая — максимум),
   без региональной привязки. Причина — пробел 5 ревизии 010: одно число
   одинаково врёт и дорогому, и дешёвому исполнителю, а «от и до» показывает
   ему, где он относительно рынка. Типовая остаётся главной цифрой; когда её
   нет, ориентиром служит середина вилки — и подписи честно называют это
   ориентиром, а не ценой. Источник вилки показывается рядом: цифра без
   источника в прайсе не проверяема. */
function rateNum(k){
  if(!k) return 0;
  const mid = Number(k.base_usd) || 0;
  if(mid > 0) return mid;
  const lo = Number(k.base_min) || 0, hi = Number(k.base_max) || 0;
  return (lo > 0 && hi > 0) ? Math.round((lo + hi) / 2 * 100) / 100 : 0;
}
function rateHint(k){
  if(!k) return 'цена за единицу';
  const money = n => (Number(n) || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const mid = Number(k.base_usd) || 0, lo = Number(k.base_min) || 0, hi = Number(k.base_max) || 0;
  const parts = [];
  if(mid > 0) parts.push('ориентир ' + money(mid));
  if(lo > 0 && hi > 0) parts.push((mid > 0 ? 'вилка ' : 'ориентир по рынку ') + money(lo) + '–' + money(hi));
  if(!parts.length) return 'цена за единицу';
  if(k.rate_src) parts.push('источник: ' + k.rate_src);
  return parts.join(' · ');
}

function profPrice(code){
  const p = ((D.catalog || {}).price || []).find(x => x.code === code);
  if(p && Number(p.price_usd) > 0) return Number(p.price_usd);
  const k = ((D.catalog || {}).kinds || []).find(x => x.code === code);
  return rateNum(k);   // прайс пуст — ориентир из справочника: типовая или середина вилки
}

/* Виды, уже стоящие в смете помещения: связь работы с видом несёт пометка
   «вид X» в Примечании [чат 013]. Показываем её, чтобы конструктор не плодил
   вторую такую же строку молча — то же правило переспроса, что у голоса. */
function profInEstimate(roomCode){
  const room = (D.rooms || []).find(r => r.code === roomCode);
  const out = {};
  if(!room) return out;
  (D.works || []).forEach(w => {
    const wc = String(w.code || '');
    const mine = wc.split('-')[0] === roomCode || String(w.room || '').split(' (')[0] === String(room.name || '').split(' (')[0];
    if(!mine) return;
    const m = String(w.note || '').match(/вид\s+([A-Za-z]+-\d+)/i);
    if(m) out[m[1].toUpperCase()] = true;
  });
  return out;
}

function profToggle(code){
  const picked = profPicked();
  if(picked[code]) delete picked[code];
  else {
    const kind = ((D.catalog || {}).kinds || []).find(x => x.code === code);
    picked[code] = { vol: profVol(kind, profRoom()), manual: false, skip: '' };
  }
  render();
}

/* ── Пропуск этапа [чат 054 разбор 25 · реализация 058] ───────────────────
   Классификатор этапный, но часть этапов технология разрешает не делать:
   «красим поверх старого», «штробы уже готовы», «сделано хозяином». Условия
   живут в справочнике (колонка «Пропуск_при», поле skip_when) открытым
   перечнем через «;» — предугадать все ситуации нельзя, и закрытый список
   врал бы больше, чем помогал.

   По умолчанию этап ВКЛЮЧЁН: молча пропустить нельзя (то же правило
   переспроса, что у обмеров, решение 016). Пропуск — осознанное действие
   человека, и у него обязательно есть ПРИЧИНА: при разрыве с подрядчиком
   «пропущено: красим поверх» и «пропущено: сделано хозяином» — это разные
   деньги и разные споры, а «просто не делали» не отвечает ни на один вопрос.

   След остаётся строкой сметы со статусом «Пропущен», объёмом 0 и без цены:
   профиль — не документ, а строка сметы — документ. В расчёты (баланс, срок,
   приёмка) такая строка не входит, как и «Снято». */
function profSkipList(code){
  const k = ((D.catalog || {}).kinds || []).find(x => x.code === code);
  return String((k || {}).skip_when || '').split(';').map(s => s.trim()).filter(Boolean);
}
function profCanSkip(code){ return profSkipList(code).length > 0; }

function profSkip(code, reason){
  const picked = profPicked();
  if(!picked[code]) return;
  const r = String(reason || '').trim();
  if(!r){ toast('Нужна причина пропуска'); return; }
  picked[code].skip = r;
  render();
}
function profUnskip(code){
  const picked = profPicked();
  if(!picked[code]) return;
  picked[code].skip = '';
  render();
}
function profSkipOwn(el){
  const code = el.getAttribute('data-code');
  const v = String(el.value ?? '').trim();
  if(!v){ toast('Впишите причину — иначе пропуск не объяснить'); return; }
  profSkip(code, v);
}
function profSkipUI(code){
  const picked = profPicked();
  const it = picked[code] || {};
  const c = esc(code);
  if(it.skip){
    return '<div class="m" style="margin-top:6px;color:#ff9f0a">Этап пропущен · причина: ' + esc(it.skip) + '</div>' +
      '<div class="m" style="margin-top:4px"><button onclick="profUnskip(\'' + c + '\')" ' +
      'style="padding:6px 10px;border-radius:8px;border:1px solid #3a3a3c;background:#1c1c1e;color:#fff;font-size:13px">Вернуть в работу</button></div>';
  }
  const reasons = profSkipList(code);
  if(!reasons.length) return '';
  return '<div class="m" style="margin-top:6px;opacity:.8">Можно пропустить, если: ' + esc(reasons.join(' · ')) + '</div>' +
    '<div class="m" style="margin-top:4px;display:flex;flex-wrap:wrap;gap:6px">' +
      reasons.map(r => '<button onclick="profSkip(\'' + c + '\', ' + JSON.stringify(r).replace(/"/g, '&quot;') + ')" ' +
        'style="padding:6px 10px;border-radius:8px;border:1px solid #3a3a3c;background:#1c1c1e;color:#ff9f0a;font-size:13px">Пропустить: ' + esc(r) + '</button>').join('') +
    '</div>' +
    '<div class="m" style="margin-top:4px">Своя причина: ' +
      '<input type="text" data-code="' + c + '" onchange="profSkipOwn(this)" placeholder="почему этап не нужен" ' +
      'style="width:190px;padding:6px;border-radius:8px;border:1px solid #3a3a3c;background:#000;color:#fff"></div>';
}

function profSetVol(el){
  const code = el.getAttribute('data-code');
  const v = String(el.value ?? '').trim().replace(',', '.');
  const picked = profPicked();
  if(!picked[code]) return;
  picked[code].vol = v === '' ? null : Number(v);
  picked[code].manual = true;
  const box = document.getElementById('profSum');
  if(box) box.textContent = profTotalText();
}

function profTotal(roomCode){                    // итог одного помещения
  const picked = (PROF.plan[roomCode || PROF.room] || {});
  let n = 0, sum = 0, blank = 0, skipped = 0;
  for(const code of Object.keys(picked)){
    const it = picked[code];
    n++;
    /* Пропущенный этап не стоит денег и не требует объёма — иначе кнопка
       сборки сметы упиралась бы в «без объёма» у строки, которую как раз
       и решили не делать. */
    if(it.skip){ skipped++; continue; }
    if(it.vol === null || !(Number(it.vol) > 0)) { blank++; continue; }
    sum += Number(it.vol) * profPriceRoom(code, roomCode || PROF.room);
  }
  return { n, sum: Math.round(sum * 100) / 100, blank, skipped };
}
function profTotalAll(){                         // итог по всему плану
  let n = 0, sum = 0, blank = 0, rooms = 0, skipped = 0;
  Object.keys(PROF.plan).forEach(rc => {
    const t = profTotal(rc);
    if(!t.n) return;
    rooms++; n += t.n; sum += t.sum; blank += t.blank; skipped += t.skipped;
  });
  return { rooms, n, sum: Math.round(sum * 100) / 100, blank, skipped };
}
function profTotalText(){
  const t = profTotal();
  return t.n ? ('Выбрано ' + t.n + ' · на ' + fmt(t.sum) + ' USD' + (t.blank ? (' · без объёма: ' + t.blank) : '') + (t.skipped ? (' · пропущено этапов: ' + t.skipped) : '')) : 'Ничего не выбрано';
}
function profTotalAllText(){
  const t = profTotalAll();
  if(!t.n) return 'План пуст';
  return 'В плане ' + t.n + ' работ в ' + t.rooms + ' помещ. · ' + fmt(t.sum) + ' USD' + (t.blank ? (' · без объёма: ' + t.blank) : '') + (t.skipped ? (' · пропущено этапов: ' + t.skipped) : '');
}

// Сборка сметы: выбранное по ВСЕМ помещениям плана превращается в строки листа 01_Работы [чат 007 · многокомнатно 017]
async function profBuild(){
  const kinds = (D.catalog || {}).kinds || [];
  const kindOf = c => kinds.find(k => k.code === c) || {};
  const roomCodes = Object.keys(PROF.plan).filter(rc => Object.keys(PROF.plan[rc] || {}).length);
  if(!roomCodes.length) { toast('Ничего не выбрано'); return; }

  let noVol = 0;
  roomCodes.forEach(rc => { noVol += profTotal(rc).blank; });
  if(noVol){ toast('Без объёма: ' + noVol + ' — заполните или снимите', 'err'); return; }

  const rows = [];
  const names = [];
  roomCodes.forEach(rc => {
    const room = (D.rooms || []).find(r => r.code === rc);
    if(!room) return;
    names.push(String(room.name || rc).split(' (')[0]);
    const codes = Object.keys(PROF.plan[rc]);
    // Новые коды строк: продолжаем нумерацию помещения, чтобы не столкнуться с существующими
    const used = (D.works || []).filter(w => String(w.code || '').indexOf(rc + '-') === 0)
      .map(w => parseInt(String(w.code).split('-')[1], 10) || 0);
    let next = (used.length ? Math.max.apply(null, used) : 0) + 1;
    const newCode = {};
    codes.forEach(c => { newCode[c] = rc + '-' + String(next++).padStart(2, '0'); });
    codes.forEach(c => {
      const k = kindOf(c);
      const skip = String(PROF.plan[rc][c].skip || '').trim();
      const vol = skip ? 0 : Number(PROF.plan[rc][c].vol);
      const rate = skip ? 0 : profPriceRoom(c, rc);
      // Типовые зависимости вида превращаются в ссылки на строки этого же помещения —
      // те предшественники, которые здесь не выбраны, просто опускаются.
      const deps = String(k.deps || '').split(',').map(x => x.trim()).filter(x => x && newCode[x]).map(x => newCode[x]);
      /* Пропущенный этап уходит в смету строкой-следом: статус «Пропущен»,
         объём и цена пустые, причина в примечании с датой. Зависимостей у
         неё нет намеренно — иначе снятый этап держал бы цепочку срока. */
      rows.push({
        'Код': newCode[c],
        'Помещение': room.name,
        'Раздел': k.section || '',
        'Работа': k.name || c,
        'Ед': k.unit || '',
        'Объём': skip ? 0 : vol,
        'Ставка_USD': (!skip && rate) ? rate : '',
        'Категория': 'База',
        'Цена_аллокация_USD': (!skip && rate) ? Math.round(vol * rate * 100) / 100 : '',
        'Статус': skip ? 'Пропущен' : 'Не начато',
        'Готовность_%': 0,
        'Источник': 'профиль ремонта',
        'Примечание': 'вид ' + c + (skip ? (' · пропуск: ' + skip + ' [' + crewToday() + ']') : modNote(c, rc)),
        'Зависит_от': skip ? '—' : (deps.length ? deps.join(', ') : '—'),
      });
    });
  });

  const t = profTotalAll();
  if(!confirm('Добавить ' + rows.length + ' работ в смету на ' + fmt(t.sum) + ' USD?' +
    (t.skipped ? ('\nИз них пропущенных этапов: ' + t.skipped + ' — уйдут строками без цены, с причиной') : '') +
    '\nПомещения: ' + names.join(', '))) return;

  try{
    const r = await fetch(API + '/append', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: INIT, key: KEY, sheet: '01_Работы', rows: rows })
    });
    const txt = (await r.text()).trim();
    if(!r.ok || !txt) throw new Error('Не удалось добавить работы');
    toast('Добавлено работ: ' + rows.length + ' в ' + names.length + ' помещ.');
    PROF = { room: null, plan: {} };
    await load();
    render(true);
  }catch(e){ toast(e.message, 'err'); }
}

/* ══════════════════════════════════════════════════════════════
   СРОКИ — критический путь и шкала «опережение / отставание» [чат 007]
   Длительности приезжают в поле dur (черновая оценка из ставки чел-часа),
   связи — в поле deps. По ним считается самая длинная цепочка: она и есть
   срок объекта. Работы вне этой цепочки имеют запас и на финиш не влияют.
   ══════════════════════════════════════════════════════════════ */
/* Техпаузы [чат 012]. «Техпауза_дней» — календарное время ПОСЛЕ работы
   (стяжка сохнет, штукатурка стоит), прежде чем могут стартовать зависимые.
   Живёт в справочнике видов; связь работы с видом — пометка «вид X»
   в Примечании, её ставит конструктор смет. У унаследованных работ пилота
   пометки нет: их паузы неизвестны и считаются нулём, охват честно показан
   на экране. Паузы не тратят человекодни — оценка «по рукам» не растёт. */
function pauseOf(w){
  const kinds = (D.catalog || {}).kinds;
  if(!kinds || !w || !w.note) return 0;
  const m = String(w.note).match(/вид\s+([A-Za-z]+-\d+)/i);
  if(!m) return 0;
  const k = kinds.find(x => x.code === m[1]);
  return (k && Number(k.pause) > 0) ? Number(k.pause) : 0;
}
async function openTerms(){
  try{
    if(!D.catalog){ toast('Загружаю справочник…'); await loadCatalog(); }
  }catch(e){ /* без справочника паузы просто нулевые */ }
  go('terms');
}

function schedule(usePauses){
  const ws = (D.works || []).filter(w => w.code);
  const by = {}; ws.forEach(w => { by[w.code] = w; });
  const dur = w => (Number(w.dur) > 0 ? Number(w.dur) : 0.5);
  const pz = c => usePauses ? pauseOf(by[c]) : 0;
  const depsOf = w => String(w.deps || '').split(',').map(s => s.trim())
    .filter(s => s && s !== '—' && by[s]);

  const ef = {};                       // ранний финиш, в днях от старта
  const calc = (code, seen) => {
    if(ef[code] !== undefined) return ef[code];
    if(seen[code]) return 0;           // страховка от цикла в карте связей
    seen[code] = 1;
    const w = by[code]; if(!w) return 0;
    const ds = depsOf(w);
    const start = ds.length ? Math.max.apply(null, ds.map(d => calc(d, Object.assign({}, seen)) + pz(d))) : 0;
    ef[code] = Math.round((start + dur(w)) * 100) / 100;
    return ef[code];
  };
  ws.forEach(w => calc(w.code, {}));
  const total = ws.length ? Math.max.apply(null, ws.map(w => ef[w.code] || 0)) : 0;

  const succ = {};                     // последователи
  ws.forEach(w => depsOf(w).forEach(d => { (succ[d] = succ[d] || []).push(w.code); }));
  const lf = {};                       // поздний финиш
  const late = (code, seen) => {
    if(lf[code] !== undefined) return lf[code];
    if(seen[code]) return total;
    seen[code] = 1;
    const ss = succ[code] || [];
    lf[code] = ss.length
      ? Math.min.apply(null, ss.map(s => late(s, Object.assign({}, seen)) - dur(by[s]))) - pz(code)
      : total;
    return lf[code];
  };
  ws.forEach(w => late(w.code, {}));
  const slack = {}; ws.forEach(w => { slack[w.code] = Math.round(((lf[w.code] || 0) - (ef[w.code] || 0)) * 100) / 100; });
  const critical = ws.filter(w => Math.abs(slack[w.code]) < 0.01).map(w => w.code);
  return { ef, lf, slack, total, critical, by };
}

/* ── Срок с ограничением параллельности [чат 034] ─────────────────────
   До 034 срок считался как max(критический путь; чел-дни ÷ бригада). Второе
   слагаемое отменено решением Дмитрия (029): «не всегда есть прямая
   зависимость от количества людей… электрики и сантехники мигрируют между
   бригадами, так как нужны штучно на конкретном этапе». Делить объём на людей
   нельзя: ремонт упирается не в людей, а во фронты — сколько работ физически
   можно вести одновременно.

   Два ограничения, оба из полей, которые есть у каждой работы: помещение
   (в одной комнате не штукатурят и не красят разом) и раздел (специалист
   штучный, он в одном месте за раз). Ни новой сущности, ни ручного ввода —
   то же правило, что в решении 031: путь «этого ещё нет» обязан работать. */
const CAP_ROOM_KEY = "Фронтов_в_помещении";
const CAP_SEC_KEY  = "Фронтов_на_раздел";

/* Умолчание — один фронт. Это не измерение, а честный минимум: он виден на
   экране и правится, в отличие от прежней зашитой «бригады из двух», которую
   человек не видел вовсе. Кривое значение в листе не должно ронять расчёт,
   поэтому всё, что не число ≥ 1, считается умолчанием. */
function capOf(key){
  const v = (D.settings || {})[key];
  const n = Number(v);
  return (v === null || v === undefined || String(v).trim() === "" || !(n >= 1)) ? 1 : Math.round(n);
}
function capSet(){ return { room: capOf(CAP_ROOM_KEY), sec: capOf(CAP_SEC_KEY) }; }

/* Заведены ли строки параметров в листе настроек. Пока их нет, поля правки
   не показываем: запись в несуществующую строку возвращает 404 уже после
   того, как человек нажал (грабля 19 — ключевая колонка листа). */
function capStored(){
  const s = D.settings || {};
  return Object.prototype.hasOwnProperty.call(s, CAP_ROOM_KEY)
      && Object.prototype.hasOwnProperty.call(s, CAP_SEC_KEY);
}

/* Списочное планирование. Порядок — по критичности (меньший поздний старт
   раньше), при равенстве длиннее вперёд, при полном равенстве по коду —
   иначе расписание меняется от порядка строк в листе и тест не воспроизводим.
   Время двигается событиями, а не шагами календаря: шаг в четверть дня давал
   бы ошибку округления на каждой работе.

   Паузы фронт не занимают: пока стяжка сохнет, помещение свободно для работ,
   которые от неё не зависят. Иначе 28-дневная пауза заперла бы комнату
   на месяц — а сохнет пол, а не комната. */
function planRun(capRoom, capSecDefault, capSecBy, cpm){
  const ws = (D.works || []).filter(w => w.code);
  const by = {}; ws.forEach(w => { by[w.code] = w; });
  const dur = w => (Number(w.dur) > 0 ? Number(w.dur) : 0.5);
  const depsOf = w => String(w.deps || "").split(",").map(s => s.trim())
    .filter(s => s && s !== "—" && by[s]);
  const s = cpm || schedule(true);
  const ls = {}; ws.forEach(w => { ls[w.code] = (s.lf[w.code] || 0) - dur(w); });
  const capS = k => (capSecBy && capSecBy[k] !== undefined) ? capSecBy[k] : capSecDefault;
  const left = ws.map(w => w.code).sort((a, b) =>
    (ls[a] - ls[b]) || (dur(by[b]) - dur(by[a])) || (a < b ? -1 : a > b ? 1 : 0));
  const fin = {}, start = {}, running = [];
  let t = 0, guard = 0;
  while(left.length && guard++ < 4000){
    const br = {}, bs = {};
    running.forEach(r => { br[r.room] = (br[r.room] || 0) + 1; bs[r.sec] = (bs[r.sec] || 0) + 1; });
    let started = false;
    for(let i = 0; i < left.length; i++){
      const c = left[i], w = by[c];
      const ready = depsOf(w).every(d => fin[d] !== undefined && fin[d] + pauseOf(by[d]) <= t + 1e-9);
      if(!ready) continue;
      const rm = w.room || "(общие)", sc = w.section || "(без раздела)";
      if((br[rm] || 0) >= capRoom) continue;
      if((bs[sc] || 0) >= capS(sc)) continue;
      br[rm] = (br[rm] || 0) + 1; bs[sc] = (bs[sc] || 0) + 1;
      start[c] = t; fin[c] = t + dur(w);
      running.push({ code: c, room: rm, sec: sc, fin: fin[c] });
      left.splice(i, 1); i--; started = true;
    }
    /* Никто не работает и никто не стартовал. Это ещё не тупик: так бывает,
       когда все оставшиеся работы ждут технологическую паузу — стяжка сохнет,
       а больше делать нечего. Двигаем время к ближайшей готовности; если
       двигать не к чему, значит в карте связей кольцо — выходим, посчитав
       что смогли, и экран честно назовёт число незапланированных. */
    if(!running.length && !started){
      let next = Infinity;
      left.forEach(c => {
        const ds = depsOf(by[c]);
        if(!ds.length) return;
        let rdy = 0, all = true;
        ds.forEach(d => {
          if(fin[d] === undefined) all = false;
          else rdy = Math.max(rdy, fin[d] + pauseOf(by[d]));
        });
        if(all && rdy > t) next = Math.min(next, rdy);
      });
      if(next === Infinity) break;
      t = next;
      continue;
    }
    t = Math.min.apply(null, running.map(r => r.fin));
    for(let i = running.length - 1; i >= 0; i--) if(running[i].fin <= t + 1e-9) running.splice(i, 1);
  }
  const codes = Object.keys(fin);
  const span = codes.length ? Math.max.apply(null, codes.map(c => fin[c])) : 0;
  return { start: start, fin: fin, makespan: Math.round(span * 100) / 100, stuck: left.length };
}

/* Что держит срок: на сколько сократится, если у раздела станет фронтом
   больше. Считается перепланированием, а не прикидкой — «работ много» не
   значит «держит»: раздел вне критического пути не даёт ничего, сколько
   людей в него ни ставь. Это и есть ответ на «50 человек за день» в цифрах:
   видно, кого добавлять, а кого бессмысленно. */
function termsBottleneck(){
  const caps = capSet();
  const cpm = schedule(true);
  const base = planRun(caps.room, caps.sec, null, cpm).makespan;
  const secs = [];
  (D.works || []).filter(w => w.code).forEach(w => {
    const k = w.section || "(без раздела)";
    if(secs.indexOf(k) < 0) secs.push(k);
  });
  const rows = secs.map(k => {
    const o = {}; o[k] = caps.sec + 1;
    const m = planRun(caps.room, caps.sec, o, cpm).makespan;
    return { sec: k, span: Math.round(m * 10) / 10, gain: Math.round((base - m) * 10) / 10 };
  }).sort((a, b) => (b.gain - a.gain) || (a.sec < b.sec ? -1 : 1));
  const rm = planRun(caps.room + 1, caps.sec, null, cpm).makespan;
  return { base: Math.round(base * 10) / 10, rows: rows,
           roomSpan: Math.round(rm * 10) / 10,
           roomGain: Math.round((base - rm) * 10) / 10 };
}

// Где мы во времени: сравниваем пройденное по плану с прошедшими днями
function timeCalc(){
  const s = schedule(true);
  const s0 = schedule(false);
  const caps = capSet();
  const p = planRun(caps.room, caps.sec, null, s);
  /* Пройдено — по расписанию С ограничениями: план теперь это оно, а не
     технологический минимум. Считать достигнутое по одному расписанию,
     а срок по другому — тот же разъезд определений, что дал два разных
     числа человекодней в 027. */
  const done = (D.works || []).filter(w => w.status === 'Готово' && w.code);
  const reached = done.length ? Math.max.apply(null, done.map(w => p.fin[w.code] || 0)) : 0;
  const dates = (D.works || []).map(w => String(w.updated || '').slice(0, 10)).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const start = dates.length ? new Date(dates[0] + 'T00:00:00') : null;
  const elapsed = start ? Math.max(0, Math.round((Date.now() - start.getTime()) / 86400000)) : null;
  const diff = (elapsed === null) ? null : Math.round((reached - elapsed) * 10) / 10;
  const sumDur = (D.works || []).reduce((a, w) => a + (Number(w.dur) > 0 ? Number(w.dur) : 0.5), 0);
  const real = Math.round(p.makespan * 10) / 10;
  return { total: Math.round(s.total * 10) / 10, reached: Math.round(reached * 10) / 10, elapsed, diff,
           critical: s.critical, sched: s, startDate: dates[0] || null,
           sumDur: Math.round(sumDur * 10) / 10, caps: caps, plan: p, real: real, stuck: p.stuck,
           pauses: Math.round((s.total - s0.total) * 10) / 10,
           pcov: (D.works || []).filter(w => pauseOf(w) > 0).length };
}
