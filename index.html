/* ══════════════════════════════════════════════════════════════
   ГОЛОСОВОЙ ВВОД — запись прямо в приложении, разбор на сервере.
   Ничего не уходит в ленту бота: запись, распознавание и
   подтверждение живут во встроенном окне.
   Контракт сервера POST {API}/voice  (FormData: audio, initData|key):
     ответ { ok:true, recognized:"…", items:[ {sheet,code,name,room,
             field,field_label,value,value_label} ] }
     items.length === 0  → ничего внятного не распознано (выбраковка)
     items.length === 1  → одно подтверждение
     items.length  >  1  → мультивыбор «N из M»
   Для работника (kind=hand) сервер отвечает { ok, recognized,
     mode:'hand', actions:[ {kind:'time',event,shift_min,at} |
     {kind:'work',code,name,room,percent,comment} |
     {kind:'material',name,qty,comment} ] } — запись идёт прежними
   каналами: Табель и Отчёты_бригады через crewAppend [чат 015].
   ══════════════════════════════════════════════════════════════ */
let mediaRec = null, chunks = [], vTimer = null, vSec = 0, vStream = null, vItems = [];
let vMode = "";   // сценарий разбора: "" — правки учёта, "rooms" — обмеры помещений [чат 016]
const vmask  = document.getElementById("vmask");
const vsheet = document.getElementById("vsheet");

function openVSheet(html){ vsheet.innerHTML = html; vmask.classList.add("on"); }
function closeVSheet(){ vmask.classList.remove("on"); }

async function startVoice(mode){
  vMode = String(mode || "");
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined"){
    toast("Запись голоса недоступна в этом клиенте", "bad"); return;
  }
  try{
    vStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    openVSheet(`
      <div class="vh">Нужен доступ к микрофону</div>
      <div class="vs">Разрешите приложению запись, чтобы диктовать правки.</div>
      <div class="vrow"><button class="vbtn-cancel" onclick="closeVSheet()">Закрыть</button></div>`);
    return;
  }
  chunks = [];
  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
             : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm"
             : MediaRecorder.isTypeSupported("audio/ogg;codecs=opus") ? "audio/ogg;codecs=opus" : "";
  try{
    mediaRec = new MediaRecorder(vStream, mime ? { mimeType: mime } : undefined);
  }catch(e){ mediaRec = new MediaRecorder(vStream); }
  mediaRec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  mediaRec.onstop = onRecStop;
  mediaRec._send = false;
  mediaRec.start();
  vSec = 0;
  renderRecUI();
  vTimer = setInterval(() => { vSec++; const t = document.getElementById("vtime"); if(t) t.textContent = fmtTime(vSec); }, 1000);
}

function renderRecUI(){
  openVSheet(`
    <div class="vh">Говорите</div>
    <div class="vs">${vMode === "rooms"
      ? "Например: «в спальне пять двадцать на три двадцать, потолки два восемьдесят пять, одно окно и одна дверь»"
      : vMode === "repair"
      ? "Например: «в спальне потолок выровнять и покрасить, стены под обои»"
      : (D && D.kind === "hand")
      ? "Например: «пришёл 10 минут назад» или «готовность сдира потолка 50»"
      : "Например: «покраска потолка в спальне готова» или «куплено 5 мешков цемента»"}</div>
    <div class="vrec">
      <div class="vmic rec">🎙️</div>
      <div class="vtime" id="vtime">0:00</div>
      <div class="vwave"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="vrow">
      <button class="vbtn-cancel" onclick="stopVoice(false)">Отмена</button>
      <button class="vbtn-ok" onclick="stopVoice(true)">Готово</button>
    </div>`);
}

function stopVoice(send){
  if(vTimer){ clearInterval(vTimer); vTimer = null; }
  if(mediaRec && mediaRec.state !== "inactive"){ mediaRec._send = send; mediaRec.stop(); }
  if(vStream){ vStream.getTracks().forEach(t => t.stop()); vStream = null; }
  if(!send) closeVSheet();
}

async function onRecStop(){
  if(!mediaRec._send){ return; }
  const blob = new Blob(chunks, { type: (chunks[0] && chunks[0].type) || "audio/webm" });
  if(!blob.size){ showVError("Не расслышал — попробуйте ещё раз."); return; }
  openVSheet(`<div class="vh">Распознаю…</div><div class="vspin"></div>
    <div class="vs" style="text-align:center">Отправляю запись на разбор</div>`);
  try{
    const fd = new FormData();
    fd.append("audio", blob, "voice.webm");
    fd.append("initData", INIT);
    fd.append("key", KEY);                       // legacy / отладка вне Telegram
    fd.append("mode", vMode);                    // сценарий разбора на сервере [чат 016]
    fd.append("room", (typeof PROF === "object" && PROF && PROF.room) ? PROF.room : "");   // открытое помещение профиля: подставится, если его не назвали вслух [чат 017]
    fd.append("lang", LANG);                     // язык интерфейса → язык транскрипции: без него движок относит узбекскую речь к чужому языку [чат 022]
    const r = await fetch(`${API}/voice`, { method: "POST", body: fd });
    const raw = (await r.text()).trim();
    if(r.status === 401 || r.status === 403) throw new Error("Доступ не подтверждён.");
    if(!raw) throw new Error("Не удалось разобрать запись. Попробуйте ещё раз.");
    let d; try{ d = JSON.parse(raw); }catch{ throw new Error("Сервер вернул неожиданный ответ."); }
    showVResult(d);
  }catch(e){ showVError(e.message); }
}

function showVError(msg){
  tg?.HapticFeedback?.notificationOccurred("error");
  openVSheet(`
    <div class="vh">Не получилось</div>
    <div class="vs">${esc(msg)}</div>
    <div class="vrow">
      <button class="vbtn-cancel" onclick="closeVSheet()">Закрыть</button>
      <button class="vbtn-ok" onclick="startVoice(vMode)">Записать заново</button>
    </div>`);
}

/* Переспрос вместо «Не разобрал» [чат 030]. Единый голосовой вход снял привязку
   разбора к экрану: сервер сам решает, о чём реплика. Но когда он ошибся или
   человек сказал о том, чего в этом режиме нет, реплика раньше просто пропадала
   вместе с распознанным текстом. Теперь сервер возвращает ask со списком
   непробованных режимов, а панель предлагает выбрать — и повторяет разбор
   ТЕКСТОМ, без новой записи: звук уже распознан, платить за это дважды незачем. */
const VASK = {
  rooms:  { t: "Размеры и проёмы",     d: "площадь, высота, окна и двери помещения" },
  repair: { t: "Какие работы делать",  d: "покрасить, штукатурить, заменить дверь" },
  acc:    { t: "Учёт по смете",        d: "готовность, статус, закуп материалов" }
};
let vAskText = "";

function showVAsk(d){
  tg?.HapticFeedback?.notificationOccurred("warning");
  vAskText = String(d.recognized || "");
  const opts = (Array.isArray(d.options) ? d.options : []).filter(m => VASK[m]);
  const btns = opts.map(m => `
    <div class="vitem" onclick="vRetry('${m}')">
      <div style="flex:1;min-width:0">
        <div class="vt">${esc(VASK[m].t)}</div>
        <div class="vd">${esc(VASK[m].d)}</div>
      </div>
    </div>`).join("");
  openVSheet(`
    <div class="vh">К чему это отнести?</div>
    <div class="vs">Расслышал, но не понял раздел. Выберите — разберу заново, записывать ничего не буду.</div>
    ${vAskText ? `<div class="vquote">Расслышал: <b>${esc(vAskText)}</b></div>` : ""}
    ${btns}
    <div class="vrow">
      <button class="vbtn-cancel" onclick="closeVSheet()">Закрыть</button>
      <button class="vbtn-ok" onclick="startVoice(vMode)">Сказать иначе</button>
    </div>`);
}

/* Повтор разбора текстом: звук не пишем заново, шлём распознанное и явный режим.
   Нода промпта принимает body.text, а Scribe в этом случае отказывает молча
   (у него onError=continueRegularOutput) — путь проверен прод-тестом 030. */
async function vRetry(mode){
  const text = vAskText;
  if(!text){ startVoice(mode); return; }
  vMode = String(mode === "acc" ? "" : mode);
  openVSheet(`<div class="vh">Разбираю заново…</div><div class="vspin"></div>
    <div class="vs" style="text-align:center">${esc(VASK[mode] ? VASK[mode].t : "")}</div>`);
  try{
    const r = await fetch(`${API}/voice`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        initData: INIT, key: KEY, text: text, mode: vMode,
        room: (typeof PROF === "object" && PROF && PROF.room) ? PROF.room : "",
        lang: LANG
      })
    });
    const raw = (await r.text()).trim();
    if(r.status === 401 || r.status === 403) throw new Error("Доступ не подтверждён.");
    if(!raw) throw new Error("Не удалось разобрать. Попробуйте сказать иначе.");
    let d; try{ d = JSON.parse(raw); }catch{ throw new Error("Сервер вернул неожиданный ответ."); }
    d.ask = false;                     // второй круг переспроса не показываем: человек уже выбрал
    showVResult(d);
  }catch(e){ showVError(e.message); }
}

/* Показ распознанного. items===[] → выбраковка (ничего не поняли). */
function showVResult(d){
  /* Пустой разбор с ask — не тупик, а развилка: показать её раньше, чем ветки
     нарисуют своё «Не разобрал» [чат 030]. */
  if(d && d.ask && Array.isArray(d.options) && d.options.length){
    const nRooms = Array.isArray(d.rooms) ? d.rooms.length : 0;
    const nItems = Array.isArray(d.items) ? d.items.length : 0;
    const nActs  = Array.isArray(d.actions) ? d.actions.length : 0;
    if(nRooms + nItems + nActs === 0){ showVAsk(d); return; }
  }
  if(d && d.mode === "rooms" && Array.isArray(d.rooms)){ showVRooms(d); return; }
  if(d && d.mode === "repair" && Array.isArray(d.rooms)){ showVRepair(d); return; }
  if(d && d.mode === "hand" && Array.isArray(d.actions)){ showVHand(d); return; }
  const items = Array.isArray(d.items) ? d.items : [];
  vItems = items.map(x => ({ ...x, _sel: true }));

  if(items.length === 0){
    tg?.HapticFeedback?.notificationOccurred("warning");
    openVSheet(`
      <div class="vh">Не разобрал</div>
      <div class="vs">Не понял, какую работу или трату вы имели в виду.</div>
      ${d.recognized ? `<div class="vquote">Расслышал: <b>${esc(d.recognized)}</b></div>` : ""}
      <div class="vrow">
        <button class="vbtn-cancel" onclick="closeVSheet()">Закрыть</button>
        <button class="vbtn-ok" onclick="startVoice()">Сказать иначе</button>
      </div>`);
    return;
  }

  const multi = items.length > 1;
  const quote = d.recognized ? `<div class="vquote">Расслышал: <b>${esc(d.recognized)}</b></div>` : "";
  const rows = vItems.map((it, i) => {
    const claim = it.field === "Статус" && it.value === "Готово";
    return `
    <div class="vitem sel" data-i="${i}" onclick="toggleVItem(${i})">
      <div class="vchk">✓</div>
      <div style="flex:1;min-width:0">
        <div class="vt">${esc(it.name || it.code || "")}</div>
        ${it.room ? `<div class="vd">${esc(it.room)}</div>` : ""}
        <div class="vv">${claim
          ? `<b>Заявить готовность</b> — уйдёт ${D.role==="worker" ? "заказчику" : "работнику"} на приёмку`
          : `${esc(it.field_label || it.field || "")}: <b>${esc(it.value_label ?? it.value ?? "")}</b>`}</div>
      </div>
    </div>`;
  }).join("");

  openVSheet(`
    <div class="vh">${multi ? "Проверьте — распознано несколько" : "Проверьте и подтвердите"}</div>
    <div class="vs">${multi ? "Отметьте, что записать, и подтвердите." : "Запишу это изменение в таблицу."}</div>
    ${quote}
    <div id="vlist">${rows}</div>
    <div class="vrow">
      <button class="vbtn-cancel" onclick="closeVSheet()">Отмена</button>
      <button class="vbtn-ok" id="vapply" onclick="applyVoice()">${multi ? "Записать выбранные" : "Да, записать"}</button>
    </div>`);
}

function toggleVItem(i){
  vItems[i]._sel = !vItems[i]._sel;
  const el = document.querySelector(`.vitem[data-i="${i}"]`);
  if(el) el.classList.toggle("sel", vItems[i]._sel);
}

/* Применяем выбранные — по одной записи через тот же /update. */
async function applyVoice(){
  const chosen = vItems.filter(x => x._sel);
  if(!chosen.length){ toast("Ничего не отмечено", "wait"); return; }
  const btn = document.getElementById("vapply");
  if(btn){ btn.disabled = true; btn.textContent = "Записываю…"; }
  let done = 0, fail = 0;
  for(const it of chosen){
    const ok = await upd(it.sheet, it.code, it.field, it.value);
    ok ? done++ : fail++;
  }
  closeVSheet();
  if(fail === 0) toast(done > 1 ? `Записано: ${done}` : "Записано");
  else toast(`Записано ${done}, не удалось ${fail}`, fail && !done ? "bad" : "");
}

/* ── Голос: профиль объекта [чат 016] ──────────────────────────
   Сервер (mode:'rooms') возвращает не правки листа, а разбор сказанного,
   сопоставленный с 06_Помещения: по каждому полю видно «было → станет».
   Поле, у которого значение уже стояло, помечено конфликтом и по умолчанию
   НЕ отмечено: голос, расходящийся с введённым, вызывает переспрос,
   а не тихую перезапись (решение 006). */
let vRooms = [];
const RU2LAT = { а:"A", б:"B", в:"V", г:"G", д:"D", е:"E", ж:"J", з:"Z", и:"I", й:"I", к:"K", л:"L", м:"M", н:"N", о:"O", п:"P", р:"R", с:"S", т:"T", у:"U", ф:"F", х:"H", ц:"C", ч:"C", ш:"S", щ:"S", ы:"Y", э:"E", ю:"U", я:"Y" };
function roomNewCode(name){
  const s = String(name || "").toLowerCase().replace(/[^a-zа-яё ]/gi, " ").trim();
  const w = s.split(/\s+/).filter(Boolean);
  let base = "";
  if(w.length >= 2) base = (RU2LAT[w[0][0]] || w[0][0].toUpperCase()) + (RU2LAT[w[1][0]] || w[1][0].toUpperCase());
  else if(w.length === 1) base = (RU2LAT[w[0][0]] || w[0][0].toUpperCase()) + (RU2LAT[w[0][1]] || (w[0][1] || "X").toUpperCase());
  else base = "RM";
  const busy = new Set(roomList().map(r => String(r.code || "").toUpperCase()));
  if(!busy.has(base)) return base;
  for(let i = 2; i < 30; i++){ const c = base.slice(0, 1) + i; if(!busy.has(c)) return c; }
  return base + "X";
}

/* ── Голос про проёмы [чат 032] ────────────────────────────────────────
   Сервер знает словарь («дверь · окно · проём · нет», семь судеб), но не знает
   схемы объекта и не должен: лист элементов необязательный, а batchGet
   «Голоса» падает целиком, если листа нет (грабля 20). Поэтому сторону
   сопоставляет панель — у неё свежие D.elements и D.adjacency, и здесь же
   живёт признак расхождения плана с фактом (одно место на сводную величину,
   урок 027). Сказанное не пишется молча: конфликт и новый проём приходят
   неотмеченными — те же ворота переспроса, что у обмеров (решение 016). */
function vrNorm(s){
  return String(s == null ? "" : s).toLowerCase().replace(/ё/g, "е")
    .replace(/\(.*?\)/g, " ").replace(/[^a-zа-я0-9 ]/gi, " ").replace(/\s+/g, " ").trim();
}
/* Группы названий — те же, что у ноды «Собрать items»: человек говорит
   «в туалет», а в листе стоит «Санузел». Дублирование осознанное и узкое:
   правда о помещениях по-прежнему одна — лист 06_Помещения, здесь только
   синонимы для сопоставления, и они нужны на случай, когда модель не
   проставила код стороны. Не найдётся ничего — панель честно скажет «не
   понял», а не выберет соседа наугад. */
const VR_GROUPS = [
  ["зал","гостиная","гостинная","холл","mehmonxona","zal"],
  ["спальня","спальная","yotoqxona"],
  ["кухня","oshxona"],
  ["ванная","ванна","душевая","hammom","vanna"],
  ["туалет","уборная","санузел","hojatxona","tualet"],
  ["коридор","прихожая","dahliz","koridor"],
  ["лоджия","балкон","balkon","ayvon","lodjiya"],
  ["третья комната","третья","детская","кабинет","bolalar","kabinet"]
];
function vrGroup(t){
  t = vrNorm(t);
  if(!t) return -1;
  for(let i = 0; i < VR_GROUPS.length; i++)
    for(const w of VR_GROUPS[i]) if(t.indexOf(w) >= 0) return i;
  return -1;
}
function vrSide(x){
  const said = vrNorm(x.side_code || x.side);
  if(!said) return "";
  if(/улиц|двор|наружу|снаруж/.test(said)) return "улица";
  if(/подъезд|лестнич|тамбур|площадк/.test(said)) return "подъезд";
  const byCode = roomList().find(r => vrNorm(r.code) === said);
  if(byCode) return String(byCode.code);
  const byName = roomList().find(r => {
    const n = vrNorm(r.name);
    return n && (n === said || n.indexOf(said) === 0 || said.indexOf(n) === 0);
  });
  if(byName) return String(byName.code);
  const g = vrGroup(said);
  if(g < 0) return "";
  const byGroup = roomList().find(r => vrGroup(r.name) === g);
  return byGroup ? String(byGroup.code) : "";
}
function vrElems(r){
  const list = Array.isArray(r.elements) ? r.elements : [];
  return list.map(x => {
    const side = vrSide(x);
    const near = side ? elemOf(r.code).filter(e => elemSide(e, r.code) === side) : [];
    const cur = near.length === 1 ? near[0] : null;
    const ch = [];
    const put = (col, key, val) => {
      if(!val) return;
      const was = String((cur || {})[key] || "").trim();
      if(was === val) return;                       // сказанное уже стоит — менять нечего
      ch.push({ col: col, key: key, now: val, was: was, conflict: !!cur && was !== "", _sel: !(cur && was !== "") });
    };
    put("Тип_факт", "fact", x.fact);
    put("Судьба", "fate", x.fate);
    put("Тип_план", "plan", x.plan);
    return {
      said: String(x.side || x.side_code || ""), side: side,
      id: cur ? cur.id : "", many: near.length > 1,
      isNew: !near.length && !!side, unknown: !side,
      changes: ch, _sel: false
    };
  }).filter(e => e.changes.length || e.unknown || e.many);
}
/* Подпись без предлога: «Проём → Кухня». Падежи в панели не склоняются нигде,
   а «проём в Кухня» читается как ошибка интерфейса. */
function vrSideLabel(side, said){
  if(side === "улица" || side === "подъезд") return side;
  const r = roomList().find(x => String(x.code) === side);
  return r ? String(r.name || side).split(" (")[0] : (said || side);
}

function showVRooms(d){
  const list = Array.isArray(d.rooms) ? d.rooms : [];
  vRooms = list.map(r => ({ ...r, fields: (r.fields || []).map(f => ({ ...f, _sel: !f.conflict })), elems: vrElems(r) }));
  const quote = d.recognized ? `<div class="vquote">Расслышал: <b>${esc(d.recognized)}</b></div>` : "";
  if(!list.length){
    tg?.HapticFeedback?.notificationOccurred("warning");
    openVSheet(`
      <div class="vh">Не разобрал</div>
      <div class="vs">Скажите, например: «в спальне пять двадцать на три двадцать, потолки два восемьдесят пять, одно окно и одна дверь».</div>
      ${quote}
      <div class="vrow">
        <button class="vbtn-cancel" onclick="closeVSheet()">Закрыть</button>
        <button class="vbtn-ok" onclick="startVoice('rooms')">Сказать иначе</button>
      </div>`);
    return;
  }
  const conflicts = vRooms.reduce((s, r) => s + r.fields.filter(f => f.conflict).length, 0);
  const rows = vRooms.map((r, i) => {
    const head = `<div class="vt">${esc(r.name || "помещение")}${r.isNew ? ' <span style="color:#ff9f0a">· новое</span>' : ""}</div>`;
    const fl = r.fields.map((f, j) => `
      <div class="vitem${f._sel ? " sel" : ""}" data-i="${i}-${j}" onclick="toggleVRoom(${i},${j})">
        <div class="vchk">✓</div>
        <div style="flex:1;min-width:0">
          <div class="vv">${esc(f.label)}: <b>${esc(String(f.now))}</b>${f.conflict ? ` <span style="color:#ff9f0a">(было ${esc(String(f.was))} — заменить?)</span>` : ""}</div>
        </div>
      </div>`).join("");
    const el = (r.elems || []).map((e, j) => {
      const where = vrSideLabel(e.side, e.said);
      if(e.unknown) return `<div class="vitem"><div class="vchk" style="opacity:.3">?</div><div style="flex:1;min-width:0"><div class="vv" style="color:#ff9f0a">Не понял, куда ведёт проём: ${esc(e.said)}</div></div></div>`;
      if(e.many) return `<div class="vitem"><div class="vchk" style="opacity:.3">?</div><div style="flex:1;min-width:0"><div class="vv" style="color:#ff9f0a">Проёмов → ${where} несколько — поправьте в карточке помещения</div></div></div>`;
      /* Разметка разводит интерфейс и данные по разным текстовым узлам:
         «Проём →» и «судьба:» — словарь, «Кухня» и «заложить» — значения.
         Слой переводит узлами, и слипшаяся строка «Проём → Кухня — судьба:»
         осталась бы наполовину русской (урок 021 про остаток кириллицы). */
      const what = e.changes.map(c => `${esc(c.key === "fate" ? "судьба:" : (c.key === "plan" ? "на плане:" : "сейчас:"))} <b>${esc(c.now)}</b>${c.was ? ` <span style="color:#ff9f0a">было: <b>${esc(c.was)}</b></span>` : ""}`).join(" · ");
      const mark = e.isNew ? ' <span style="color:#ff9f0a">· нового проёма нет в схеме, заведу</span>' : "";
      const sel = e.isNew ? e._sel : e.changes.some(c => c._sel);
      return `
      <div class="vitem${sel ? " sel" : ""}" data-e="${i}-${j}" onclick="toggleVElem(${i},${j})">
        <div class="vchk">✓</div>
        <div style="flex:1;min-width:0">
          <div class="vv">Проём → <b>${esc(where)}</b> · ${what}${mark}</div>
        </div>
      </div>`;
    }).join("");
    const elHead = (r.elems || []).length ? '<div class="vd" style="margin:6px 0 2px">Проёмы</div>' : "";
    return `<div style="margin-bottom:10px">${head}${fl}${elHead}${el}</div>`;
  }).join("");
  openVSheet(`
    <div class="vh">Обмеры помещений</div>
    <div class="vs">${conflicts ? "Отмеченное запишу. Значения, которые уже стояли, не отмечены — подтвердите замену вручную." : "Проверьте и подтвердите — запишу в профиль объекта."}</div>
    ${quote}
    <div class="vfilter"><button onclick="vSelOnly(this)">Только отмеченные</button></div>
    <div id="vlist">${rows}</div>
    <div class="vrow">
      <button class="vbtn-cancel" onclick="closeVSheet()">Отмена</button>
      <button class="vbtn-ok" id="vrapply" onclick="applyVoiceRooms()">Записать отмеченное</button>
    </div>`);
}

function toggleVElem(i, j){
  const e = vRooms[i].elems[j];
  if(e.unknown || e.many) return;                  // выбирать не из чего
  const on = e.isNew ? !e._sel : !e.changes.some(c => c._sel);
  e._sel = on;
  e.changes.forEach(c => { c._sel = on; });
  const el = document.querySelector(`.vitem[data-e="${i}-${j}"]`);
  if(el) el.classList.toggle("sel", on);
}

function toggleVRoom(i, j){
  const f = vRooms[i].fields[j];
  f._sel = !f._sel;
  const el = document.querySelector(`.vitem[data-i="${i}-${j}"]`);
  if(el) el.classList.toggle("sel", f._sel);
}

/* Запись: существующее помещение правится по ячейкам, новое сначала
   заводится строкой (код + название), а числа доезжают тем же /update —
   append кладёт значения как есть, а числу положено быть числом. */
async function applyVoiceRooms(){
  const btn = document.getElementById("vrapply");
  const chosen = vRooms
    .map(r => ({ ...r, fields: r.fields.filter(f => f._sel),
                 elems: (r.elems || []).filter(e => e.isNew ? e._sel : e.changes.some(c => c._sel)) }))
    .filter(r => r.fields.length || r.elems.length || r.isNew);
  if(!chosen.length){ toast("Ничего не отмечено", "wait"); return; }
  if(btn){ btn.disabled = true; btn.textContent = "Записываю…"; }
  let done = 0, fail = 0, added = 0;
  for(const r of chosen){
    let code = r.code;
    if(!code){
      try{
        code = roomNewCode(r.name);
        const kindF = r.fields.find(f => f.col === "Тип_помещения");
        await crewAppend("06_Помещения", [{ "Код": code, "Помещение": r.name, "Тип_помещения": kindF ? String(kindF.now) : "прочее" }]);
        added++;
      }catch(e){ fail += r.fields.length; continue; }
    }
    for(const f of r.fields){
      if(f.col === "Тип_помещения" && added && !r.code) { done++; continue; }
      try{
        await writeCell("06_Помещения", code, f.col, String(f.now).replace(".", ","));
        done++;
      }catch(e){ fail++; }
    }
  }
  /* Проёмы: правка существующего ребра — обычный writeCell, новый проём
     заводится строкой сразу со сказанными полями (append + правка стоили бы
     двух записей ради одного факта). Пока данные не перечитаны, добавленное
     ребро кладётся в D.elements: иначе второй новый проём в той же реплике
     получил бы тот же id. */
  for(const r of chosen){
    if(!r.code) continue;
    for(const e of (r.elems || [])){
      const sel = e.changes.filter(c => c._sel);
      try{
        if(e.isNew){
          const id = elemNextId();
          const val = k => (sel.find(c => c.key === k) || {}).now || "";
          await crewAppend("13_Элементы", [{
            "id": id, "Сторона_A": r.code, "Сторона_B": e.side,
            "Тип_план": val("plan"), "Тип_факт": val("fact") || "дверь", "Судьба": val("fate"),
            "Название": (roomList().find(x => String(x.code) === r.code) || {}).name + " ↔ " + vrSideLabel(e.side, e.said),
            "Ширина_м": "", "Высота_м": "", "Примечание": "добавлен голосом", "Обновлено": chgStamp(),
          }]);
          (D.elements = D.elements || []).push({ id: id, a: r.code, b: e.side,
            plan: val("plan"), fact: val("fact") || "дверь", fate: val("fate") });
          done++;
        }else if(e.id){
          for(const c of sel){
            await writeCell("13_Элементы", e.id, c.col, c.now);
            done++;
          }
        }
      }catch(err){ fail++; }
    }
  }
  closeVSheet();
  await load();
  render();
  if(fail === 0) toast(added ? `Записано: ${done}, новых помещений: ${added}` : `Записано: ${done}`);
  else toast(`Записано ${done}, не удалось ${fail}`, done ? "" : "bad");
}

/* ── Голос: профиль ремонта [чат 017] ──────────────────────────
   Сервер (mode:'repair') возвращает не строки сметы, а виды справочника,
   сопоставленные со сказанным: что названо голосом, что достроено по
   технологическим зависимостям вида и что уже стоит в смете помещения.
   Записи здесь нет: голос отмечает виды в профиле, смету по-прежнему собирает
   человек кнопкой «Добавить в смету» — переспрос вместо тихой записи (решение 006). */
let vRep = [];

function showVRepair(d){

  vRep = list.map(r => ({ ...r, kinds: (r.kinds || []).map(k => ({ ...k, _sel: !k.already })) }));

  if(!list.length){

    openVSheet(`

      ${quote}
      <div class="vrow">
        <button class="vbtn-cancel" onclick="closeVSheet()">Закрыть</button>

      </div>`);

  }
  const rows = vRep.map((r, i) => {
    const head = `<div class="vt">${esc(r.name || "помещение")}${r.isNew ? ' <span style="color:#ff9f0a">· нет в объекте</span>' : ""}</div>`;
    if(r.isNew){
      return `<div style="margin-bottom:10px">${head}<div class="vd" style="margin-top:4px">Такого помещения в объекте нет. Заведите его на экране «Объект» — тогда объёмы посчитаются из обмеров.</div></div>`;
    }
    const kl = r.kinds.map((k, j) => `
      <div class="vitem${k._sel ? " sel" : ""}" data-i="r${i}-${j}" onclick="toggleVRep(${i},${j})">
        <div class="vchk">✓</div>
        <div style="flex:1;min-width:0">
          <div class="vv">${esc(k.name)}<span style="opacity:.6"> · ${esc(k.unit || "")}</span></div>
          <div class="vd">${esc(k.code)}${k.src === "tech" ? " · добавлено по технологии" : ""}${k.already ? ' · <span style="color:#ff9f0a">уже в смете</span>' : ""}</div>
        </div>
      </div>`).join("");
    const tech = r.kinds.filter(k => k.src === "tech").length;
    const dup  = r.kinds.filter(k => k.already).length;
    const note = [tech ? `по технологии добавлено: ${tech}` : "", dup ? `уже в смете: ${dup} — не отмечено` : ""].filter(Boolean).join(" · ");
    return `<div style="margin-bottom:12px">${head}${note ? `<div class="vd" style="margin:2px 0 6px">${esc(note)}</div>` : ""}${kl}
      </div>`;
  }).join("");
  openVSheet(`
    <div class="vh">Работы по помещениям</div>
    <div class="vs">Отмеченное перенесу в профиль ремонта: объём посчитается из обмеров, а смета соберётся кнопкой «Добавить в смету».</div>
    ${quote}
    <div class="vfilter"><button onclick="vSelOnly(this)">Только отмеченные</button></div>
    <div id="vlist">${rows}</div>
    <div class="vrow">
      <button class="vbtn-cancel" onclick="closeVSheet()">Отмена</button>
      <button class="vbtn-ok" onclick="applyVoiceRepair()">Отметить в профиле</button>
    </div>`);
}

/* Фильтр списка [чат 029, просьба Дмитрия «напрашивается фильтр показать
   отмеченное»]. Прячет невыбранные строки классом на контейнере: состояние
   выбора не трогается, повторное нажатие возвращает всё. */
function vSelOnly(btn){
  const box = document.getElementById("vlist");
  if(!box) return;
  const on = !box.classList.contains("selonly");
  box.classList.toggle("selonly", on);
  if(btn){ btn.classList.toggle("on", on); btn.textContent = on ? "Показать все" : "Только отмеченные"; }
}
function vSelCount(){ return document.querySelectorAll("#vlist .vitem.sel").length; }

function toggleVRep(i, j){
  const k = vRep[i].kinds[j];

  const el = document.querySelector(`.vitem[data-i="r${i}-${j}"]`);

/* Перенос в профиль: отмечаем виды и считаем объём из обмеров помещения.
   В лист сейчас не пишется ничего — человек смотрит цифры и жмёт «Добавить в смету». */
async function applyVoiceRepair(){
  const ready = vRep.filter(r => !r.isNew && r.kinds.some(k => k._sel));
  if(!ready.length){ toast("Ничего не отмечено", "wait"); return; }
  try{ if(!D.catalog) await loadCatalog(); }catch(e){ toast(e.message, "err"); return; }
  const kinds = (D.catalog || {}).kinds || [];
  let n = 0, noVol = 0, rooms = 0, last = null;
  for(const r of ready){
    const room = (D.rooms || []).find(x => x.code === r.code);
    if(!room) continue;
    const picked = profPicked(r.code);
    let added = 0;
    r.kinds.filter(k => k._sel).forEach(k => {
      const kind = kinds.find(x => x.code === k.code);
      if(!kind) return;
      const vol = profVol(kind, room);
      picked[k.code] = { vol: vol, manual: false };
      added++; n++;
      if(!(Number(vol) > 0)) noVol++;
    });
    if(added){ rooms++; last = r.code; }
  }
  closeVSheet();
  // одно помещение — открываем его сразу; несколько — общий экран со сводкой плана
  PROF.room = (rooms === 1) ? last : null;
  if(stack[stack.length - 1] !== "profile") go("profile"); else render(true);
  if(!n) { toast("Ничего не перенесено", "err"); return; }
  toast("Отмечено: " + n + (rooms > 1 ? (" в " + rooms + " помещ.") : "") + (noVol ? (" · без объёма: " + noVol) : ""));
}


/* ── Голос работника: отметки дня и отчёты бригадиру [чат 015] ──
   Сервер (mode:'hand') возвращает действия, а не правки листов; запись —
   прежними каналами (crewAppend в Табель и Отчёты_бригады), права те же. */
let vActs = [];
/* Момент отметки — дата и время вместе [чат 028]. «Двадцать минут назад»,
   сказанное в 00:07, ведёт во вчерашние сутки; прежний расчёт жил в минутах
   одних суток, обрезал разницу по нулю и писал 00:00 сегодняшним днём —
   неверное время и неверный день разом. Нашлось живым проходом: моки
   молчаливо жили в середине дня, где обрезание никогда не срабатывало.
   Явное время больше текущего — не будущее, а одно из двух: оговорка
   (в пределах HAND_SLIP_MIN прижимаем к «сейчас», как было до 028) либо
   речь о вчерашнем вечере. Дальше вчера кнопка не уводит: отметки прошлых
   дней — дело бригадира, а не сдвига «−1 час». */
const HAND_SLIP_MIN = 120;
const HAND_DAY_MIN = 24 * 60;
function handMoment(a){
  const p = n => String(n).padStart(2, "0");
  const today = crewToday(), now = crewNow();
  const mins = t => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
  const nowMin = mins(now);
  const at = String((a && a.at) || "").trim();
  const m = at.match(/^(\d{1,2}):(\d{2})$/);
  if(m){
    const hm = p(Number(m[1])) + ":" + m[2];
    const d = mins(hm) - nowMin;
    if(d <= 0) return { date: today, time: hm };
    return d <= HAND_SLIP_MIN ? { date: today, time: now } : { date: dShift(today, -1), time: hm };
  }

/* ── ЖИВОЕ ОБНОВЛЕНИЕ ──────────────────────────────────────────
   Панель — инструмент взаимного подтверждения: заявка одной стороны
   должна появляться у другой без ручной перезагрузки. Тихо перечитываем
   /data; если данные изменились и пользователь не занят вводом или
   голосовым окном — обновляем текущий экран.                          */
let _sig = "";
function _snapshot(d){
  try{
    return JSON.stringify({
      w:(d.works||[]).map(x => x.code+":"+x.status+":"+(x.progress||0)+":"+(x.price_contractor_usd??"")),
      m:(d.materials||[]).map(x => x.name+":"+(x.in||0)+":"+(x.out||0)),
      c:(d.changes||[]).map(x => x.id+":"+x.status),
      s:d.settings, p:(d.payments||[]).length
    });
  }catch{ return ""; }
}
async function refresh(){
  const el = document.activeElement;
  const busy = (el && ["INPUT","SELECT","TEXTAREA"].includes(el.tagName)) || vmask.classList.contains("on");
  if(busy) return;                       // не мешаем вводу/голосовому окну
  try{
    const auth = INIT ? `initData=${encodeURIComponent(INIT)}` : `key=${encodeURIComponent(KEY)}`;
    const r = await fetch(`${API}/data?${auth}`, { cache:"no-store" });
    if(!r.ok) return;
    const raw = (await r.text()).trim();
    if(!raw) return;
    let nd; try{ nd = JSON.parse(raw); }catch{ return; }
    if(!nd || !nd.role) return;
    const sig = _snapshot(nd);
    if(!_sig){ _sig = sig; return; }
    if(sig === _sig) return;              // ничего не изменилось — не моргаем
    _sig = sig; D = nd; render();
  }catch{}
}

"Отчёт видит только бригадир. Он подтвердит или поправит — и тогда запись попадёт в учёт объекта.":"Hisobotni faqat brigadir ko'radi. U tasdiqlaydi yoki to'g'rilaydi — shundan keyin yozuv obyekt hisobiga tushadi.",
"Критический путь — цепочка, которая определяет срок целиком: задержка любой её работы двигает финиш день в день. Остальные работы имеют запас.":"Kritik yo'l — muddatni butunlay belgilaydigan zanjir: undagi har qanday ishning kechikishi tugash sanasini kun sayin suradi. Qolgan ishlarda zaxira bor.",
"Скидку на договорные цены предлагает заказчик. Когда он её заявит, вы увидите пакет в «Изменениях» и сможете принять или оспорить его одним нажатием.":"Shartnoma narxlariga chegirmani buyurtmachi taklif qiladi. U bildirganda siz «O'zgarishlar»da to'plamni ko'rasiz va bir bosishda qabul qilasiz yoki e'tiroz bildirasiz.",
"К помещению применяются виды работ, объём считается из его размеров, цена — из прайса исполнителя. Пройдите помещения подряд — смета соберётся одним действием в конце.":"Xonaga ish turlari qo'llanadi, hajm uning o'lchamlaridan hisoblanadi, narx — ijrochi narxlaridan. Xonalarni ketma-ket o'ting — smeta oxirida bitta harakat bilan yig'iladi.",
"Цена ставится за единицу вида работы и хранится в общей базе, а не в этом объекте: на следующем объекте задавать её заново не нужно. Объём подставится из профиля помещения.":"Narx ish turining birligiga qo'yiladi va umumiy bazada saqlanadi, bu obyektda emas: keyingi obyektda uni qaytadan kiritish shart emas. Hajm xona profilidan olinadi.",
"Снимок чека приходит в буфер из чата бота. Фактом учёта он становится, когда указаны материал и сумма: тогда сумма уходит в материал, а плашка «не подтверждено» уменьшается.":"Chek surati bot chatidan buferga keladi. Material va summa ko'rsatilganda u hisob faktiga aylanadi: shunda summa materialga o'tadi, «tasdiqlanmagan» yozuvi kamayadi.",
"Пока не зафиксирована. Когда состав, цены, сроки и остатки материалов сойдутся, любая сторона предлагает зафиксировать это как стартовое состояние — вторая подтверждает, и черта проведена.":"Hozircha belgilanmagan. Tarkib, narxlar, muddatlar va material qoldiqlari to'g'ri kelganda, har qaysi tomon buni boshlang'ich holat sifatida belgilashni taklif qiladi — ikkinchisi tasdiqlaydi, chiziq tortiladi.",
"Цену, объём и снятие работы заявляет заказчик — у вас нет его разнесения цен по работам. Вы можете предложить новую работу со своей ценой или другой срок, а на предложение заказчика ответить в «Изменениях».":"Narx, hajm va ishni olib tashlashni buyurtmachi bildiradi — sizda uning ishlar bo'yicha narx taqsimoti yo'q. Siz o'z narxingiz bilan yangi ish yoki boshqa muddat taklif qilishingiz mumkin, buyurtmachining taklifiga «O'zgarishlar»da javob berasiz.",

       читается как сломанные данные (о чём и предупреждала шапка слоя, но
       порога длины для этого не хватало — поймано стендом 021). */
    const looksData = !hit && t.indexOf(" · ") < 0 && /[А-Яа-яЁё]/.test(w2);
    if(wordHit && !looksData){ w = w2; hit = true; }
  }
  return hit ? w : null;
}
const UZ_SEP = [" · ", " — "];
/* Перевод строки по частям вокруг разделителя. null — ни одна часть не далась. */
function uzByParts(s){
  for(const sep of UZ_SEP){
    if(s.indexOf(sep) < 0) continue;
    const parts = s.split(sep);
    let any = false;
    const done = parts.map(p => { const v = uzPart(p); if(v !== null){ any = true; return v; } return p; });
    if(any) return done.join(sep);
  }
  return null;
}
function uzStr(raw){
  const t = uzNorm(raw);
  if(!t || !/[А-Яа-яЁё]/.test(t)) return null;
  /* Соседние надписи панель кладёт в разные текстовые узлы, и разделитель
     достаётся узлу целиком («· заявил Дмитрий ·», «точка ·»). Обрамление
     снимаем, переводим ядро, возвращаем как было [чат 021]. */
  const edge = t.match(/^((?:·\s*)*)([\s\S]*?)((?:\s*·)*)$/);
  if(edge && (edge[1] || edge[3]) && edge[2].trim()){
    const core = uzStr(edge[2].trim());
    if(core !== null) return edge[1] + core + edge[3];
  }
  const whole = uzPart(t);
  if(whole !== null){
    /* Шаблон покрыл обвязку, а склеенная в строку надпись осталась русской
       («Изменить цену · решает вторая сторона»): дособираем по частям [чат 021].
       Раньше части пробовались только когда целое не далось вовсе. */
    if(!/[А-Яа-яЁё]/.test(whole)) return whole;
    const fixed = uzByParts(whole);
    if(fixed !== null) return fixed;
    return whole;
  }
  const fixed = uzByParts(t);
  if(fixed !== null) return fixed;
  /* Не покрыто словарём — запоминаем для ревизии покрытия (см. шапку слоя). */
  try{ (window.__uzMiss = window.__uzMiss || new Set()).add(t); }catch(e){}
  return null;
}

/* Перевод готового DOM: текстовые узлы + надписи в атрибутах. */
function uzApply(root){
  if(LANG !== "uz" || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const list = [];
  let n; while((n = w.nextNode())){
    const p = n.parentNode && n.parentNode.nodeName;
    if(p === "SCRIPT" || p === "STYLE") continue;
    list.push(n);
  }
  list.forEach(node => {
    const raw = node.nodeValue;
    const v = uzStr(raw);
    if(v === null || v === uzNorm(raw)) return;
    /* Края узла возвращаем на место [чат 021, живой прогон]. Панель разбивает
       надпись на соседние узлы («880 000 сум» жирным + « из аванса 26.06…»),
       и пробел на стыке живёт внутри одного из них; uzNorm его срезает, а
       замена подставляла обрезанный перевод — получалось «so'mavansdan». */
    const lead = (raw.match(/^\s*/) || [''])[0];
    const tail = (raw.match(/\s*$/) || [''])[0];
    node.nodeValue = lead + v + tail;
  });
  root.querySelectorAll("[placeholder],[title],[aria-label]").forEach(el => {
    ["placeholder","title","aria-label"].forEach(a => {
      const cur = el.getAttribute(a); if(!cur) return;
      const v = uzStr(cur); if(v !== null && v !== uzNorm(cur)) el.setAttribute(a, v);
    });
  });
}

/* Наблюдатель: панель перерисовывает не только #app (тосты, модальные листы,
   точечные box.innerHTML в 15 местах) — вместо правки каждого места слой
   слушает body. Замок UZ_BUSY нужен потому, что наша же замена текста
   порождает новые записи мутаций. */
function uzWatch(){
  if(UZ_OBS || LANG !== "uz") return;
  UZ_OBS = new MutationObserver(() => {
    if(UZ_BUSY) return;
    UZ_BUSY = true;
    try{ uzApply(document.body); }finally{ UZ_OBS.takeRecords(); UZ_BUSY = false; }
  });
  UZ_OBS.observe(document.body, { childList:true, subtree:true, characterData:true });
}

/* Кнопка языка. Вставляется в body один раз, поэтому ни один экран
   не приходится править: переключатель нужен и на экране приглашения,
   куда работник попадает до всякой роли. */
function langButton(){
  if(document.getElementById("langbtn")) return;
  const b = document.createElement("button");
  b.id = "langbtn";
  b.textContent = LANG === "uz" ? "RU" : "UZ";
  b.setAttribute("aria-label", LANG === "uz" ? "Русский" : "O'zbekcha");
  b.style.cssText = "position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:9999;" +
    "padding:7px 11px;border:0;border-radius:12px;background:rgba(58,58,60,.92);color:#fff;" +
    "font-size:13px;font-weight:600;letter-spacing:.5px;box-shadow:0 2px 8px rgba(0,0,0,.45)";
  b.onclick = () => langSet(LANG === "uz" ? "ru" : "uz", true);   // true = переключил человек
  document.body.appendChild(b);
}

/* Смена языка. На узбекский — включаем слой и переводим то, что на экране.
   Обратно — панель просто перерисовывает экран: она всегда рисует по-русски,
   поэтому «снять перевод» = отрисовать заново, без перезагрузки данных. */
function langSet(v, byUser){
  LANG = (v === "uz") ? "uz" : "ru";
  try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){}
  const b = document.getElementById("langbtn");
  if(b){ b.textContent = LANG === "uz" ? "RU" : "UZ"; b.setAttribute("aria-label", LANG === "uz" ? "Русский" : "O'zbekcha"); }
  if(LANG === "uz"){ uzWatch(); uzApply(document.body); }
  else {
    if(UZ_OBS){ UZ_OBS.disconnect(); UZ_OBS = null; }
    /* Экран ошибки доступа и экран приглашения рисуются не через render(), а
       напрямую в #app (данных ещё нет) — там перерисовка перевод не снимет, и
       человек, вернувший русский, остался бы с узбекским текстом. Поймано
       прод-проверкой [чат 020]: в таком случае честнее перезагрузить страницу,
       язык уже сохранён. */
    let ok = false;
    try{ if(typeof D === "object" && D && D.role){ render(); ok = true; } }catch(e){}
    /* Перезагрузка — только когда язык переключил человек. Вызов из langInit()
       приходит ДО загрузки данных (D ещё null), и безусловный reload там
       превращал бы каждый запуск панели в цикл перезагрузок — поймано прод-
       проверкой сразу после выката [чат 020]. */
    if(!ok && byUser) location.reload();
  }
}

/* Начальный язык: сначала выбор человека (он главнее всего), затем язык из
   09_Доступы (свойство пользователя — так задумано планом E1), затем язык
   Telegram. Ничего нет — русский. */
function langInit(){
  let saved = null;
  try{ saved = localStorage.getItem(LANG_KEY); }catch(e){}
  const fromSheet = (typeof D === "object" && D && D.lang) ? String(D.lang).toLowerCase().slice(0,2) : "";
  const fromTg = String((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || "").toLowerCase().slice(0,2);
  const want = saved || (fromSheet === "uz" ? "uz" : "") || (fromTg === "uz" ? "uz" : "") || "ru";
  langButton();
  langSet(want);
}

/* Метка сборки [чат 021]. Ставится рядом с кнопкой языка, ничего не
   перехватывает (pointer-events:none) и не переводится языковым слоем —
   в ней нет кириллицы. Номер ведётся вручную: «чат.сборка». */
const BUILD = "032.2";
function buildTag(){
  if(document.getElementById("buildtag")) return;
  const d = document.createElement("div");
  d.id = "buildtag";
  d.textContent = BUILD;
  d.style.cssText = "position:fixed;right:56px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:9998;" +
    "padding:6px 9px;border-radius:10px;background:rgba(58,58,60,.72);color:rgba(235,235,245,.9);" +
    "font-size:12px;font-weight:600;line-height:1;letter-spacing:.5px;pointer-events:none;user-select:none";
  document.body.appendChild(d);
}

/* ── СТАРТ ────────────────────────────────────────────────── */
tg?.ready();
tg?.expand();
load();
langInit();                                       // кнопка языка нужна и до данных [чат 020]
buildTag();                                       // видимый номер версии [чат 021]
setInterval(refresh, 15000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });
window.addEventListener("focus", refresh);
</script>
</body>
