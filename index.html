/* Отключение работника = Статус «отключён» + снятие будущих нарядов.
   Строка не удаляется: на ней висят табель и подтверждённые отчёты
   (разбор 09 §3.1). Полное гашение строки в 09_Доступы — за заказчиком:
   у бригадира нет прав на лист доступов, и это правильно.            */
let CW_OFF_BUSY = false;
async function cwOff(i){
  const w = (((CREW_DATA || {}).workers) || [])[i];
  if(!w || CW_OFF_BUSY) return;
  if(!confirm("Отключить работника «" + w.name + "»? Наряды вперёд снимутся (начатый сегодняшний день останется), история цела.")) return;
  CW_OFF_BUSY = true;
  try{
    toast("Отключаю…", "wait");
    await crewCell("Работники", w.name, "Статус", "отключён");
    await crewCell("Работники", w.name, "Отключён", crewToday());
    const today = crewToday();
    /* Сегодняшний наряд снимается, только если день не начат: есть отметки
       табеля — день считается рабочим и остаётся (уточнение прогона 014). */
    const dayStarted = (((CREW_DATA || {}).time) || []).some(x =>
      String(x.worker || "").trim() === String(w.name).trim() &&
      String(x.date || "") === today && String(x.status || "") !== "отклонено");
    const future = ((CREW_DATA || {}).orders || []).filter(o =>
      String(o.worker || "").trim() === String(w.name).trim() &&
      String(o.status || "") === "назначен" &&
      (String(o.date || "") > today || (String(o.date || "") === today && !dayStarted)));
    for(const o of future){ await crewCell("Наряды", o.id, "Статус", "отменён"); o.status = "отменён"; }
    w.status = "отключён"; w.off = crewToday();
    toast("Отключён" + (future.length ? " · снято нарядов: " + future.length : ""));
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ CW_OFF_BUSY = false; }
}
async function cwOn(i){
  const w = (((CREW_DATA || {}).workers) || [])[i];
  if(!w || CW_OFF_BUSY) return;
  CW_OFF_BUSY = true;
  try{
    toast("Возвращаю…", "wait");
    await crewCell("Работники", w.name, "Статус", "активен");
    await crewCell("Работники", w.name, "Отключён", "");
    w.status = "активен"; w.off = "";
    toast("Работник снова активен");
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ CW_OFF_BUSY = false; }
}

/* ── НАРЯДЫ (бригадир): кто где завтра ── */
let ORD_BUSY = false, ORD_PAST = false;
function ordActive(){ return (((CREW_DATA || {}).orders) || []).filter(o => String(o.status || "") !== "отменён"); }
async function ordCreate(){
  const g = id => String((document.getElementById(id) || {}).value || "").trim();
  const worker = g("or_worker"), from = g("or_from"), to = g("or_to") || from;
  const load0 = g("or_load"), hours = g("or_hours"), object = g("or_object"), task = g("or_task");
  if(!worker){ toast("Выберите работника", "err"); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(from)){ toast("Укажите дату", "err"); return; }
  if(to < from){ toast("Дата «по» раньше даты «с»", "err"); return; }
  if(!task){ toast("Напишите задание", "err"); return; }
  const load = load0 === "часы" ? ("часы " + (Number(hours) || 4)) : load0;
  const days = [];
  for(let d = from; d <= to && days.length < 31; d = dShift(d, 1)) days.push(d);
  if(days.length > 14 && !confirm("Наряд на " + days.length + " дней подряд — создать?")) return;
  /* Конфликт (разбор 09 §3.2): два «весь день» на одну дату — предупреждаем,
     но не запрещаем: бывает переброска в середине дня. */
  const busyDays = days.filter(d => ordActive().some(o =>
    String(o.worker || "").trim() === worker && String(o.date || "") === d &&
    String(o.load || "") === "весь день" && load === "весь день"));
  if(busyDays.length && !confirm(worker + " уже занят весь день: " + busyDays.map(dLabel).join(", ") + ". Всё равно назначить?")) return;
  if(ORD_BUSY) return;
  ORD_BUSY = true;
  try{
    toast("Создаю наряд…", "wait");
    const rows = days.map(d => ({
      "id": crewId("NR"), "Бригадир": D.who, "Работник": worker, "Дата": d,
      "Объект": object, "Занятость": load, "Задание": task,
      "Статус": "назначен", "Создан": chgStamp(),
    }));
    await crewAppend("Наряды", rows);
    toast("Наряд создан" + (rows.length > 1 ? " на " + rows.length + " дн" : ""));
    await crewLoad(); render();
  }catch(e){ toast(e.message, "err"); }
  finally{ ORD_BUSY = false; }
}
async function ordCancel(i){
  const o = (((CREW_DATA || {}).orders) || [])[i];
  if(!o || ORD_BUSY) return;
  if(!confirm("Отменить наряд: " + (o.worker || "") + ", " + dLabel(String(o.date || "")) + "?")) return;
  ORD_BUSY = true;
  try{
    toast("Отменяю…", "wait");
    await crewCell("Наряды", o.id, "Статус", "отменён");
    o.status = "отменён";
    toast("Наряд отменён");
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ ORD_BUSY = false; }
}

/* ── ТАБЕЛЬ (бригадир): подтверждение отметок ── */
let TM_BUSY = false, TM_FIX = null, TM_ALL = false;
async function tmDecide(i, mode){
  const t = (((CREW_DATA || {}).time) || [])[i];
  if(!t || TM_BUSY) return;
  if(mode === "reject" && !confirm("Отклонить отметку «" + (t.event || "") + " " + (t.time || "") + "» (" + (t.worker || "") + ")?")) return;
  let newTime = "";
  if(mode === "fix"){
    newTime = String((document.getElementById("tm_" + i) || {}).value || "").trim();
    if(!/^\d{2}:\d{2}$/.test(newTime)){ toast("Время — в формате ЧЧ:ММ", "err"); return; }
  }
  if(TM_BUSY) return;
  TM_BUSY = true;
  try{
    toast("Сохраняю…", "wait");
    if(mode === "fix"){
      await crewCell("Табель", t.id, "Время", newTime);
      await crewCell("Табель", t.id, "Статус", "исправлено");
      t.time = newTime; t.status = "исправлено";
    } else if(mode === "reject"){
      await crewCell("Табель", t.id, "Статус", "отклонено");
      t.status = "отклонено";
    } else {
      await crewCell("Табель", t.id, "Статус", "подтверждено");
      t.status = "подтверждено";
    }
    await crewCell("Табель", t.id, "Подтвердил", D.who);
    t.confirmed = D.who;
    TM_FIX = null;
    toast(mode === "reject" ? "Отметка отклонена" : "Отметка " + (mode === "fix" ? "исправлена" : "подтверждена"));
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ TM_BUSY = false; }
}
/* ── ЧАСЫ БРИГАДИРА (заказчик) [чат 026, маяк §15] ──
   «Бригадир сам себе бригадир, но финально подтвердить дни работы, а вернее
   часы, должен заказчик». Механика решения — та же, что у бригадира с отметками
   бригады: подтвердить · исправить время · отклонить, запись в тот же лист
   «Табель». Список свой (c.ftime) и функция своя: у бригадирского пути уже есть
   живой прогон, и вешать на него вторую роль — плодить общие поломки. */
let FT_BUSY = false, FT_FIX = null, FT_ALL = false;
async function ftDecide(i, mode){
  const t = (((CREW_DATA || {}).ftime) || [])[i];
  if(!t || FT_BUSY) return;
  if(mode === "reject" && !confirm("Отклонить отметку «" + (t.event || "") + " " + (t.time || "") + "» (" + (t.worker || "") + ")?")) return;
  let newTime = "";
  if(mode === "fix"){
    newTime = String((document.getElementById("ft_" + i) || {}).value || "").trim();
    if(!/^\d{2}:\d{2}$/.test(newTime)){ toast("Время — в формате ЧЧ:ММ", "err"); return; }
  }
  FT_BUSY = true;
  try{
    toast("Сохраняю…", "wait");
    if(mode === "fix"){
      await crewCell("Табель", t.id, "Время", newTime);
      await crewCell("Табель", t.id, "Статус", "исправлено");
      t.time = newTime; t.status = "исправлено";
    } else if(mode === "reject"){
      await crewCell("Табель", t.id, "Статус", "отклонено");
      t.status = "отклонено";
    } else {
      await crewCell("Табель", t.id, "Статус", "подтверждено");
      t.status = "подтверждено";
    }
    await crewCell("Табель", t.id, "Подтвердил", D.who);
    t.confirmed = D.who;
    FT_FIX = null;
    toast(mode === "reject" ? "Отметка отклонена" : "Отметка " + (mode === "fix" ? "исправлена" : "подтверждена"));
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ FT_BUSY = false; }
}
/* Блок часов бригадира на экране «Бригада» у заказчика. Пустой список — не
   ошибка: бригадир мог ещё ни разу не отметиться, и говорить об этом надо
   прямо, а не пустым местом. */
function ftBlock(c){
  const rows = ((c || {}).ftime) || [];
  if(!rows.length) return '<div class="stat"><span class="k">Бригадир пока не отмечал свои часы. Когда отметит, решение появится здесь.</span></div>';
  const wait = rows.filter(x => String(x.status || "") === "заявлено");
  const view = FT_ALL ? rows : rows.filter(x => String(x.date || "") >= dShift(crewToday(), -7));
  const groups = {};
  view.forEach(x => { const d = String(x.date || "?"); (groups[d] = groups[d] || []).push(x); });
  const idxOf = x => rows.indexOf(x);
  const card = x => {
    const i = idxOf(x);
    const open = String(x.status || "") === "заявлено";
    return '<div class="work"><div class="t">' + esc(String(x.worker || "")) + " · " + esc(String(x.event || "")) + " · " + esc(String(x.time || "")) + "</div>" +
      '<div class="m">' + (x.object ? esc(String(x.object)) + " · " : "") + esc(String(x.status || "")) +
        (x.confirmed ? " · решил " + esc(String(x.confirmed)) : "") + "</div>" +
      (open ? (FT_FIX === i ?
        '<div class="m" style="margin-top:8px;display:flex;gap:8px;align-items:center">' +
          '<input id="ft_' + i + '" type="time" value="' + attr(String(x.time || "")) + '" style="flex:1;padding:10px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px">' +
          '<button onclick="ftDecide(' + i + ',\'fix\')" ' + CREW_BTN + ">Сохранить</button>" +
          '<button onclick="FT_FIX=null;render()" ' + CREW_BTN2 + ">✕</button>" +
        "</div>" :
        '<div class="m" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">' +
          '<button onclick="ftDecide(' + i + ',\'ok\')" ' + CREW_BTN + ">Подтвердить</button>" +
          '<button onclick="FT_FIX=' + i + ';render()" ' + CREW_BTN2 + ">Исправить время</button>" +
          '<button onclick="ftDecide(' + i + ',\'reject\')" ' + CREW_BTNR + ">Отклонить</button>" +
        "</div>") : "") +
      tmcUI(x) +
      "</div>";
  };
  const list = Object.keys(groups).sort().reverse().map(d =>
    '<div class="sub" style="margin-top:14px">' + dLabel(d) + "</div>" + groups[d].map(card).join("")).join("");
  return '<div class="sub" style="margin-top:16px">Часы бригадира</div>' +
    '<div class="stat"><span class="k">' + (wait.length ? (wait.length + " ждут вашего решения") : "все часы бригадира решены") + "</span></div>" +
    '<div class="filt"><button class="' + (FT_ALL ? "on" : "") + '" onclick="FT_ALL=!FT_ALL;render()">' + (FT_ALL ? "Только последняя неделя" : "Показать всё") + "</button></div>" +
    (view.length ? list : '<div class="stat"><span class="k">За последнюю неделю отметок нет.</span></div>');
}

/* ── ПРАВКА РЕШЁННЫХ ЧАСОВ [чат 027, маяк §15] ──
   «Последующие изменения этой информации так же: запрос и подтверждение или
   опровержение». Решённую отметку (подтверждена или исправлена) больше нельзя
   переписать тихо — правка идёт заявкой вида «часы» в 11_Изменения: ссылка на
   отметку в «Код_работы», время в «Было» → «Стало», дельты нулевые, поэтому
   договор она не двигает (тот же приём, что у вида «точка», решение 019).
   Новой сущности в данных не заводим — механизм согласования в системе один
   на всё: заявил → вторая сторона приняла или оспорила (решение 006).
   Применяет принявшая сторона: право писать «Время» в «Табеле» есть и у
   заказчика (поля решения, чат 026), и у бригадира — значит ждать третьего
   не нужно, а «принято, но не применено» перестало бы значить хоть что-то. */
const TMC_KIND = 'часы';
const TMC_DONE = ['подтверждено', 'исправлено'];   /* решённые отметки: только их правят заявкой */
let TMC_FORM = null;      /* id отметки с открытой формой правки */
let TMC_BUSY = false;     /* замок от повторного входа [грабля 012] */

/* Час без ведущего нуля — обычное дело для значения, пришедшего из листа:
   Google хранит время числом и отдаёт отображаемое «8:20» (грабля 19, на ней
   падала регистрация в 014). Сравнивать и подставлять в поле ввода можно
   только приведённое к ЧЧ:ММ, иначе «правка 8:20 → 08:20» пройдёт как
   настоящая. Показываем при этом то, что пришло: это данные листа. */
const tmcHM = v => {
  const m = String(v == null ? '' : v).trim().match(/^(\d{1,2}):(\d{2})/);
  return m ? (m[1].length < 2 ? '0' : '') + m[1] + ':' + m[2] : '';
};
const tmcDone = t => TMC_DONE.includes(String((t && t.status) || '').trim());
const tmcAll  = () => chgAll().filter(c => String(c.kind || '').trim() === TMC_KIND);
const tmcFor  = id => tmcAll().filter(c => String(c.code || '') === String(id));
const tmcOpen = id => tmcFor(id).filter(c => chgSt(c) === 'Заявлено')[0] || null;
const tmcLast = id => tmcFor(id).filter(c => ['Применено', 'Оспорено'].includes(chgSt(c))).slice(-1)[0] || null;
/* Отметку ищем во всех трёх списках: свои часы бригадира (my_time), часы
   бригадира глазами заказчика (ftime) и табель бригады (time). */
const tmcRow  = id => ((((CREW_DATA || {}).my_time) || [])
  .concat(((CREW_DATA || {}).ftime) || [], ((CREW_DATA || {}).time) || []))
  .filter(x => String(x.id) === String(id))[0] || null;

async function tmcSubmit(id){
  if(TMC_BUSY) return;
  const t = tmcRow(id);
  if(!t){ toast('Отметка не найдена', 'err'); return; }
  const nt = String((document.getElementById('tmc_' + id) || {}).value || '').trim();
  if(!/^\d{2}:\d{2}$/.test(nt)){ toast('Время — в формате ЧЧ:ММ', 'err'); return; }
  if(nt === tmcHM(t.time)){ toast('Время то же самое — менять нечего', 'err'); return; }
  if(tmcOpen(id)){ toast('По этой отметке уже заявлена правка', 'err'); return; }
  const why = String((document.getElementById('tmcw_' + id) || {}).value || '').trim();
  TMC_BUSY = true;
  try{
    toast('Отправляю на согласование…', 'wait');
    await crewAppend('11_Изменения', [{
      'id': 'CH-' + Date.now().toString(36).toUpperCase(),
      'Время': chgStamp(),
      'Инициатор': D.who,
      'Вид': TMC_KIND,
      'Код_работы': String(id),
      'Что_меняем': 'Часы: ' + String(t.worker || '') + ' · ' + String(t.date || '') + ' · ' + String(t.event || ''),
      'Было': tmcHM(t.time) || String(t.time || ''),
      'Стало': nt,
      'Дельта_USD': 0,
      'Дельта_дней': 0,
      'Статус': 'Заявлено',
      'Решил': '',
      'Комментарий': why,
    }]);
    TMC_FORM = null;
    toast('Правка заявлена — ждёт решения второй стороны');
    await load();
    await crewLoad();
  }catch(e){ toast(e.message, 'err'); }
  finally{ TMC_BUSY = false; }
}

/* Разметка правки под карточкой отметки — одна на оба контура: у бригадира
   («Мой день») и у заказчика («Часы бригадира») путь один и тот же, и вешать
   на него две разные разметки значило бы чинить потом в двух местах. */
function tmcUI(t){
  if(!t || !tmcDone(t)) return '';
  const id = String(t.id || '');
  const op = tmcOpen(id);
  if(op){
    const line = '<div class="m" style="margin-top:6px;color:var(--warn)">✎ правка времени: ' +
      esc(String(op.was || '')) + ' → ' + esc(String(op.now || '')) +
      (op.comment ? (' · ' + esc(String(op.comment))) : '') + '</div>';
    if(String(op.by || '') === String(D.who))
      return line + '<div class="m" style="color:var(--warn)">⏳ Ждёт ответа второй стороны</div>';
    return line + '<div class="m" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button onclick="chgAccept(\'' + esc(String(op.id)) + '\')" ' + CREW_BTN + '>Принять правку</button>' +
      '<button onclick="chgDispute(\'' + esc(String(op.id)) + '\')" ' + CREW_BTNR + '>Оспорить правку</button></div>';
  }
  const last = tmcLast(id);
  const hist = last ? ('<div class="m" style="opacity:.65">правка ' + esc(String(last.was || '')) + ' → ' +
    esc(String(last.now || '')) + ' · ' + esc(chgSt(last)) + '</div>') : '';
  if(TMC_FORM === id)
    return hist +
      '<div class="m" style="margin-top:8px;display:flex;gap:8px;align-items:center">' +
        '<input id="tmc_' + attr(id) + '" type="time" value="' + attr(tmcHM(t.time)) + '" style="flex:1;padding:10px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px">' +
        '<button onclick="tmcSubmit(\'' + esc(id) + '\')" ' + CREW_BTN + '>Заявить</button>' +
        '<button onclick="TMC_FORM=null;render()" ' + CREW_BTN2 + '>✕</button>' +
      '</div>' +
      '<div style="margin-top:8px"><input id="tmcw_' + attr(id) + '" type="text" placeholder="почему меняем — необязательно" style="width:100%;padding:10px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:14px"></div>';
  return hist + '<div class="m" style="margin-top:8px">' +
    '<button onclick="TMC_FORM=\'' + esc(id) + '\';render()" ' + CREW_BTN2 + '>Изменить время</button></div>';
}

/* Человекодни: уникальные пары дата+работник по подтверждённым отметкам —
   та же формула, что в GET-ноде для заказчика. */
function tmMandays(rows){
  const seen = {};
  rows.forEach(r => {
    if(["подтверждено", "исправлено"].includes(String(r.status || ""))){
      seen[String(r.date || "") + "|" + String(r.worker || "")] = 1;
    }
  });
  return Object.keys(seen).length;
}

/* ── ОТЧЁТЫ (бригадир): буфер работ и материалов от работников ──
   Принять как есть → «принято»; поправить значение → «исправлено»,
   исходное остаётся в «Значение», версия бригадира — в «Стало»:
   через месяц в споре важно, что именно сказал работник (разбор 09).
   Только принятое уходит в учёт объекта: работа → Готовность_%,
   материал → Израсходовано (+= значение).                          */
let RP_BUSY = false;
async function rpDecide(i, mode){
  const p = (((CREW_DATA || {}).reports) || [])[i];
  if(!p || RP_BUSY) return;
  if(mode === "reject" && !confirm("Отклонить отчёт " + (p.worker || "") + "?")) return;
  let val = String(p.value || "").trim();
  if(mode === "accept"){
    val = String((document.getElementById("rp_" + i) || {}).value || "").trim().replace(",", ".");
    if(val === "" || isNaN(Number(val))){ toast("Значение — число", "err"); return; }
  }
  if(RP_BUSY) return;
  RP_BUSY = true;
  try{
    toast("Сохраняю…", "wait");
    if(mode === "reject"){
      await crewCell("Отчёты_бригады", p.id, "Статус", "отклонено");
      p.status = "отклонено";
    } else {
      const changed = String(val) !== String(p.value ?? "").trim().replace(",", ".");
      if(changed){
        await crewCell("Отчёты_бригады", p.id, "Стало", val);
        await crewCell("Отчёты_бригады", p.id, "Статус", "исправлено");
        p.corrected = val; p.status = "исправлено";
      } else {
        await crewCell("Отчёты_бригады", p.id, "Статус", "принято");
        p.status = "принято";
      }
    }
    await crewCell("Отчёты_бригады", p.id, "Решил", D.who);
    p.solved = D.who;
    /* Перенос в учёт объекта — после фиксации решения: если он упадёт,
       решение уже записано, а учёт бригадир поправит руками по подсказке. */
    let carried = true;
    if(mode !== "reject"){
      try{
        if(String(p.type || "") === "работа"){
          const w = (D.works || []).find(x => x.code === String(p.code || "").trim());
          if(w){
            const prog = Math.max(0, Math.min(100, Number(val)));
            await crewCell("01_Работы", w.code, "Готовность_%", prog);
            patch("01_Работы", w.code, "Готовность_%", prog);
            if(prog >= 100) toast("Готовность 100% — заявите приёмку на экране «Работы»", "wait");
          } else toast("Работа «" + String(p.code || "") + "» не найдена в смете — учёт не тронут", "err");
        } else {
          const name = String(p.code || "").trim();
          const m = (D.materials || []).find(x => String(x.name || "").trim() === name);
          if(m){
            const total = (Number(m.out) || 0) + Number(val);
            await crewCell("03_Материалы", name, "Израсходовано", total);
            patch("03_Материалы", name, "Израсходовано", total);
          } else {
            await crewAppend("03_Материалы", [{ "Материал": name, "Израсходовано": val, "Источник": "отчёт бригады" }]);
          }
        }
      }catch(e2){ carried = false; toast("Решение записано, но учёт не обновился — поправьте с экрана работ или материалов", "err"); }
    }
    if(carried) toast(mode === "reject" ? "Отчёт отклонён" : "Отчёт принят — учёт обновлён");
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ RP_BUSY = false; }
}

/* ── РАБОТНИК (hand): свой день, календарь, отчёты ── */
let HM = null, HM_BUSY = false, HR_BUSY = false, HR_TYPE = "работа";
/* Черновики обеих вкладок отчёта: переключение вкладки не теряет ввод,
   отправка забирает все заполненные части (кандидат прогона 014). */
let HR_DRAFT = { "работа": { code: "", val: "", comment: "" }, "материал": { mat: "", val: "", comment: "" } };
function hrSet(field, el){ HR_DRAFT[HR_TYPE][field] = String(el.value == null ? "" : el.value); }
function hrTab(v){ HR_TYPE = v; render(); }
function handMyOrders(){ return ordActive(); }   // сервер уже отдал hand только его наряды
function handObject(){
  const today = crewToday();
  /* Наряд без объекта — не ответ [чат 026]: раньше первая же сегодняшняя строка
     возвращала пустую строку, и «Объект» в табеле оставался пустым, хотя объект
     был известен из соседних записей. */
  const t = handMyOrders().find(o => String(o.date || "") === today && String(o.object || "").trim());
  if(t) return String(t.object || "");
  const past = handMyOrders().filter(o => String(o.date || "") <= today).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  if(past.length && String(past[past.length - 1].object || "").trim()) return String(past[past.length - 1].object || "");
  /* У бригадира наряда на себя нет [чат 026]: он их выдаёт, а не получает,
     и его строка табеля уходила в лист с пустым «Объектом». Берём объект из
     последней отметки — сначала своей, потом бригадной: это тот же объект,
     просто записанный кем-то другим. */
  const seen = ((((CREW_DATA || {}).my_time) || []).concat((((CREW_DATA || {}).time) || [])))
    .filter(x => String(x.object || "").trim())
    .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
  return seen.length ? String(seen[seen.length - 1].object || "") : "";
}
/* Кому уходит моя отметка [чат 026, маяк §15]: у работника её решает бригадир,
   у бригадира — заказчик («бригадир сам себе бригадир, но финально подтвердить
   часы должен заказчик»). Подпись обязана называть верного адресата: она —
   единственное, из чего человек понимает, кто теперь ждёт решения. */
function markGoesTo(){ return (D && (D.kind === "foreman" || D.role === "foreman")) ? "заказчику" : "бригадиру"; }
function markHint(){ return markGoesTo() === "заказчику" ? "уйдёт заказчику на подтверждение" : "уйдёт бригадиру на подтверждение"; }
function handMark(ev){ HM = { ev: ev, mode: "now" }; render(); }
/* Кнопки и голос считают момент одной функцией: разойдись они — ночная
   отметка кнопкой и голосом легла бы в разные сутки. [чат 028] */
function handMarkMoment(){
  if(!HM) return null;
  if(HM.mode === "custom"){
    const el = document.getElementById("hm_time");
    const v = String(el ? (el.value || "") : (HM.at || crewNow())).trim();
    return /^\d{1,2}:\d{2}$/.test(v) ? handMoment({ at: v }) : null;
  }
  return handMoment({ shift_min: { now: 0, m10: 10, m30: 30, m60: 60 }[HM.mode] || 0 });
}
function handMarkTime(){ const m = handMarkMoment(); return m ? m.time : ""; }
/* Что именно запишется — видно до нажатия «Записать»: и время, и день.
   Введённое своё время держим в HM.at: панель перерисовывается поллингом,
   и без этого набранное пропадало бы на очередном обновлении. */
function hmWhen(){
  const m = handMarkMoment();
  if(!m) return "Время — в формате ЧЧ:ММ";
  return "Запишется: " + (m.date === crewToday() ? "сегодня" : dLabel(m.date)) + " " + m.time;
}
function hmHint(){
  const el = document.getElementById("hm_time");
  if(el && HM) HM.at = el.value;
  const box = document.getElementById("hm_when");
  if(box) box.textContent = hmWhen();
}
async function handMarkGo(){
  if(!HM || HM_BUSY) return;
  const mo = handMarkMoment();
  if(!mo){ toast("Время — в формате ЧЧ:ММ", "err"); return; }
  const t = mo.time, today = crewToday();
  const day = mo.date === today ? "сегодня" : dLabel(mo.date);
  const dup = (((CREW_DATA || {}).time) || []).some(x =>
    String(x.date || "") === mo.date && String(x.event || "") === HM.ev && String(x.status || "") !== "отклонено");
  if(dup && !confirm("Отметка «" + HM.ev + "» " + day + " уже есть. Добавить ещё одну?")) return;
  HM_BUSY = true;
  try{
    toast("Записываю…", "wait");
    await crewAppend("Табель", [{
      "id": crewId("TB"), "Работник": D.who, "Объект": handObject(), "Дата": mo.date,
      "Событие": HM.ev, "Время": t, "Отметил": D.who, "Статус": "заявлено",
      "Подтвердил": "", "Комментарий": "",
    }]);
    toast("Отмечено: " + HM.ev + " " + (mo.date === today ? "" : day + " ") + t + " — " + markHint());
    HM = null;
    await crewLoad(); render();
  }catch(e){ toast(e.message, "err"); }
  finally{ HM_BUSY = false; }
}
async function handReport(){
  if(HR_BUSY) return;
  /* Уходят ВСЕ заполненные вкладки, а не только открытая (кандидат прогона 014). */
  const w = HR_DRAFT["работа"], m = HR_DRAFT["материал"];
  const wFilled = !!(w.code || String(w.val).trim());
  const mFilled = !!(String(m.mat).trim() || String(m.val).trim());
  if(!wFilled && !mFilled){ toast("Заполните работу или материал", "err"); return; }
  const rows = [], errs = [];
  if(wFilled){
    const n = Number(String(w.val).replace(",", "."));
    if(!w.code) errs.push("работа: выберите из списка");
    else if(!(n >= 0 && n <= 100)) errs.push("работа: готовность — число от 0 до 100");
    else rows.push({ t: "работа", c: w.code, v: String(n), k: String(w.comment || "").trim() });
  }
  if(mFilled){
    const v = String(m.val).replace(",", ".").trim();
    if(!String(m.mat).trim()) errs.push("материал: напишите, какой");
    else if(v === "" || isNaN(Number(v))) errs.push("материал: количество — число");
    else rows.push({ t: "материал", c: String(m.mat).trim(), v: v, k: String(m.comment || "").trim() });
  }
  if(errs.length){ toast(errs.join(" · "), "err"); return; }
  HR_BUSY = true;
  try{
    toast("Отправляю бригадиру…", "wait");
    await crewAppend("Отчёты_бригады", rows.map((r, i) => ({
      "id": crewId("RP") + (rows.length > 1 ? "-" + (i + 1) : ""),
      "Дата": crewToday(), "Работник": D.who,
      "Тип": r.t, "Код": r.c, "Значение": r.v, "Комментарий": r.k,
      "Статус": "новый", "Стало": "", "Решил": "", "Время": crewNow(),
    })));
    toast("Отчёт ушёл бригадиру: " + rows.map(r => r.t).join(" + "));
    HR_DRAFT = { "работа": { code: "", val: "", comment: "" }, "материал": { mat: "", val: "", comment: "" } };
    await crewLoad(); render();
  }catch(e){ toast(e.message, "err"); }
  finally{ HR_BUSY = false; }
}
async function handRefresh(){
  try{ toast("Обновляю…", "wait"); await crewLoad(); toast("Обновлено"); render(); }
  catch(e){ toast("Не удалось обновить", "err"); }
}

/* Главный экран работника. Самый бедный в системе — осознанно (разбор 09 §4):
   ни цен, ни сумм, ни договора. Наряд на сегодня, четыре кнопки дня, отчёт. */
function handHome(){
  const c = CREW_DATA;
  const hello = '<div class="hello">' + esc(D.who) + ", добрый день</div>" +
    '<div class="sub">' + new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) + "</div>";
  if(!c) return hello + '<div class="stat"><span class="k">Загружаю наряды…</span></div>' +
    '<div class="grid"><button class="tile" onclick="handRefresh()"><span class="ic">🔄</span><span class="nm">Обновить</span></button></div>';
  if(c.off) return hello + '<div class="warnbox">Бригадир отключил вас от объекта. Если это ошибка — свяжитесь с ним напрямую.</div>';
  const today = crewToday();
  const orders = handMyOrders().filter(o => String(o.date || "") === today);
  const myTime = (c.time || []).filter(x => String(x.date || "") === today);
  const ordBox = orders.length ? orders.map(o =>
    '<div class="stat"><div class="r"><span class="k">Сегодня · ' + esc(String(o.load || "")) + (o.object ? " · " + esc(String(o.object)) : "") + '</span><span class="v"></span></div>' +

function toast(msg, kind){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast on" + (kind ? " " + kind : "");
  clearTimeout(tt);
  if(kind !== "wait") tt = setTimeout(() => t.className = "toast", kind === "err" ? 3500 : 2600);
}

/* ── НАВИГАЦИЯ (стек, ровно один уровень вглубь) ───────────── */
/* Вертикальная позиция экрана [чат 021]. Раньше любая перерисовка бросала
   страницу наверх: поллинг раз в 15 секунд сбрасывал прокрутку посреди чтения
   длинного списка, а возврат со второго уровня открывал экран с начала, хотя
   человек ушёл с его середины. Позиция хранится по ключу экрана в памяти
   вкладки — переживать перезагрузку ей незачем. */
const SCROLL = {};
function scrollSave(){ try{ SCROLL[stack[stack.length - 1]] = window.scrollY || 0; }catch(e){} }
function go(k){ scrollSave(); stack.push(k); render(true); }
function back(){ if(stack.length > 1){ scrollSave(); stack.pop(); render(true); } }

/* ── Выгрузка-витрина: кнопка «Обновить таблицу» ──────────────────
   [чат 073, разбор 28 §7.2 исполнение A]

   После ухода с Google база — единственный приёмник, а книга осталась тем,
   ради чего Дмитрий её держит: человек смотрит и правит глазами. Поток стал
   односторонним «база → книга», и у него появился момент: кто-то нажимает.

   Кнопка честнее расписания. Она показывает, что таблица — снимок, а не
   истина: между нажатиями книга отстаёт, и это видно по времени в подписи.
   Расписание добавляется одним узлом на сервере, когда станет ясно, что
   нажимать лень (§7.2 B).

   Право на выгрузку — только у заказчика и администратора: кнопка переписывает
   книгу целиком, а не свою строку. Сервер проверяет это сам (узел «Проверить
   личность (выгрузка)»), панель лишь не показывает кнопку тем, кому откажут.  */
const EXPORT = { busy: false, note: "", at: "" };

const canExport = () => ["admin", "owner"].indexOf(String(D.role || "")) >= 0
                     || ["admin", "owner"].indexOf(String(D.kind || "")) >= 0;

async function exportBook(){
  /* Замок от второго входа [чат 012]: двойной тап давал второй круг запросов,
     а здесь второй круг — это второй batchClear по боевой книге. */
  if(EXPORT.busy) return;
  EXPORT.busy = true; render();
  try{
    const r = await fetch(API + "/export", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: INIT, key: KEY })
    });
    const t = await r.text();
    let j = null; try{ j = JSON.parse(t); }catch(e){}
    if(!r.ok || !j || j.ok !== true){
      /* Сервер отвечает 403 и текстом причины; хвост «[line NN]» дописывает
         n8n — человеку он ничего не говорит. */
      const msg = (j && j.error) ? String(j.error).replace(/\s*\[line \d+\]\s*$/, "")
                                 : ("сервер ответил " + r.status);
      toast(msg, "err");
    }else{
      const d = new Date();
      const p2 = n => String(n).padStart(2, "0");
      EXPORT.at = p2(d.getHours()) + ":" + p2(d.getMinutes());
      EXPORT.note = (j.books || []).join(" · ");
      toast("Таблица обновлена: листов " + (j.sheets || 0) + ", строк " + (j.rows || 0), "ok");
    }
  }catch(e){
    toast("Не получилось: " + ((e && e.message) ? e.message : "сеть"), "err");
  }
  EXPORT.busy = false; render();
}

/* Блок на экране «Объект». Сводка обязательна (§11.2 п. 5): кнопка без отчёта

function exportBox(){
  if(!canExport()) return "";
  return '<div class="stat">' +

    '<div class="m">Данные живут в базе, таблица — витрина для глаз. Кнопка переписывает листы книги объекта и общей базы из базы: то, что правили в таблице руками, заменится тем, что в базе.</div>' +
    (EXPORT.note ? ('<div class="m" style="margin-top:6px;color:#30d158">' + esc(EXPORT.note) + '</div>') : "") +

      (EXPORT.busy ? "#3a3a3c" : "#0a84ff") + ';color:#fff;font-size:15px">' +
      (EXPORT.busy ? "Обновляю…" : "🔄 Обновить таблицу") + '</button>' +
  '</div>';
}

/* ══════════════════════════════════════════════════════════════
   ЗАВЕДЕНИЕ ОБЪЕКТА ИЗ ПАНЕЛИ [чат 077, G1 шаг 5]

   Серверная сторона готова с 076: POST /remont/object заводит объект целиком
   в базе по подписи владельца — аккаунт, строка objects, участие admin, ключ
   доступа. Google-книга после этого необязательна: она витрина, а не объект.

   Идемпотентность держится меткой формы ref: она рождается один раз при
   открытии экрана и живёт до успеха. Второй тап, повтор после обрыва сети и
   возврат на экран возвращают ТОТ ЖЕ объект и тот же ключ, а не заводят
   второй (сервер ищет по паре владелец + метка, разбор 21 §7.4).

   Поля живут в NOBJ.f, а не только в DOM: экран перерисовывается от данных,
   и введённое иначе пропадало бы на середине заполнения (урок 021).
   ══════════════════════════════════════════════════════════════ */
const NOBJ = { busy: false, ref: "", err: "", res: null, f: { title: "", address: "", contract: "" } };

function nobjRef(){
  if(!NOBJ.ref){
    const rnd = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
              : (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
    NOBJ.ref = "panel-" + rnd;
  }
  return NOBJ.ref;
}

function nobjSet(k, v){ NOBJ.f[k] = String(v == null ? "" : v); }

/* ─── D4 · выбор объекта [чат 091] ───────────────────────────────────────
   Панель показывает те объекты, ключи которых знает: пришедшие ссылкой и
   заведённые ей самой. Серверной ветки «мои объекты» ещё нет (её SQL готовится
   отдельно), поэтому список неполон по построению — и об этом сказано словами,
   а не умолчанием. Переключение не перезагружает страницу: подпись Telegram
   живёт в WebApp, и терять её ради смены объекта незачем.                    */
function objSwitchBox(){
  const list = objsAll();
  if(!list.length) return "";
  if(list.length === 1 && (!KEY || list[0].key === KEY)) return "";
  return '<div class="stat">' +
    '<div class="r"><span class="k">Мои объекты</span><span class="v">' + list.length + '</span></div>' +
    '<div class="m">Сейчас открыт: ' + esc(KEY ? objsTitle(KEY) : "объект по умолчанию") + '</div>' +
    '<button onclick="go(\'objsel\')" style="width:100%;margin-top:10px;padding:11px;border-radius:11px;border:0;background:#2c2c2e;color:#fff;font-size:15px">🔀 Выбрать объект</button>' +
  '</div>';
}

function objSelRole(r){
  const k = String(r || "");
  return k ? (OBJ_ROLE_RU[k] || k) : "";
}
function objSelScreen(){
  const list = objsAll().slice().sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const rows = list.map(o => {
    const on = (o.key === KEY);
    const role = objSelRole(o.role);
    return '<div onclick="objsSwitch(\'' + esc(o.key) + '\')" style="margin-top:8px;padding:12px;border-radius:12px;' +
      'background:' + (on ? "#0a84ff" : "#2c2c2e") + ';color:#fff;cursor:pointer">' +
      '<div style="font-size:15px">' + esc(objsTitle(o.key)) + (on ? " · открыт" : "") + '</div>' +
      '<div style="font-size:12px;opacity:.65;margin-top:3px">' + (role ? esc(role) + ' · ' : '') +
        'ключ …' + esc(String(o.key).slice(-6)) + '</div>' +
    '</div>';
  }).join("");
  /* Участия без годного ключа: показываем, но переключиться нечем — человеку
     нужна ссылка от бригадира. В хранилище они не попадают (objsAll их режет). */
  const nokey = (OBJSRV.nokey || []).map(o => {
    const role = objSelRole(o.role);
    return '<div style="margin-top:8px;padding:12px;border-radius:12px;background:#1c1c1e;color:#8e8e93">' +
      '<div style="font-size:15px">' + esc(o.title || "Объект без названия") + '</div>' +
      '<div style="font-size:12px;margin-top:3px">' + (role ? esc(role) + ' · ' : '') +
        'ключа нет — попросите ссылку у бригадира</div>' +
    '</div>';
  }).join("");
  /* Подзаголовок обязан быть честным: пока ветка не ответила, список — память
     панели, и обещать «все ваши объекты» нельзя. */
  const sub = (OBJSRV.state === "done") ? "объекты, где вы участвуете"
            : (OBJSRV.state === "load") ? "спрашиваю сервер о ваших объектах…"
            : "панель помнит объекты, ключи которых получала";
  const note = (OBJSRV.state === "done")
      ? 'Список пришёл с сервера по вашей подписи. Если объекта нет и здесь — вас ещё не добавили на него.'
      : 'Если объекта нет в списке — откройте его ссылкой ещё раз: панель запомнит ключ и покажет его здесь.';
  return '<div class="hello">Выбор объекта</div>' +
    '<div class="sub">' + sub + '</div>' +
    (rows || (nokey ? "" : '<div class="stat"><div class="m">Панель пока не знает ни одного ключа. Объект открывается ссылкой от бригадира или заводится на экране «Объект».</div></div>')) +
    nokey +
    (OBJSRV.err ? '<div class="stat" style="margin-top:12px"><div class="m">Список с сервера не пришёл: ' + esc(OBJSRV.err) + '. Показаны объекты, которые панель помнит.</div></div>' : '') +
    '<div class="stat" style="margin-top:12px"><div class="m">' + note + '</div></div>';
}

function objsSwitch(key){
  key = String(key || ""); if(!key) return;
  if(key === KEY){ back(); return; }
  objsSetActive(key);
  KEY = key;
  D = null; INVS = null; CREW_DATA = null;
  back();
  app.innerHTML = '<div class="hello">Открываю объект…</div>';
  load();
}

/* Блок на экране «Объект». Право то же, что у выгрузки: заказчик и админ.
   Владельцев системы панель не знает — их список живёт в базе, и чужому

function nobjDone(){
  const r = NOBJ.res || {};

  return '<div class="hello">' + (r.created ? "Объект заведён" : "Такой объект уже был") + '</div>' +

      '<div class="r"><span class="k">Ключ доступа</span></div>' +

      '<div class="m" style="margin-top:8px">Ключ открывает объект в браузере вне Telegram. Внутри Telegram он не нужен — система узнаёт вас по подписи.</div>' +
      '<button onclick="nobjCopy()" style="width:100%;margin-top:10px;padding:11px;border-radius:11px;border:0;background:#2c2c2e;color:#fff;font-size:15px">Скопировать ключ</button>' +
    '</div>' +
    '<button onclick="nobjOpen()" style="width:100%;margin-top:12px;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:16px">Открыть объект</button>' +

}

function nobjCopy(){
  const k = String((NOBJ.res || {}).key || "");
  if(!k) return;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(k);
    else {
      const ta = document.createElement("textarea");
      ta.value = k; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    toast("Ключ скопирован", "ok");
  }catch(e){ toast("Скопировать не вышло — выделите руками", "err"); }
}

/* Открытие нового объекта — ключом в адресе: сервер выбирает объект по ключу
   доступа (приём 074). Хеш сохраняем — в нём живёт подпись Telegram. */
function nobjOpen(){
  const k = String((NOBJ.res || {}).key || "");
  if(!k) return;
  objsRemember(k, (NOBJ.f && NOBJ.f.title) || "");   // [чат 091] объект попадает в список выбора
  location.href = location.pathname + "?key=" + encodeURIComponent(k) + (location.hash || "");
}

function nobjReset(){
  NOBJ.res = null; NOBJ.err = ""; NOBJ.ref = "";
  NOBJ.f = { title: "", address: "", contract: "" };
  render();
}

async function mkObject(){
  if(NOBJ.busy) return;                                  // замок от второго тапа [чат 012]
  const title = String(NOBJ.f.title || "").trim();
  if(!title){ toast("Название объекта обязательно", "wait"); return; }
  NOBJ.busy = true; NOBJ.err = ""; render();
  try{
    const body = { initData: INIT, key: KEY, title: title, ref: nobjRef() };
    const addr = String(NOBJ.f.address || "").trim();
    const sum  = String(NOBJ.f.contract || "").trim().replace(",", ".");
    if(addr) body.address = addr;
    if(sum && !isNaN(Number(sum))) body.contract = Number(sum);
    const r = await fetch(API + "/object", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const txt = await r.text();
    let j = null; try{ j = JSON.parse(txt); }catch(e){}
    if(!r.ok || !j || j.ok !== true){
      /* Хвост «[line NN]» дописывает n8n, человеку он ничего не говорит;
         служебный код сервер ставит в конец текста в скобках (находка 076). */
      NOBJ.err = (j && j.error) ? String(j.error).replace(/\s*\[line \d+\]\s*$/, "")
                                : ("сервер ответил " + r.status);
      toast(NOBJ.err, "err");
    }else{
      NOBJ.res = j;
      toast(j.created ? "Объект заведён" : "Объект уже был — вот его ключ", "ok");
    }
  }catch(e){
    NOBJ.err = "Не получилось: " + ((e && e.message) ? e.message : "сеть");
    toast(NOBJ.err, "err");
  }
  NOBJ.busy = false; render();
}

function render(toTop){
  const k = stack[stack.length - 1];
  const keep = window.scrollY || 0;               // где человек стоял до перерисовки
  app.innerHTML = (SCREENS[k] || SCREENS.home)();
  uzApply(app);                                   // языковой слой E1 [чат 020]
  if(k === "object" && objPlan()) setTimeout(objShowPlan, 0);   // картинка плана грузится отдельным запросом [чат 016]
  /* Переход (toTop) открывает экран там, где его оставили в прошлый раз;
     перерисовка от данных не двигает страницу вовсе. Восстановление отложено
     на кадр: сразу после подстановки разметки высота документа ещё старая,
     и scrollTo упёрся бы в неё [чат 021]. */
  const want = toTop ? (SCROLL[k] || 0) : keep;
  if(want || toTop){
    const put = () => window.scrollTo(0, want);
    put();
    if(typeof requestAnimationFrame === "function") requestAnimationFrame(put); else setTimeout(put, 0);
  }
  if(tg){
    if(stack.length > 1){ tg.BackButton.show(); tg.BackButton.onClick(back); }
    else tg.BackButton.hide();
  }
}

const progress = () => D.works.length
  ? D.works.reduce((s,w) => s + (w.progress || 0), 0) / D.works.length : 0;

/* Деньги от приёмки. «Принято» — только статус «Готово» (подтверждено заказчиком).
   «В работе» — незавершённые, пропорционально проценту готовности (справочно).
   Поле: заказчику — договорная разнесённая цена, работнику — его цена. */
const accSum = f => D.works.filter(w => w.status === "Готово")
  .reduce((s,w) => s + (Number(w[f]) || 0), 0);
const wipSum = f => D.works.filter(w => w.status !== "Готово" && (w.progress || 0) > 0)
  .reduce((s,w) => s + (Number(w[f]) || 0) * (w.progress || 0) / 100, 0);

/* Приглашения [чат 083, E5]: список выписанных с состоянием и отзывом.
   Состояние приходит с сервера готовым (v_invites_active), панель его не
   вычисляет: иначе часы телефона стали бы частью правила доступа.
   Отзыв — обязательная часть механизма, а не удобство: по решению 060
   ссылка открывает профиль объекта ДО принятия, и выписанное по ошибке
   приглашение без отзыва остаётся открытой дверью.                      */
invites(){
  const head = '<div class="hello">Приглашения</div>';
  if(INV_NEW === false)
    return head + '<div class="sub">серверная часть ещё не выкачена</div>' +
      '<div class="stat"><span class="k">Пока код приглашения генерирует само приложение, у приглашения нет ни записи, ни состояния — показывать и отзывать нечего. Список появится вместе с серверными ветками приглашений.</span></div>';
  const rows = INVS;
  if(!rows) return head + '<div class="sub">Загружаю…</div>';
  if(!rows.length)
    return head + '<div class="sub">Пока ни одного</div>' +
      '<div class="stat"><span class="k">Приглашение выписывается на экране «Бригада»: выберите, куда зовёте человека, и перешлите ему ссылку.</span></div>' +
      '<button class="tile" style="width:100%" onclick="openCrewScreen(\'crew\')"><span class="nm">К бригаде</span></button>';

  const live = rows.filter(x => String(x.state || "") === "действует").length;
  const item = (x) => {
    const st   = String(x.state || "");
    const code = String(x.code || "");
    const used = Number(x.used_count || 0), max = Number(x.max_uses || 1);
    const by   = Array.isArray(x.accepted_by) ? x.accepted_by.filter(Boolean) : [];
    const dead = st !== "действует";
    return '<div class="work' + (dead ? " done" : "") + '">' +
      '<div class="t"><span style="font-family:monospace;letter-spacing:2px">' + esc(code) + '</span> ' +
        '<span style="font-size:13px;color:' + (INV_STC[st] || "#8e8e93") + '">' + esc(st || "—") + '</span></div>' +
      '<div class="m">' + esc(INV_T[x.type] || String(x.type || "")) +
        (x.role ? " · " + esc(INV_ROLE[x.role] || x.role) : "") +
        (x.invitee ? " · " + esc(x.invitee) : "") +
        (max > 1 ? (" · принято " + used + " из " + max) : (used ? " · принято" : "")) +
        (x.expires_at ? (" · до " + esc(String(x.expires_at).replace("T", " ").slice(0, 16))) : "") + "</div>" +
      (x.purpose ? '<div class="m" style="margin-top:6px">' + esc(x.purpose) + "</div>" : "") +
      (by.length ? '<div class="m" style="margin-top:6px;opacity:.75">Приняли: ' + esc(by.join(", ")) + "</div>" : "") +
      '<div class="m" style="margin-top:8px">' +
        '<button onclick="invCopy(\'' + attr(code) + '\',\'' + attr(String(x.type || "")) + '\')" ' + CREW_BTN + ">Скопировать</button> " +
        (dead ? "" :
          (INV_ASK === code
            ? '<button onclick="invRevoke(\'' + attr(code) + '\')" ' + CREW_BTNR + ">Точно отозвать</button> " +
              '<button onclick="invAsk(\'' + attr(code) + '\')" ' + CREW_BTN2 + ">Не надо</button>"
            : '<button onclick="invAsk(\'' + attr(code) + '\')" ' + CREW_BTN2 + (INV_ACT === code ? " disabled" : "") + ">" +
              (INV_ACT === code ? "Отзываю…" : "Отозвать") + "</button>")) +
      "</div></div>";
  };

  return head +
    '<div class="sub">' + (live ? ("действует: " + live + " из " + rows.length) : ("все погашены или отозваны · всего " + rows.length)) + "</div>" +
    '<div class="grid" style="margin-bottom:12px">' +
      '<button class="tile" onclick="openInvites()"><span class="ic">🔄</span><span class="nm">Обновить</span></button>' +
      '<button class="tile" onclick="openCrewScreen(\'crew\')"><span class="ic">➕</span><span class="nm">Позвать</span><div class="h">выписать новое</div></button>' +
    "</div>" +
    rows.map(item).join("") +
    '<div class="stat"><span class="k">Отозванное приглашение перестаёт открывать профиль объекта сразу — тем, кто уже вошёл по нему, доступ сохраняется: его снимают отключением участника, а не отзывом кода.</span></div>';
},


home(){

  const m = D.my_money;
  const S = D.settings;

     заполнены (колонка «Цена_Юрия_USD»); иначе блок не показываем.        */
  const adv = (() => {
    const f = worker ? "price_contractor_usd" : "price_alloc_usd";
    return (worker && !accSum(f)) ? null : advCalc(f);
  })();
  const advBox = adv ? `
    <div class="r"><span class="k">${adv.k}</span>
      <span class="v" style="color:${adv.color}">${adv.main}</span></div>
    <div class="r"><span class="k" style="font-size:13px;opacity:.65">${adv.sub}</span><span class="v"></span></div>
    <div class="bar"><i style="width:${adv.pct}%"></i></div>` : "";
  /* Временна́я шкала — симметрия денежной: как «отработано аванса» отвечает,
     где деньги относительно работ, так эта отвечает, где мы относительно срока. */
  const tm = timeCalc();

  const head = worker && m ? `

        <span class="v">${fmt(m.received_usd)} из ${usd(dealSum())} $</span></div>
      ${dealDelta() ? `<div class="r"><span class="k" style="font-size:13px;opacity:.65">${esc(dealNote())}</span><span class="v"></span></div>` : ""}
      <div class="r"><span class="k">Принято заказчиком</span>

      <div class="bar"><i style="width:${p}%"></i></div>
    </div>` : `
    <div class="stat">
      ${advBox}${timeBox}
      <div class="r"><span class="k">Договор</span>
        <span class="v">${usd(dealSum())} $</span></div>
      ${dealDelta() ? `<div class="r"><span class="k" style="font-size:13px;opacity:.65">${esc(dealNote())}</span><span class="v"></span></div>` : ""}

works(){

  const rooms  = [...new Set(D.works.map(w => w.room))];
  const base   = fRoom ? D.works.filter(w => w.room === fRoom) : D.works;
  const doneN  = base.filter(w => w.status === "Готово").length;
  const list   = hideDone ? base.filter(w => w.status !== "Готово") : base;

  return `
    <div class="hello">Работы</div>
    <div class="sub">${list.length}${fRoom ? " из " + D.works.length : " позиций"}${hideDone && doneN ? ` · скрыто готовых: ${doneN}` : ""}</div>

      <button class="${hideDone ? "on" : ""}" onclick="hideDone=!hideDone;render()">${hideDone ? "Показать готовое" : "Скрыть готовое"}${doneN ? ` (${doneN})` : ""}</button>

    ${list.map(w => `
      <div class="work${w.status === "Готово" ? " done" : ""}">
        <div class="t">${esc(w.name)}</div>
        <div class="m">${esc(w.room.split(" (")[0])} · ${esc(w.section)} · ${w.unit === "компл" ? "комплект" : w.qty + " " + esc(w.unit)}</div>
        ${(() => { const _b = (w.status === "Готово" || w.status === "Не начато") ? [] : depBlockers(w);
          return _b.length ? `<div class="m" style="color:var(--warn)">⏳ Сначала должно быть принято: ${_b.map(x => esc(x.name)).join(", ")}</div>` : ""; })()}

        ${w.status === "Заявлено" ? `<div class="m" style="color:var(--warn)">⏳ Заявлено — ждёт приёмки заказчиком</div>` : ""}
        ${w.status === "На приёмке у работника" ? `<div class="m" style="color:var(--warn)">⏳ Ждёт приёмки работником</div>` : ""}
        <div class="row">
          <label>Статус</label>
          <select onchange="upd('01_Работы','${w.code}','Статус',this.value)">
            ${["Не начато","В работе","Заявлено","На приёмке у работника","Оспорено","Готово","Приостановлено","Снято"]
              .map(s => `<option${s === w.status ? " selected" : ""}>${s}</option>`).join("")}
          </select>
        </div>
        <div class="row">
          <label>Готово, %</label>
          <input type="number" min="0" max="100" step="10" value="${w.progress || 0}"
            onchange="upd('01_Работы','${w.code}','Готовность_%',this.value)">
        </div>
        ${worker ? `
        <div class="row">
          <label>Ваша цена, $</label>
          <input type="number" min="0" value="${w.price_contractor_usd ?? ""}" placeholder="— впишите"
            onchange="upd('01_Работы','${w.code}','Цена_Юрия_USD',this.value)">
        </div>` : `
        <div class="row">
          <label>Оценка</label>
          <div style="flex:1;font-weight:600;font-size:14px">
            ${w.price_alloc_usd ? "$" + Math.round(w.price_alloc_usd) : "—"}
            ${w.price_contractor_usd != null
              ? ` <span style="color:var(--hint);font-weight:400">· Юрий: $${w.price_contractor_usd}</span>` : ""}
          </div>
        </div>`}
      </div>`).join("")}`;
},
