}
function planRulerTap(ev){
  if(!PRL) return;
  const p = planCTapXY(ev);
  if(!p) return;
  if(PRL.pts.length >= 2) PRL.pts = [];
  PRL.pts.push(p);
  planRulerDraw();
}

/* Очередь разметки: сперва помещения, потом проёмы. Размеченное в очередь
   не попадает — незавершённая разметка продолжается с того места, где встала,
   и ничего не блокирует (решение 031: путь «этого ещё нет» обязан работать). */
function planQueue(m){
  const q = [];
  roomList().forEach(r => { if(!planHas(m, "rooms", r.code)) q.push({ t: "rooms", id: r.code, name: planShort(r.name || r.code) }); });
  elemAll().forEach(e => { if(!planHas(m, "elems", String(e.id))) q.push({ t: "elems", id: String(e.id), name: String(e.name || e.id) }); });
  return q;
}

/* Слой поверх картинки: линии проёмов между размеченными помещениями,
   точки у проёмов со своей меткой, плашки помещений. Цвета и штрих те же,
   что у графа (graphLine) — один язык на обоих видах. */
function planLayer(m){
  const R = m.rooms || {}, E = m.elems || {};
  const els = elemAll();
  const lines = els.filter(e => R[e.a] && R[e.b]).map(e => {
    const g = graphLine(e), a = R[e.a], b = R[e.b];
    const x1 = a[0] * 100, y1 = a[1] * 100, x2 = b[0] * 100, y2 = b[1] * 100;
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + g.color +
      '" stroke-width="2" vector-effect="non-scaling-stroke"' + (g.dash ? ' stroke-dasharray="' + g.dash + '"' : "") + ' />';
  }).join("");
  const dots = Object.keys(E).map(id => {
    const p = E[id], e = els.filter(x => String(x.id) === String(id))[0];
    const g = e ? graphLine(e) : { color: "#0a84ff" };
    return '<circle cx="' + (p[0] * 100) + '" cy="' + (p[1] * 100) + '" r="1.4" fill="' + g.color +
      '" stroke="#000" stroke-width="0.3" />';
  }).join("");
  const svg = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"' +
    ' style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">' + lines + dots + '</svg>';
  const tags = Object.keys(R).map(code => {
    const r = roomList().filter(x => x.code === code)[0];
    const p = R[code], nm = r ? planShort(r.name || code) : code;
    return '<div style="position:absolute;left:' + (p[0] * 100) + '%;top:' + (p[1] * 100) + '%;' +
      'transform:translate(-50%,-50%);background:rgba(28,28,30,.86);color:#fff;font-size:11px;' +
      'padding:3px 7px;border-radius:8px;white-space:nowrap;pointer-events:none">' + esc(nm) + '</div>';
  }).join("");
  return svg + tags;
}

function planMarkStart(){
  if(!PLAN_URL){ toast("План ещё не загрузился", "wait"); return; }
  PMK = planMarks();
  PMQ = planQueue(PMK);
  PMI = 0;
  planMarkDraw();
}
function planMarkClose(){
  const box = document.getElementById("pmkBox");
  if(box) box.remove();
  PMK = null; PMQ = []; PMI = 0;
}
function planMarkDraw(){
  let box = document.getElementById("pmkBox");
  if(!box){
    box = document.createElement("div");
    box.id = "pmkBox";
    box.style.cssText = "position:fixed;inset:0;z-index:9997;background:#000;overflow-y:auto;" +
      "padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px))";
    document.body.appendChild(box);
  }
  const cur = PMQ[PMI] || null;
  const left = PMQ.length - PMI;
  /* Пройденная очередь и пустая очередь — разные вещи: пропущенное никуда
     не делось, и человек должен видеть, что записывает не всё [чат 039]. */
  const head = cur
    ? '<div class="vs">Отметьте на плане: <b>' + esc(cur.name) + '</b></div>' +
      '<div class="m" style="margin-bottom:8px">Осталось отметить: ' + left + '</div>'
    : (PMQ.length
      ? '<div class="vs">Пропущено: ' + PMQ.length + '. Их можно отметить позже — кнопкой «Дополнить разметку». Нажмите «Готово», чтобы записать отмеченное.</div>'
      : '<div class="vs">Всё отмечено. Нажмите «Готово», чтобы записать.</div>');
  box.innerHTML =
    '<div class="vh" style="color:#fff">Разметка плана</div>' + head +
    '<div id="pmkWrap" style="position:relative">' +
      '<img id="pmkImg" src="' + PLAN_URL + '" alt="План БТИ" style="width:100%;display:block;border-radius:12px">' +
      planLayer(PMK) +
    '</div>' +
    '<div class="vrow" style="margin-top:12px">' +
      '<button class="vbtn-cancel" onclick="planMarkClose()">Отмена</button>' +
      (cur ? '<button class="vbtn-cancel" onclick="planMarkSkip()">Пропустить</button>' : "") +
      '<button class="vbtn-ok" id="pmkOk" onclick="planMarkDone()">Готово</button>' +
    '</div>' +
    '<div class="m" style="margin-top:8px">Тычок ставит метку. Пока не нажато «Готово», в лист не уходит ничего.</div>' +
    planMarkChips();
  const img = document.getElementById("pmkImg");
  if(img) img.onclick = planMarkTap;
}
/* «Пропустить» переносит пункт в конец очереди, а не сдвигает индекс мимо
   него [чат 039]. Раньше пропущенное в этом сеансе больше не предлагалось,
   и вернуться к нему можно было только следующим заходом. Защита от кольца:
   когда всё оставшееся уже пропускали, очередь считается пройденной —
   человек видит итог и записывает, а не ходит по кругу. */
function planMarkSkip(){
  if(PMI >= PMQ.length) return;
  const c = PMQ.splice(PMI, 1)[0];
  c.sk = 1;
  PMQ.push(c);
  if(PMQ.slice(PMI).every(x => x.sk)) PMI = PMQ.length;
  planMarkDraw();
}
/* Правка поставленной метки [чат 039, дыра 037.2]. Касание пункта в списке
   снимает метку и ставит пункт текущим: ткнул по плану заново — переставил,
   нажал «Пропустить» — оставил снятым. Пункт вставляется на место текущего,
   а не в конец, — иначе человек не понял бы, куда делось то, что он выбрал. */
function planMarkRedo(kind, id){
  if(!PMK) return;
  const key = String(id);
  const r = kind === "rooms" ? roomList().filter(x => String(x.code) === key)[0] : null;
  const e = kind === "elems" ? elemAll().filter(x => String(x.id) === key)[0] : null;
  const name = r ? planShort(r.name || key) : (e ? String(e.name || key) : key);
  delete PMK[kind][key];
  PMQ = PMQ.filter(x => !(x.t === kind && String(x.id) === key));
  if(PMI > PMQ.length) PMI = PMQ.length;
  PMQ.splice(PMI, 0, { t: kind, id: key, name: name });
  planMarkDraw();
}
/* Список отмеченного под планом: он же — единственный путь к правке. */
function planMarkChips(){
  if(!PMK) return "";
  const items = [];
  roomList().forEach(r => {
    if(planHas(PMK, "rooms", r.code)) items.push({ t: "rooms", id: String(r.code), name: planShort(r.name || r.code) });
  });
  elemAll().forEach(e => {
    if(planHas(PMK, "elems", String(e.id))) items.push({ t: "elems", id: String(e.id), name: String(e.name || e.id) });
  });
  if(!items.length) return "";
  return '<div class="m" style="margin-top:10px">Отмечено: ' + items.length + " — коснитесь, чтобы переставить</div>" +
    '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">' +
    items.map(x => '<button onclick="planMarkRedo(\'' + x.t + '\',\'' + esc(x.id) + '\')" ' +
      'style="padding:6px 10px;border-radius:9px;border:0;background:#2c2c2e;color:#fff;font-size:13px">' +
      esc(x.name) + "</button>").join("") + "</div>";
}
/* Координаты берём относительно самой картинки, а не окна: страница
   прокручивается, и разница вылезла бы только на длинном плане. */
function planMarkTap(ev){
  const cur = PMQ[PMI];
  if(!cur || !PMK) return;
  const r = ev.currentTarget.getBoundingClientRect();
  if(!r.width || !r.height) return;
  const x = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
  const y = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
  PMK[cur.t][cur.id] = [Math.round(x * 1000) / 1000, Math.round(y * 1000) / 1000];
  PMI++;
  planMarkDraw();
}
async function planMarkDone(){
  if(!PMK) return;
  const btn = document.getElementById("pmkOk");
  if(btn){ btn.disabled = true; btn.textContent = "Записываю…"; }
  try{
    const p = objPlan();
    PMK.img = p ? String(p.file_id || p.id || "") : "";
    await planMarksSave(PMK);
    toast("Разметка плана записана");
    planMarkClose();
    await load();
    render();
  }catch(e){
    toast(e.message, "err");
    if(btn){ btn.disabled = false; btn.textContent = "Готово"; }
  }
}

async function objShowPlan(){
  const box = document.getElementById("objPlanBox");
  const p = objPlan();
  if(!box || !p) return;
  box.innerHTML = '<div class="m">Загружаю план…</div>';
  try{
    const q = "draft=" + encodeURIComponent(p.id) + "&initData=" + encodeURIComponent(INIT) + "&key=" + encodeURIComponent(KEY);
    const r = await fetch(API + "/file?" + q);
    if(!r.ok){ console.warn("file: HTTP " + r.status); throw new Error("Сервер не отдал изображение"); }
    const raw = await r.blob();
    const hdr = fileCT(r);
    const type = (hdr.indexOf("image/") === 0) ? hdr : await sniffImage(raw);
    if(!type){ console.warn("file: тип «" + hdr + "», байт " + ((raw && raw.size) || 0)); throw new Error("Сервер не отдал изображение"); }
    const b = (raw.type === type) ? raw : new Blob([raw], { type: type });
    const u = URL.createObjectURL(b);
    /* Адрес картинки живёт до конца сеанса: экран разметки берёт его отсюда
       и не качает план второй раз [чат 037]. */
    PLAN_URL = u;
    const mk = planMarks();
    const marked = planMarked(mk);
    const total = roomList().length;
    const stale = mk.img && p && String(mk.img) !== String(p.file_id || p.id || "");
    /* Уровень C [чат 048]: заливка контуров под слоем линий и плашек; плашка
       комнаты с контуром садится в центр тяжести (§11.5) — координаты комнат
       подменяет planCAdj, сам planLayer не правлен. */
    const ppC = planPolys();
    const scC = planScale();
    const polyN = Object.keys(ppC.polys).length;
    const curImgC = String(p.file_id || p.id || "");
    const staleC = !!((scC && !planSameImg(scC, curImgC)) || (polyN && !planSameImg(ppC, curImgC)));
    box.innerHTML = '<div style="position:relative">' +
        '<img src="' + u + '" alt="План БТИ" style="width:100%;border-radius:12px;display:block">' +
        planCFills(ppC) +
        ((marked || polyN) ? planLayer(planCAdj(mk, ppC)) : "") +
      "</div>" +
      '<div class="m" style="margin-top:6px">Загружен ' + esc(p.at || "") + " · " + esc(p.who || "") + "</div>" +
      (stale ? '<div class="m" style="color:#ff9f0a">Метки остались от прежнего снимка плана — проверьте их.</div>' : "") +
      '<div class="m" style="margin-top:4px">' + (marked
        ? ("Отмечено помещений: " + marked + " из " + total)
        : "Помещения на плане не отмечены. Разметка — это тычки пальцем: где какая комната и где какая дверь.") + "</div>" +
      '<button onclick="planMarkStart()" style="width:100%;margin-top:8px;padding:11px;border-radius:11px;' +
        'border:0;background:#2c2c2e;color:#fff;font-size:15px">' +
        (marked ? "Дополнить разметку" : "Разметить план") + "</button>" +
      /* Уровень C [чат 048]: масштаб, контуры, линейка (§11.4–11.5). */
      (staleC ? '<div class="m" style="margin-top:6px;color:#ff9f0a">Масштаб от прежнего снимка</div>' : "") +
      (!scC ? '<div class="m" style="margin-top:6px">Масштаб не задан</div>'
            : (polyN < total ? '<div class="m" style="margin-top:6px">Осталось обвести: ' + (total - polyN) + '</div>' : "")) +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<button onclick="planScaleStart()" style="flex:1;padding:11px;border-radius:11px;border:0;background:#2c2c2e;color:#fff;font-size:15px">Задать масштаб</button>' +
        '<button onclick="planPolyStart()" style="flex:1;padding:11px;border-radius:11px;border:0;background:#2c2c2e;color:#fff;font-size:15px">Обвести помещение</button>' +
      '</div>' +
      (scC ? '<button onclick="planRulerStart()" style="width:100%;margin-top:8px;padding:11px;border-radius:11px;border:0;background:#2c2c2e;color:#fff;font-size:15px">Линейка</button>' : "");
  }catch(e){
    box.innerHTML = '<div class="m" style="color:#ff453a">План не открылся: ' + esc(e.message) + "</div>";
  }
}

/* Снимок плана [чат 029]. Требования Дмитрия по ходу живого прохода:
   «Должна быть возможность сделать фото» — до 029 кнопка открывала только
   галерею, и план приходилось снимать заранее другим приложением; «Надо
   добавить возможность крутить фото» — план БТИ снимают как лежит, а в
   панели он потом виден боком. Поворот делается ДО отправки: снимок уходит
   в чат человека и становится файлом системы, там его уже не повернуть. */
let objRot = 0, objFile = null;

function objPick(){
  const box = document.createElement("div");
  box.id = "objSrc";
  box.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:14px";
  box.innerHTML =
    '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:16px;max-width:420px;width:100%;font-size:15px">' +
      '<div style="font-weight:700;margin-bottom:10px">План БТИ</div>' +
      '<button id="objCam" style="width:100%;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px;margin-bottom:8px">Сфотографировать план</button>' +
      '<button id="objGal" style="width:100%;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px;margin-bottom:8px">Выбрать из галереи</button>' +
      '<button id="objNo" style="width:100%;padding:13px;border-radius:12px;border:0;background:transparent;color:#8e8e93;font-size:15px">Отмена</button>' +
    "</div>";
  document.body.appendChild(box);
  box.querySelector("#objNo").onclick = () => box.remove();
  box.querySelector("#objCam").onclick = () => { box.remove(); objCamera(); };
  box.querySelector("#objGal").onclick = () => { box.remove(); objInput(false); };
}

function objInput(useCamera){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  if(useCamera) inp.setAttribute("capture", "environment");
  inp.onchange = () => { if(inp.files && inp.files[0]) objPreview(inp.files[0]); };
  inp.click();
}

/* Своя камера [чат 029.2]. Живой проход: «выбрал "сфотографировать" —
   инструмент не вижу». Внутри Telegram WebView атрибут capture у <input>
   игнорируется, открывается тот же выбор из галереи, а метода «сними фото»
   у Mini App SDK нет. Поэтому видоискатель свой: поток с задней камеры,
   кадр снимается в canvas и уходит в тот же предпросмотр с поворотом.
   Где getUserMedia недоступен (старый webview, отказ в доступе) — честный
   откат к выбору файла с объяснением, а не молчаливое «ничего не произошло». */
let objStream = null;

function objCamStop(){
  try{ if(objStream) objStream.getTracks().forEach(t => t.stop()); }catch(e){}
  objStream = null;
  const b = document.getElementById("objCamBox");
  if(b) b.remove();
}

async function objCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast("Камера недоступна в этом клиенте — открываю выбор снимка", "wait");
    objInput(true); return;
  }
  try{
    objStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
  }catch(e){
    toast("Камера не открылась — открываю выбор снимка", "wait");
    objInput(true); return;
  }
  const box = document.createElement("div");
  box.id = "objCamBox";
  box.style.cssText = "position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column";
  box.innerHTML =
    '<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center">' +
      '<video id="objCamV" playsinline autoplay muted style="max-width:100%;max-height:100%"></video>' +
    "</div>" +
    '<div style="display:flex;gap:8px;padding:14px calc(14px + env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom))">' +
      '<button id="objCamNo" style="flex:1;padding:14px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
      '<button id="objCamGo" style="flex:2;padding:14px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Снять</button>' +
    "</div>";
  document.body.appendChild(box);
  const v = box.querySelector("#objCamV");
  try{ v.srcObject = objStream; }catch(e){}
  box.querySelector("#objCamNo").onclick = () => objCamStop();
  box.querySelector("#objCamGo").onclick = () => {
    let file = null;
    try{
      const c = document.createElement("canvas");
      c.width = v.videoWidth || 1280; c.height = v.videoHeight || 960;
      const x = c.getContext("2d");
      if(!x) throw new Error("нет контекста");
      x.drawImage(v, 0, 0, c.width, c.height);
      c.toBlob(b => {
        objCamStop();
        if(!b){ toast("Снимок не получился — попробуйте выбрать файл", "err"); return; }
        objPreview(new File([b], "plan.jpg", { type: "image/jpeg" }));
      }, "image/jpeg", 0.92);
      return;
    }catch(e){
      objCamStop();
      toast("Снять не вышло — открываю выбор снимка", "wait");
      objInput(true);
    }
    return file;
  };
}

/* Предпросмотр до отправки: человек видит, что снял, и доворачивает план.
   Поворот на экране — CSS-трансформация, в отправку он попадает уже
   пикселями (иначе повёрнутым его увидит только этот телефон). */
function objPreview(file){
  objFile = file; objRot = 0;
  const box = document.createElement("div");
  box.id = "objPrev";
  box.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:14px";
  box.innerHTML =
    '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:16px;max-width:460px;width:100%;font-size:15px">' +
      '<div style="font-weight:700;margin-bottom:8px">Проверьте снимок</div>' +
      '<div style="overflow:hidden;border-radius:12px;background:#000;display:flex;align-items:center;justify-content:center;min-height:180px">' +
        '<img id="objPrevImg" alt="План БТИ" style="max-width:100%;max-height:52vh;display:block;transition:transform .2s">' +
      "</div>" +
      '<div style="display:flex;gap:8px;margin-top:12px">' +
        '<button id="objRotL" style="flex:1;padding:12px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Повернуть</button>' +
        '<button id="objSend" style="flex:1;padding:12px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Загрузить</button>' +
      "</div>" +
      '<button id="objPrevNo" style="width:100%;padding:12px;border-radius:12px;border:0;background:transparent;color:#8e8e93;font-size:15px;margin-top:6px">Отмена</button>' +
    "</div>";
  document.body.appendChild(box);
  const img = box.querySelector("#objPrevImg");
  try{ img.src = URL.createObjectURL(file); }catch(e){}
  box.querySelector("#objPrevNo").onclick = () => { box.remove(); objFile = null; };
  box.querySelector("#objRotL").onclick = () => {
    objRot = (objRot + 90) % 360;
    img.style.transform = "rotate(" + objRot + "deg)";
    img.style.maxHeight = (objRot % 180 === 90) ? "38vh" : "52vh";
  };
  box.querySelector("#objSend").onclick = async () => {
    box.remove();
    const f = objFile; objFile = null;
    if(!f) return;
    let out = f;
    if(objRot % 360 !== 0){
      try{ out = await objRotate(f, objRot); }
      catch(e){ toast("Повернуть не вышло — отправляю как есть", "wait"); out = f; }
    }
    objUpload(out);
  };
}

/* Поворот пикселями: canvas меняет местами стороны на 90 и 270 градусов.
   Имя файла сохраняем — сервер кладёт снимок в чат под ним. */
function objRotate(file, deg){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try{
        const swap = (deg % 180) === 90;
        const c = document.createElement("canvas");
        c.width  = swap ? img.height : img.width;
        c.height = swap ? img.width  : img.height;
        const x = c.getContext("2d");
        x.translate(c.width / 2, c.height / 2);
        x.rotate(deg * Math.PI / 180);
        x.drawImage(img, -img.width / 2, -img.height / 2);
        c.toBlob(b => {
          if(!b){ reject(new Error("canvas пуст")); return; }
          resolve(new File([b], file.name || "plan.jpg", { type: "image/jpeg" }));
        }, "image/jpeg", 0.92);
      }catch(e){ reject(e); }
    };
    img.onerror = () => reject(new Error("снимок не открылся"));
    try{ img.src = URL.createObjectURL(file); }catch(e){ reject(e); }
  });
}

/* Загрузка документа объекта. Снимок уходит в личный чат человека с ботом
   и оттуда живёт как файл системы: своего хранилища у приложения нет,
   а копия в чате — заодно его собственный архив. */
async function objUpload(file){
  if(!file){ return; }
  if(file.size > 8 * 1024 * 1024){ toast("Снимок больше 8 МБ — сожмите", "err"); return; }
  toast("Загружаю план…", "wait");
  try{
    const fd = new FormData();
    fd.append("image", file, file.name || "plan.jpg");
    fd.append("initData", INIT);
    fd.append("key", KEY);
    fd.append("kind", "план");
    fd.append("title", "план БТИ объекта");
    const r = await fetch(API + "/upload", { method: "POST", body: fd });
    const t = (await r.text()).trim();
    let ok = false; try{ ok = !!(t && JSON.parse(t).ok); }catch(e){}
    if(!r.ok || !ok) throw new Error("Сервер не принял снимок");
    toast("План загружен");
    await load();
    objShowPlan();
  }catch(e){ toast(e.message, "err"); }

/* Построение схемы из того, что уже введено [чат 031]. Распознавать план БТИ
   картинкой мы не умеем и не обещаем: план уже прожит человеком, когда он
   вводил обмеры и смежность. По ребру графа — внутренний проём, по числу окон
   — окна на улицу, лишние двери сверх числа соседей — внешние. Тип угадывается
   числами: пока у обеих сторон осталась неизрасходованная дверь — это дверь,
   иначе проём. Заготовка не претендует на истину, она даёт что править. */
function elemPlan(){
  const rooms = roomList();
  const left = {};
  rooms.forEach(r => { left[r.code] = { d: Number(r.doors) || 0, w: Number(r.windows) || 0 }; });
  const seen = {}, out = [];
  const pairs = [];
  (D.adjacency || []).forEach(a => (a.near || []).forEach(b => {
    const k = [a.code, b].sort().join("|");
    if(seen[k]) return;
    seen[k] = 1; pairs.push(k.split("|"));
  }));
  pairs.sort((x, y) => (x[0] + x[1]).localeCompare(y[0] + y[1], "ru"));
  pairs.forEach(p => {
    const a = p[0], b = p[1];
    const la = left[a] || { d: 0 }, lb = left[b] || { d: 0 };
    const isDoor = la.d > 0 && lb.d > 0;
    if(isDoor){ la.d--; lb.d--; }
    out.push({ a: a, b: b, fact: isDoor ? "дверь" : "проём" });
  });
  rooms.forEach(r => {
    const l = left[r.code] || { d: 0, w: 0 };
    for(let i = 0; i < l.w; i++) out.push({ a: r.code, b: "улица", fact: "окно" });
    for(let i = 0; i < l.d; i++) out.push({ a: r.code, b: "подъезд", fact: "дверь" });
  });
  return out;
}

function objGoRoom(code){
  const el = document.getElementById("room_" + code);
  if(!el) return;
  /* Прокрутка — необязательная роскошь: в старом webview у элемента может не
     быть scrollIntoView вовсе (и в jsdom его нет), а подсветка нужна всегда. */

async function allocApply(total){
  const plan = allocPlan(total);
  if(!plan.ok){ toast('Нечего записывать', 'err'); return; }
  const btn = document.getElementById('allocGo');
  if(btn && btn.disabled) return;                 // замок от двойного тапа
  if(btn){ btn.disabled = true; btn.textContent = 'Записываю…'; }
  let done = 0, fail = 0;
  for(const r of plan.rows){
    try{
      await writeCell('01_Работы', r.code, 'Цена_аллокация_USD', String(r.now).replace('.', ','));
      done++;
      if(btn) btn.textContent = 'Записываю… ' + done + ' из ' + plan.rows.length;
    }catch(e){ fail++; }
  }
  try{
    await writeCell('07_Настройки', 'Договор_USD', 'Значение', String(plan.sum).replace('.', ','));
  }catch(e){ fail++; }
  closeVSheet();
  toast(fail ? ('Записано ' + done + ', с ошибкой ' + fail) : ('Сумма разнесена по ' + done + ' работам'), fail ? 'err' : 'ok');
  await load();
  render();
}

   не делается молча — эти числа уже участвуют в объёмах работ. */
function roomApplyWalls(code){

  box.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px";

      '<div style="display:flex;gap:8px">' +
        '<button id="rwNo" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
        '<button id="rwYes" style="flex:1;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Записать</button>' +
      "</div></div>";
  document.body.appendChild(box);

    try{
      await writeCell("06_Помещения", code, "Стены_м2", String(w).replace(".", ","));
      if(alsoCeil) await writeCell("06_Помещения", code, "Потолок_м2", String(ceil).replace(".", ","));
      toast("Обмеры пересчитаны");
      await load();
      render();
    }catch(e){ toast(e.message, "err"); }
  };
}

/* ══════════════════════════════════════════════════════════════
   ИЗМЕНЕНИЯ СОСТАВА РАБОТ — подвижный договор [чат 008]
   Решения чата 006: заявляют обе стороны · состав и цена согласуются
   одним действием · цена уже принятых работ замораживается.

   Договор в 07_Настройки остаётся БАЗОЙ и не переписывается. Действующая
   сумма = база + принятые изменения, считается на лету. Так у каждой
   прибавки есть автор, время и след в 11_Изменения, а перезаписанное
   число этого не даёт: по нему не восстановить, из чего оно сложилось.
   ══════════════════════════════════════════════════════════════ */
/* Дробные деньги: fmt() режет копейки, а дельта изменения обязана сходиться
   с договором до цента. usd() показывает копейки только когда они есть. */
const usd = n => {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return Math.abs(v % 1) < 0.005 ? fmt(v) : v.toLocaleString('ru-RU', { minimumFractionDigits:2, maximumFractionDigits:2 });
};
const CH_LIVE  = ['Принято', 'Применено'];        // изменения, вошедшие в договор
const CH_KINDS = ['добавить', 'убрать', 'цена', 'объём', 'срок'];

const chgAll     = () => (D.changes || []);
const chgSt      = c => String((c && c.status) || '').trim();
const chgLive    = () => chgAll().filter(c => CH_LIVE.includes(chgSt(c)));
const chgPending = () => chgAll().filter(c => chgSt(c) === 'Заявлено');
const chgMine    = () => chgPending().filter(c => String(c.by || '') === String(D.who));
const chgTheirs  = () => chgPending().filter(c => String(c.by || '') !== String(D.who));
const chgToApply = () => chgAll().filter(c => chgSt(c) === 'Принято');
const chgDone    = () => chgAll().filter(c => ['Применено', 'Оспорено'].includes(chgSt(c)));

/* Действующий договор. База — то, что лежит в 07_Настройки (заказчику приходит
   в settings, работнику — в my_money). Дельта — сумма принятых изменений. */
function dealBase(){
  const S = D.settings || {};
  return Number(S['Договор_USD'] != null ? S['Договор_USD'] : ((D.my_money || {}).contract_usd || 0)) || 0;
}
function dealDelta(){ return Math.round(chgLive().reduce((a, c) => a + (Number(c.d_usd) || 0), 0) * 100) / 100; }
function dealSum(){ return Math.round((dealBase() + dealDelta()) * 100) / 100; }
function paidSum(){
  const S = D.settings || {};
  return Number(S['Оплачено_за_работу_USD'] != null ? S['Оплачено_за_работу_USD'] : ((D.my_money || {}).received_usd || 0)) || 0;
}
function dealRest(){ return Math.round((dealSum() - paidSum()) * 100) / 100; }
function dealDaysDelta(){ return Math.round(chgLive().reduce((a, c) => a + (Number(c.d_days) || 0), 0) * 10) / 10; }
function dealNote(){
  const d = dealDelta();
  if(!d) return '';
  return 'база ' + usd(dealBase()) + ' ' + (d > 0 ? '+' : '−') + ' изменения ' + usd(Math.abs(d));
}

/* Форма заявки. Живёт вне render(), поэтому переключение вида не теряет ввод. */
let CHG = { kind:'цена', code:'', room:'', section:'', name:'', unit:'', vol:'', rate:'', price:'', days:'', comment:'' };

function chgOpen(){
  const ks = chgKindsFor();
  CHG = { kind:(ks.indexOf('цена') >= 0 ? 'цена' : ks[0]), code:'', room:'', section:'', name:'', unit:'', vol:'', rate:'', price:'', days:'', comment:'' };
  go('chgnew');
}
function chgSet(field, el){
  CHG[field] = String(el.value == null ? '' : el.value).replace(',', '.').trim();
  const box = document.getElementById('chgPreview');
  if(box) box.innerHTML = chgPreview();
}
function chgPickKind(v){ if(chgKindsFor().indexOf(v) < 0) return; CHG.kind = v; render(); }
function chgPickWork(el){ CHG.code = el.value; render(); }

function chgWork(){ return (D.works || []).find(w => w.code === CHG.code) || null; }
const workPrice = w => Number((w && w.price_alloc_usd) || 0) || 0;
const workDur   = w => Number((w && w.dur) || 0) || 0;

/* Работы, доступные для изменения: принятые заморожены решением чата 006 —
   цена «Готово» не пересматривается, изменения действуют вперёд. */
function chgOpenWorks(){
  return (D.works || []).filter(w => w.status !== 'Готово' && w.status !== 'Снято' && w.status !== 'Пропущен');
}

function chgCalc(){
  const k = CHG.kind;
  if(k === 'добавить'){
    const vol = Number(CHG.vol) || 0, rate = Number(CHG.rate) || 0;
    if(!CHG.name || !CHG.room) return null;
    const sum = Math.round(vol * rate * 100) / 100;
    return { what:'Добавить работу', was:'—',
             now:[CHG.name, CHG.room, CHG.section || 'Изменение', CHG.unit || 'компл', vol, rate].join(' | '),
             d_usd:sum, d_days:Number(CHG.days) || 0,
             human:CHG.name + ' · ' + vol + ' ' + (CHG.unit || 'компл') + ' × ' + usd(rate) + ' = ' + usd(sum) + ' USD' };
  }
  const w = chgWork();
  if(!w) return null;
  if(k === 'убрать')
    return { what:'Убрать работу', was:usd(workPrice(w)) + ' USD', now:'снято',
             d_usd:-workPrice(w), d_days:-workDur(w),
             human:'из договора уйдёт ' + usd(workPrice(w)) + ' USD и ' + workDur(w) + ' дн' };
  if(k === 'цена'){
    if(CHG.price === '') return null;
    const np = Number(CHG.price) || 0;
    return { what:'Цена работы', was:usd(workPrice(w)) + ' USD', now:usd(np) + ' USD',
             d_usd:Math.round((np - workPrice(w)) * 100) / 100, d_days:0,
             human:'было ' + usd(workPrice(w)) + ' → станет ' + usd(np) + ' USD' };
  }
  if(k === 'объём'){
    if(CHG.vol === '') return null;
    const nv = Number(CHG.vol) || 0;
    const rate = Number(w.qty) > 0 ? workPrice(w) / Number(w.qty) : 0;
    const np = Math.round(nv * rate * 100) / 100;
    return { what:'Объём работы', was:w.qty + ' ' + (w.unit || ''), now:nv + ' ' + (w.unit || ''),
             d_usd:Math.round((np - workPrice(w)) * 100) / 100, d_days:0,
             human:'по ставке ' + usd(Math.round(rate * 100) / 100) + ' за единицу цена станет ' + usd(np) + ' USD' };
  }
  if(k === 'срок'){
    if(CHG.days === '') return null;
    const nd = Number(CHG.days) || 0;
    return { what:'Длительность', was:workDur(w) + ' дн', now:nd + ' дн',
             d_usd:0, d_days:Math.round((nd - workDur(w)) * 10) / 10,
             human:'было ' + workDur(w) + ' → станет ' + nd + ' дн' };
  }
  return null;
}

function chgPreview(){
  const c = chgCalc();
  if(!c) return '<span class="k" style="opacity:.6">Заполните поля — здесь появится, что именно уйдёт на согласование.</span>';
  const sign = c.d_usd > 0 ? '+' : (c.d_usd < 0 ? '−' : '');
  return '<div class="r"><span class="k">' + esc(c.what) + '</span><span class="v">' +
         (c.d_usd ? (sign + usd(Math.abs(c.d_usd)) + ' $') : '—') + '</span></div>' +
         '<div class="r"><span class="k" style="font-size:13px;opacity:.7">' + esc(c.human) + '</span><span class="v"></span></div>' +
         (c.d_days ? ('<div class="r"><span class="k" style="font-size:13px;opacity:.7">срок: ' + (c.d_days > 0 ? '+' : '') + c.d_days + ' дн</span><span class="v"></span></div>') : '') +
         '<div class="r"><span class="k">Договор станет</span><span class="v">' + usd(dealSum() + (Number(c.d_usd) || 0)) + ' $</span></div>';
}

/* Время в поясе объекта: сервер n8n живёт не по Ташкенту (грабля чата 006),
   поэтому метку ставит панель, а не сервер. */
function chgStamp(){
  const d = new Date(Date.now() + (5 * 60 + new Date().getTimezoneOffset()) * 60000);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

async function chgSubmit(){
  const c = chgCalc();
  if(!c){ toast('Заполните поля заявки', 'err'); return; }
  if(CHG.kind !== 'добавить' && !CHG.code){ toast('Выберите работу', 'err'); return; }
  if(!c.d_usd && !c.d_days){ toast('Изменение ничего не меняет', 'err'); return; }

  // код строки для новой работы: продолжаем нумерацию помещения
  let code = CHG.code;
  if(CHG.kind === 'добавить'){
    const room = (D.rooms || []).find(r => r.name === CHG.room);
    const pref = room ? room.code : 'NEW';
    const used = (D.works || []).filter(w => String(w.code || '').indexOf(pref + '-') === 0)
      .map(w => parseInt(String(w.code).split('-')[1], 10) || 0);
    code = pref + '-' + String((used.length ? Math.max.apply(null, used) : 0) + 1).padStart(2, '0');
  }

  const row = {
    'id': 'CH-' + Date.now().toString(36).toUpperCase(),
    'Время': chgStamp(),
    'Инициатор': D.who,
    'Вид': CHG.kind,
    'Код_работы': code,
    'Что_меняем': c.what,
    'Было': c.was,
    'Стало': c.now,
    'Дельта_USD': c.d_usd || 0,
    'Дельта_дней': c.d_days || 0,
    'Статус': 'Заявлено',
    'Решил': '',
    'Комментарий': CHG.comment || '',
  };
  toast('Отправляю на согласование…', 'wait');
  try{
    const r = await fetch(API + '/append', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ initData:INIT, key:KEY, sheet:'11_Изменения', rows:[row] })
    });
    const t = (await r.text()).trim();
    if(!r.ok || !t) throw new Error('Не удалось отправить заявку');
    toast('Заявлено — ждёт ответа второй стороны');
    await load();
    back();
  }catch(e){ toast(e.message, 'err'); }
}

/* Принятие = согласие. Применение к смете идёт следом, если у принимающего
   есть права на запись договорных полей; иначе заявка ждёт заказчика. */
async function chgAccept(id){
  const c = chgAll().find(x => String(x.id) === String(id));
  if(!c) return;
  if(String(c.by || '') === String(D.who)){ toast('Свою заявку принимает вторая сторона', 'err'); return; }
  try{
    await writeCell('11_Изменения', c.id, 'Статус', 'Принято');
    await writeCell('11_Изменения', c.id, 'Решил', D.who);
    /* Часы применяет принявшая сторона независимо от роли: право писать
       «Время» в «Табеле» есть у обеих, а ждать заказчика бессмысленно —
       он же и мог быть заявителем [чат 027]. */
    if(['admin', 'owner'].includes(D.role) || String(c.kind || '').trim() === TMC_KIND){
      await chgApply(id, true);
    }else{
      toast('Принято — заказчик применит к смете');
      await load();
    }
  }catch(e){ toast(e.message, 'err'); }
}

async function chgDispute(id){

  try{
    await writeCell('11_Изменения', c.id, 'Статус', 'Оспорено');
    await writeCell('11_Изменения', c.id, 'Решил', D.who);

/* Применение принятой заявки к 01_Работы. Цена считается от дельты, а не
   разбором текста: дельта — то, что стороны согласовали, и именно она
   должна сойтись с договором. */
async function chgApply(id, quiet){
  const c = chgAll().find(x => String(x.id) === String(id));
  if(!c) return;
  const k = String(c.kind || '').trim();
  const w = (D.works || []).find(x => x.code === c.code);
  try{
    if(k === 'добавить'){
      const p = String(c.now || '').split('|').map(x => x.trim());
      const vol = Number(p[4]) || 0, rate = Number(p[5]) || 0;
      const r = await fetch(API + '/append', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ initData:INIT, key:KEY, sheet:'01_Работы', rows:[{
          'Код': c.code, 'Помещение': p[1] || '', 'Раздел': p[2] || 'Изменение', 'Работа': p[0] || '',
          'Ед': p[3] || '', 'Объём': vol, 'Ставка_USD': rate || '',
          'Категория': 'Изменение',
          'Цена_аллокация_USD': Math.round(vol * rate * 100) / 100,
          'Статус': 'Не начато', 'Готовность_%': 0,
          'Длительность_дней': (Number(c.d_days) > 0 ? Number(c.d_days) : ''),
          'Источник': 'изменение ' + c.id, 'Зависит_от': '—',
        }] })
      });
      const t = (await r.text()).trim();
      if(!r.ok || !t) throw new Error('Не удалось добавить работу в смету');
    }else if(k === 'убрать'){
      await writeCell('01_Работы', c.code, 'Статус', 'Снято');
    }else if(k === 'цена'){
      if(!w) throw new Error('Работа ' + c.code + ' не найдена');
      await writeCell('01_Работы', c.code, 'Цена_аллокация_USD', Math.round((workPrice(w) + (Number(c.d_usd) || 0)) * 100) / 100);
    }else if(k === 'объём'){
      if(!w) throw new Error('Работа ' + c.code + ' не найдена');
      await writeCell('01_Работы', c.code, 'Объём', parseFloat(String(c.now)) || 0);
      await writeCell('01_Работы', c.code, 'Цена_аллокация_USD', Math.round((workPrice(w) + (Number(c.d_usd) || 0)) * 100) / 100);
    }else if(k === TMC_KIND){
      /* Время правится в том же листе, где живёт отметка. Статус её не трогаем:
         она уже решена, меняется только время — а прежнее остаётся следом в
         комментарии, чтобы через месяц спор был с чем сверить (та же логика,
         что у отчётов бригады: слова работника остаются в «Значение»). */
      const t = tmcRow(c.code);
      const nt = String(c.now || '').trim();
      if(!/^\d{2}:\d{2}$/.test(nt)) throw new Error('Время правки испорчено: ' + nt);
      await crewCell('Табель', c.code, 'Время', nt);
      const note = (t && t.comment ? String(t.comment) + ' · ' : '') +
        'время ' + String(c.was || '') + ' → ' + nt + ' по заявке ' + c.id + ' (решил ' + D.who + ')';
      await crewCell('Табель', c.code, 'Комментарий', note);
      if(t){ t.time = nt; t.comment = note; }
    }else if(k === 'срок'){
      if(!w) throw new Error('Работа ' + c.code + ' не найдена');
      await writeCell('01_Работы', c.code, 'Длительность_дней', parseFloat(String(c.now)) || 0);
    }
    await writeCell('11_Изменения', c.id, 'Статус', 'Применено');
    toast(k === TMC_KIND ? 'Правка принята — время в табеле изменено' : (quiet ? 'Принято и внесено в смету' : 'Внесено в смету'));
    await load();
    if(k === TMC_KIND) await crewLoad();
  }catch(e){
    toast('Принято, но применить не удалось: ' + e.message, 'err');
    await load();
  }
}


/* ══════════════════════════════════════════════════════════════
   ВЫБОРОЧНАЯ СКИДКА — этап C2 [чат 019]
   Скидка на отдельные работы — не новая сущность в данных, а ПАКЕТ
   заявок вида «цена» с общим маркером [PK-…] в начале комментария:
   у каждой работы своя строка в 11_Изменения (свой след «было → стало»),
   а панель показывает их одной карточкой и решает одним нажатием.
   Договор считается прежним способом — база + Σ дельт принятых заявок,
   поэтому скидка автоматически видна в «Финансах» и на главном экране.
   Два режима: процентом и «итоговой суммой за выбранное» (пропорционально,
   с добором остатка в последнюю строку — итог обязан сойтись до цента).
   ══════════════════════════════════════════════════════════════ */
const DSC_MAX = 40;   /* больше строк за пакет — принятие становится слишком долгим */
let DSC = { mode:'pct', pct:'', sum:'', pick:{}, comment:'' };
let DSC_BUSY = false;   /* замок от повторного входа: двойной тап = второй круг [грабля 012] */

/* Скидку на договорные цены предлагает та сторона, которой сервер отдаёт
   разнесение (price_alloc_usd) — то есть заказчик. */
const dscCan = () => ['admin','owner'].includes(D.role);
const dscRoomName = w => String((w && w.room) || '—').split(' (')[0];
const dscNum = s => Number(String(s == null ? '' : s).replace(/[^0-9,.\-]/g, '').replace(',', '.')) || 0;

function dscOpen(){
  DSC = { mode:'pct', pct:'', sum:'', pick:{}, comment:'' };
  go('discount');
}
function dscWorks(){ return chgOpenWorks().filter(w => workPrice(w) > 0); }
function dscPicked(){ return dscWorks().filter(w => DSC.pick[w.code]); }
function dscToggle(code){
  if(DSC.pick[code]) delete DSC.pick[code]; else DSC.pick[code] = 1;
  dscRefresh();
}
function dscRoomPick(room, on){
  dscWorks().filter(w => dscRoomName(w) === room).forEach(w => {
    if(on) DSC.pick[w.code] = 1; else delete DSC.pick[w.code];
  });
  render();
}
function dscSet(field, el){
  DSC[field] = String(el.value == null ? '' : el.value).replace(',', '.').trim();
  dscRefresh();
}
function dscMode(m){ DSC.mode = m; render(); }
function dscRefresh(){
  const box = document.getElementById('dscPrev');
  if(box) box.innerHTML = dscPreview();
  const cnt = document.getElementById('dscCnt');
  if(cnt) cnt.textContent = dscPicked().length;
}

/* Расчёт пакета. В режиме «процентом» каждая работа дешевеет ровно на процент —
   так подпись не врёт ни на одной строке; общий итог складывается из строк.
   В режиме «итоговой суммой» распределение пропорционально текущим ценам,
   а копейки округления добираются последней строкой, чтобы сумма была ровно
   заданной: иначе договор разошёлся бы с суммой работ. */
function dscCalc(){
  const list = dscPicked();
  if(!list.length) return null;
  const base = Math.round(list.reduce((s, w) => s + workPrice(w), 0) * 100) / 100;
  if(!(base > 0)) return null;
  const rows = [];
  if(DSC.mode === 'pct'){
    const p = Number(DSC.pct);
    if(!(p > 0)) return null;
    if(p >= 100) return { err:'Скидка 100 % — это уже не скидка, а снятие работ (вид «убрать»)' };
    list.forEach(w => {
      const was = workPrice(w);
      const now = Math.round(was * (100 - p)) / 100;
      rows.push({ code:w.code, name:w.name, room:dscRoomName(w), was:was, now:now, d:Math.round((now - was) * 100) / 100 });
    });
  }else{
    const t = Number(DSC.sum);
    if(!(t > 0)) return null;
    if(t >= base) return { err:'Итог не ниже текущей суммы — это повышение цены, его заявляют видом «цена»' };
    let acc = 0;
    list.forEach((w, i) => {
      const was = workPrice(w);
      let now;
      if(i === list.length - 1){ now = Math.round((t - acc) * 100) / 100; }
      else { now = Math.round(t * was / base * 100) / 100; acc = Math.round((acc + now) * 100) / 100; }
      rows.push({ code:w.code, name:w.name, room:dscRoomName(w), was:was, now:now, d:Math.round((now - was) * 100) / 100 });
    });
  }
  const bad = rows.find(r => !(r.now > 0));
  if(bad) return { err:'Слишком мало: на «' + bad.name + '» не остаётся цены — такие работы снимают видом «убрать»' };
  const target = Math.round(rows.reduce((s, r) => s + r.now, 0) * 100) / 100;
  const cut = Math.round((base - target) * 100) / 100;
  if(!(cut > 0)) return { err:'Скидка нулевая — договор не изменится' };
  return { rows:rows, base:base, target:target, cut:cut, pct:Math.round(cut / base * 1000) / 10 };
}

function dscPreview(){
  const c = dscCalc();
  if(!c) return '<span class="k" style="opacity:.6">Отметьте работы и задайте скидку — здесь появится, что именно уйдёт на согласование.</span>';
  if(c.err) return '<span class="k" style="color:var(--bad)">' + esc(c.err) + '</span>';
  const lines = c.rows.slice(0, 6).map(r =>
    '<div class="r"><span class="k" style="font-size:13px;opacity:.75">' + esc(r.name) + ' · ' + esc(r.room) + '</span>' +
    '<span class="v" style="font-size:13px">' + usd(r.was) + ' → ' + usd(r.now) + '</span></div>').join('');
  const more = c.rows.length > 6
    ? '<div class="r"><span class="k" style="font-size:13px;opacity:.55">и ещё ' + (c.rows.length - 6) + '…</span><span class="v"></span></div>' : '';
  return '<div class="r"><span class="k">Работ в пакете</span><span class="v">' + c.rows.length + '</span></div>' +
    '<div class="r"><span class="k">Было</span><span class="v">' + usd(c.base) + ' $</span></div>' +
    '<div class="r"><span class="k">Станет</span><span class="v">' + usd(c.target) + ' $</span></div>' +
    '<div class="r"><span class="k">Скидка</span><span class="v" style="color:var(--ok)">−' + usd(c.cut) + ' $ · ' + c.pct + ' %</span></div>' +
    '<div class="r"><span class="k">Договор станет</span><span class="v">' + usd(Math.round((dealSum() - c.cut) * 100) / 100) + ' $</span></div>' +
    lines + more;
}

/* Отправка пакета — один запрос /append на все строки: заявка либо ушла целиком,
   либо не ушла вовсе. Частично заявленная скидка не имела бы смысла. */
async function dscSubmit(){
  if(!dscCan()){ toast('Скидку на договорные цены предлагает заказчик', 'err'); return; }
  const c = dscCalc();
  if(!c){ toast('Отметьте работы и задайте скидку', 'err'); return; }
  if(c.err){ toast(c.err, 'err'); return; }
  if(c.rows.length > DSC_MAX){ toast('За один раз не больше ' + DSC_MAX + ' работ', 'err'); return; }
  if(DSC_BUSY) return;
  DSC_BUSY = true;
  const pk = 'PK-' + Date.now().toString(36).toUpperCase();
  const head = DSC.mode === 'pct'
    ? ('скидка ' + c.pct + ' % на ' + c.rows.length + ' работ')
    : ('итог ' + usd(c.target) + ' $ за ' + c.rows.length + ' работ');
  const stamp = chgStamp();
  const rows = c.rows.map((r, i) => ({
    'id': 'CH-' + pk.slice(3) + '-' + String(i + 1).padStart(2, '0'),
    'Время': stamp,
    'Инициатор': D.who,
    'Вид': 'цена',
    'Код_работы': r.code,
    'Что_меняем': 'Цена работы',
    'Было': usd(r.was) + ' USD',
    'Стало': usd(r.now) + ' USD',
    'Дельта_USD': r.d,
    'Дельта_дней': 0,
    'Статус': 'Заявлено',
    'Решил': '',
    'Комментарий': '[' + pk + '] ' + head + (DSC.comment ? (' · ' + DSC.comment) : ''),
  }));
  toast('Отправляю пакет на согласование…', 'wait');
  try{
    const r = await fetch(API + '/append', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ initData:INIT, key:KEY, sheet:'11_Изменения', rows:rows })
    });
    const t = (await r.text()).trim();
    if(!r.ok || !t) throw new Error('Не удалось отправить пакет');
    toast('Скидка заявлена — ' + rows.length + ' работ ждут ответа второй стороны');
    await load();
    back();
  }catch(e){ toast(e.message, 'err'); }
  finally{ DSC_BUSY = false; }
}

/* ── Пакеты в списке изменений ───────────────────────────────── */

const dscPk = c => { const m = String((c && c.comment) || '').match(/^\[(PK-[A-Z0-9]+)\]/); return m ? m[1] : ''; };
function dscGroup(list){
  const packs = {}, single = [], order = [];
  (list || []).forEach(c => {
    const p = dscPk(c);
    if(p){ if(!packs[p]){ packs[p] = []; order.push(p); } packs[p].push(c); }
    else single.push(c);
  });
  return { packs:packs, order:order, single:single };
}
function dscPackSum(list){
  const was = Math.round(list.reduce((s, c) => s + dscNum(c.was), 0) * 100) / 100;
  const cut = Math.round(list.reduce((s, c) => s + (Number(c.d_usd) || 0), 0) * 100) / 100;
  return { was:was, cut:cut, now:Math.round((was + cut) * 100) / 100 };
}
function dscActs(c, mode){
  const bt = 'flex:1;padding:12px;border:0;border-radius:10px;color:#fff;font-weight:600;font-size:15px';
  /* Точка отсчёта решается своими функциями: у неё вместе со статусом пишется
     время фиксации, иначе черта осталась бы без даты. [чат 019] */
  const isRef = String(c.kind || '').trim() === REF_KIND;
  if(mode === 'theirs') return '<div class="row" style="gap:8px;margin-top:10px">' +
    '<button style="' + bt + ';background:var(--ok)" onclick="' + (isRef ? 'refAccept' : 'chgAccept') + '(\'' + esc(c.id) + '\')">' + (isRef ? 'Подтвердить' : 'Принять') + '</button>' +
    '<button style="' + bt + ';background:var(--bad)" onclick="' + (isRef ? 'refDispute' : 'chgDispute') + '(\'' + esc(c.id) + '\')">Оспорить</button></div>';
  if(mode === 'mine') return '<div class="m" style="color:var(--warn);margin-top:6px">⏳ Ждёт ответа второй стороны</div>';
  if(mode === 'apply') return '<div class="row" style="margin-top:10px">' +
    '<button style="' + bt + ';background:#0a84ff" onclick="chgApply(\'' + esc(c.id) + '\')">' +
      (String(c.kind || '').trim() === TMC_KIND ? 'Внести в табель' : 'Внести в смету') + '</button></div>';
  return '';
}
function dscPackCard(pk, list, mode){
  const first = list[0] || {};
  const head = String(first.comment || '').replace(/^\[[^\]]*\]\s*/, '') || 'скидка пакетом';
  const s = dscPackSum(list);
  const bt = 'flex:1;padding:12px;border:0;border-radius:10px;color:#fff;font-weight:600;font-size:15px';
  const items = list.map(c => {
    const w = (D.works || []).find(x => x.code === c.code);
    return '<div class="m" style="opacity:.75">' + esc(w ? w.name : c.code) + ' · ' +
      esc(String(c.was || '')) + ' → ' + esc(String(c.now || '')) +
      (mode === 'done' ? (' · ' + esc(chgSt(c))) : '') + '</div>';
  }).join('');
  let acts = '';
  if(mode === 'theirs') acts = '<div class="row" style="gap:8px;margin-top:10px">' +
    '<button style="' + bt + ';background:var(--ok)" onclick="dscPackDecide(\'' + esc(pk) + '\',\'accept\')">Принять пакет</button>' +
    '<button style="' + bt + ';background:var(--bad)" onclick="dscPackDecide(\'' + esc(pk) + '\',\'dispute\')">Оспорить пакет</button></div>';
  if(mode === 'mine') acts = '<div class="m" style="color:var(--warn);margin-top:6px">⏳ Ждёт ответа второй стороны</div>';
  if(mode === 'apply') acts = '<div class="row" style="margin-top:10px">' +
    '<button style="' + bt + ';background:#0a84ff" onclick="dscPackApply(\'' + esc(pk) + '\')">Внести пакет в смету</button></div>';
  return '<div class="work">' +
    '<div class="t">Скидка · ' + esc(head) + '</div>' +
    '<div class="m">' + esc(pk) + ' · заявил ' + esc(first.by || '') + ' · ' + esc(first.at || '') + '</div>' +
    '<div class="m">было: ' + usd(s.was) + ' $ → станет: ' + usd(s.now) + ' $</div>' +
    '<div class="m" style="color:var(--ok)">−' + usd(Math.abs(s.cut)) + ' $ к договору · работ: ' + list.length + '</div>' +
    items + acts + '</div>';
}
function dscList(list, mode, card){
  const g = dscGroup(list);
  const packs = g.order.map(pk => dscPackCard(pk, g.packs[pk], mode)).join('');
  const single = g.single.map(c => card(c, dscActs(c, mode))).join('');
  return packs + single;
}

/* Решение по пакету — построчно, с прогрессом: /update правит одну ячейку за
   запрос, а замок не даёт запустить второй круг по тем же строкам (грабля 012). */
async function dscRun(title, items, fn){
  if(DSC_BUSY){ toast('Дождитесь окончания предыдущего действия', 'err'); return; }
  DSC_BUSY = true;
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px;color:#fff;font-size:16px';
  box.innerHTML = '<div style="background:#1c1c1e;border-radius:16px;padding:20px;min-width:240px;text-align:center">' + esc(title) +
    '<div id="dscN" style="opacity:.7;font-size:14px;margin-top:8px">0 из ' + items.length + '</div></div>';
  document.body.appendChild(box);
  let ok = 0, fail = 0, last = '';
  for(const it of items){
    try{ await fn(it); ok++; }
    catch(e){ fail++; last = e.message || String(e); }
    const el = box.querySelector('#dscN');
    if(el) el.textContent = (ok + fail) + ' из ' + items.length;
  }
  box.remove();
  DSC_BUSY = false;
  await load();
  toast(fail ? ('Прошло ' + ok + ', не удалось ' + fail + (last ? (' — ' + last) : '')) : ('Готово: ' + ok + ' из ' + items.length), fail ? 'err' : 'ok');
}

/* Применение одной принятой заявки цены — без тостов и перезагрузки:
   в пакете это делается в цикле, а данные перечитываются один раз в конце. */
async function chgApplyOne(c){
  const w = (D.works || []).find(x => x.code === c.code);
  if(!w) throw new Error('Работа ' + c.code + ' не найдена');
  await writeCell('01_Работы', c.code, 'Цена_аллокация_USD', Math.round((workPrice(w) + (Number(c.d_usd) || 0)) * 100) / 100);
  await writeCell('11_Изменения', c.id, 'Статус', 'Применено');
}

async function dscPackDecide(pk, how){
  const list = chgPending().filter(c => dscPk(c) === pk);
  if(!list.length){ toast('Пакет уже решён', 'err'); return; }
  if(String(list[0].by || '') === String(D.who)){ toast('Свой пакет принимает вторая сторона', 'err'); return; }
  const accept = how === 'accept';
  const mine = dscCan();
  await dscRun(accept ? 'Принимаю пакет…' : 'Оспариваю пакет…', list, async c => {
    await writeCell('11_Изменения', c.id, 'Статус', accept ? 'Принято' : 'Оспорено');
    await writeCell('11_Изменения', c.id, 'Решил', D.who);
    if(accept && mine) await chgApplyOne(c);
  });
}

async function dscPackApply(pk){
  const list = chgToApply().filter(c => dscPk(c) === pk);
  if(!list.length){ toast('Нечего вносить', 'err'); return; }
  if(!dscCan()){ toast('В смету вносит заказчик', 'err'); return; }
  await dscRun('Вношу пакет в смету…', list, async c => { await chgApplyOne(c); });
}

/* Виды заявок — по факту прихода цены, а не по роли. В 019 бригадиру не отдавали
   разнесение (price_alloc_usd), и виды, дельту которых без него не посчитать, ему
   не показывались: заявка ушла бы с дельтой от нуля и раздула бы договор. С чата 022
   сервер отдаёт цену работы и бригадиру — своя цена есть знание исполнителя, а не наш
   секрет, — поэтому условие переехало с роли на наличие поля: пришла цена — виды открыты,
   не пришла (старый сервер, урезанный контур) — прежняя защита остаётся в силе. */
const CH_KINDS_NO_ALLOC = ['добавить', 'срок'];
const hasAlloc = () => (D && Array.isArray(D.works)) && D.works.some(w => w.price_alloc_usd !== undefined && w.price_alloc_usd !== null);
const chgKindsFor = () => (hasAlloc() ? CH_KINDS : CH_KINDS_NO_ALLOC);
function chgKindsNote(){

/* ══════════════════════════════════════════════════════════════
   СТАРТОВЫЕ ОСТАТКИ МАТЕРИАЛОВ — этап C3 [чат 019]
   На встрече пара вводит материалы по памяти. Человек помнит не историю
   закупа, а то, что лежит на объекте, поэтому основной режим — «остаток
   по факту»: он пишется в колонку «Остаток», и сервер считает её главнее
   вычитания «куплено − ушло» (маяк §7: принимается по факту остатков,
   без анализа процесса и адекватности расходов). Второй режим — «куплено
   и ушло» — для тех строк, где память полная.
   Записи уходят одним /append: строка либо появилась целиком, либо нет.
   ══════════════════════════════════════════════════════════════ */
const MAT_MAX = 60;
const MAT_UNITS = ['мешок','шт','м','м2','м3','л','кг','лист','рулон','упак','компл'];
const matRow = () => ({ name:'', unit:'', rest:'', in:'', out:'', price:'', who:'' });
let MAT = { mode:'rest', rows:[matRow()] };
let MAT_BUSY = false;

/* Материалы правит тот, кому сервер разрешает запись в 03_Материалы:
   заказчик, владелец и бригадир. У рядового работника своего экрана нет. */
const matCanEdit = () => ['admin','owner','foreman'].includes(D.kind) || ['admin','owner','foreman'].includes(D.role);
const matNorm = s => String(s == null ? '' : s).trim().toLowerCase();
const matNumOk = v => v !== '' && v != null && Number(v) >= 0 && !isNaN(Number(v));

function matOpen(){ MAT = { mode:'rest', rows:[matRow()] }; go('matnew'); }
function matMode(m){ MAT.mode = m; render(); }
function matAdd(){ if(MAT.rows.length < MAT_MAX){ MAT.rows.push(matRow()); render(); } else toast('Больше ' + MAT_MAX + ' строк за раз не берём', 'err'); }
function matDel(i){ MAT.rows.splice(i, 1); if(!MAT.rows.length) MAT.rows.push(matRow()); render(); }
function matSet(i, field, el){
  MAT.rows[i][field] = String(el.value == null ? '' : el.value).replace(',', '.').trim();
  const box = document.getElementById('matPrev');
  if(box) box.innerHTML = matPreview();
}

/* Разбор введённого. Дубль имени — не мелочь: правки материалов ищут строку
   по названию, и второй «Ротбанд» сделал бы правку неоднозначной. */
function matCalc(){
  const have = (D.materials || []).map(m => matNorm(m.name));
  const seen = {}, rows = [], bad = [];
  MAT.rows.forEach((r, i) => {
    const nm = String(r.name || '').trim();
    if(!nm && !r.rest && !r.in && !r.out) return;            /* пустая строка — просто пропуск */
    if(!nm){ bad.push({ i:i, why:'без названия' }); return; }
    const key = matNorm(nm);
    if(have.includes(key)){ bad.push({ i:i, why:'такой материал уже есть в списке' }); return; }
    if(seen[key]){ bad.push({ i:i, why:'повторяется в этой же форме' }); return; }
    seen[key] = 1;
    if(MAT.mode === 'rest'){
      if(!matNumOk(r.rest)){ bad.push({ i:i, why:'не указан остаток' }); return; }
    }else{
      if(!matNumOk(r.in)){ bad.push({ i:i, why:'не указано «куплено»' }); return; }
      if(r.out !== '' && !matNumOk(r.out)){ bad.push({ i:i, why:'«ушло» не число' }); return; }
    }
    if(r.price !== '' && !matNumOk(r.price)){ bad.push({ i:i, why:'цена не число' }); return; }
    rows.push({
      name: nm, unit: String(r.unit || '').trim(), who: String(r.who || '').trim(),
      rest: MAT.mode === 'rest' ? Number(r.rest) : null,
      in:   MAT.mode === 'rest' ? null : Number(r.in),
      out:  MAT.mode === 'rest' ? null : (r.out === '' ? null : Number(r.out)),
      price: r.price === '' ? null : Number(r.price),
    });
  });
  const rate = Number((D.settings || {})['Курс_сум_за_USD']) || 0;
  const sumUzs = Math.round(rows.reduce((s, r) => {
    const qty = MAT.mode === 'rest' ? r.rest : r.in;
    return s + ((r.price != null && qty != null) ? r.price * qty : 0);
  }, 0));
  return { rows:rows, bad:bad, sumUzs:sumUzs, sumUsd: rate > 0 ? Math.round(sumUzs / rate * 100) / 100 : null };
}

function matPreview(){
  const c = matCalc();
  const bad = c.bad.map(b => '<div class="r"><span class="k" style="font-size:13px;color:var(--bad)">строка ' + (b.i + 1) + ': ' + esc(b.why) + '</span><span class="v"></span></div>').join('');
  if(!c.rows.length) return (bad || '<span class="k" style="opacity:.6">Впишите материалы — здесь появится, что уйдёт в таблицу.</span>');
  return '<div class="r"><span class="k">Строк к записи</span><span class="v">' + c.rows.length + '</span></div>' +
    (c.sumUzs ? ('<div class="r"><span class="k">Закуп на сумму</span><span class="v">' + fmt(c.sumUzs) + ' сум' + (c.sumUsd ? (' ≈ ' + usd(c.sumUsd) + ' $') : '') + '</span></div>') : '') +
    c.rows.slice(0, 8).map(r => '<div class="r"><span class="k" style="font-size:13px;opacity:.75">' + esc(r.name) + '</span><span class="v" style="font-size:13px">' +
      (MAT.mode === 'rest' ? ('остаток ' + r.rest) : ('куплено ' + r.in + (r.out != null ? (' · ушло ' + r.out) : ''))) + ' ' + esc(r.unit) + '</span></div>').join('') +
    bad;
}

async function matSubmit(){
  if(!matCanEdit()){ toast('Материалы вводит заказчик или бригадир', 'err'); return; }
  const c = matCalc();
  if(!c.rows.length){ toast(c.bad.length ? 'Поправьте отмеченные строки' : 'Нечего записывать', 'err'); return; }
  if(MAT_BUSY) return;
  MAT_BUSY = true;
  const src = 'старт по памяти · ' + D.who + ' · ' + chgStamp().slice(0, 10);
  const rows = c.rows.map(r => {
    const o = { 'Материал': r.name, 'Ед': r.unit, 'Источник': src };
    if(r.who) o['Кто_купил'] = r.who;
    if(r.price != null) o['Цена_за_ед_сум'] = r.price;
    if(MAT.mode === 'rest'){
      o['Остаток'] = r.rest;                                  /* закуп неизвестен — врать «куплено» нельзя */
    }else{
      o['Куплено'] = r.in;
      if(r.out != null) o['Израсходовано'] = r.out;
      if(r.price != null) o['Сумма_сум'] = Math.round(r.price * r.in);
    }
    return o;
  });
  toast('Записываю материалы…', 'wait');
  try{
    const r = await fetch(API + '/append', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ initData:INIT, key:KEY, sheet:'03_Материалы', rows:rows })
    });
    const t = (await r.text()).trim();
    if(!r.ok || !t) throw new Error('Не удалось записать материалы');
    toast('Записано материалов: ' + rows.length);
    await load();
    back();
  }catch(e){ toast(e.message, 'err'); }
  finally{ MAT_BUSY = false; }
}

/* Правка остатка у существующей строки: пишем именно «Остаток» — это и есть
   «принято по факту», а история закупа остаётся как была. */
async function matRest(name, el){
  const v = String(el.value == null ? '' : el.value).replace(',', '.').trim();
  if(v !== '' && !matNumOk(v)){ toast('Остаток — число или пусто', 'err'); return; }
  await upd('03_Материалы', name, 'Остаток', v);
}


/* ══════════════════════════════════════════════════════════════
   ТОЧКА ОТСЧЁТА — этап C4 [чат 019]
   «Все предложения приняты второй стороной, и это стало точкой отсчёта»
   (маяк §7). Отдельной сущности в данных не заводим: точка отсчёта — это
   предложение, принятое второй стороной, а механизм для этого уже есть —
   заявка в 11_Изменения. Заявка вида «точка» несёт снимок стартового
   состояния (работы, договор, срок, материалы, бригада) в поле «Стало»
   машинно-читаемой строкой и нулевые дельты: она ничего не меняет в деньгах,
   она фиксирует черту. Дата фиксации дописывается в комментарий при принятии —
   так у черты есть автор, время и след, как у любого другого согласования.
   ══════════════════════════════════════════════════════════════ */
const REF_KIND = 'точка';
let REF_BUSY = false;

const refIsClient = () => ['admin','owner'].includes(D.role);

/* Разнесение суммы договора по работам [чат 029].
   Вес работы — её нынешняя цена: при сборке сметы панель проставляет
   объём × ставку справочника, и это и есть структура сметы. Приведение к
   названной сумме сохраняет пропорции и меняет только масштаб — ровно то,
   что происходит на встрече, когда пара договаривается «за всё столько-то».
   Работы без цены в дележе не участвуют: делить между «16 м²» и «3 шт»
   нечего, и выдумывать им вес — значит назначить цену наугад. */
function allocPlan(total){
  const sum = Math.round((Number(total) || 0) * 100) / 100;
  const live = (D.works || []).filter(w => w.code && w.status !== 'Снято' && w.status !== 'Пропущен');
  const priced = live.filter(w => (Number(w.price_alloc_usd) || 0) > 0);
  const nopr = live.filter(w => !((Number(w.price_alloc_usd) || 0) > 0));
  const base = Math.round(priced.reduce((s, w) => s + Number(w.price_alloc_usd), 0) * 100) / 100;
  if(!(sum > 0) || !priced.length || !(base > 0)) return { ok: false, sum, base, priced: [], nopr, k: 0 };
  const k = sum / base;
  const rows = priced.map(w => ({
    code: w.code, name: w.name, room: w.room,
    was: Math.round(Number(w.price_alloc_usd) * 100) / 100,
    now: Math.round(Number(w.price_alloc_usd) * k * 100) / 100,
  }));
  /* Копейки округления добираются последней строкой: сумма работ обязана
     совпасть с договором до цента, иначе экран денег начнёт спорить сам с собой. */
  const got = Math.round(rows.reduce((s, r) => s + r.now, 0) * 100) / 100;
  const tail = Math.round((sum - got) * 100) / 100;
  if(tail !== 0 && rows.length) rows[rows.length - 1].now = Math.round((rows[rows.length - 1].now + tail) * 100) / 100;
  return { ok: true, sum, base, k, rows, nopr, tail };
}

/* Снимок текущего состояния: то, что стороны фиксируют как стартовое. */
function refSnap(){
  const works = (D.works || []).filter(w => w.code && w.status !== 'Снято' && w.status !== 'Пропущен');
  const tm = timeCalc();
  const mats = (D.materials || []);
  const crew = Number((D.settings || {})['Рабочих_в_бригаде']);
  return {
    works: works.length,
    alloc: Math.round(works.reduce((s, w) => s + (Number(w.price_alloc_usd) || 0), 0) * 100) / 100,
    deal: dealSum(),
    days: tm.real,
    mat: mats.length,
    have: mats.filter(m => (m.rest ?? 0) > 0).length,
    crew: crew > 0 ? crew : null,
  };
}
const refPack = s => ['works=' + s.works, 'deal=' + s.deal, 'days=' + s.days,
                      'mat=' + s.mat, 'have=' + s.have, 'crew=' + (s.crew == null ? '' : s.crew)].join(';');
function refParse(str){
  const o = {};
  String(str == null ? '' : str).split(';').forEach(p => { const i = p.indexOf('='); if(i > 0) o[p.slice(0, i).trim()] = p.slice(i + 1).trim(); });
  return o;
}
const refHuman = s => s.works + ' работ · ' + usd(s.deal) + ' $ · ' + s.days + ' дн · ' +
  s.mat + ' материалов' + (s.crew ? (' · ' + s.crew + ' чел') : ' · бригада не задана');

const refAll     = () => chgAll().filter(c => String(c.kind || '').trim() === REF_KIND);
const refPending = () => refAll().find(c => chgSt(c) === 'Заявлено') || null;
function refLive(){
  const l = refAll().filter(c => CH_LIVE.includes(chgSt(c)));
  return l.length ? l[l.length - 1] : null;
}
const refFixedAt = c => { const m = String((c && c.comment) || '').match(/зафиксировано\s+(\d{4}-\d{2}-\d{2}\s\d{2}:\d{2})/); return m ? m[1] : ''; };

/* Что изменилось с момента фиксации. Сравниваем машинную часть снимка,
   а не человеческую подпись: подпись — для чтения, снимок — для сверки. */
function refDiff(){
  const live = refLive();
  if(!live) return null;
  const then = refParse(live.now), now = refSnap();
  const num = v => (v === '' || v == null) ? null : Number(v);
  const rows = [
    { k:'Работ',       was:num(then.works), now:now.works, dec:0 },
    { k:'Договор, $',  was:num(then.deal),  now:now.deal,  dec:2 },
    { k:'Срок, дн',    was:num(then.days),  now:now.days,  dec:1 },
    { k:'Материалов',  was:num(then.mat),   now:now.mat,   dec:0 },
    { k:'Рабочих',     was:num(then.crew),  now:now.crew,  dec:0 },
  ].map(r => Object.assign(r, { same: (r.was == null && r.now == null) || Number(r.was) === Number(r.now) }));
  return { live:live, at:refFixedAt(live), rows:rows, changed:rows.filter(r => !r.same).length };
}

function spreadPrices(onlyEmpty){
  const inp = document.getElementById('spSum');
  const sum = Number(String(inp ? inp.value : '').replace(',', '.'));
  if (!(sum > 0)) { toast('Введите сумму больше нуля', 'err'); return; }
  const targets = (D.works || []).filter(w => onlyEmpty ? !(Number(w.price_contractor_usd) > 0) : true);
  const base = targets.reduce((s, w) => s + (Number(w.price_alloc_usd) || 0), 0);
  if (!(base > 0)) { toast('Не от чего считать пропорцию', 'err'); return; }
  const list = targets.map(w => ({ code: w.code, name: w.name,
    value: Math.round(sum * (Number(w.price_alloc_usd) || 0) / base * 100) / 100 })).filter(x => x.value > 0);
  const total = list.reduce((s, x) => s + x.value, 0);
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px';
  box.innerHTML =
    '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;font-size:15px">' +
      '<div style="font-weight:700;margin-bottom:8px">Разнести ' + fmt(sum) + ' USD</div>' +
      '<div style="opacity:.7;font-size:14px;margin-bottom:12px">Пропорционально договорной цене работ.<br>Позиций: <b>' + list.length + '</b>, сумма после округления: <b>' + fmt(total) + ' USD</b><br>' +
      (onlyEmpty ? 'Затрагиваются только работы без цены.' : 'Перезапишутся все цены, включая заданные.') + '</div>' +
      '<div style="display:flex;gap:8px">' +
        '<button id="spNo" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
        '<button id="spYes" style="flex:1;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Записать</button>' +
      '</div></div>';
  document.body.appendChild(box);
  box.querySelector('#spNo').onclick = () => box.remove();
  box.querySelector('#spYes').onclick = () => { box.remove(); applyPrices(list); };
}

/* Сторона приёмки — по контуру, а не по сырой роли листа [чат 048].
   Исполнитель (hand, foreman) заявляет «Готово» → «Заявлено» (ждёт заказчика)
   и видит на приёмке «На приёмке у работника»; заказчик (admin, owner) —
   зеркально. До правки foreman жил по ветке заказчика: не видел заявок
   заказчика вовсе, а его «Готово» уходило «работнику». Вскрыто живым
   проходом двумя ролями; у hand и worker поведение не меняется. */
const crewSide = () => D.kind === "hand" || D.kind === "foreman";

async function upd(sheet, code, field, value, opts){
  // Работник не пишет «Готово» напрямую (ни голосом, ни вручную):
  // любое его «Готово» становится ЗАЯВКОЙ на приёмку заказчику.
  const claimed = (!(opts&&opts.confirm) && field === "Статус" && value === "Готово");
  /* Мягкая проверка зависимостей: если предшественник ещё не принят —
     спрашиваем, но не запрещаем (карта связей черновая).            */
  if (claimed && sheet === "01_Работы" && !(opts && opts.skipDeps)) {
    const _w = (D.works || []).find(x => x.code === code);
    const _b = depBlockers(_w);
    if (_b.length) {
      const _go = await depAsk(_w, _b);
      if (!_go) { toast("Отменено", "err"); return false; }
    }
  }
  if(claimed) value = crewSide() ? "Заявлено" : "На приёмке у работника";
  toast(claimed ? "Отправляю на приёмку…" : "Сохраняю…", "wait");
  try{
    const r = await fetch(`${API}/update`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: INIT, key: KEY, sheet, code, field, value })
    });
    /* При отказе сервер отдаёт пустой ответ с кодом 200 (n8n throw → пустое тело).
       Поэтому «успех» = ok И непустое тело; пустое тело трактуем как отказ.      */
    const t = (await r.text()).trim();
    if(!r.ok || !t){
      throw new Error(t.includes("403") ? "Это поле только для чтения" : "Не удалось сохранить");
    }
    patch(sheet, code, field, value);
    /* [чат 107] «Готово» и 100 % — одно состояние, и оно должно доехать до сервера.
       Правило «статус Готово ⇒ готовность 100» жило только в patch(), то есть в памяти
       страницы: в базе пять принятых работ стояли с нулём, общий прогресс врал вниз,
       а карточка показывала «Готово, % = 0» сразу после перезагрузки. Здесь значение
       value уже переписано на заявку для исполнителя, поэтому «Готово» в этой точке
       означает ровно подтверждённую приёмку. Досыл идёт тем же /update; если он не
       прошёл — перечитываем правду сервера, чтобы расхождение не осталось невидимым. */
    if(sheet === "01_Работы" && field === "Статус" && value === "Готово"){
      try{
        const rp = await fetch(`${API}/update`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: INIT, key: KEY, sheet, code, field: "Готовность_%", value: 100 })
        });
        const tp = (await rp.text()).trim();
        if(!rp.ok || !tp) load(); else patch(sheet, code, "Готовность_%", 100);
      }catch(e){ load(); }
    }
    tg?.HapticFeedback?.notificationOccurred("success");
    toast(claimed ? (crewSide() ? "Заявлено — ждёт приёмки заказчиком" : "Отправлено работнику на подтверждение") : "Сохранено");
    return true;
  }catch(e){
    tg?.HapticFeedback?.notificationOccurred("error");
    toast(e.message, "bad");
    load();                                   // откатить экран к правде сервера
    return false;
  }
}

/* локально отразить правку — чтобы прогресс и суммы пересчитались сразу */
function patch(sheet, code, field, value){
  if(sheet === "01_Работы"){
    const w = D.works.find(x => x.code === code);
    if(!w) return;
    if(field === "Статус")        w.status   = value;
    if(field === "Готовность_%")  w.progress = Number(value) || 0;
    if(field === "Цена_Юрия_USD") w.price_contractor_usd = value === "" ? null : Number(value);
    if(field === "Цена_аллокация_USD") w.price_alloc_usd = value === "" ? null : Number(value);
    if(field === "Комментарий")   w.comment  = value;
    if(w.status === "Готово") w.progress = 100;
  }
  if(sheet === "03_Материалы"){
    const m = D.materials.find(x => x.name === code);
    if(!m) return;
    if(field === "Куплено")       m.in  = Number(value) || 0;
    if(field === "Израсходовано") m.out = Number(value) || 0;
    m.rest = (m.in || 0) - (m.out || 0);
  }
}

   старого пути.

   Регистр кода. Старый код — 8 знаков из алфавита без похожих символов
   (A-Z, 2-9), новый — 10 знаков hex в НИЖНЕМ регистре (gen_random_uuid).
   Сервер ищет код точным сравнением, поэтому toUpperCase, стоявший на входе,

const INV_T    = { app: "в приложение", object: "на объект", crew: "в бригаду" };

/* Тексты отказов по служебному коду. Сервер ставит код в КОНЕЦ сообщения
   в скобках — начало сообщения принадлежит n8n (находка 076).            */
const INV_MSG = {
  400: "Код приглашения не разобран — проверьте, что он скопирован целиком.",
  401: "Панель не узнала вас — откройте её через бота в Telegram.",
  403: "Отозвать приглашение может тот, кто его выписал, или владелец объекта.",
  404: "Такого приглашения нет. Возможно, ссылка старая — попросите новую.",
  409: "На этом объекте у вас уже другая роль. Сменить её может только владелец.",
  410: "Приглашение больше не действует: истёк срок, оно отозвано или уже использовано.",
  422: "Приглашение выписано неверно — проверьте тип, срок и число погашений.",
};

let INV_NEW  = null;    // null — не проверяли · true — ветки на проде · false — ещё нет
let INVS     = null;    // список приглашений (экран «Приглашения»)
let INV_LOAD = false, INV_ACT = "", INV_ASK = "";
const INV_F  = { type: "app", role: "hand", purpose: "", invitee: "", hours: "24", max: "1" };

function invClean(t){
  return String(t == null ? "" : t)
    .replace(/\s*\[line \d+\]\s*$/, "")     // хвост n8n, человеку он ничего не говорит
    .replace(/\s*\(\d{3}\)\s*$/, "")        // служебный код отказа
    .trim();
}
function invCodeOf(t, st){
  /* Порядок обязателен: n8n дописывает «[line N]» ПОСЛЕ служебного кода,
     поэтому сначала снимается хвост, и только потом ищется «(NNN)» в конце.
     Искать код сразу — значит не найти его ни разу в реальном ответе ветки
     (поймано стендом 083, тест 2).                                        */
  const s = String(t == null ? "" : t).replace(/\s*\[line \d+\]\s*$/, "");
  const m = /\((\d{3})\)\s*$/.exec(s);
  return m ? Number(m[1]) : (Number(st) || 0);
}

/* Один вход ко всем четырём веткам. Возвращает либо ответ сервера,
   либо {absent:true} (ветки ещё нет), либо {error, code}.               */
async function invApi(path, body){
  let r, txt;
  try{
    r = await fetch(API + path, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ initData: INIT, key: KEY }, body || {})) });
    txt = (await r.text()).trim();
  }catch(e){ return { error: "Нет связи с сервером — попробуйте ещё раз.", code: 0, net: true }; }
  let j = null; try{ j = JSON.parse(txt); }catch(e){}
  /* «Ветки ещё нет» опознаётся по НЕ-JSON ответу, а не по коду 404 [чат 097 —
     тот же дефект, что вылечен в objsrvLoad 096.2]. Этот n8n на незарегистрированный
     webhook отвечает 500 и HTML-страницей «not registered»: проверено живым запросом
     в 096 и на реальном пути, и на контрольном несуществующем. По прежнему условию
     INV_NEW = false не выставился бы никогда — у первой невыложенной ветки человек
     видел бы отказ вместо честного «серверная часть ещё не выкачена», а старый путь
     /register не включился бы. Отказ САМОЙ ветки приходит телом JSON со своим кодом
     и доходит до человека по-прежнему; 401/403 фолбэком не лечатся (см. ниже). */
  if(!j && (!r.ok || r.status === 404)){ INV_NEW = false; return { absent: true }; }
  INV_NEW = true;
  if(!r.ok || !j || j.ok !== true){
    const raw  = (j && (j.error || j.message)) ? String(j.error || j.message) : ("сервер ответил " + r.status);
    const code = invCodeOf(raw, r.status);
    return { error: INV_MSG[code] || invClean(raw) || "Не получилось — попробуйте ещё раз.", code: code };
  }
  return j;
}

/* Отзыв — в два тапа, без модального окна: в Telegram WebView диалог
   браузера выглядит чужеродно, а промах по кнопке стоит доступа.       */
function invAsk(code){ INV_ASK = (INV_ASK === code) ? "" : code; render(); }
async function invRevoke(code){

let CREW_ADD_BUSY = false;
let INV_LAST = null;               // последнее выписанное приглашение — показывается в карточке

/* Создание приглашения. Код приходит ОТВЕТОМ СЕРВЕРА: клиентский код нельзя
   ни отозвать, ни ограничить сроком, поэтому invGen остаётся только на время
   переходного периода — пока ветки приглашений не выкачены (см. блок выше).
   Типы «на объект» и «в бригаду» требуют идентификаторов, которых панель
   сегодня не получает: /data не отдаёт ни object_id, ни crew_id. Это названо
   предусловием E5, а не обойдено угадыванием — выписать приглашение «куда-то»
   хуже, чем честно сказать, что дверь ещё не открыта.                      */
async function crewAdd(){
  const name  = String((document.getElementById("cw_name")  || {}).value || "").trim();
  const phone = String((document.getElementById("cw_phone") || {}).value || "").trim();
  const type  = String(INV_F.type || "app");
  if(CREW_ADD_BUSY) return;

  if(INV_NEW !== false){
    const body = { type: type, purpose: String(INV_F.purpose || "").trim(),
                   invitee: name, hours: String(INV_F.hours || "24"), max_uses: String(INV_F.max || "1") };
    if(type === "object"){
      const oid = String((D && D.object_id) || "");
      if(!oid){ toast("Сервер пока не сообщает панели, какой это объект — приглашение на объект недоступно", "err"); return; }
      body.object_id = oid; body.role = String(INV_F.role || "hand");
    }
    if(type === "crew"){
      const cid = String((D && D.crew_id) || "");
      if(!cid){ toast("Бригада ещё не заведена как запись — приглашение в бригаду недоступно", "err"); return; }
      body.crew_id = cid;
    }
    CREW_ADD_BUSY = true;
    try{
      toast("Создаю приглашение…", "wait");
      const j = await invApi("/invite", body);
      if(!j.absent){
        if(j.error){ toast(j.error, "err"); return; }
        INV_LAST = { code: j.code, type: j.type || type, expires_h: j.expires_h, max_uses: j.max_uses, invitee: name };
        INVS = null;                                   // список устарел — перечитается при заходе
        toast("Приглашение создано");
        render();
        return;
      }
    }catch(e){ toast("Не удалось создать приглашение", "err"); return; }
    finally{ CREW_ADD_BUSY = false; }
  }

  /* ── Переходный путь: сервер ещё не знает о приглашениях ─────────────
     Работает ровно один случай из трёх — работник в бригаду строкой листа. */
  if(type !== "app" && type !== "crew"){
    toast("Пока сервер не обновлён, доступно только приглашение работника", "err"); return;
  }
  if(!name){ toast("Введите имя работника", "err"); return; }
  if(((CREW_DATA || {}).workers || []).some(w => String(w.name || "").trim().toLowerCase() === name.toLowerCase())){
    toast("Такое имя уже есть в бригаде", "err"); return;
  }
  CREW_ADD_BUSY = true;
  try{
    toast("Создаю приглашение…", "wait");
    const code = invGen();
    await crewAppend("Работники", [{
      "Бригадир": D.who, "Имя": name, "Телефон": phone,
      "Статус": "приглашён", "Добавлен": chgStamp(), "Код_приглашения": code,
    }]);
    toast("Приглашение создано");
    await openCrewScreen("crew");
  }catch(e){ toast("Не удалось создать приглашение", "err"); }
  finally{ CREW_ADD_BUSY = false; }
}
