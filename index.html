<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ремонт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:   var(--tg-theme-bg-color, #17212b);
  --sec:  var(--tg-theme-secondary-bg-color, #232e3c);
  --txt:  var(--tg-theme-text-color, #ffffff);
  --hint: var(--tg-theme-hint-color, #7d8b99);
  --btn:  var(--tg-theme-button-color, #5288c1);
  --btxt: var(--tg-theme-button-text-color, #ffffff);
  --ok:#4dcd5e; --warn:#f5a623; --bad:#e5484d; --link:#6ab3f3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  padding:14px 14px 40px;overscroll-behavior-y:contain}

.hello{font-size:19px;font-weight:600}
.sub{font-size:12px;color:var(--hint);margin-bottom:14px}

.stat{background:var(--sec);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.stat .r{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;gap:10px}
.stat .k{font-size:13px;color:var(--hint)}
.stat .v{font-size:16px;font-weight:600;white-space:nowrap}
.stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)} .stat .v.bad{color:var(--bad)}
.bar{height:6px;background:rgba(125,139,153,.25);border-radius:3px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .4s}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sec);border:none;border-radius:14px;padding:18px 10px;color:var(--txt);
  cursor:pointer;text-align:center;font:inherit;transition:transform .1s}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:27px;display:block;margin-bottom:6px}
.tile .nm{font-size:13px;font-weight:600;line-height:1.25}
.tile .h{font-size:11px;color:var(--hint);margin-top:3px}
.tile.pri{background:var(--btn);color:var(--btxt)}
.tile.pri .h{opacity:.85;color:inherit}

.card{background:var(--sec);border-radius:12px;padding:14px;margin-bottom:10px}
.card .lbl{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;gap:10px;
  border-bottom:1px solid rgba(125,139,153,.16)}
.li:last-child{border:none}
.li .n{font-size:14px;flex:1;min-width:0}
.li .d{font-size:11px;color:var(--hint);margin-top:2px}
.li .v{font-size:14px;font-weight:600;white-space:nowrap}

select,input{background:var(--bg);border:1px solid rgba(125,139,153,.3);color:var(--txt);
  padding:8px 10px;border-radius:9px;font:inherit;font-size:14px;width:100%}
input[type=number]{text-align:center}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row label{font-size:12px;color:var(--hint);flex:0 0 96px}

.filt{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt button{background:var(--sec);border:none;color:var(--hint);padding:7px 13px;border-radius:20px;
  font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.filt button.on{background:var(--btn);color:var(--btxt)}

.work{background:var(--sec);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.work.done{opacity:.55}
.work .t{font-size:14px;font-weight:500;line-height:1.3}
.work .m{font-size:11px;color:var(--hint);margin-top:3px}

.warnbox{background:rgba(245,166,35,.13);border:1px solid rgba(245,166,35,.32);border-radius:12px;
  padding:13px;margin-bottom:12px;font-size:14px;line-height:1.5}
.warnbox b{color:var(--warn)}
.mainbtn{width:100%;background:var(--btn);color:var(--btxt);border:none;border-radius:11px;
  padding:13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:11px}

.load{text-align:center;padding:70px 20px;color:var(--hint)}
.err{background:rgba(229,72,77,.13);border:1px solid rgba(229,72,77,.4);border-radius:12px;
  padding:15px;font-size:14px;line-height:1.55}
.toast{position:fixed;left:14px;right:14px;bottom:18px;background:var(--ok);color:#06240c;
  padding:12px;border-radius:11px;text-align:center;font-weight:600;font-size:14px;
  opacity:0;transform:translateY(12px);transition:.22s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
.toast.bad{background:var(--bad);color:#fff}
.toast.wait{background:var(--sec);color:var(--hint)}

/* ── ГОЛОСОВОЙ ВВОД: модальное окно, индикатор, результат ── */
.vmask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
  justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:.2s}
.vmask.on{opacity:1;pointer-events:auto}
.vsheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(20px);transition:.24s}
.vmask.on .vsheet{transform:none}
.vsheet .vh{font-size:17px;font-weight:600;margin-bottom:4px}
.vsheet .vs{font-size:12px;color:var(--hint);margin-bottom:14px}

.vrec{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 6px}
.vmic{width:84px;height:84px;border-radius:50%;background:var(--btn);display:flex;align-items:center;
  justify-content:center;font-size:38px}
.vmic.rec{animation:pulse 1.2s ease-out infinite;background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}100%{box-shadow:0 0 0 26px rgba(229,72,77,0)}}
.vtime{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.vwave{display:flex;gap:3px;align-items:center;height:20px}
.vwave i{width:3px;background:var(--hint);border-radius:2px;animation:wv 1s ease-in-out infinite}
.vwave i:nth-child(2){animation-delay:.15s}.vwave i:nth-child(3){animation-delay:.3s}
.vwave i:nth-child(4){animation-delay:.45s}.vwave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:6px}50%{height:20px}}

.vrow{display:flex;gap:10px;margin-top:16px}
.vrow button{flex:1;border:none;border-radius:11px;padding:13px;font:inherit;font-size:15px;
  font-weight:600;cursor:pointer}
.vbtn-ok{background:var(--btn);color:var(--btxt)}
.vbtn-cancel{background:var(--sec);color:var(--txt)}
.vbtn-bad{background:var(--bad);color:#fff}

.vitem{display:flex;gap:11px;align-items:flex-start;background:var(--sec);border-radius:11px;
  padding:12px;margin-bottom:8px;cursor:pointer}
.vitem .vchk{width:22px;height:22px;border-radius:6px;border:2px solid var(--hint);flex:0 0 22px;
  margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.vitem.sel .vchk{background:var(--ok);border-color:var(--ok)}
.vitem .vt{font-size:14px;font-weight:500;line-height:1.3}
.vitem .vd{font-size:12px;color:var(--hint);margin-top:2px}
.vitem .vv{font-size:13px;margin-top:3px}
.vitem .vv b{color:var(--ok)}
.vquote{background:var(--sec);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--hint);
  margin-bottom:12px;line-height:1.45}
.vquote b{color:var(--txt);font-weight:500}
.vspin{width:34px;height:34px;border:3px solid rgba(125,139,153,.3);border-top-color:var(--btn);
  border-radius:50%;animation:spin .8s linear infinite;margin:8px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app"><div class="load">Загружаю…</div></div>
<div class="toast" id="toast"></div>

<!-- Модальное окно голосового ввода -->
<div class="vmask" id="vmask"><div class="vsheet" id="vsheet"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Адрес n8n. Уже прописан — менять не надо.
   ═══════════════════════════════════════════════════════════════ */
const API = "https://n8n.nc-lab.uz/webhook/remont";

/* Идентификация — по ЛИЧНОСТИ из Telegram (initData), а не по ключу в ссылке.
   Сервер проверяет подпись Telegram его публичным ключом (токен бота не нужен)
   и определяет роль по Telegram-ID из листа 09_Доступы. Подменить роль с клиента
   или подставить чужой ключ нельзя. KEY оставлен запасным входом на переходный
   период и для отладки в обычном браузере (вне Telegram initData недоступен).   */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const INIT = (tg && tg.initData) || "";                              // подписанные данные Telegram
const KEY  = new URLSearchParams(location.search).get("key") || "";  // legacy / отладка вне Telegram

let D = null;                       // данные с сервера
let stack = ["home"];               // стек навигации
let fRoom = "";                     // активный фильтр по комнате
let hideDone = false;               // глобальный фильтр «скрыть готовое»
const app = document.getElementById("app");
const fmt = n => (Number(n) || 0).toLocaleString("ru-RU", { maximumFractionDigits: 0 });

/* Бот пишет в таблицу произвольные названия материалов. Одна кавычка в имени
   сломала бы разметку — поэтому всё, что пришло с сервера, экранируем.        */
const esc  = t => String(t ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const attr = t => esc(t);

/* ── ЗАГРУЗКА ─────────────────────────────────────────────── */
async function load(){
  try{
    const auth = INIT ? `initData=${encodeURIComponent(INIT)}`
                      : `key=${encodeURIComponent(KEY)}`;
    const r = await fetch(`${API}/data?${auth}`, { cache: "no-store" });
    const BAD = "Доступ не подтверждён — откройте панель через бота в Telegram.";
    if(r.status === 401 || r.status === 403) throw new Error(BAD);
    if(!r.ok) throw new Error("Сервер не отвечает (HTTP " + r.status + ")");
    /* При неверном ключе n8n обрывает цепочку и отдаёт пустое тело с кодом 200.
       Данные не утекают, но и JSON не приходит — трактуем это как отказ в доступе. */
    const raw = (await r.text()).trim();
    if(!raw) throw new Error(BAD);
    try{ D = JSON.parse(raw); }catch{ throw new Error(BAD); }
    if(!D || !D.role) throw new Error(BAD);
    render();
    _sig = _snapshot(D);            // калибровка живого обновления
  }catch(e){
    app.innerHTML = `<div class="err"><b>Не удалось загрузить.</b><br>${e.message}
      <br><br><span style="color:var(--hint);font-size:13px">Проверьте интернет и откройте ещё раз.</span></div>`;
  }
}

/* ── ЗАПИСЬ ───────────────────────────────────────────────────
   Не перечитываем всё после каждой правки — правим локально.
   Иначе на 102 работах экран моргает и уезжает наверх.        */
/* ═══ Зависимости работ · мягкое предупреждение ═══════════════════════
   Предшественники берутся из колонки «Зависит_от» листа 01_Работы
   (приходит в поле deps). Зависимость снята, когда предшественник
   «Готово» или «Снято». Предупреждение НЕ блокирует: карта связей
   черновая, и ошибка в ней не должна стопорить реальную работу.     */
function depCodes(w){
  const raw = String((w && w.deps) || "").trim();
  if (!raw || raw === "—" || raw === "-") return [];
  return raw.split(",").map(s => s.trim()).filter(Boolean);
}
function depBlockers(w){
  if (!D || !D.works || !w) return [];
  return depCodes(w)
    .map(c => D.works.find(x => x.code === c))
    .filter(p => p && p.status !== "Готово" && p.status !== "Снято");
}
function depAsk(w, blockers){
  return new Promise(resolve => {
    const rows = blockers.map(b =>
      '<div style="margin:8px 0;padding:8px 10px;background:rgba(255,255,255,.07);border-radius:10px">' +
      '<b>' + esc(b.name) + '</b><br><span style="opacity:.65;font-size:13px">' +
      esc(String(b.room || "").split(" (")[0]) + ' · ' + esc(b.status) + '</span></div>').join("");
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px";
    box.innerHTML =
      '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:80vh;overflow:auto;font-size:15px">' +
        '<div style="font-weight:700;margin-bottom:8px">⚠ Предыдущее ещё не принято</div>' +
        '<div style="opacity:.7;font-size:14px;margin-bottom:6px">«' + esc(w.name) + '» обычно делается после того, как принято:</div>' +
        rows +
        '<div style="opacity:.6;font-size:13px;margin:10px 0 14px">Это подсказка, а не запрет. Если на объекте порядок другой — продолжайте.</div>' +
        '<div style="display:flex;gap:8px">' +
          '<button id="depNo" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
          '<button id="depYes" style="flex:1;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Всё равно заявить</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(box);
    box.querySelector("#depNo").onclick  = () => { box.remove(); resolve(false); };
    box.querySelector("#depYes").onclick = () => { box.remove(); resolve(true);  };
  });
}

/* Баланс от приёмки: сколько из выданного аванса уже отработано принятыми
   работами. null — если считать не из чего (нет ни оплат, ни приёмки).  */
function advCalc(field){
  const acc  = accSum(field);
  const S2   = D.settings || {};
  const paid = Number(S2["Оплачено_за_работу_USD"] ?? (D.my_money && D.my_money.received_usd) ?? 0);
  if (!paid && !acc) return null;
  if (!paid)        return { k:"Принято работ",             main: fmt(acc) + " $",
                             sub:"Оплат пока не поступало", pct:0, color:"var(--ok)" };
  if (acc < paid)   return { k:"Отработано аванса",         main: fmt(acc) + " из " + fmt(paid) + " $",
                             sub:"Осталось отработать " + fmt(paid - acc) + " $",
                             pct: Math.max(1, Math.round(acc / paid * 100)), color:"var(--warn)" };
  if (acc === paid) return { k:"Аванс отработан полностью", main: fmt(paid) + " $",
                             sub:"Расчёты сошлись", pct:100, color:"var(--ok)" };
  return              { k:"Аванс отработан, к доплате",     main: fmt(acc - paid) + " $",
                        sub:"Принято на " + fmt(acc) + " $ при оплаченных " + fmt(paid) + " $",
                        pct:100, color:"var(--ok)" };
}

/* ═══ Цены Юрия: подсказка, разнесение, пакетная запись ═══════════════
   Пока колонка «Цена_Юрия_USD» пуста, работник не видит своей витрины
   приёмки. Панель показывает, сколько позиций осталось, принимает ставку
   голосом и умеет разнести общую сумму пропорционально договору.      */
function priceStats(){
  const all = (D.works || []);
  const set = all.filter(w => Number(w.price_contractor_usd) > 0);
  return { all: all.length, set: set.length, empty: all.length - set.length,
           sumSet: set.reduce((s,w) => s + Number(w.price_contractor_usd), 0) };
}
async function writeCell(sheet, code, field, value){
  const r = await fetch(API + '/update', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData: INIT, key: KEY, sheet: sheet, code: code, field: field, value: value })
  });
  const txt = (await r.text()).trim();
  if (!r.ok || !txt) throw new Error('Не удалось сохранить ' + code);
  patch(sheet, code, field, value);
  return true;
}
async function applyPrices(list){
  if (!list.length) { toast('Нечего записывать', 'err'); return; }
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px;color:#fff;font-size:16px';
  box.innerHTML = '<div style="background:#1c1c1e;border-radius:16px;padding:20px;min-width:240px;text-align:center">Записываю цены…<div id="prN" style="opacity:.7;font-size:14px;margin-top:8px">0 из ' + list.length + '</div></div>';
  document.body.appendChild(box);
  let ok = 0, fail = 0;
  for (const it of list) {
    try { await writeCell('01_Работы', it.code, 'Цена_Юрия_USD', String(it.value)); ok++; }
    catch (e) { fail++; }
    const el = box.querySelector('#prN'); if (el) el.textContent = (ok + fail) + ' из ' + list.length;
  }
  box.remove();
  toast(fail ? ('Записано ' + ok + ', не удалось ' + fail) : ('Записано цен: ' + ok), fail ? 'err' : 'ok');
  render();
}
function spreadPrices(onlyEmpty){
  const inp = document.getElementById('spSum');
  const sum = Number(String(inp ? inp.value : '').replace(',', '.'));
  if (!(sum > 0)) { toast('Введите сумму больше нуля', 'err'); return; }
  const targets = (D.works || []).filter(w => onlyEmpty ? !(Number(w.price_contractor_usd) > 0) : true);
  const base = targets.reduce((s, w) => s + (Number(w.price_alloc_usd) || 0), 0);
  if (!(base > 0)) { toast('Не от чего считать пропорцию', 'err'); return; }
  const list = targets.map(w => ({ code: w.code, name: w.name,
    value: Math.round(sum * (Number(w.price_alloc_usd) || 0) / base * 100) / 100 })).filter(x => x.value > 0);
  const total = list.reduce((s, x) => s + x.value, 0);
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px';
  box.innerHTML =
    '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;font-size:15px">' +
      '<div style="font-weight:700;margin-bottom:8px">Разнести ' + fmt(sum) + ' USD</div>' +
      '<div style="opacity:.7;font-size:14px;margin-bottom:12px">Пропорционально договорной цене работ.<br>Позиций: <b>' + list.length + '</b>, сумма после округления: <b>' + fmt(total) + ' USD</b><br>' +
      (onlyEmpty ? 'Затрагиваются только работы без цены.' : 'Перезапишутся все цены, включая заданные.') + '</div>' +
      '<div style="display:flex;gap:8px">' +
        '<button id="spNo" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
        '<button id="spYes" style="flex:1;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Записать</button>' +
      '</div></div>';
  document.body.appendChild(box);
  box.querySelector('#spNo').onclick = () => box.remove();
  box.querySelector('#spYes').onclick = () => { box.remove(); applyPrices(list); };
}

async function upd(sheet, code, field, value, opts){
  // Работник не пишет «Готово» напрямую (ни голосом, ни вручную):
  // любое его «Готово» становится ЗАЯВКОЙ на приёмку заказчику.
  const claimed = (!(opts&&opts.confirm) && field === "Статус" && value === "Готово");
  /* Мягкая проверка зависимостей: если предшественник ещё не принят —
     спрашиваем, но не запрещаем (карта связей черновая).            */
  if (claimed && sheet === "01_Работы" && !(opts && opts.skipDeps)) {
    const _w = (D.works || []).find(x => x.code === code);
    const _b = depBlockers(_w);
    if (_b.length) {
      const _go = await depAsk(_w, _b);
      if (!_go) { toast("Отменено", "err"); return false; }
    }
  }
  if(claimed) value = (D.role === "worker") ? "Заявлено" : "На приёмке у работника";
  toast(claimed ? "Отправляю на приёмку…" : "Сохраняю…", "wait");
  try{
    const r = await fetch(`${API}/update`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: INIT, key: KEY, sheet, code, field, value })
    });
    /* При отказе сервер отдаёт пустой ответ с кодом 200 (n8n throw → пустое тело).
       Поэтому «успех» = ok И непустое тело; пустое тело трактуем как отказ.      */
    const t = (await r.text()).trim();
    if(!r.ok || !t){
      throw new Error(t.includes("403") ? "Это поле только для чтения" : "Не удалось сохранить");
    }
    patch(sheet, code, field, value);
    tg?.HapticFeedback?.notificationOccurred("success");
    toast(claimed ? (D.role === "worker" ? "Заявлено — ждёт приёмки заказчиком" : "Отправлено работнику на подтверждение") : "Сохранено");
    return true;
  }catch(e){
    tg?.HapticFeedback?.notificationOccurred("error");
    toast(e.message, "bad");
    load();                                   // откатить экран к правде сервера
    return false;
  }
}

/* локально отразить правку — чтобы прогресс и суммы пересчитались сразу */
function patch(sheet, code, field, value){
  if(sheet === "01_Работы"){
    const w = D.works.find(x => x.code === code);
    if(!w) return;
    if(field === "Статус")        w.status   = value;
    if(field === "Готовность_%")  w.progress = Number(value) || 0;
    if(field === "Цена_Юрия_USD") w.price_contractor_usd = value === "" ? null : Number(value);
    if(field === "Комментарий")   w.comment  = value;
    if(w.status === "Готово") w.progress = 100;
  }
  if(sheet === "03_Материалы"){
    const m = D.materials.find(x => x.name === code);
    if(!m) return;
    if(field === "Куплено")       m.in  = Number(value) || 0;
    if(field === "Израсходовано") m.out = Number(value) || 0;
    m.rest = (m.in || 0) - (m.out || 0);
  }
}

let tt;

async function disputeWork(code){ if(await upd("01_Работы", code, "Статус", "Оспорено")) render(); }

function toast(msg, kind){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast on" + (kind ? " " + kind : "");
  clearTimeout(tt);
  if(kind !== "wait") tt = setTimeout(() => t.className = "toast", 1900);
}

/* ── НАВИГАЦИЯ (стек, ровно один уровень вглубь) ───────────── */
function go(k){ stack.push(k); render(true); }
function back(){ if(stack.length > 1){ stack.pop(); render(true); } }

function render(toTop){
  const k = stack[stack.length - 1];
  app.innerHTML = (SCREENS[k] || SCREENS.home)();
  if(toTop) window.scrollTo(0, 0);
  if(tg){
    if(stack.length > 1){ tg.BackButton.show(); tg.BackButton.onClick(back); }
    else tg.BackButton.hide();
  }
}

const progress = () => D.works.length
  ? D.works.reduce((s,w) => s + (w.progress || 0), 0) / D.works.length : 0;

/* Деньги от приёмки. «Принято» — только статус «Готово» (подтверждено заказчиком).
   «В работе» — незавершённые, пропорционально проценту готовности (справочно).
   Поле: заказчику — договорная разнесённая цена, работнику — его цена. */
const accSum = f => D.works.filter(w => w.status === "Готово")
  .reduce((s,w) => s + (Number(w[f]) || 0), 0);
const wipSum = f => D.works.filter(w => w.status !== "Готово" && (w.progress || 0) > 0)
  .reduce((s,w) => s + (Number(w[f]) || 0) * (w.progress || 0) / 100, 0);

};   /* ── конец SCREENS ───────────────────────────────────────── */

/* ══════════════════════════════════════════════════════════════
   ГОЛОСОВОЙ ВВОД — запись прямо в приложении, разбор на сервере.
   Ничего не уходит в ленту бота: запись, распознавание и
   подтверждение живут во встроенном окне.
   Контракт сервера POST {API}/voice  (FormData: audio, initData|key):
     ответ { ok:true, recognized:"…", items:[ {sheet,code,name,room,
             field,field_label,value,value_label} ] }
     items.length === 0  → ничего внятного не распознано (выбраковка)
     items.length === 1  → одно подтверждение
     items.length  >  1  → мультивыбор «N из M»
   ══════════════════════════════════════════════════════════════ */
let mediaRec = null, chunks = [], vTimer = null, vSec = 0, vStream = null, vItems = [];
const vmask  = document.getElementById("vmask");
const vsheet = document.getElementById("vsheet");

function openVSheet(html){ vsheet.innerHTML = html; vmask.classList.add("on"); }
function closeVSheet(){ vmask.classList.remove("on"); }

async function startVoice(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined"){
    toast("Запись голоса недоступна в этом клиенте", "bad"); return;
  }
  try{
    vStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    openVSheet(`
      <div class="vh">Нужен доступ к микрофону</div>
      <div class="vs">Разрешите приложению запись, чтобы диктовать правки.</div>
      <div class="vrow"><button class="vbtn-cancel" onclick="closeVSheet()">Закрыть</button></div>`);
    return;
  }
  chunks = [];
  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
             : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm"
             : MediaRecorder.isTypeSupported("audio/ogg;codecs=opus") ? "audio/ogg;codecs=opus" : "";
  try{
    mediaRec = new MediaRecorder(vStream, mime ? { mimeType: mime } : undefined);
  }catch(e){ mediaRec = new MediaRecorder(vStream); }
  mediaRec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  mediaRec.onstop = onRecStop;
  mediaRec._send = false;
  mediaRec.start();
  vSec = 0;
  renderRecUI();
  vTimer = setInterval(() => { vSec++; const t = document.getElementById("vtime"); if(t) t.textContent = fmtTime(vSec); }, 1000);
}

function renderRecUI(){
  openVSheet(`
    <div class="vh">Говорите</div>
    <div class="vs">Например: «покраска потолка в спальне готова» или «куплено 5 мешков цемента»</div>
    <div class="vrec">
      <div class="vmic rec">🎙️</div>
      <div class="vtime" id="vtime">0:00</div>
      <div class="vwave"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="vrow">
      <button class="vbtn-cancel" onclick="stopVoice(false)">Отмена</button>
      <button class="vbtn-ok" onclick="stopVoice(true)">Готово</button>
    </div>`);
}

function stopVoice(send){
  if(vTimer){ clearInterval(vTimer); vTimer = null; }
  if(mediaRec && mediaRec.state !== "inactive"){ mediaRec._send = send; mediaRec.stop(); }
  if(vStream){ vStream.getTracks().forEach(t => t.stop()); vStream = null; }
  if(!send) closeVSheet();
}

async function onRecStop(){
  if(!mediaRec._send){ return; }
  const blob = new Blob(chunks, { type: (chunks[0] && chunks[0].type) || "audio/webm" });
  if(!blob.size){ showVError("Не расслышал — попробуйте ещё раз."); return; }
  openVSheet(`<div class="vh">Распознаю…</div><div class="vspin"></div>
    <div class="vs" style="text-align:center">Отправляю запись на разбор</div>`);
  try{
    const fd = new FormData();
    fd.append("audio", blob, "voice.webm");
    fd.append("initData", INIT);
    fd.append("key", KEY);                       // legacy / отладка вне Telegram
    const r = await fetch(`${API}/voice`, { method: "POST", body: fd });
    const raw = (await r.text()).trim();
    if(r.status === 401 || r.status === 403) throw new Error("Доступ не подтверждён.");
    if(!raw) throw new Error("Не удалось разобрать запись. Попробуйте ещё раз.");
    let d; try{ d = JSON.parse(raw); }catch{ throw new Error("Сервер вернул неожиданный ответ."); }
    showVResult(d);
  }catch(e){ showVError(e.message); }
}

function showVError(msg){
  tg?.HapticFeedback?.notificationOccurred("error");
  openVSheet(`
    <div class="vh">Не получилось</div>
    <div class="vs">${esc(msg)}</div>
    <div class="vrow">
      <button class="vbtn-cancel" onclick="closeVSheet()">Закрыть</button>
      <button class="vbtn-ok" onclick="startVoice()">Записать заново</button>
    </div>`);
}

/* Показ распознанного. items===[] → выбраковка (ничего не поняли). */
function showVResult(d){
  const items = Array.isArray(d.items) ? d.items : [];
  vItems = items.map(x => ({ ...x, _sel: true }));

  if(items.length === 0){
    tg?.HapticFeedback?.notificationOccurred("warning");
    openVSheet(`
      <div class="vh">Не разобрал</div>
      <div class="vs">Не понял, какую работу или трату вы имели в виду.</div>
      ${d.recognized ? `<div class="vquote">Расслышал: <b>${esc(d.recognized)}</b></div>` : ""}
      <div class="vrow">
        <button class="vbtn-cancel" onclick="closeVSheet()">Закрыть</button>
        <button class="vbtn-ok" onclick="startVoice()">Сказать иначе</button>
      </div>`);
    return;
  }

  const multi = items.length > 1;
  const quote = d.recognized ? `<div class="vquote">Расслышал: <b>${esc(d.recognized)}</b></div>` : "";
  const rows = vItems.map((it, i) => {
    const claim = it.field === "Статус" && it.value === "Готово";
    return `
    <div class="vitem sel" data-i="${i}" onclick="toggleVItem(${i})">
      <div class="vchk">✓</div>
      <div style="flex:1;min-width:0">
        <div class="vt">${esc(it.name || it.code || "")}</div>
        ${it.room ? `<div class="vd">${esc(it.room)}</div>` : ""}
        <div class="vv">${claim
          ? `<b>Заявить готовность</b> — уйдёт ${D.role==="worker" ? "заказчику" : "работнику"} на приёмку`
          : `${esc(it.field_label || it.field || "")}: <b>${esc(it.value_label ?? it.value ?? "")}</b>`}</div>
      </div>
    </div>`;
  }).join("");

  openVSheet(`
    <div class="vh">${multi ? "Проверьте — распознано несколько" : "Проверьте и подтвердите"}</div>
    <div class="vs">${multi ? "Отметьте, что записать, и подтвердите." : "Запишу это изменение в таблицу."}</div>
    ${quote}
    <div id="vlist">${rows}</div>
    <div class="vrow">
      <button class="vbtn-cancel" onclick="closeVSheet()">Отмена</button>
      <button class="vbtn-ok" id="vapply" onclick="applyVoice()">${multi ? "Записать выбранные" : "Да, записать"}</button>
    </div>`);
}

function toggleVItem(i){
  vItems[i]._sel = !vItems[i]._sel;
  const el = document.querySelector(`.vitem[data-i="${i}"]`);
  if(el) el.classList.toggle("sel", vItems[i]._sel);
}

/* Применяем выбранные — по одной записи через тот же /update. */
async function applyVoice(){
  const chosen = vItems.filter(x => x._sel);
  if(!chosen.length){ toast("Ничего не отмечено", "wait"); return; }
  const btn = document.getElementById("vapply");
  if(btn){ btn.disabled = true; btn.textContent = "Записываю…"; }
  let done = 0, fail = 0;
  for(const it of chosen){
    const ok = await upd(it.sheet, it.code, it.field, it.value);
    ok ? done++ : fail++;
  }
  closeVSheet();
  if(fail === 0) toast(done > 1 ? `Записано: ${done}` : "Записано");
  else toast(`Записано ${done}, не удалось ${fail}`, fail && !done ? "bad" : "");
}

function fmtTime(s){ const m = Math.floor(s / 60); const ss = String(s % 60).padStart(2, "0"); return `${m}:${ss}`; }

/* ── ВЫХОД В ЧАТ С БОТОМ (только для фото чека) ────────────── */
function toBot(){
  if(tg){ tg.close(); }
  else { toast("Откройте через Telegram — там ждёт бот", "wait"); }
}

/* ── ЖИВОЕ ОБНОВЛЕНИЕ ──────────────────────────────────────────
   Панель — инструмент взаимного подтверждения: заявка одной стороны
   должна появляться у другой без ручной перезагрузки. Тихо перечитываем
   /data; если данные изменились и пользователь не занят вводом или
   голосовым окном — обновляем текущий экран.                          */
let _sig = "";
function _snapshot(d){
  try{
    return JSON.stringify({
      w:(d.works||[]).map(x => x.code+":"+x.status+":"+(x.progress||0)+":"+(x.price_contractor_usd??"")),
      m:(d.materials||[]).map(x => x.name+":"+(x.in||0)+":"+(x.out||0)),
      s:d.settings, p:(d.payments||[]).length
    });
  }catch{ return ""; }
}
async function refresh(){
  const el = document.activeElement;
  const busy = (el && ["INPUT","SELECT","TEXTAREA"].includes(el.tagName)) || vmask.classList.contains("on");
  if(busy) return;                       // не мешаем вводу/голосовому окну
  try{
    const auth = INIT ? `initData=${encodeURIComponent(INIT)}` : `key=${encodeURIComponent(KEY)}`;
    const r = await fetch(`${API}/data?${auth}`, { cache:"no-store" });
    if(!r.ok) return;
    const raw = (await r.text()).trim();
    if(!raw) return;
    let nd; try{ nd = JSON.parse(raw); }catch{ return; }
    if(!nd || !nd.role) return;
    const sig = _snapshot(nd);
    if(!_sig){ _sig = sig; return; }
    if(sig === _sig) return;              // ничего не изменилось — не моргаем
    _sig = sig; D = nd; render();
  }catch{}
}

/* ── СТАРТ ────────────────────────────────────────────────── */
tg?.ready();
tg?.expand();
load();
setInterval(refresh, 15000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });
window.addEventListener("focus", refresh);
</script>
