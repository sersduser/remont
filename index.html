<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ремонт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:   var(--tg-theme-bg-color, #17212b);
  --sec:  var(--tg-theme-secondary-bg-color, #232e3c);
  --txt:  var(--tg-theme-text-color, #ffffff);
  --hint: var(--tg-theme-hint-color, #7d8b99);
  --btn:  var(--tg-theme-button-color, #5288c1);
  --btxt: var(--tg-theme-button-text-color, #ffffff);
  --ok:#4dcd5e; --warn:#f5a623; --bad:#e5484d; --link:#6ab3f3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  padding:calc(14px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 14px 40px;overscroll-behavior-y:contain}

.hello{font-size:19px;font-weight:600}
.sub{font-size:12px;color:var(--hint);margin-bottom:14px}

.stat{background:var(--sec);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.stat .r{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;gap:10px}
.stat .k{font-size:13px;color:var(--hint)}
.stat .v{font-size:16px;font-weight:600;white-space:nowrap}
.stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)} .stat .v.bad{color:var(--bad)}
.bar{height:6px;background:rgba(125,139,153,.25);border-radius:3px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .4s}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sec);border:none;border-radius:14px;padding:18px 10px;color:var(--txt);
  cursor:pointer;text-align:center;font:inherit;transition:transform .1s}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:27px;display:block;margin-bottom:6px}
.tile .nm{font-size:13px;font-weight:600;line-height:1.25}
.tile .h{font-size:11px;color:var(--hint);margin-top:3px}
.tile.pri{background:var(--btn);color:var(--btxt)}
.tile.pri .h{opacity:.85;color:inherit}

.card{background:var(--sec);border-radius:12px;padding:14px;margin-bottom:10px}
.card .lbl{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;gap:10px;
  border-bottom:1px solid rgba(125,139,153,.16)}
.li:last-child{border:none}
.li .n{font-size:14px;flex:1;min-width:0}
.li .d{font-size:11px;color:var(--hint);margin-top:2px}
.li .v{font-size:14px;font-weight:600;white-space:nowrap}

select,input{background:var(--bg);border:1px solid rgba(125,139,153,.3);color:var(--txt);
  padding:8px 10px;border-radius:9px;font:inherit;font-size:14px;width:100%}
input[type=number]{text-align:center}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row label{font-size:12px;color:var(--hint);flex:0 0 96px}

.filt{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt button{background:var(--sec);border:none;color:var(--hint);padding:7px 13px;border-radius:20px;
  font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.filt button.on{background:var(--btn);color:var(--btxt)}

.work{background:var(--sec);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.work.done{opacity:.55}
.work .t{font-size:14px;font-weight:500;line-height:1.3}
.work .m{font-size:11px;color:var(--hint);margin-top:3px}

.warnbox{background:rgba(245,166,35,.13);border:1px solid rgba(245,166,35,.32);border-radius:12px;
  padding:13px;margin-bottom:12px;font-size:14px;line-height:1.5}
.warnbox b{color:var(--warn)}
.mainbtn{width:100%;background:var(--btn);color:var(--btxt);border:none;border-radius:11px;
  padding:13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:11px}

.load{text-align:center;padding:70px 20px;color:var(--hint)}
.err{background:rgba(229,72,77,.13);border:1px solid rgba(229,72,77,.4);border-radius:12px;
  padding:15px;font-size:14px;line-height:1.55}
.toast{position:fixed;left:14px;right:14px;bottom:18px;background:var(--ok);color:#06240c;
  padding:12px;border-radius:11px;text-align:center;font-weight:600;font-size:14px;
  opacity:0;transform:translateY(12px);transition:.22s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
.toast.bad{background:var(--bad);color:#fff}
.toast.wait{background:var(--sec);color:var(--hint)}
.toast.err{background:var(--bad);color:#fff}

/* ── ГОЛОСОВОЙ ВВОД: модальное окно, индикатор, результат ── */
.vmask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
  justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:.2s}
.vmask.on{opacity:1;pointer-events:auto}
/* Лист подтверждения прокручивается [чат 029]. При длинном разборе (работы по
   коридору — два десятка видов) лист вырастал за экран: кнопки «Отмена» и
   «Записать» оставались внизу за краем, а «Расслышал:» уезжал вверх, и
   проверить распознанное было нечем. */
.vsheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(20px);transition:.24s;
  max-height:88vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* Фильтр «только отмеченные»: прячем невыбранное, не трогая состояние выбора. */
#vlist.selonly .vitem:not(.sel){display:none}
.vfilter{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.vfilter button{flex:1;border:none;border-radius:10px;padding:9px;font:inherit;font-size:13px;
  background:var(--sec);color:var(--txt);cursor:pointer}
.vfilter button.on{background:var(--btn);color:var(--btxt)}
.vmask.on .vsheet{transform:none}
.vsheet .vh{font-size:17px;font-weight:600;margin-bottom:4px}
.vsheet .vs{font-size:12px;color:var(--hint);margin-bottom:14px}

.vrec{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 6px}
.vmic{width:84px;height:84px;border-radius:50%;background:var(--btn);display:flex;align-items:center;
  justify-content:center;font-size:38px}
.vmic.rec{animation:pulse 1.2s ease-out infinite;background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}100%{box-shadow:0 0 0 26px rgba(229,72,77,0)}}
.vtime{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.vwave{display:flex;gap:3px;align-items:center;height:20px}
.vwave i{width:3px;background:var(--hint);border-radius:2px;animation:wv 1s ease-in-out infinite}
.vwave i:nth-child(2){animation-delay:.15s}.vwave i:nth-child(3){animation-delay:.3s}
.vwave i:nth-child(4){animation-delay:.45s}.vwave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:6px}50%{height:20px}}

.vrow{display:flex;gap:10px;margin-top:16px}
.vrow button{flex:1;border:none;border-radius:11px;padding:13px;font:inherit;font-size:15px;
  font-weight:600;cursor:pointer}
.vbtn-ok{background:var(--btn);color:var(--btxt)}
.vbtn-cancel{background:var(--sec);color:var(--txt)}
.vbtn-bad{background:var(--bad);color:#fff}

.vitem{display:flex;gap:11px;align-items:flex-start;background:var(--sec);border-radius:11px;
  padding:12px;margin-bottom:8px;cursor:pointer}
.vitem .vchk{width:22px;height:22px;border-radius:6px;border:2px solid var(--hint);flex:0 0 22px;
  margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.vitem.sel .vchk{background:var(--ok);border-color:var(--ok)}
.vitem .vt{font-size:14px;font-weight:500;line-height:1.3}
.vitem .vd{font-size:12px;color:var(--hint);margin-top:2px}
.vitem .vv{font-size:13px;margin-top:3px}
.vitem .vv b{color:var(--ok)}
.vquote{background:var(--sec);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--hint);
  margin-bottom:12px;line-height:1.45;position:sticky;top:-4px;z-index:2;box-shadow:0 6px 12px -8px rgba(0,0,0,.9)}
.vquote b{color:var(--txt);font-weight:500}
.vspin{width:34px;height:34px;border:3px solid rgba(125,139,153,.3);border-top-color:var(--btn);
  border-radius:50%;animation:spin .8s linear infinite;margin:8px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app"><div class="load">Загружаю…</div></div>
<div class="toast" id="toast"></div>

<!-- Модальное окно голосового ввода -->
<div class="vmask" id="vmask"><div class="vsheet" id="vsheet"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Адрес n8n. Уже прописан — менять не надо.
   ═══════════════════════════════════════════════════════════════ */
const API = "https://n8n.nc-lab.uz/webhook/remont";

/* Идентификация — по ЛИЧНОСТИ из Telegram (initData), а не по ключу в ссылке.
   Сервер проверяет подпись Telegram его публичным ключом (токен бота не нужен)
   и определяет роль по Telegram-ID из листа 09_Доступы. Подменить роль с клиента
   или подставить чужой ключ нельзя. KEY оставлен запасным входом на переходный
   период и для отладки в обычном браузере (вне Telegram initData недоступен).   */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const INIT = (tg && tg.initData) || "";                              // подписанные данные Telegram
const KEY  = new URLSearchParams(location.search).get("key") || "";  // legacy / отладка вне Telegram

/* Код приглашения в бригаду [чат 012]: приходит в подписанном start_param
   (ссылка t.me/бота?startapp=inv_КОД) или руками через ?invite / поле ввода.
   Сервер доверяет только тому коду, который сам достаёт из initData или body —
   здесь код нужен лишь чтобы показать его в поле и не заставлять печатать. */
const INVITE = String((tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("invite") || "").replace(/^inv_/i, "").toUpperCase();

let D = null;                       // данные с сервера
let stack = ["home"];               // стек навигации
let fRoom = "";                     // активный фильтр по комнате
let hideDone = false;               // глобальный фильтр «скрыть готовое»
const app = document.getElementById("app");
const fmt = n => (Number(n) || 0).toLocaleString("ru-RU", { maximumFractionDigits: 0 });

/* Бот пишет в таблицу произвольные названия материалов. Одна кавычка в имени
   сломала бы разметку — поэтому всё, что пришло с сервера, экранируем.        */
const esc  = t => String(t ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const attr = t => esc(t);

/* ── ЗАГРУЗКА ─────────────────────────────────────────────── */
async function load(){
  try{
    const auth = INIT ? `initData=${encodeURIComponent(INIT)}`
                      : `key=${encodeURIComponent(KEY)}`;
    const r = await fetch(`${API}/data?${auth}`, { cache: "no-store" });
    const BAD = "Доступ не подтверждён — откройте панель через бота в Telegram.";
    if(r.status === 401 || r.status === 403) throw new Error(BAD);
    if(!r.ok) throw new Error("Сервер не отвечает (HTTP " + r.status + ")");
    /* При неверном ключе n8n обрывает цепочку и отдаёт пустое тело с кодом 200.
       Данные не утекают, но и JSON не приходит — трактуем это как отказ в доступе. */
    const raw = (await r.text()).trim();
    if(!raw) throw new Error(BAD);
    try{ D = JSON.parse(raw); }catch{ throw new Error(BAD); }
    /* Объект без листов [чат 018]: сервер отвечает не отказом, а need_setup —
       панель предлагает создать недостающие листы, вместо тупика «сервер не отвечает». */
    if(D && D.need_setup){ renderSetup(D); return; }
    if(!D || !D.role) throw new Error(BAD);
    render();
    _sig = _snapshot(D);
    langInit();                   // язык: выбор человека → 09_Доступы → Telegram [чат 020]            // калибровка живого обновления
    /* Работник живёт данными контура бригады — тянем их при каждой полной
       загрузке: load() зовётся и при старте, и при откате после ошибки [чат 013] */
    if (D.kind === "hand") crewLoad().then(() => render()).catch(() => {});
  }catch(e){
    /* Незнакомый Telegram — возможно, это работник с приглашением [чат 012]:
       вместо тупика показываем экран регистрации по коду. */
    if(INIT && /не подтверждён/.test(String(e.message || ""))){ renderInvite(); return; }
    app.innerHTML = `<div class="err"><b>Не удалось загрузить.</b><br>${e.message}
      <br><br><span style="color:var(--hint);font-size:13px">Проверьте интернет и откройте ещё раз.</span></div>`;
  }
}

/* ══════════════════════════════════════════════════════════════
   ПРИГЛАШЕНИЕ В БРИГАДУ [чат 012] — регистрация работника.
   Двухфазный разговор с POST /remont/register: check возвращает,
   кого нашли по коду («Вы — Петя, бригада Суботина?»), confirm=1
   вписывает Telegram_ID в Работники и строку в 09_Доступы.
   Ошибки сервер отдаёт пустым телом (граблина 6) — панель честно
   говорит «не подошёл», не различая причин. Замок от двойного тапа. */
let INV_BUSY = false, INV_CODE = "";
const INV_INP = 'style="width:100%;padding:12px;border-radius:12px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:18px;letter-spacing:3px;text-align:center;text-transform:uppercase"';
function renderInvite(s){
  s = s || {};
  const code0 = s.code !== undefined ? s.code : INVITE;
  let body = "";
  if(s.phase === "found"){
    body = '<div class="stat"><span class="k">Код принят. Вы — <b>' + esc(s.name) + '</b>, бригада: <b>' + esc(s.foreman) + '</b>?</span></div>' +
      '<button class="tile pri" style="width:100%;margin-bottom:10px" onclick="invConfirm()"><span class="nm">Да, это я — подключить</span></button>' +
      '<button class="tile" style="width:100%" onclick="renderInvite({code:\'\'})"><span class="nm">Нет, ввести другой код</span></button>';
  } else if(s.phase === "done"){
    body = '<div class="stat"><span class="k">Готово, ' + esc(s.name) + '! Вы в бригаде. Открываю панель…</span></div>';
  } else {
    body = '<div class="stat"><span class="k">Введите код приглашения от бригадира. Если вы открыли панель по ссылке-приглашению, код уже подставлен.</span></div>' +
      '<div style="margin:10px 0"><input id="invcode" value="' + attr(code0) + '" ' + INV_INP + ' placeholder="КОД"></div>' +
      (s.err ? '<div class="warnbox">' + esc(s.err) + '</div>' : "") +
      '<button class="tile pri" style="width:100%" onclick="invCheck()"><span class="nm">Проверить код</span></button>';
  }
  app.innerHTML = '<div class="hello">Приглашение в бригаду</div>' +
    '<div class="sub">объект «Ремонт»</div>' + body;
}
async function invCheck(){
  const code = String((document.getElementById("invcode") || {}).value || "").trim().toUpperCase();
  if(!/^[A-Z0-9]{6,12}$/.test(code)){ renderInvite({err: "Код — буквы и цифры, обычно 8 знаков.", code}); return; }
  if(INV_BUSY) return;
  INV_BUSY = true;
  try{
    const r = await fetch(API + "/register", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: INIT, code }) });
    const t = (await r.text()).trim();
    let j = null; try{ j = JSON.parse(t); }catch(e){}
    if(j && j.ok && j.phase === "check"){ INV_CODE = code; renderInvite({phase: "found", name: j.name, foreman: j.foreman}); }
    else renderInvite({err: "Код не подошёл: он мог истечь, быть использован или ваш Telegram уже подключён. Попросите у бригадира новую ссылку.", code});
  }catch(e){ renderInvite({err: "Нет связи с сервером — попробуйте ещё раз.", code}); }
  finally{ INV_BUSY = false; }
}
async function invConfirm(){
  if(INV_BUSY) return;
  INV_BUSY = true;
  try{
    const r = await fetch(API + "/register", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: INIT, code: INV_CODE, confirm: "1" }) });
    const t = (await r.text()).trim();
    let j = null; try{ j = JSON.parse(t); }catch(e){}
    if(j && j.ok && j.phase === "confirm"){ renderInvite({phase: "done", name: j.name}); setTimeout(() => location.reload(), 1600); }
    else renderInvite({err: "Не получилось подключить — попробуйте ещё раз или запросите новую ссылку.", code: INV_CODE});
  }catch(e){ renderInvite({err: "Нет связи с сервером — попробуйте ещё раз.", code: INV_CODE}); }
  finally{ INV_BUSY = false; }
}

/* ── ЗАПИСЬ ───────────────────────────────────────────────────
   Не перечитываем всё после каждой правки — правим локально.
   Иначе на 102 работах экран моргает и уезжает наверх.        */
/* ═══ Зависимости работ · мягкое предупреждение ═══════════════════════
   Предшественники берутся из колонки «Зависит_от» листа 01_Работы
   (приходит в поле deps). Зависимость снята, когда предшественник
   «Готово» или «Снято». Предупреждение НЕ блокирует: карта связей
   черновая, и ошибка в ней не должна стопорить реальную работу.     */
function depCodes(w){
  const raw = String((w && w.deps) || "").trim();
  if (!raw || raw === "—" || raw === "-") return [];
  return raw.split(",").map(s => s.trim()).filter(Boolean);
}
function depBlockers(w){
  if (!D || !D.works || !w) return [];
  return depCodes(w)
    .map(c => D.works.find(x => x.code === c))
    .filter(p => p && p.status !== "Готово" && p.status !== "Снято");
}
function depAsk(w, blockers){
  return new Promise(resolve => {
    const rows = blockers.map(b =>
      '<div style="margin:8px 0;padding:8px 10px;background:rgba(255,255,255,.07);border-radius:10px">' +
      '<b>' + esc(b.name) + '</b><br><span style="opacity:.65;font-size:13px">' +
      esc(String(b.room || "").split(" (")[0]) + ' · ' + esc(b.status) + '</span></div>').join("");
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px";
    box.innerHTML =
      '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:80vh;overflow:auto;font-size:15px">' +
        '<div style="font-weight:700;margin-bottom:8px">⚠ Предыдущее ещё не принято</div>' +
        '<div style="opacity:.7;font-size:14px;margin-bottom:6px">«' + esc(w.name) + '» обычно делается после того, как принято:</div>' +
        rows +
        '<div style="opacity:.6;font-size:13px;margin:10px 0 14px">Это подсказка, а не запрет. Если на объекте порядок другой — продолжайте.</div>' +
        '<div style="display:flex;gap:8px">' +
          '<button id="depNo" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
          '<button id="depYes" style="flex:1;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Всё равно заявить</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(box);
    box.querySelector("#depNo").onclick  = () => { box.remove(); resolve(false); };
    box.querySelector("#depYes").onclick = () => { box.remove(); resolve(true);  };
  });
}

/* Баланс от приёмки: сколько из выданного аванса уже отработано принятыми
   работами. null — если считать не из чего (нет ни оплат, ни приёмки).  */
function advCalc(field){
  const acc  = accSum(field);
  const S2   = D.settings || {};
  const paid = Number(S2["Оплачено_за_работу_USD"] ?? (D.my_money && D.my_money.received_usd) ?? 0);
  if (!paid && !acc) return null;
  if (!paid)        return { k:"Принято работ",             main: fmt(acc) + " $",
                             sub:"Оплат пока не поступало", pct:0, color:"var(--ok)" };
  if (acc < paid)   return { k:"Отработано аванса",         main: fmt(acc) + " из " + fmt(paid) + " $",
                             sub:"Осталось отработать " + fmt(paid - acc) + " $",
                             pct: Math.max(1, Math.round(acc / paid * 100)), color:"var(--warn)" };
  if (acc === paid) return { k:"Аванс отработан полностью", main: fmt(paid) + " $",
                             sub:"Расчёты сошлись", pct:100, color:"var(--ok)" };
  return              { k:"Аванс отработан, к доплате",     main: fmt(acc - paid) + " $",
                        sub:"Принято на " + fmt(acc) + " $ при оплаченных " + fmt(paid) + " $",
                        pct:100, color:"var(--ok)" };
}

/* ══════════════════════════════════════════════════════════════
   ПРАЙС ИСПОЛНИТЕЛЯ — цены по видам работ из общей базы [чат 007]
   Справочник и прайс лежат в отдельной таблице, общей для всех

   ══════════════════════════════════════════════════════════════ */
async function loadCatalog(force){

/* ══════════════════════════════════════════════════════════════
   ПРОФИЛЬ РЕМОНТА — сборка сметы из обмеров и прайса [чат 007]
   К помещению применяются виды работ; объём считается из его размеров
   по колонке «База_объёма» справочника, цена — из прайса исполнителя.
   Итог дописывается строками в 01_Работы через POST /remont/append.
   [чат 017] Выбор копится СРАЗУ ПО НЕСКОЛЬКИМ помещениям (PROF.plan):
   на встрече пара проходит квартиру подряд, а смета собирается одним
   действием в конце — возврата к таблице между комнатами быть не должно.
   ══════════════════════════════════════════════════════════════ */
let PROF = { room: null, plan: {} };   // текущее помещение и план по всем помещениям: plan[код помещения][код вида] = {vol, manual}

async function openProfile(){
  try{
    if(!D.catalog) toast('Загружаю справочник…');
    await loadCatalog();
    PROF = { room: null, plan: {} };
    go('profile');
  }catch(e){ toast(e.message, 'err'); }
}

function profRoom(){ return (D.rooms || []).find(r => r.code === PROF.room) || null; }
function profPicked(code){                      // выбор одного помещения (по умолчанию — текущего)
  const rc = code || PROF.room;
  if(!rc) return {};
  if(!PROF.plan[rc]) PROF.plan[rc] = {};
  return PROF.plan[rc];
}

// Сколько единиц работы даёт помещение по базе объёма из справочника
function profVol(kind, room){
  if(!kind || !room) return null;
  const part = b => {
    if(b === 'пол')       return room.floor_m2;
    if(b === 'потолок')   return room.ceiling_m2;
    if(b === 'стены')     return room.wall_m2;
    if(b === 'периметр')  return room.perimeter_m;
    if(b === 'окна')      return room.windows;
    if(b === 'двери')     return room.doors;
    if(b === 'помещение' || b === 'объект') return 1;
    return null;
  };
  const base = String(kind.base || '').trim();
  if(!base || base === 'вручную') return null;
  let sum = 0;
  for(const p of base.split('+')){
    const v = part(p.trim());
    if(v === null || v === undefined || v === '') return null;   // нет данных — просим ввести руками
    sum += Number(v) || 0;
  }
  return Math.round(sum * 100) / 100;
}

/* ── Ставка вида: типовая и вилка мин–макс [чат 018] ──────────────────────
   Решение Дмитрия: справочник несёт разброс (минимум — типовая — максимум),
   без региональной привязки. Причина — пробел 5 ревизии 010: одно число
   одинаково врёт и дорогому, и дешёвому исполнителю, а «от и до» показывает
   ему, где он относительно рынка. Типовая остаётся главной цифрой; когда её
   нет, ориентиром служит середина вилки — и подписи честно называют это
   ориентиром, а не ценой. Источник вилки показывается рядом: цифра без
   источника в прайсе не проверяема. */
function rateNum(k){
  if(!k) return 0;
  const mid = Number(k.base_usd) || 0;
  if(mid > 0) return mid;
  const lo = Number(k.base_min) || 0, hi = Number(k.base_max) || 0;
  return (lo > 0 && hi > 0) ? Math.round((lo + hi) / 2 * 100) / 100 : 0;
}
function rateHint(k){
  if(!k) return 'цена за единицу';
  const money = n => (Number(n) || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const mid = Number(k.base_usd) || 0, lo = Number(k.base_min) || 0, hi = Number(k.base_max) || 0;
  const parts = [];
  if(mid > 0) parts.push('ориентир ' + money(mid));
  if(lo > 0 && hi > 0) parts.push((mid > 0 ? 'вилка ' : 'ориентир по рынку ') + money(lo) + '–' + money(hi));
  if(!parts.length) return 'цена за единицу';
  if(k.rate_src) parts.push('источник: ' + k.rate_src);
  return parts.join(' · ');
}

function profPrice(code){
  const p = ((D.catalog || {}).price || []).find(x => x.code === code);
  if(p && Number(p.price_usd) > 0) return Number(p.price_usd);
  const k = ((D.catalog || {}).kinds || []).find(x => x.code === code);
  return rateNum(k);   // прайс пуст — ориентир из справочника: типовая или середина вилки
}

/* Виды, уже стоящие в смете помещения: связь работы с видом несёт пометка
   «вид X» в Примечании [чат 013]. Показываем её, чтобы конструктор не плодил
   вторую такую же строку молча — то же правило переспроса, что у голоса. */
function profInEstimate(roomCode){
  const room = (D.rooms || []).find(r => r.code === roomCode);
  const out = {};
  if(!room) return out;
  (D.works || []).forEach(w => {
    const wc = String(w.code || '');
    const mine = wc.split('-')[0] === roomCode || String(w.room || '').split(' (')[0] === String(room.name || '').split(' (')[0];
    if(!mine) return;
    const m = String(w.note || '').match(/вид\s+([A-Za-z]+-\d+)/i);
    if(m) out[m[1].toUpperCase()] = true;
  });
  return out;
}

function profToggle(code){
  const picked = profPicked();
  if(picked[code]) delete picked[code];
  else {
    const kind = ((D.catalog || {}).kinds || []).find(x => x.code === code);
    picked[code] = { vol: profVol(kind, profRoom()), manual: false };
  }
  render();
}

function profSetVol(el){
  const code = el.getAttribute('data-code');
  const v = String(el.value ?? '').trim().replace(',', '.');
  const picked = profPicked();
  if(!picked[code]) return;
  picked[code].vol = v === '' ? null : Number(v);
  picked[code].manual = true;
  const box = document.getElementById('profSum');
  if(box) box.textContent = profTotalText();
}

function profTotal(roomCode){                    // итог одного помещения
  const picked = (PROF.plan[roomCode || PROF.room] || {});
  let n = 0, sum = 0, blank = 0;
  for(const code of Object.keys(picked)){
    const it = picked[code];
    n++;
    if(it.vol === null || !(Number(it.vol) > 0)) { blank++; continue; }
    sum += Number(it.vol) * profPrice(code);
  }
  return { n, sum: Math.round(sum * 100) / 100, blank };
}
function profTotalAll(){                         // итог по всему плану
  let n = 0, sum = 0, blank = 0, rooms = 0;
  Object.keys(PROF.plan).forEach(rc => {
    const t = profTotal(rc);
    if(!t.n) return;
    rooms++; n += t.n; sum += t.sum; blank += t.blank;
  });
  return { rooms, n, sum: Math.round(sum * 100) / 100, blank };
}
function profTotalText(){
  const t = profTotal();
  return t.n ? ('Выбрано ' + t.n + ' · на ' + fmt(t.sum) + ' USD' + (t.blank ? (' · без объёма: ' + t.blank) : '')) : 'Ничего не выбрано';
}
function profTotalAllText(){
  const t = profTotalAll();
  if(!t.n) return 'План пуст';
  return 'В плане ' + t.n + ' работ в ' + t.rooms + ' помещ. · ' + fmt(t.sum) + ' USD' + (t.blank ? (' · без объёма: ' + t.blank) : '');
}

// Сборка сметы: выбранное по ВСЕМ помещениям плана превращается в строки листа 01_Работы [чат 007 · многокомнатно 017]
async function profBuild(){
  const kinds = (D.catalog || {}).kinds || [];
  const kindOf = c => kinds.find(k => k.code === c) || {};
  const roomCodes = Object.keys(PROF.plan).filter(rc => Object.keys(PROF.plan[rc] || {}).length);
  if(!roomCodes.length) { toast('Ничего не выбрано'); return; }

  let noVol = 0;
  roomCodes.forEach(rc => { noVol += profTotal(rc).blank; });
  if(noVol){ toast('Без объёма: ' + noVol + ' — заполните или снимите', 'err'); return; }

  const rows = [];
  const names = [];
  roomCodes.forEach(rc => {
    const room = (D.rooms || []).find(r => r.code === rc);
    if(!room) return;
    names.push(String(room.name || rc).split(' (')[0]);
    const codes = Object.keys(PROF.plan[rc]);
    // Новые коды строк: продолжаем нумерацию помещения, чтобы не столкнуться с существующими
    const used = (D.works || []).filter(w => String(w.code || '').indexOf(rc + '-') === 0)
      .map(w => parseInt(String(w.code).split('-')[1], 10) || 0);
    let next = (used.length ? Math.max.apply(null, used) : 0) + 1;
    const newCode = {};
    codes.forEach(c => { newCode[c] = rc + '-' + String(next++).padStart(2, '0'); });
    codes.forEach(c => {
      const k = kindOf(c);
      const vol = Number(PROF.plan[rc][c].vol);
      const rate = profPrice(c);
      // Типовые зависимости вида превращаются в ссылки на строки этого же помещения —
      // те предшественники, которые здесь не выбраны, просто опускаются.
      const deps = String(k.deps || '').split(',').map(x => x.trim()).filter(x => x && newCode[x]).map(x => newCode[x]);
      rows.push({
        'Код': newCode[c],
        'Помещение': room.name,
        'Раздел': k.section || '',
        'Работа': k.name || c,
        'Ед': k.unit || '',
        'Объём': vol,
        'Ставка_USD': rate || '',
        'Категория': 'База',
        'Цена_аллокация_USD': rate ? Math.round(vol * rate * 100) / 100 : '',
        'Статус': 'Не начато',
        'Готовность_%': 0,
        'Источник': 'профиль ремонта',
        'Примечание': 'вид ' + c,
        'Зависит_от': deps.length ? deps.join(', ') : '—',
      });
    });
  });

  const t = profTotalAll();
  if(!confirm('Добавить ' + rows.length + ' работ в смету на ' + fmt(t.sum) + ' USD?\nПомещения: ' + names.join(', '))) return;

  try{
    const r = await fetch(API + '/append', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: INIT, key: KEY, sheet: '01_Работы', rows: rows })
    });
    const txt = (await r.text()).trim();
    if(!r.ok || !txt) throw new Error('Не удалось добавить работы');
    toast('Добавлено работ: ' + rows.length + ' в ' + names.length + ' помещ.');
    PROF = { room: null, plan: {} };
    await load();
    render(true);
  }catch(e){ toast(e.message, 'err'); }
}

/* ══════════════════════════════════════════════════════════════
   СРОКИ — критический путь и шкала «опережение / отставание» [чат 007]
   Длительности приезжают в поле dur (черновая оценка из ставки чел-часа),
   связи — в поле deps. По ним считается самая длинная цепочка: она и есть
   срок объекта. Работы вне этой цепочки имеют запас и на финиш не влияют.
   ══════════════════════════════════════════════════════════════ */
/* Техпаузы [чат 012]. «Техпауза_дней» — календарное время ПОСЛЕ работы
   (стяжка сохнет, штукатурка стоит), прежде чем могут стартовать зависимые.
   Живёт в справочнике видов; связь работы с видом — пометка «вид X»
   в Примечании, её ставит конструктор смет. У унаследованных работ пилота
   пометки нет: их паузы неизвестны и считаются нулём, охват честно показан
   на экране. Паузы не тратят человекодни — оценка «по рукам» не растёт. */
function pauseOf(w){
  const kinds = (D.catalog || {}).kinds;
  if(!kinds || !w || !w.note) return 0;
  const m = String(w.note).match(/вид\s+([A-Za-z]+-\d+)/i);
  if(!m) return 0;
  const k = kinds.find(x => x.code === m[1]);
  return (k && Number(k.pause) > 0) ? Number(k.pause) : 0;
}
async function openTerms(){
  try{
    if(!D.catalog){ toast('Загружаю справочник…'); await loadCatalog(); }
  }catch(e){ /* без справочника паузы просто нулевые */ }
  go('terms');
}

function schedule(usePauses){
  const ws = (D.works || []).filter(w => w.code);
  const by = {}; ws.forEach(w => { by[w.code] = w; });
  const dur = w => (Number(w.dur) > 0 ? Number(w.dur) : 0.5);
  const pz = c => usePauses ? pauseOf(by[c]) : 0;
  const depsOf = w => String(w.deps || '').split(',').map(s => s.trim())
    .filter(s => s && s !== '—' && by[s]);

  const ef = {};                       // ранний финиш, в днях от старта
  const calc = (code, seen) => {
    if(ef[code] !== undefined) return ef[code];
    if(seen[code]) return 0;           // страховка от цикла в карте связей
    seen[code] = 1;
    const w = by[code]; if(!w) return 0;
    const ds = depsOf(w);
    const start = ds.length ? Math.max.apply(null, ds.map(d => calc(d, Object.assign({}, seen)) + pz(d))) : 0;
    ef[code] = Math.round((start + dur(w)) * 100) / 100;
    return ef[code];
  };
  ws.forEach(w => calc(w.code, {}));
  const total = ws.length ? Math.max.apply(null, ws.map(w => ef[w.code] || 0)) : 0;

  const succ = {};                     // последователи
  ws.forEach(w => depsOf(w).forEach(d => { (succ[d] = succ[d] || []).push(w.code); }));
  const lf = {};                       // поздний финиш
  const late = (code, seen) => {
    if(lf[code] !== undefined) return lf[code];
    if(seen[code]) return total;
    seen[code] = 1;
    const ss = succ[code] || [];
    lf[code] = ss.length
      ? Math.min.apply(null, ss.map(s => late(s, Object.assign({}, seen)) - dur(by[s]))) - pz(code)
      : total;
    return lf[code];
  };
  ws.forEach(w => late(w.code, {}));
  const slack = {}; ws.forEach(w => { slack[w.code] = Math.round(((lf[w.code] || 0) - (ef[w.code] || 0)) * 100) / 100; });
  const critical = ws.filter(w => Math.abs(slack[w.code]) < 0.01).map(w => w.code);
  return { ef, lf, slack, total, critical, by };
}

// Где мы во времени: сравниваем пройденное по плану с прошедшими днями
function timeCalc(){
  const s = schedule(true);
  const s0 = schedule(false);
  const done = (D.works || []).filter(w => w.status === 'Готово' && w.code);
  const reached = done.length ? Math.max.apply(null, done.map(w => s.ef[w.code] || 0)) : 0;
  const dates = (D.works || []).map(w => String(w.updated || '').slice(0, 10)).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const start = dates.length ? new Date(dates[0] + 'T00:00:00') : null;
  const elapsed = start ? Math.max(0, Math.round((Date.now() - start.getTime()) / 86400000)) : null;
  const diff = (elapsed === null) ? null : Math.round((reached - elapsed) * 10) / 10;
  // Критический путь — это технологический минимум: столько займёт ремонт, если
  // на каждую готовую к работе позицию хватает людей. Реальный срок упирается в руки:
  // сумма всех длительностей, делённая на размер бригады. Берём больший из двух.
  const sumDur = (D.works || []).reduce((a, w) => a + (Number(w.dur) > 0 ? Number(w.dur) : 0.5), 0);
  const crew = Number((D.settings || {})['Рабочих_в_бригаде']) || 2;
  const byCrew = Math.round((sumDur / crew) * 10) / 10;
  const real = Math.max(Math.round(s.total * 10) / 10, byCrew);
  return { total: Math.round(s.total * 10) / 10, reached: Math.round(reached * 10) / 10, elapsed, diff,
           critical: s.critical, sched: s, startDate: dates[0] || null,
           sumDur: Math.round(sumDur * 10) / 10, crew, byCrew, real,
           pauses: Math.round((s.total - s0.total) * 10) / 10,
           pcov: (D.works || []).filter(w => pauseOf(w) > 0).length };
}

/* ══════════════════════════════════════════════════════════════
   ЧЕКИ — привязка фото из буфера к материалу [чат 007]
   Бот кладёт снимок чека в 08_Черновики, но фактом учёта он становится

function checkList(){

}

async function bindCheck(id){
  const sel = document.getElementById('mat_' + id);
  const amt = document.getElementById('sum_' + id);
  const mat = sel ? sel.value : '';
  const raw = String(amt ? amt.value : '').replace(/\s/g, '').replace(',', '.');
  const sum = Number(raw);
  if(!mat){ toast('Выберите материал'); return; }
  if(!(sum > 0)){ toast('Укажите сумму в сумах'); return; }
  const btn = document.getElementById('btn_' + id);
  if(btn) btn.disabled = true;
  try{

/* ══════════════════════════════════════════════════════════════
   ОБЪЕКТ: план БТИ и обмеры помещений [чат 016]
   Этап B большого плана: на первой встрече пара заводит объект голосом,
   а не заполняет таблицу. План БТИ живёт здесь картинкой и НЕ распознаётся
   (решение маяка §7) — он нужен глазам, а размеры приезжают голосом.
   Сам файл хранится в Telegram: панель просит его у сервера по id записи,
   прямой ссылки на файл и токена бота в клиенте нет.
   ══════════════════════════════════════════════════════════════ */
/* ── Смежность помещений [чат 016] ─────────────────────────────
   Зачем: порядок работ зависит не только от технологии, но и от того,
   как комнаты связаны между собой. Полы нельзя залить везде разом —
   иначе к дальней комнате не подойти; порядок считаем обходом графа
   от выхода. Связь всегда двусторонняя: помечая соседа, пишем обе строки. */
const adjMap = () => { const m = {}; (D.adjacency || []).forEach(a => { m[a.code] = a.near || []; }); return m; };
const adjOf  = (code) => adjMap()[code] || [];

async function adjWrite(code, list){
  const r = roomList().find(x => x.code === code);
  const known = (D.adjacency || []).some(a => a.code === code);
  const val = list.join(",");
  if(known) await writeCell("12_Смежность", code, "Смежные", val);
  else await crewAppend("12_Смежность", [{ "Код": code, "Помещение": r ? r.name : code, "Смежные": val, "Примечание": "" }]);
}

async function adjToggle(code, other){
  const a = adjOf(code).slice(), b = adjOf(other).slice();
  const i = a.indexOf(other);
  if(i >= 0){ a.splice(i, 1); const j = b.indexOf(code); if(j >= 0) b.splice(j, 1); }
  else { a.push(other); if(b.indexOf(code) < 0) b.push(code); }
  toast("Сохраняю…", "wait");
  try{
    await adjWrite(code, a);
    await adjWrite(other, b);
    await load();
    render();
    toast("Связь обновлена");
  }catch(e){ toast(e.message, "err"); }
}

function adjChips(code){
  const near = adjOf(code);
  return roomList().filter(r => r.code !== code).map(r => {
    const on = near.indexOf(r.code) >= 0;
    return '<button onclick="adjToggle(\'' + code + '\',\'' + r.code + '\')" style="margin:3px 4px 0 0;padding:6px 10px;border-radius:9px;border:1px solid ' +
      (on ? "#0a84ff" : "#3a3a3c") + ';background:' + (on ? "#0a84ff" : "transparent") + ';color:#fff;font-size:13px">' +
      (on ? "✓ " : "") + esc(String(r.name || r.code).split(" (")[0]) + "</button>";
  }).join("");
}

/* Порядок заливки полов: обход от выхода вглубь, заливаем в обратном
   порядке — дальние первыми, выход последним. Выход — коридор (или самое
   связное помещение, если коридора нет). */
function floorOrder(){
  const rooms = roomList();
  const m = adjMap();
  const links = rooms.reduce((s, r) => s + (m[r.code] || []).length, 0);
  if(!rooms.length || !links) return null;
  const exit = rooms.find(r => /коридор|прихож/i.test(String(r.kind || "") + " " + String(r.name || "")))
    || rooms.slice().sort((a, b) => (m[b.code] || []).length - (m[a.code] || []).length)[0];
  const dist = {}; dist[exit.code] = 0;
  const q = [exit.code];
  while(q.length){
    const c = q.shift();
    (m[c] || []).forEach(n => { if(dist[n] === undefined && rooms.some(r => r.code === n)){ dist[n] = dist[c] + 1; q.push(n); } });
  }
  const known  = rooms.filter(r => dist[r.code] !== undefined).sort((a, b) => dist[b.code] - dist[a.code]);
  const orphan = rooms.filter(r => dist[r.code] === undefined);
  return { exit: exit, order: known, orphan: orphan, dist: dist };
}

const ROOM_FIELDS = [
  { col: "Пол_м2",     label: "Пол, м²",     unit: "м²" },
  { col: "Периметр_м", label: "Периметр, м", unit: "м"  },
  { col: "Высота_м",   label: "Высота, м",   unit: "м"  },
  { col: "Окон_шт",    label: "Окон",        unit: ""   },
  { col: "Дверей_шт",  label: "Дверей",      unit: ""   },
];
/* Типовые площади проёма — выведены из обмеров этого объекта (стены
   листа сходятся с периметр×высота минус проёмы). Панель их только
   ПРЕДЛАГАЕТ: пересчёт стен всегда подтверждает человек. */
const S_WIN = 3.1, S_DOOR = 1.7;

/* ══════════════════════════════════════════════════════════════
   СХЕМА ПРОЁМОВ [чат 031] — дверь и окно перестали быть числом
   Требования Дмитрия: «у многих расходится план с фактом… чтобы создавалась
   собственная схема и потом голосом её можно было регулировать» и «4 замены
   дверей — неправильно: в коридоре 5 дверей, входная не трогается, в зал и
   в третью заменяется, в туалет демонтируется, в ванную переносится».
   Одно число не может нести пять разных ответов, поэтому проём стал вещью.

   Проём — РЕБРО: у него две стороны, и внутренняя дверь принадлежит паре
   помещений, а не одному. Тогда «дверь в кухню заложена» правится один раз
   и видна с обеих сторон — та же логика, что у двустороннего графа
   смежности (решение 016). Разбор — 02_Разборы/16.
   ══════════════════════════════════════════════════════════════ */
const ELEM_FACTS = ["дверь", "окно", "проём", "нет"];
const ELEM_FATES = ["не трогаем", "заменить", "демонтировать", "заложить", "пробить", "перенести", "установить"];
const ELEM_AREA  = { "дверь": S_DOOR, "окно": S_WIN, "проём": S_DOOR };

const elemAll  = () => (D.elements || []);
const elemOf   = (code) => elemAll().filter(e => e.a === code || e.b === code);
const elemSide = (e, code) => (e.a === code ? e.b : e.a);
function elemSideName(e, code){
  const s = elemSide(e, code);
  const r = (D.rooms || []).find(x => x.code === s);
  return r ? String(r.name || s).split(" (")[0] : String(s || "—");
}
/* Расхождение план/факт не хранится полем и не приходит с сервера: признак,
   по которому считается сводная величина, записывается один раз (урок 027 —
   определение «решено» разъехалось между сервером и панелью). */
const elemGap   = (e) => !!(e.plan && e.fact && e.plan !== e.fact);
const elemGaps  = () => elemAll().filter(elemGap);
const elemCount = (code, fact) => elemOf(code).filter(e => e.fact === fact).length;

/* Площадь настоящих проёмов помещения: свои размеры, если заданы, иначе
   типовые. Пока схемы нет — null, и стены считаются прежней формулой. */
function elemArea(code){
  const list = elemOf(code).filter(e => e.fact && e.fact !== "нет");
  if(!elemOf(code).length) return null;
  let s = 0;
  for(const e of list){
    const w = Number(e.w), h = Number(e.h);
    s += (w > 0 && h > 0) ? (w * h) : (ELEM_AREA[e.fact] || 0);
  }
  return Math.round(s * 100) / 100;
}

/* Что схема говорит про числа проёмов помещения. Числа в 06_Помещения
   остаются источником объёмов работ, поэтому схема их не переписывает молча,
   а показывает расхождение и предлагает пересчитать — тот же переспрос, что
   у обмеров (решение 016). */
function elemDelta(r){
  if(!r || !elemOf(r.code).length) return null;
  const w = elemCount(r.code, "окно"), d = elemCount(r.code, "дверь");
  const same = (a, b) => !(a === null || a === undefined || String(a).trim() === "") && Number(a) === b;
  const needW = !same(r.windows, w), needD = !same(r.doors, d);
  return (needW || needD) ? { w: w, d: d, needW: needW, needD: needD } : null;
}


const objDocs = () => (D.drafts || []).filter(d => /план/i.test(String(d.kind || "")));
const objPlan = () => { const l = objDocs(); return l.length ? l[l.length - 1] : null; };
const roomList = () => (D.rooms || []);
/* Пробел проёмов [чат 029]. До 029 фильтр смотрел только на null/undefined:
   пустая ячейка, приехавшая строкой, считалась заполненной, а ноль отличить
   от «не задано» было нечем вовсе — отсюда вечная подсказка в помещениях,
   где окон нет физически. Теперь «не задано» — это null, undefined и пустая
   строка, а 0 — обычное заданное значение. */
const roomNeed = v => v === null || v === undefined || String(v).trim() === "";
const roomGapOf = r => [roomNeed(r.windows) ? "окна" : "", roomNeed(r.doors) ? "двери" : ""].filter(Boolean);
const roomGap  = () => roomList().filter(r => roomGapOf(r).length);

/* Стены по обмерам: периметр × высота минус проёмы. Возвращает null,
   пока не хватает данных, — считать «примерно» тут нельзя, число уходит
   в объёмы работ. */
function roomWalls(r){
  const p = Number(r.perimeter_m), h = Number(r.height_m);
  if(!(p > 0) || !(h > 0)) return null;
  /* Незаданные проёмы — это не «ноль проёмов»: Number(null) даёт 0 и молча
     завысил бы стены на площадь окон и дверей. Пока чисел нет — не считаем. */
  const empty = v => v === null || v === undefined || v === "";
  if(empty(r.windows) || empty(r.doors)) return null;
  const w = Number(r.windows), d = Number(r.doors);
  if(!(w >= 0) || !(d >= 0)) return null;
  /* Схема проёмов заведена — вычитаем настоящие проёмы, а не типовые числа
     [чат 031]: у арки между залом и лоджией своя площадь, и до 031 она не
     вычиталась вовсе (аркой не считается ни окно, ни дверь). Своя ширина и
     высота проёма главнее типовой площади. */
  const ea = elemArea(r.code);
  if(ea !== null) return Math.round((p * h - ea) * 100) / 100;
  return Math.round((p * h - w * S_WIN - d * S_DOOR) * 100) / 100;
}

/* Тип картинки — по содержимому, а не по слову сервера [чат 032].
   Ветка /file отдавала настоящий JPEG с заголовком application/octet-stream:
   узел «Ответить файлом» берёт тип из свойства файла Telegram, а оно пустое.
   Сервер починен тем же чатом, но панель не должна зависеть от честности
   заголовка — файлы старых загрузок лежат в Telegram как есть, и заголовок
   у них появится только при перезаливке. Правило шире случая: если содержимое
   можно проверить самому, проверка чужого ярлыка не должна быть единственной. */
const IMG_SIGS = [
  { t: "image/jpeg", b: [0xFF, 0xD8, 0xFF] },
  { t: "image/png",  b: [0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A] },
  { t: "image/gif",  b: [0x47, 0x49, 0x46, 0x38] },
  { t: "image/bmp",  b: [0x42, 0x4D] }
];
function fileCT(r){
  try{ return String((r.headers && r.headers.get("content-type")) || "").split(";")[0].trim().toLowerCase(); }
  catch(e){ return ""; }
}
async function blobHead(blob, n){
  try{
    const part = blob.slice(0, n);
    if(part.arrayBuffer) return new Uint8Array(await part.arrayBuffer());
    return await new Promise(res => {
      const fr = new FileReader();
      fr.onload = () => res(new Uint8Array(fr.result));
      fr.onerror = () => res(new Uint8Array(0));
      fr.readAsArrayBuffer(part);
    });
  }catch(e){ return new Uint8Array(0); }
}
async function sniffImage(blob){
  if(!blob || !blob.size) return "";
  const h = await blobHead(blob, 16);
  for(const s of IMG_SIGS){
    let ok = h.length >= s.b.length;
    for(let i = 0; ok && i < s.b.length; i++) if(h[i] !== s.b[i]) ok = false;
    if(ok) return s.t;
  }
  if(h.length >= 12 && h[0] === 0x52 && h[1] === 0x49 && h[2] === 0x46 && h[3] === 0x46 &&
     h[8] === 0x57 && h[9] === 0x45 && h[10] === 0x42 && h[11] === 0x50) return "image/webp";
  return "";
}

async function objShowPlan(){
  const box = document.getElementById("objPlanBox");
  const p = objPlan();
  if(!box || !p) return;
  box.innerHTML = '<div class="m">Загружаю план…</div>';
  try{
    const q = "draft=" + encodeURIComponent(p.id) + "&initData=" + encodeURIComponent(INIT) + "&key=" + encodeURIComponent(KEY);
    const r = await fetch(API + "/file?" + q);
    if(!r.ok){ console.warn("file: HTTP " + r.status); throw new Error("Сервер не отдал изображение"); }
    const raw = await r.blob();
    const hdr = fileCT(r);
    const type = (hdr.indexOf("image/") === 0) ? hdr : await sniffImage(raw);
    if(!type){ console.warn("file: тип «" + hdr + "», байт " + ((raw && raw.size) || 0)); throw new Error("Сервер не отдал изображение"); }
    const b = (raw.type === type) ? raw : new Blob([raw], { type: type });
    const u = URL.createObjectURL(b);
    box.innerHTML = '<img src="' + u + '" alt="План БТИ" style="width:100%;border-radius:12px;display:block">' +
      '<div class="m" style="margin-top:6px">Загружен ' + esc(p.at || "") + " · " + esc(p.who || "") + "</div>";
  }catch(e){
    box.innerHTML = '<div class="m" style="color:#ff453a">План не открылся: ' + esc(e.message) + "</div>";
  }
}

/* Своя камера [чат 029.2]. Живой проход: «выбрал "сфотографировать" —
   инструмент не вижу». Внутри Telegram WebView атрибут capture у <input>
   игнорируется, открывается тот же выбор из галереи, а метода «сними фото»
   у Mini App SDK нет. Поэтому видоискатель свой: поток с задней камеры,
   кадр снимается в canvas и уходит в тот же предпросмотр с поворотом.
   Где getUserMedia недоступен (старый webview, отказ в доступе) — честный
   откат к выбору файла с объяснением, а не молчаливое «ничего не произошло». */
let objStream = null;

function objCamStop(){
  try{ if(objStream) objStream.getTracks().forEach(t => t.stop()); }catch(e){}
  objStream = null;
  const b = document.getElementById("objCamBox");
  if(b) b.remove();
}

async function objCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast("Камера недоступна в этом клиенте — открываю выбор снимка", "wait");
    objInput(true); return;
  }
  try{
    objStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
  }catch(e){
    toast("Камера не открылась — открываю выбор снимка", "wait");
    objInput(true); return;
  }
  const box = document.createElement("div");
  box.id = "objCamBox";
  box.style.cssText = "position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column";
  box.innerHTML =
    '<div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center">' +
      '<video id="objCamV" playsinline autoplay muted style="max-width:100%;max-height:100%"></video>' +
    "</div>" +
    '<div style="display:flex;gap:8px;padding:14px calc(14px + env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom))">' +
      '<button id="objCamNo" style="flex:1;padding:14px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
      '<button id="objCamGo" style="flex:2;padding:14px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Снять</button>' +
    "</div>";
  document.body.appendChild(box);
  const v = box.querySelector("#objCamV");
  try{ v.srcObject = objStream; }catch(e){}
  box.querySelector("#objCamNo").onclick = () => objCamStop();
  box.querySelector("#objCamGo").onclick = () => {
    let file = null;
    try{
      const c = document.createElement("canvas");
      c.width = v.videoWidth || 1280; c.height = v.videoHeight || 960;
      const x = c.getContext("2d");
      if(!x) throw new Error("нет контекста");
      x.drawImage(v, 0, 0, c.width, c.height);
      c.toBlob(b => {
        objCamStop();
        if(!b){ toast("Снимок не получился — попробуйте выбрать файл", "err"); return; }
        objPreview(new File([b], "plan.jpg", { type: "image/jpeg" }));
      }, "image/jpeg", 0.92);
      return;
    }catch(e){
      objCamStop();
      toast("Снять не вышло — открываю выбор снимка", "wait");
      objInput(true);
    }
    return file;
  };
}

/* Предпросмотр до отправки: человек видит, что снял, и доворачивает план.

  box.innerHTML =

      '<div style="font-weight:700;margin-bottom:8px">Проверьте снимок</div>' +
      '<div style="overflow:hidden;border-radius:12px;background:#000;display:flex;align-items:center;justify-content:center;min-height:180px">' +
        '<img id="objPrevImg" alt="План БТИ" style="max-width:100%;max-height:52vh;display:block;transition:transform .2s">' +
      "</div>" +
      '<div style="display:flex;gap:8px;margin-top:12px">' +
        '<button id="objRotL" style="flex:1;padding:12px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Повернуть</button>' +
        '<button id="objSend" style="flex:1;padding:12px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Загрузить</button>' +
      "</div>" +
      '<button id="objPrevNo" style="width:100%;padding:12px;border-radius:12px;border:0;background:transparent;color:#8e8e93;font-size:15px;margin-top:6px">Отмена</button>' +
    "</div>";
  document.body.appendChild(box);
  const img = box.querySelector("#objPrevImg");
  try{ img.src = URL.createObjectURL(file); }catch(e){}
  box.querySelector("#objPrevNo").onclick = () => { box.remove(); objFile = null; };
  box.querySelector("#objRotL").onclick = () => {
    objRot = (objRot + 90) % 360;
    img.style.transform = "rotate(" + objRot + "deg)";
    img.style.maxHeight = (objRot % 180 === 90) ? "38vh" : "52vh";
  };
  box.querySelector("#objSend").onclick = async () => {
    box.remove();
    const f = objFile; objFile = null;
    if(!f) return;
    let out = f;
    if(objRot % 360 !== 0){
      try{ out = await objRotate(f, objRot); }
      catch(e){ toast("Повернуть не вышло — отправляю как есть", "wait"); out = f; }
    }
    objUpload(out);
  };
}

/* Поворот пикселями: canvas меняет местами стороны на 90 и 270 градусов.
   Имя файла сохраняем — сервер кладёт снимок в чат под ним. */
function objRotate(file, deg){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try{
        const swap = (deg % 180) === 90;
        const c = document.createElement("canvas");
        c.width  = swap ? img.height : img.width;
        c.height = swap ? img.width  : img.height;
        const x = c.getContext("2d");
        x.translate(c.width / 2, c.height / 2);
        x.rotate(deg * Math.PI / 180);
        x.drawImage(img, -img.width / 2, -img.height / 2);
        c.toBlob(b => {
          if(!b){ reject(new Error("canvas пуст")); return; }
          resolve(new File([b], file.name || "plan.jpg", { type: "image/jpeg" }));
        }, "image/jpeg", 0.92);
      }catch(e){ reject(e); }
    };
    img.onerror = () => reject(new Error("снимок не открылся"));
    try{ img.src = URL.createObjectURL(file); }catch(e){ reject(e); }
  });
}

/* Загрузка документа объекта. Снимок уходит в личный чат человека с ботом
   и оттуда живёт как файл системы: своего хранилища у приложения нет,
   а копия в чате — заодно его собственный архив. */
async function objUpload(file){
  if(!file){ return; }
  if(file.size > 8 * 1024 * 1024){ toast("Снимок больше 8 МБ — сожмите", "err"); return; }
  toast("Загружаю план…", "wait");
  try{
    const fd = new FormData();
    fd.append("image", file, file.name || "plan.jpg");
    fd.append("initData", INIT);
    fd.append("key", KEY);
    fd.append("kind", "план");
    fd.append("title", "план БТИ объекта");
    const r = await fetch(API + "/upload", { method: "POST", body: fd });
    const t = (await r.text()).trim();
    let ok = false; try{ ok = !!(t && JSON.parse(t).ok); }catch(e){}
    if(!r.ok || !ok) throw new Error("Сервер не принял снимок");
    toast("План загружен");
    await load();
    objShowPlan();
  }catch(e){ toast(e.message, "err"); }
}

/* Построение схемы из того, что уже введено [чат 031]. Распознавать план БТИ
   картинкой мы не умеем и не обещаем: план уже прожит человеком, когда он
   вводил обмеры и смежность. По ребру графа — внутренний проём, по числу окон
   — окна на улицу, лишние двери сверх числа соседей — внешние. Тип угадывается
   числами: пока у обеих сторон осталась неизрасходованная дверь — это дверь,
   иначе проём. Заготовка не претендует на истину, она даёт что править. */
function elemPlan(){
  const rooms = roomList();
  const left = {};
  rooms.forEach(r => { left[r.code] = { d: Number(r.doors) || 0, w: Number(r.windows) || 0 }; });
  const seen = {}, out = [];
  const pairs = [];
  (D.adjacency || []).forEach(a => (a.near || []).forEach(b => {
    const k = [a.code, b].sort().join("|");
    if(seen[k]) return;
    seen[k] = 1; pairs.push(k.split("|"));
  }));
  pairs.sort((x, y) => (x[0] + x[1]).localeCompare(y[0] + y[1], "ru"));
  pairs.forEach(p => {
    const a = p[0], b = p[1];
    const la = left[a] || { d: 0 }, lb = left[b] || { d: 0 };
    const isDoor = la.d > 0 && lb.d > 0;
    if(isDoor){ la.d--; lb.d--; }
    out.push({ a: a, b: b, fact: isDoor ? "дверь" : "проём" });
  });
  rooms.forEach(r => {
    const l = left[r.code] || { d: 0, w: 0 };
    for(let i = 0; i < l.w; i++) out.push({ a: r.code, b: "улица", fact: "окно" });
    for(let i = 0; i < l.d; i++) out.push({ a: r.code, b: "подъезд", fact: "дверь" });
  });
  return out;
}

function objGoRoom(code){

     быть scrollIntoView вовсе (и в jsdom его нет), а подсветка нужна всегда. */
  if(typeof el.scrollIntoView === "function"){
    try{ el.scrollIntoView({ behavior: "smooth", block: "center" }); }
    catch(e){ try{ el.scrollIntoView(); }catch(e2){} }

  setTimeout(() => { el.style.boxShadow = prev; }, 1400);
}

/* Окно разнесения: показать, как названная сумма ляжет на работы, и только

    '</div>');

async function allocApply(total){
  const plan = allocPlan(total);
  if(!plan.ok){ toast('Нечего записывать', 'err'); return; }
  const btn = document.getElementById('allocGo');
  if(btn && btn.disabled) return;                 // замок от двойного тапа
  if(btn){ btn.disabled = true; btn.textContent = 'Записываю…'; }
  let done = 0, fail = 0;
  for(const r of plan.rows){
    try{
      await writeCell('01_Работы', r.code, 'Цена_аллокация_USD', String(r.now).replace('.', ','));
      done++;
      if(btn) btn.textContent = 'Записываю… ' + done + ' из ' + plan.rows.length;
    }catch(e){ fail++; }
  }
  try{
    await writeCell('07_Настройки', 'Договор_USD', 'Значение', String(plan.sum).replace('.', ','));
  }catch(e){ fail++; }
  closeVSheet();
  toast(fail ? ('Записано ' + done + ', с ошибкой ' + fail) : ('Сумма разнесена по ' + done + ' работам'), fail ? 'err' : 'ok');
  await load();
  render();
}

/* Пересчёт стен и потолка по обмерам: предлагается кнопкой и никогда
   не делается молча — эти числа уже участвуют в объёмах работ. */
function roomApplyWalls(code){
  const r = roomList().find(x => x.code === code);
  if(!r) return;
  const w = roomWalls(r);
  if(w === null){ toast("Не хватает данных для расчёта", "err"); return; }
  const ceil = Number(r.floor_m2);
  const rows = ["Стены: " + fmt(r.wall_m2 || 0) + " → <b>" + fmt(w) + "</b> м²"];
  const alsoCeil = ceil > 0 && Math.abs(ceil - Number(r.ceiling_m2 || 0)) > 0.005;
  if(alsoCeil) rows.push("Потолок: " + fmt(r.ceiling_m2 || 0) + " → <b>" + fmt(ceil) + "</b> м²");
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px";
  box.innerHTML =
    '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;font-size:15px">' +
      '<div style="font-weight:700;margin-bottom:8px">' + esc(r.name) + "</div>" +
      '<div style="opacity:.75;font-size:14px;margin-bottom:12px">' + rows.join("<br>") +
      "<br><span style=\"opacity:.7\">Периметр × высота минус проёмы (окно " + fmt(S_WIN) + " м², дверь " + fmt(S_DOOR) + " м²).</span></div>" +
      '<div style="display:flex;gap:8px">' +
        '<button id="rwNo" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
        '<button id="rwYes" style="flex:1;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Записать</button>' +
      "</div></div>";
  document.body.appendChild(box);
  box.querySelector("#rwNo").onclick = () => box.remove();
  box.querySelector("#rwYes").onclick = async () => {
    box.remove();
    try{
      await writeCell("06_Помещения", code, "Стены_м2", String(w).replace(".", ","));
      if(alsoCeil) await writeCell("06_Помещения", code, "Потолок_м2", String(ceil).replace(".", ","));
      toast("Обмеры пересчитаны");
      await load();
      render();
    }catch(e){ toast(e.message, "err"); }
  };
}

/* ══════════════════════════════════════════════════════════════
   ИЗМЕНЕНИЯ СОСТАВА РАБОТ — подвижный договор [чат 008]
   Решения чата 006: заявляют обе стороны · состав и цена согласуются
   одним действием · цена уже принятых работ замораживается.

   Договор в 07_Настройки остаётся БАЗОЙ и не переписывается. Действующая
   сумма = база + принятые изменения, считается на лету. Так у каждой
   прибавки есть автор, время и след в 11_Изменения, а перезаписанное
   число этого не даёт: по нему не восстановить, из чего оно сложилось.
   ══════════════════════════════════════════════════════════════ */
/* Дробные деньги: fmt() режет копейки, а дельта изменения обязана сходиться
   с договором до цента. usd() показывает копейки только когда они есть. */
const usd = n => {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return Math.abs(v % 1) < 0.005 ? fmt(v) : v.toLocaleString('ru-RU', { minimumFractionDigits:2, maximumFractionDigits:2 });
};
const CH_LIVE  = ['Принято', 'Применено'];        // изменения, вошедшие в договор
const CH_KINDS = ['добавить', 'убрать', 'цена', 'объём', 'срок'];

const chgAll     = () => (D.changes || []);
const chgSt      = c => String((c && c.status) || '').trim();
const chgLive    = () => chgAll().filter(c => CH_LIVE.includes(chgSt(c)));
const chgPending = () => chgAll().filter(c => chgSt(c) === 'Заявлено');
const chgMine    = () => chgPending().filter(c => String(c.by || '') === String(D.who));
const chgTheirs  = () => chgPending().filter(c => String(c.by || '') !== String(D.who));
const chgToApply = () => chgAll().filter(c => chgSt(c) === 'Принято');
const chgDone    = () => chgAll().filter(c => ['Применено', 'Оспорено'].includes(chgSt(c)));

/* Действующий договор. База — то, что лежит в 07_Настройки (заказчику приходит
   в settings, работнику — в my_money). Дельта — сумма принятых изменений. */
function dealBase(){
  const S = D.settings || {};
  return Number(S['Договор_USD'] != null ? S['Договор_USD'] : ((D.my_money || {}).contract_usd || 0)) || 0;
}
function dealDelta(){ return Math.round(chgLive().reduce((a, c) => a + (Number(c.d_usd) || 0), 0) * 100) / 100; }
function dealSum(){ return Math.round((dealBase() + dealDelta()) * 100) / 100; }
function paidSum(){
  const S = D.settings || {};
  return Number(S['Оплачено_за_работу_USD'] != null ? S['Оплачено_за_работу_USD'] : ((D.my_money || {}).received_usd || 0)) || 0;
}
function dealRest(){ return Math.round((dealSum() - paidSum()) * 100) / 100; }
function dealDaysDelta(){ return Math.round(chgLive().reduce((a, c) => a + (Number(c.d_days) || 0), 0) * 10) / 10; }
function dealNote(){
  const d = dealDelta();
  if(!d) return '';
  return 'база ' + usd(dealBase()) + ' ' + (d > 0 ? '+' : '−') + ' изменения ' + usd(Math.abs(d));
}

/* Форма заявки. Живёт вне render(), поэтому переключение вида не теряет ввод. */
let CHG = { kind:'цена', code:'', room:'', section:'', name:'', unit:'', vol:'', rate:'', price:'', days:'', comment:'' };

function chgOpen(){
  const ks = chgKindsFor();
  CHG = { kind:(ks.indexOf('цена') >= 0 ? 'цена' : ks[0]), code:'', room:'', section:'', name:'', unit:'', vol:'', rate:'', price:'', days:'', comment:'' };
  go('chgnew');
}
function chgSet(field, el){
  CHG[field] = String(el.value == null ? '' : el.value).replace(',', '.').trim();
  const box = document.getElementById('chgPreview');
  if(box) box.innerHTML = chgPreview();
}
function chgPickKind(v){ if(chgKindsFor().indexOf(v) < 0) return; CHG.kind = v; render(); }
function chgPickWork(el){ CHG.code = el.value; render(); }

function chgWork(){ return (D.works || []).find(w => w.code === CHG.code) || null; }
const workPrice = w => Number((w && w.price_alloc_usd) || 0) || 0;
const workDur   = w => Number((w && w.dur) || 0) || 0;

/* Работы, доступные для изменения: принятые заморожены решением чата 006 —
   цена «Готово» не пересматривается, изменения действуют вперёд. */
function chgOpenWorks(){
  return (D.works || []).filter(w => w.status !== 'Готово' && w.status !== 'Снято');
}

function chgCalc(){
  const k = CHG.kind;
  if(k === 'добавить'){
    const vol = Number(CHG.vol) || 0, rate = Number(CHG.rate) || 0;
    if(!CHG.name || !CHG.room) return null;
    const sum = Math.round(vol * rate * 100) / 100;
    return { what:'Добавить работу', was:'—',
             now:[CHG.name, CHG.room, CHG.section || 'Изменение', CHG.unit || 'компл', vol, rate].join(' | '),
             d_usd:sum, d_days:Number(CHG.days) || 0,
             human:CHG.name + ' · ' + vol + ' ' + (CHG.unit || 'компл') + ' × ' + usd(rate) + ' = ' + usd(sum) + ' USD' };
  }
  const w = chgWork();
  if(!w) return null;
  if(k === 'убрать')
    return { what:'Убрать работу', was:usd(workPrice(w)) + ' USD', now:'снято',
             d_usd:-workPrice(w), d_days:-workDur(w),
             human:'из договора уйдёт ' + usd(workPrice(w)) + ' USD и ' + workDur(w) + ' дн' };
  if(k === 'цена'){
    if(CHG.price === '') return null;
    const np = Number(CHG.price) || 0;
    return { what:'Цена работы', was:usd(workPrice(w)) + ' USD', now:usd(np) + ' USD',
             d_usd:Math.round((np - workPrice(w)) * 100) / 100, d_days:0,
             human:'было ' + usd(workPrice(w)) + ' → станет ' + usd(np) + ' USD' };
  }
  if(k === 'объём'){
    if(CHG.vol === '') return null;
    const nv = Number(CHG.vol) || 0;
    const rate = Number(w.qty) > 0 ? workPrice(w) / Number(w.qty) : 0;
    const np = Math.round(nv * rate * 100) / 100;
    return { what:'Объём работы', was:w.qty + ' ' + (w.unit || ''), now:nv + ' ' + (w.unit || ''),
             d_usd:Math.round((np - workPrice(w)) * 100) / 100, d_days:0,
             human:'по ставке ' + usd(Math.round(rate * 100) / 100) + ' за единицу цена станет ' + usd(np) + ' USD' };
  }
  if(k === 'срок'){
    if(CHG.days === '') return null;
    const nd = Number(CHG.days) || 0;
    return { what:'Длительность', was:workDur(w) + ' дн', now:nd + ' дн',
             d_usd:0, d_days:Math.round((nd - workDur(w)) * 10) / 10,
             human:'было ' + workDur(w) + ' → станет ' + nd + ' дн' };
  }
  return null;
}

function chgPreview(){
  const c = chgCalc();
  if(!c) return '<span class="k" style="opacity:.6">Заполните поля — здесь появится, что именно уйдёт на согласование.</span>';
  const sign = c.d_usd > 0 ? '+' : (c.d_usd < 0 ? '−' : '');
  return '<div class="r"><span class="k">' + esc(c.what) + '</span><span class="v">' +
         (c.d_usd ? (sign + usd(Math.abs(c.d_usd)) + ' $') : '—') + '</span></div>' +
         '<div class="r"><span class="k" style="font-size:13px;opacity:.7">' + esc(c.human) + '</span><span class="v"></span></div>' +
         (c.d_days ? ('<div class="r"><span class="k" style="font-size:13px;opacity:.7">срок: ' + (c.d_days > 0 ? '+' : '') + c.d_days + ' дн</span><span class="v"></span></div>') : '') +
         '<div class="r"><span class="k">Договор станет</span><span class="v">' + usd(dealSum() + (Number(c.d_usd) || 0)) + ' $</span></div>';
}

/* Время в поясе объекта: сервер n8n живёт не по Ташкенту (грабля чата 006),
   поэтому метку ставит панель, а не сервер. */
function chgStamp(){
  const d = new Date(Date.now() + (5 * 60 + new Date().getTimezoneOffset()) * 60000);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

async function chgSubmit(){
  const c = chgCalc();
  if(!c){ toast('Заполните поля заявки', 'err'); return; }
  if(CHG.kind !== 'добавить' && !CHG.code){ toast('Выберите работу', 'err'); return; }
  if(!c.d_usd && !c.d_days){ toast('Изменение ничего не меняет', 'err'); return; }

  // код строки для новой работы: продолжаем нумерацию помещения
  let code = CHG.code;
  if(CHG.kind === 'добавить'){
    const room = (D.rooms || []).find(r => r.name === CHG.room);
    const pref = room ? room.code : 'NEW';
    const used = (D.works || []).filter(w => String(w.code || '').indexOf(pref + '-') === 0)
      .map(w => parseInt(String(w.code).split('-')[1], 10) || 0);
    code = pref + '-' + String((used.length ? Math.max.apply(null, used) : 0) + 1).padStart(2, '0');
  }

  const row = {
    'id': 'CH-' + Date.now().toString(36).toUpperCase(),
    'Время': chgStamp(),
    'Инициатор': D.who,
    'Вид': CHG.kind,
    'Код_работы': code,
    'Что_меняем': c.what,
    'Было': c.was,
    'Стало': c.now,
    'Дельта_USD': c.d_usd || 0,
    'Дельта_дней': c.d_days || 0,
    'Статус': 'Заявлено',
    'Решил': '',
    'Комментарий': CHG.comment || '',
  };
  toast('Отправляю на согласование…', 'wait');
  try{
    const r = await fetch(API + '/append', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ initData:INIT, key:KEY, sheet:'11_Изменения', rows:[row] })
    });
    const t = (await r.text()).trim();
    if(!r.ok || !t) throw new Error('Не удалось отправить заявку');
    toast('Заявлено — ждёт ответа второй стороны');
    await load();
    back();
  }catch(e){ toast(e.message, 'err'); }
}

/* Принятие = согласие. Применение к смете идёт следом, если у принимающего
   есть права на запись договорных полей; иначе заявка ждёт заказчика. */
async function chgAccept(id){
  const c = chgAll().find(x => String(x.id) === String(id));
  if(!c) return;
  if(String(c.by || '') === String(D.who)){ toast('Свою заявку принимает вторая сторона', 'err'); return; }
  try{
    await writeCell('11_Изменения', c.id, 'Статус', 'Принято');
    await writeCell('11_Изменения', c.id, 'Решил', D.who);
    /* Часы применяет принявшая сторона независимо от роли: право писать
       «Время» в «Табеле» есть у обеих, а ждать заказчика бессмысленно —
       он же и мог быть заявителем [чат 027]. */
    if(['admin', 'owner'].includes(D.role) || String(c.kind || '').trim() === TMC_KIND){
      await chgApply(id, true);
    }else{
      toast('Принято — заказчик применит к смете');
      await load();
    }
  }catch(e){ toast(e.message, 'err'); }
}

async function chgDispute(id){
  const c = chgAll().find(x => String(x.id) === String(id));
  if(!c) return;
  try{
    await writeCell('11_Изменения', c.id, 'Статус', 'Оспорено');
    await writeCell('11_Изменения', c.id, 'Решил', D.who);
    toast('Оспорено — заявка не вошла в договор');
    await load();
  }catch(e){ toast(e.message, 'err'); }
}

/* Применение принятой заявки к 01_Работы. Цена считается от дельты, а не
   разбором текста: дельта — то, что стороны согласовали, и именно она
   должна сойтись с договором. */
async function chgApply(id, quiet){
  const c = chgAll().find(x => String(x.id) === String(id));
  if(!c) return;
  const k = String(c.kind || '').trim();
  const w = (D.works || []).find(x => x.code === c.code);
  try{
    if(k === 'добавить'){
      const p = String(c.now || '').split('|').map(x => x.trim());
      const vol = Number(p[4]) || 0, rate = Number(p[5]) || 0;
      const r = await fetch(API + '/append', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ initData:INIT, key:KEY, sheet:'01_Работы', rows:[{
          'Код': c.code, 'Помещение': p[1] || '', 'Раздел': p[2] || 'Изменение', 'Работа': p[0] || '',
          'Ед': p[3] || '', 'Объём': vol, 'Ставка_USD': rate || '',
          'Категория': 'Изменение',
          'Цена_аллокация_USD': Math.round(vol * rate * 100) / 100,
          'Статус': 'Не начато', 'Готовность_%': 0,
          'Длительность_дней': (Number(c.d_days) > 0 ? Number(c.d_days) : ''),
          'Источник': 'изменение ' + c.id, 'Зависит_от': '—',
        }] })
      });
      const t = (await r.text()).trim();
      if(!r.ok || !t) throw new Error('Не удалось добавить работу в смету');
    }else if(k === 'убрать'){
      await writeCell('01_Работы', c.code, 'Статус', 'Снято');
    }else if(k === 'цена'){
      if(!w) throw new Error('Работа ' + c.code + ' не найдена');
      await writeCell('01_Работы', c.code, 'Цена_аллокация_USD', Math.round((workPrice(w) + (Number(c.d_usd) || 0)) * 100) / 100);
    }else if(k === 'объём'){
      if(!w) throw new Error('Работа ' + c.code + ' не найдена');
      await writeCell('01_Работы', c.code, 'Объём', parseFloat(String(c.now)) || 0);
      await writeCell('01_Работы', c.code, 'Цена_аллокация_USD', Math.round((workPrice(w) + (Number(c.d_usd) || 0)) * 100) / 100);
    }else if(k === TMC_KIND){
      /* Время правится в том же листе, где живёт отметка. Статус её не трогаем:
         она уже решена, меняется только время — а прежнее остаётся следом в
         комментарии, чтобы через месяц спор был с чем сверить (та же логика,
         что у отчётов бригады: слова работника остаются в «Значение»). */
      const t = tmcRow(c.code);
      const nt = String(c.now || '').trim();
      if(!/^\d{2}:\d{2}$/.test(nt)) throw new Error('Время правки испорчено: ' + nt);
      await crewCell('Табель', c.code, 'Время', nt);
      const note = (t && t.comment ? String(t.comment) + ' · ' : '') +
        'время ' + String(c.was || '') + ' → ' + nt + ' по заявке ' + c.id + ' (решил ' + D.who + ')';
      await crewCell('Табель', c.code, 'Комментарий', note);
      if(t){ t.time = nt; t.comment = note; }
    }else if(k === 'срок'){
      if(!w) throw new Error('Работа ' + c.code + ' не найдена');
      await writeCell('01_Работы', c.code, 'Длительность_дней', parseFloat(String(c.now)) || 0);
    }
    await writeCell('11_Изменения', c.id, 'Статус', 'Применено');
    toast(k === TMC_KIND ? 'Правка принята — время в табеле изменено' : (quiet ? 'Принято и внесено в смету' : 'Внесено в смету'));
    await load();
    if(k === TMC_KIND) await crewLoad();
  }catch(e){
    toast('Принято, но применить не удалось: ' + e.message, 'err');
    await load();
  }
}


/* ══════════════════════════════════════════════════════════════
   ВЫБОРОЧНАЯ СКИДКА — этап C2 [чат 019]
   Скидка на отдельные работы — не новая сущность в данных, а ПАКЕТ
   заявок вида «цена» с общим маркером [PK-…] в начале комментария:
   у каждой работы своя строка в 11_Изменения (свой след «было → стало»),
   а панель показывает их одной карточкой и решает одним нажатием.
   Договор считается прежним способом — база + Σ дельт принятых заявок,
   поэтому скидка автоматически видна в «Финансах» и на главном экране.
   Два режима: процентом и «итоговой суммой за выбранное» (пропорционально,
   с добором остатка в последнюю строку — итог обязан сойтись до цента).
   ══════════════════════════════════════════════════════════════ */
const DSC_MAX = 40;   /* больше строк за пакет — принятие становится слишком долгим */
let DSC = { mode:'pct', pct:'', sum:'', pick:{}, comment:'' };
let DSC_BUSY = false;   /* замок от повторного входа: двойной тап = второй круг [грабля 012] */

/* Скидку на договорные цены предлагает та сторона, которой сервер отдаёт
   разнесение (price_alloc_usd) — то есть заказчик. */
const dscCan = () => ['admin','owner'].includes(D.role);
const dscRoomName = w => String((w && w.room) || '—').split(' (')[0];
const dscNum = s => Number(String(s == null ? '' : s).replace(/[^0-9,.\-]/g, '').replace(',', '.')) || 0;

function dscOpen(){
  DSC = { mode:'pct', pct:'', sum:'', pick:{}, comment:'' };
  go('discount');
}
function dscWorks(){ return chgOpenWorks().filter(w => workPrice(w) > 0); }
function dscPicked(){ return dscWorks().filter(w => DSC.pick[w.code]); }
function dscToggle(code){
  if(DSC.pick[code]) delete DSC.pick[code]; else DSC.pick[code] = 1;
  dscRefresh();
}
function dscRoomPick(room, on){
  dscWorks().filter(w => dscRoomName(w) === room).forEach(w => {
    if(on) DSC.pick[w.code] = 1; else delete DSC.pick[w.code];
  });
  render();
}
function dscSet(field, el){
