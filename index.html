<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ремонт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:   var(--tg-theme-bg-color, #17212b);
  --sec:  var(--tg-theme-secondary-bg-color, #232e3c);
  --txt:  var(--tg-theme-text-color, #ffffff);
  --hint: var(--tg-theme-hint-color, #7d8b99);
  --btn:  var(--tg-theme-button-color, #5288c1);
  --btxt: var(--tg-theme-button-text-color, #ffffff);
  --ok:#4dcd5e; --warn:#f5a623; --bad:#e5484d; --link:#6ab3f3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  padding:14px 14px 40px;overscroll-behavior-y:contain}

.hello{font-size:19px;font-weight:600}
.sub{font-size:12px;color:var(--hint);margin-bottom:14px}

.stat{background:var(--sec);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.stat .r{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;gap:10px}
.stat .k{font-size:13px;color:var(--hint)}
.stat .v{font-size:16px;font-weight:600;white-space:nowrap}
.stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)} .stat .v.bad{color:var(--bad)}
.bar{height:6px;background:rgba(125,139,153,.25);border-radius:3px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .4s}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sec);border:none;border-radius:14px;padding:18px 10px;color:var(--txt);
  cursor:pointer;text-align:center;font:inherit;transition:transform .1s}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:27px;display:block;margin-bottom:6px}
.tile .nm{font-size:13px;font-weight:600;line-height:1.25}
.tile .h{font-size:11px;color:var(--hint);margin-top:3px}
.tile.pri{background:var(--btn);color:var(--btxt)}
.tile.pri .h{opacity:.85;color:inherit}

.card{background:var(--sec);border-radius:12px;padding:14px;margin-bottom:10px}
.card .lbl{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;gap:10px;
  border-bottom:1px solid rgba(125,139,153,.16)}
.li:last-child{border:none}
.li .n{font-size:14px;flex:1;min-width:0}
.li .d{font-size:11px;color:var(--hint);margin-top:2px}
.li .v{font-size:14px;font-weight:600;white-space:nowrap}

select,input{background:var(--bg);border:1px solid rgba(125,139,153,.3);color:var(--txt);
  padding:8px 10px;border-radius:9px;font:inherit;font-size:14px;width:100%}
input[type=number]{text-align:center}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row label{font-size:12px;color:var(--hint);flex:0 0 96px}

.filt{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt button{background:var(--sec);border:none;color:var(--hint);padding:7px 13px;border-radius:20px;
  font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.filt button.on{background:var(--btn);color:var(--btxt)}

.work{background:var(--sec);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.work.done{opacity:.55}
.work .t{font-size:14px;font-weight:500;line-height:1.3}
.work .m{font-size:11px;color:var(--hint);margin-top:3px}

.warnbox{background:rgba(245,166,35,.13);border:1px solid rgba(245,166,35,.32);border-radius:12px;
  padding:13px;margin-bottom:12px;font-size:14px;line-height:1.5}
.warnbox b{color:var(--warn)}
.mainbtn{width:100%;background:var(--btn);color:var(--btxt);border:none;border-radius:11px;
  padding:13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:11px}

.load{text-align:center;padding:70px 20px;color:var(--hint)}
.err{background:rgba(229,72,77,.13);border:1px solid rgba(229,72,77,.4);border-radius:12px;
  padding:15px;font-size:14px;line-height:1.55}
.toast{position:fixed;left:14px;right:14px;bottom:18px;background:var(--ok);color:#06240c;
  padding:12px;border-radius:11px;text-align:center;font-weight:600;font-size:14px;
  opacity:0;transform:translateY(12px);transition:.22s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
.toast.bad{background:var(--bad);color:#fff}
.toast.wait{background:var(--sec);color:var(--hint)}

/* ── ГОЛОСОВОЙ ВВОД: модальное окно, индикатор, результат ── */
.vmask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
  justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:.2s}
.vmask.on{opacity:1;pointer-events:auto}
.vsheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(20px);transition:.24s}
.vmask.on .vsheet{transform:none}
.vsheet .vh{font-size:17px;font-weight:600;margin-bottom:4px}
.vsheet .vs{font-size:12px;color:var(--hint);margin-bottom:14px}

.vrec{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 6px}
.vmic{width:84px;height:84px;border-radius:50%;background:var(--btn);display:flex;align-items:center;
  justify-content:center;font-size:38px}
.vmic.rec{animation:pulse 1.2s ease-out infinite;background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}100%{box-shadow:0 0 0 26px rgba(229,72,77,0)}}
.vtime{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.vwave{display:flex;gap:3px;align-items:center;height:20px}
.vwave i{width:3px;background:var(--hint);border-radius:2px;animation:wv 1s ease-in-out infinite}
.vwave i:nth-child(2){animation-delay:.15s}.vwave i:nth-child(3){animation-delay:.3s}
.vwave i:nth-child(4){animation-delay:.45s}.vwave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:6px}50%{height:20px}}

.vrow{display:flex;gap:10px;margin-top:16px}
.vrow button{flex:1;border:none;border-radius:11px;padding:13px;font:inherit;font-size:15px;
  font-weight:600;cursor:pointer}
.vbtn-ok{background:var(--btn);color:var(--btxt)}
.vbtn-cancel{background:var(--sec);color:var(--txt)}
.vbtn-bad{background:var(--bad);color:#fff}

.vitem{display:flex;gap:11px;align-items:flex-start;background:var(--sec);border-radius:11px;
  padding:12px;margin-bottom:8px;cursor:pointer}
.vitem .vchk{width:22px;height:22px;border-radius:6px;border:2px solid var(--hint);flex:0 0 22px;
  margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.vitem.sel .vchk{background:var(--ok);border-color:var(--ok)}
.vitem .vt{font-size:14px;font-weight:500;line-height:1.3}
.vitem .vd{font-size:12px;color:var(--hint);margin-top:2px}
.vitem .vv{font-size:13px;margin-top:3px}
.vitem .vv b{color:var(--ok)}
.vquote{background:var(--sec);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--hint);
  margin-bottom:12px;line-height:1.45}
.vquote b{color:var(--txt);font-weight:500}
.vspin{width:34px;height:34px;border:3px solid rgba(125,139,153,.3);border-top-color:var(--btn);
  border-radius:50%;animation:spin .8s linear infinite;margin:8px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app"><div class="load">Загружаю…</div></div>
<div class="toast" id="toast"></div>

<!-- Модальное окно голосового ввода -->
<div class="vmask" id="vmask"><div class="vsheet" id="vsheet"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Адрес n8n. Уже прописан — менять не надо.
   ═══════════════════════════════════════════════════════════════ */
const API = "https://n8n.nc-lab.uz/webhook/remont";

/* Идентификация — по ЛИЧНОСТИ из Telegram (initData), а не по ключу в ссылке.
   Сервер проверяет подпись Telegram его публичным ключом (токен бота не нужен)
   и определяет роль по Telegram-ID из листа 09_Доступы. Подменить роль с клиента
   или подставить чужой ключ нельзя. KEY оставлен запасным входом на переходный
   период и для отладки в обычном браузере (вне Telegram initData недоступен).   */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const INIT = (tg && tg.initData) || "";                              // подписанные данные Telegram
const KEY  = new URLSearchParams(location.search).get("key") || "";  // legacy / отладка вне Telegram

let D = null;                       // данные с сервера
let stack = ["home"];               // стек навигации
let fRoom = "";                     // активный фильтр по комнате
let hideDone = false;               // глобальный фильтр «скрыть готовое»
const app = document.getElementById("app");
const fmt = n => (Number(n) || 0).toLocaleString("ru-RU", { maximumFractionDigits: 0 });

/* Бот пишет в таблицу произвольные названия материалов. Одна кавычка в имени
   сломала бы разметку — поэтому всё, что пришло с сервера, экранируем.        */
const esc  = t => String(t ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const attr = t => esc(t);

/* ── ЗАГРУЗКА ─────────────────────────────────────────────── */
async function load(){
  try{
    const auth = INIT ? `initData=${encodeURIComponent(INIT)}`
                      : `key=${encodeURIComponent(KEY)}`;
    const r = await fetch(`${API}/data?${auth}`, { cache: "no-store" });
    const BAD = "Доступ не подтверждён — откройте панель через бота в Telegram.";
    if(r.status === 401 || r.status === 403) throw new Error(BAD);
    if(!r.ok) throw new Error("Сервер не отвечает (HTTP " + r.status + ")");
    /* При неверном ключе n8n обрывает цепочку и отдаёт пустое тело с кодом 200.
       Данные не утекают, но и JSON не приходит — трактуем это как отказ в доступе. */
    const raw = (await r.text()).trim();
    if(!raw) throw new Error(BAD);
    try{ D = JSON.parse(raw); }catch{ throw new Error(BAD); }
    if(!D || !D.role) throw new Error(BAD);
    render();
    _sig = _snapshot(D);            // калибровка живого обновления
  }catch(e){
    app.innerHTML = `<div class="err"><b>Не удалось загрузить.</b><br>${e.message}
      <br><br><span style="color:var(--hint);font-size:13px">Проверьте интернет и откройте ещё раз.</span></div>`;
  }
}

/* ── ЗАПИСЬ ───────────────────────────────────────────────────
   Не перечитываем всё после каждой правки — правим локально.
   Иначе на 102 работах экран моргает и уезжает наверх.        */
/* ═══ Зависимости работ · мягкое предупреждение ═══════════════════════
   Предшественники берутся из колонки «Зависит_от» листа 01_Работы
   (приходит в поле deps). Зависимость снята, когда предшественник
   «Готово» или «Снято». Предупреждение НЕ блокирует: карта связей
   черновая, и ошибка в ней не должна стопорить реальную работу.     */
function depCodes(w){
  const raw = String((w && w.deps) || "").trim();
  if (!raw || raw === "—" || raw === "-") return [];
  return raw.split(",").map(s => s.trim()).filter(Boolean);
}
function depBlockers(w){
  if (!D || !D.works || !w) return [];
  return depCodes(w)
    .map(c => D.works.find(x => x.code === c))
    .filter(p => p && p.status !== "Готово" && p.status !== "Снято");
}
function depAsk(w, blockers){
  return new Promise(resolve => {
    const rows = blockers.map(b =>
      '<div style="margin:8px 0;padding:8px 10px;background:rgba(255,255,255,.07);border-radius:10px">' +
      '<b>' + esc(b.name) + '</b><br><span style="opacity:.65;font-size:13px">' +
      esc(String(b.room || "").split(" (")[0]) + ' · ' + esc(b.status) + '</span></div>').join("");
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px";
    box.innerHTML =
      '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:80vh;overflow:auto;font-size:15px">' +
        '<div style="font-weight:700;margin-bottom:8px">⚠ Предыдущее ещё не принято</div>' +
        '<div style="opacity:.7;font-size:14px;margin-bottom:6px">«' + esc(w.name) + '» обычно делается после того, как принято:</div>' +
        rows +
        '<div style="opacity:.6;font-size:13px;margin:10px 0 14px">Это подсказка, а не запрет. Если на объекте порядок другой — продолжайте.</div>' +
        '<div style="display:flex;gap:8px">' +
          '<button id="depNo" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
          '<button id="depYes" style="flex:1;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Всё равно заявить</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(box);
    box.querySelector("#depNo").onclick  = () => { box.remove(); resolve(false); };
    box.querySelector("#depYes").onclick = () => { box.remove(); resolve(true);  };
  });
}

/* Баланс от приёмки: сколько из выданного аванса уже отработано принятыми
   работами. null — если считать не из чего (нет ни оплат, ни приёмки).  */
function advCalc(field){
  const acc  = accSum(field);
  const S2   = D.settings || {};
  const paid = Number(S2["Оплачено_за_работу_USD"] ?? (D.my_money && D.my_money.received_usd) ?? 0);
  if (!paid && !acc) return null;
  if (!paid)        return { k:"Принято работ",             main: fmt(acc) + " $",
                             sub:"Оплат пока не поступало", pct:0, color:"var(--ok)" };
  if (acc < paid)   return { k:"Отработано аванса",         main: fmt(acc) + " из " + fmt(paid) + " $",
                             sub:"Осталось отработать " + fmt(paid - acc) + " $",
                             pct: Math.max(1, Math.round(acc / paid * 100)), color:"var(--warn)" };
  if (acc === paid) return { k:"Аванс отработан полностью", main: fmt(paid) + " $",
                             sub:"Расчёты сошлись", pct:100, color:"var(--ok)" };
  return              { k:"Аванс отработан, к доплате",     main: fmt(acc - paid) + " $",
                        sub:"Принято на " + fmt(acc) + " $ при оплаченных " + fmt(paid) + " $",
                        pct:100, color:"var(--ok)" };
}

/* ═══ Цены Юрия: подсказка, разнесение, пакетная запись ═══════════════
   Пока колонка «Цена_Юрия_USD» пуста, работник не видит своей витрины
   приёмки. Панель показывает, сколько позиций осталось, принимает ставку
   голосом и умеет разнести общую сумму пропорционально договору.      */
function priceStats(){
  const all = (D.works || []);
  const set = all.filter(w => Number(w.price_contractor_usd) > 0);
  return { all: all.length, set: set.length, empty: all.length - set.length,
           sumSet: set.reduce((s,w) => s + Number(w.price_contractor_usd), 0) };
}
/* ══════════════════════════════════════════════════════════════
   ПРАЙС ИСПОЛНИТЕЛЯ — цены по видам работ из общей базы [чат 007]
   Справочник и прайс лежат в отдельной таблице, общей для всех
   объектов: цена задаётся один раз за вид работы и переезжает на
   следующий объект. Грузится по требованию, а не в каждом опросе —
   сервер отдаёт справочник только когда панель просит его явно.
   ══════════════════════════════════════════════════════════════ */
async function loadCatalog(force){
  if(D.catalog && !force) return true;
  const auth = INIT ? 'initData=' + encodeURIComponent(INIT) : 'key=' + encodeURIComponent(KEY);
  const r = await fetch(API + '/data?' + auth + '&catalog=1', { cache: 'no-store' });
  const raw = (await r.text()).trim();
  if(!r.ok || !raw) throw new Error('Не удалось загрузить справочник');
  let j; try{ j = JSON.parse(raw); }catch(e){ throw new Error('Не удалось загрузить справочник'); }
  D.catalog = j.catalog || { kinds: [], price: [] };
  return true;
}

async function openBook(){
  try{
    if(!D.catalog) toast('Загружаю справочник…');
    await loadCatalog();
    go('book');
  }catch(e){ toast(e.message, 'err'); }
}

function bookStats(){
  const rows = ((D.catalog || {}).price || []);
  const set  = rows.filter(p => Number(p.price_usd) > 0);
  return { all: rows.length, set: set.length, empty: rows.length - set.length };
}

async function savePrice(el){
  const code = el.getAttribute('data-code');
  const v = String(el.value ?? '').trim().replace(',', '.');
  if(v !== '' && !(Number(v) >= 0)){ toast('Не похоже на цену', 'err'); return; }
  el.disabled = true;
  try{
    await writeCell('Прайс_исполнителя', code, 'Цена_за_ед', v);
    const row = ((D.catalog || {}).price || []).find(p => p.code === code);
    if(row) row.price_usd = v === '' ? null : Number(v);
    const st = bookStats();
    const cap = document.getElementById('bookCap');
    if(cap) cap.textContent = 'Задано ' + st.set + ' из ' + st.all + (st.empty ? (' · не задано ' + st.empty) : ' · всё заполнено');
    el.style.borderColor = '#30d158';
    toast('Сохранено');
  }catch(e){ toast(e.message, 'err'); }
  el.disabled = false;
}

/* ══════════════════════════════════════════════════════════════
   ПРОФИЛЬ РЕМОНТА — сборка сметы из обмеров и прайса [чат 007]
   К помещению применяются виды работ; объём считается из его размеров
   по колонке «База_объёма» справочника, цена — из прайса исполнителя.
   Итог дописывается строками в 01_Работы через POST /remont/append.
   ══════════════════════════════════════════════════════════════ */
let PROF = { room: null, picked: {} };   // выбранное помещение и отмеченные виды

async function openProfile(){
  try{
    if(!D.catalog) toast('Загружаю справочник…');
    await loadCatalog();
    PROF = { room: null, picked: {} };
    go('profile');
  }catch(e){ toast(e.message, 'err'); }
}

function profRoom(){ return (D.rooms || []).find(r => r.code === PROF.room) || null; }

// Сколько единиц работы даёт помещение по базе объёма из справочника
function profVol(kind, room){
  if(!kind || !room) return null;
  const part = b => {
    if(b === 'пол')       return room.floor_m2;
    if(b === 'потолок')   return room.ceiling_m2;
    if(b === 'стены')     return room.wall_m2;
    if(b === 'периметр')  return room.perimeter_m;
    if(b === 'окна')      return room.windows;
    if(b === 'двери')     return room.doors;
    if(b === 'помещение' || b === 'объект') return 1;
    return null;
  };
  const base = String(kind.base || '').trim();
  if(!base || base === 'вручную') return null;
  let sum = 0;
  for(const p of base.split('+')){
    const v = part(p.trim());
    if(v === null || v === undefined || v === '') return null;   // нет данных — просим ввести руками
    sum += Number(v) || 0;
  }
  return Math.round(sum * 100) / 100;
}

function profPrice(code){
  const p = ((D.catalog || {}).price || []).find(x => x.code === code);
  if(p && Number(p.price_usd) > 0) return Number(p.price_usd);
  const k = ((D.catalog || {}).kinds || []).find(x => x.code === code);
  return (k && Number(k.base_usd) > 0) ? Number(k.base_usd) : 0;   // прайс пуст — ориентир из справочника
}

function profToggle(code){
  if(PROF.picked[code]) delete PROF.picked[code];
  else {
    const kind = ((D.catalog || {}).kinds || []).find(x => x.code === code);
    PROF.picked[code] = { vol: profVol(kind, profRoom()), manual: false };
  }
  render();
}

function profSetVol(el){
  const code = el.getAttribute('data-code');
  const v = String(el.value ?? '').trim().replace(',', '.');
  if(!PROF.picked[code]) return;
  PROF.picked[code].vol = v === '' ? null : Number(v);

function profTotal(){
  let n = 0, sum = 0, blank = 0;
  for(const code of Object.keys(PROF.picked)){
    const it = PROF.picked[code];
    n++;
    if(it.vol === null || !(Number(it.vol) > 0)) { blank++; continue; }
    sum += Number(it.vol) * profPrice(code);
  }
  return { n, sum: Math.round(sum * 100) / 100, blank };
}
function profTotalText(){
  const t = profTotal();
  return t.n ? ('Выбрано ' + t.n + ' · на ' + fmt(t.sum) + ' USD' + (t.blank ? (' · без объёма: ' + t.blank) : '')) : 'Ничего не выбрано';

    const deps = String(k.deps || '').split(',').map(x => x.trim()).filter(x => x && newCode[x]).map(x => newCode[x]);
    return {
      'Код': newCode[c],
      'Помещение': room.name,

      'Ед': k.unit || '',

      'Ставка_USD': rate || '',

  });

  const t = profTotal();

  try{
    const r = await fetch(API + '/append', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: INIT, key: KEY, sheet: '01_Работы', rows: rows })
    });
    const txt = (await r.text()).trim();
    if(!r.ok || !txt) throw new Error('Не удалось добавить работы');
    toast('Добавлено работ: ' + rows.length);
    PROF.picked = {};
    await load();
  }catch(e){ toast(e.message, 'err'); }
}

/* ══════════════════════════════════════════════════════════════
   СРОКИ — критический путь и шкала «опережение / отставание» [чат 007]
   Длительности приезжают в поле dur (черновая оценка из ставки чел-часа),
   связи — в поле deps. По ним считается самая длинная цепочка: она и есть
   срок объекта. Работы вне этой цепочки имеют запас и на финиш не влияют.
   ══════════════════════════════════════════════════════════════ */
function schedule(){
  const ws = (D.works || []).filter(w => w.code);
  const by = {}; ws.forEach(w => { by[w.code] = w; });
  const dur = w => (Number(w.dur) > 0 ? Number(w.dur) : 0.5);
  const depsOf = w => String(w.deps || '').split(',').map(s => s.trim())
    .filter(s => s && s !== '—' && by[s]);

  const ef = {};                       // ранний финиш, в днях от старта
  const calc = (code, seen) => {
    if(ef[code] !== undefined) return ef[code];
    if(seen[code]) return 0;           // страховка от цикла в карте связей
    seen[code] = 1;
    const w = by[code]; if(!w) return 0;
    const ds = depsOf(w);
    const start = ds.length ? Math.max.apply(null, ds.map(d => calc(d, Object.assign({}, seen)))) : 0;
    ef[code] = Math.round((start + dur(w)) * 100) / 100;
    return ef[code];
  };
  ws.forEach(w => calc(w.code, {}));
  const total = ws.length ? Math.max.apply(null, ws.map(w => ef[w.code] || 0)) : 0;

  const succ = {};                     // последователи
  ws.forEach(w => depsOf(w).forEach(d => { (succ[d] = succ[d] || []).push(w.code); }));
  const lf = {};                       // поздний финиш
  const late = (code, seen) => {
    if(lf[code] !== undefined) return lf[code];
    if(seen[code]) return total;
    seen[code] = 1;
    const ss = succ[code] || [];
    lf[code] = ss.length
      ? Math.min.apply(null, ss.map(s => late(s, Object.assign({}, seen)) - dur(by[s])))
      : total;
    return lf[code];
  };
  ws.forEach(w => late(w.code, {}));
  const slack = {}; ws.forEach(w => { slack[w.code] = Math.round(((lf[w.code] || 0) - (ef[w.code] || 0)) * 100) / 100; });
  const critical = ws.filter(w => Math.abs(slack[w.code]) < 0.01).map(w => w.code);
  return { ef, lf, slack, total, critical, by };
}

// Где мы во времени: сравниваем пройденное по плану с прошедшими днями
function timeCalc(){
  const s = schedule();
  const done = (D.works || []).filter(w => w.status === 'Готово' && w.code);
  const reached = done.length ? Math.max.apply(null, done.map(w => s.ef[w.code] || 0)) : 0;
  const dates = (D.works || []).map(w => String(w.updated || '').slice(0, 10)).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const start = dates.length ? new Date(dates[0] + 'T00:00:00') : null;
  const elapsed = start ? Math.max(0, Math.round((Date.now() - start.getTime()) / 86400000)) : null;
  const diff = (elapsed === null) ? null : Math.round((reached - elapsed) * 10) / 10;
  // Критический путь — это технологический минимум: столько займёт ремонт, если
  // на каждую готовую к работе позицию хватает людей. Реальный срок упирается в руки:
  // сумма всех длительностей, делённая на размер бригады. Берём больший из двух.
  const sumDur = (D.works || []).reduce((a, w) => a + (Number(w.dur) > 0 ? Number(w.dur) : 0.5), 0);
  const crew = Number((D.settings || {})['Рабочих_в_бригаде']) || 2;
  const byCrew = Math.round((sumDur / crew) * 10) / 10;
  const real = Math.max(Math.round(s.total * 10) / 10, byCrew);
  return { total: Math.round(s.total * 10) / 10, reached: Math.round(reached * 10) / 10, elapsed, diff,
           critical: s.critical, sched: s, startDate: dates[0] || null,
           sumDur: Math.round(sumDur * 10) / 10, crew, byCrew, real };
}

function spreadPrices(onlyEmpty){

async function upd(sheet, code, field, value, opts){
  // Работник не пишет «Готово» напрямую (ни голосом, ни вручную):
  // любое его «Готово» становится ЗАЯВКОЙ на приёмку заказчику.
  const claimed = (!(opts&&opts.confirm) && field === "Статус" && value === "Готово");
  /* Мягкая проверка зависимостей: если предшественник ещё не принят —
     спрашиваем, но не запрещаем (карта связей черновая).            */
  if (claimed && sheet === "01_Работы" && !(opts && opts.skipDeps)) {
    const _w = (D.works || []).find(x => x.code === code);
    const _b = depBlockers(_w);
    if (_b.length) {
      const _go = await depAsk(_w, _b);
      if (!_go) { toast("Отменено", "err"); return false; }
    }
  }
  if(claimed) value = (D.role === "worker") ? "Заявлено" : "На приёмке у работника";
  toast(claimed ? "Отправляю на приёмку…" : "Сохраняю…", "wait");
  try{
    const r = await fetch(`${API}/update`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: INIT, key: KEY, sheet, code, field, value })
    });
    /* При отказе сервер отдаёт пустой ответ с кодом 200 (n8n throw → пустое тело).
       Поэтому «успех» = ok И непустое тело; пустое тело трактуем как отказ.      */
    const t = (await r.text()).trim();
    if(!r.ok || !t){
      throw new Error(t.includes("403") ? "Это поле только для чтения" : "Не удалось сохранить");
    }
    patch(sheet, code, field, value);
    tg?.HapticFeedback?.notificationOccurred("success");
    toast(claimed ? (D.role === "worker" ? "Заявлено — ждёт приёмки заказчиком" : "Отправлено работнику на подтверждение") : "Сохранено");
    return true;
  }catch(e){
    tg?.HapticFeedback?.notificationOccurred("error");
    toast(e.message, "bad");
    load();                                   // откатить экран к правде сервера
    return false;
  }
}

/* локально отразить правку — чтобы прогресс и суммы пересчитались сразу */
function patch(sheet, code, field, value){
  if(sheet === "01_Работы"){
    const w = D.works.find(x => x.code === code);
    if(!w) return;
    if(field === "Статус")        w.status   = value;
    if(field === "Готовность_%")  w.progress = Number(value) || 0;
    if(field === "Цена_Юрия_USD") w.price_contractor_usd = value === "" ? null : Number(value);
    if(field === "Комментарий")   w.comment  = value;
    if(w.status === "Готово") w.progress = 100;
  }
  if(sheet === "03_Материалы"){
    const m = D.materials.find(x => x.name === code);
    if(!m) return;
    if(field === "Куплено")       m.in  = Number(value) || 0;
    if(field === "Израсходовано") m.out = Number(value) || 0;
    m.rest = (m.in || 0) - (m.out || 0);
  }
}

/* ── НАВИГАЦИЯ (стек, ровно один уровень вглубь) ───────────── */
function go(k){ stack.push(k); render(true); }
function back(){ if(stack.length > 1){ stack.pop(); render(true); } }

function render(toTop){
  const k = stack[stack.length - 1];
  app.innerHTML = (SCREENS[k] || SCREENS.home)();
  if(toTop) window.scrollTo(0, 0);
  if(tg){
    if(stack.length > 1){ tg.BackButton.show(); tg.BackButton.onClick(back); }
    else tg.BackButton.hide();
  }
}

const progress = () => D.works.length
  ? D.works.reduce((s,w) => s + (w.progress || 0), 0) / D.works.length : 0;

/* Деньги от приёмки. «Принято» — только статус «Готово» (подтверждено заказчиком).
   «В работе» — незавершённые, пропорционально проценту готовности (справочно).
   Поле: заказчику — договорная разнесённая цена, работнику — его цена. */
const accSum = f => D.works.filter(w => w.status === "Готово")
  .reduce((s,w) => s + (Number(w[f]) || 0), 0);
const wipSum = f => D.works.filter(w => w.status !== "Готово" && (w.progress || 0) > 0)
  .reduce((s,w) => s + (Number(w[f]) || 0) * (w.progress || 0) / 100, 0);

        ? `Из аванса на материалы <b>${fmt(chekiUZS)} сум</b> пока без чеков.<br>
           <span style="color:var(--hint);font-size:13px">Сфотографируйте их в боте — строка исчезнет.</span>`
        : `<b>${fmt(chekiUZS)} сум</b> из аванса 26.06 — без расшифровки.`}
    </div>` : "";

  return `
    <div class="hello">${esc(D.who)}, добрый день</div>
    <div class="sub">${new Date().toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}</div>
    ${head}${cheki}
    <div class="grid">
      <button class="tile pri" onclick="startVoice()">
        <span class="ic">🎤</span><span class="nm">Записать<br>голосом</span>
        <div class="h">трату или работу</div></button>
      <button class="tile pri" onclick="toBot()">
        <span class="ic">📷</span><span class="nm">Сфотографировать<br>чек</span>
        <div class="h">в чат с ботом</div></button>
      <button class="tile" onclick="go('money')"><span class="ic">💰</span>
        <span class="nm">${D.role === "worker" ? "Мои деньги" : "Финансы"}</span></button>
      <button class="tile" onclick="go('prices')" style="${(D.role === 'worker' || !priceStats().empty) ? 'display:none' : ''}">
        <span class="ic">🏷️</span><span class="nm">Цены Юрия</span>
        <div class="h">не задано ${priceStats().empty}</div></button>
      <button class="tile" onclick="openBook()">
        <span class="ic">📕</span><span class="nm">Прайс исполнителя</span>
        <div class="h">цены по видам работ</div></button>
      <button class="tile" onclick="openProfile()">
        <span class="ic">📐</span><span class="nm">Профиль ремонта</span>
        <div class="h">собрать смету по помещениям</div></button>
      <button class="tile" onclick="go('terms')">
        <span class="ic">📅</span><span class="nm">Сроки</span>
        <div class="h">критический путь и отставание</div></button>
      <button class="tile" onclick="go('checks')" style="${(D.role === 'worker' || !checkList().length) ? 'display:none' : ''}">
        <span class="ic">🧾</span><span class="nm">Чеки</span>
        <div class="h">ждут привязки ${checkList().length}</div></button>
      <button class="tile" onclick="go('works')"><span class="ic">🔨</span>
        <span class="nm">Работы</span><div class="h">${D.works.length} позиций</div></button>
      ${(true) ? `<button class="tile${D.works.filter(w=>w.status===(D.role==="worker"?"На приёмке у работника":"Заявлено")).length ? " pri" : ""}" onclick="go('accept')"><span class="ic">✅</span>
        <span class="nm">Приёмка</span><div class="h">${D.works.filter(w=>w.status===(D.role==="worker"?"На приёмке у работника":"Заявлено")).length} на подтверждение</div></button>` : ""}
      <button class="tile" onclick="go('buy')"><span class="ic">🛒</span>
        <span class="nm">Материалы</span></button>
      <button class="tile" onclick="go('deal')"><span class="ic">📋</span>
        <span class="nm">Что входит<br>в договор</span></button>
    </div>`;
},

works(){
  const worker = D.role === "worker";
  const rooms  = [...new Set(D.works.map(w => w.room))];
  const base   = fRoom ? D.works.filter(w => w.room === fRoom) : D.works;
  const doneN  = base.filter(w => w.status === "Готово").length;
  const list   = hideDone ? base.filter(w => w.status !== "Готово") : base;

  return `
    <div class="hello">Работы</div>
    <div class="sub">${list.length}${fRoom ? " из " + D.works.length : " позиций"}${hideDone && doneN ? ` · скрыто готовых: ${doneN}` : ""}</div>
    <div class="filt">
      <button class="${!fRoom ? "on" : ""}" onclick="fRoom='';render()">Все</button>
      ${rooms.map(r => `<button class="${fRoom===r?"on":""}" data-r="${attr(r)}"
        onclick="fRoom=this.dataset.r;render()">${esc(r.split(" (")[0])}</button>`).join("")}
    </div>
    <div class="filt">
      <button class="${hideDone ? "on" : ""}" onclick="hideDone=!hideDone;render()">${hideDone ? "Показать готовое" : "Скрыть готовое"}${doneN ? ` (${doneN})` : ""}</button>
    </div>
    ${list.map(w => `
      <div class="work${w.status === "Готово" ? " done" : ""}">
        <div class="t">${esc(w.name)}</div>
        <div class="m">${esc(w.room.split(" (")[0])} · ${esc(w.section)} · ${w.unit === "компл" ? "комплект" : w.qty + " " + esc(w.unit)}</div>
        ${(() => { const _b = (w.status === "Готово" || w.status === "Не начато") ? [] : depBlockers(w);
          return _b.length ? `<div class="m" style="color:var(--warn)">⏳ Сначала должно быть принято: ${_b.map(x => esc(x.name)).join(", ")}</div>` : ""; })()}
        ${w.status === "Оспорено" ? `<div class="m" style="color:var(--bad);font-weight:600">⚠ Заказчик оспорил — доработайте и заявите снова</div>` : ""}
        ${w.status === "Заявлено" ? `<div class="m" style="color:var(--warn)">⏳ Заявлено — ждёт приёмки заказчиком</div>` : ""}
        ${w.status === "На приёмке у работника" ? `<div class="m" style="color:var(--warn)">⏳ Ждёт приёмки работником</div>` : ""}
        <div class="row">
          <label>Статус</label>
          <select onchange="upd('01_Работы','${w.code}','Статус',this.value)">
            ${["Не начато","В работе","Заявлено","На приёмке у работника","Оспорено","Готово","Приостановлено","Снято"]
              .map(s => `<option${s === w.status ? " selected" : ""}>${s}</option>`).join("")}
          </select>
        </div>
        <div class="row">
          <label>Готово, %</label>
          <input type="number" min="0" max="100" step="10" value="${w.progress || 0}"
            onchange="upd('01_Работы','${w.code}','Готовность_%',this.value)">
        </div>
        ${worker ? `
        <div class="row">
          <label>Ваша цена, $</label>
          <input type="number" min="0" value="${w.price_contractor_usd ?? ""}" placeholder="— впишите"
            onchange="upd('01_Работы','${w.code}','Цена_Юрия_USD',this.value)">
        </div>` : `
        <div class="row">
          <label>Оценка</label>
          <div style="flex:1;font-weight:600;font-size:14px">
            ${w.price_alloc_usd ? "$" + Math.round(w.price_alloc_usd) : "—"}
            ${w.price_contractor_usd != null
              ? ` <span style="color:var(--hint);font-weight:400">· Юрий: $${w.price_contractor_usd}</span>` : ""}
          </div>
        </div>`}
      </div>`).join("")}`;
},

accept(){
  const worker = D.role === "worker"; const pend = D.works.filter(w => w.status === (worker ? "На приёмке у работника" : "Заявлено"));
  return `
    <div class="hello">Приёмка</div>
    <div class="sub">${pend.length ? pend.length + " на подтверждение" : "нет заявленных работ"}</div>
    ${pend.length ? pend.map(w => `
      <div class="work">
        <div class="t">${esc(w.name)}</div>
        <div class="m">${esc(w.room.split(" (")[0])} · ${esc(w.section)}</div>
        <div class="m" style="color:var(--warn)">${worker ? "Заказчик заявил готовность" : "Работник заявил готовность"}${w.price_contractor_usd != null ? ` · $${w.price_contractor_usd}` : ""}</div>
        <div class="row" style="gap:8px;margin-top:10px">
          <button style="flex:1;padding:12px;border:0;border-radius:10px;background:var(--ok);color:#fff;font-weight:600;font-size:15px" onclick="acceptWork('${w.code}')">Принять</button>
          <button style="flex:1;padding:12px;border:0;border-radius:10px;background:var(--bad);color:#fff;font-weight:600;font-size:15px" onclick="disputeWork('${w.code}')">Оспорить</button>
        </div>
      </div>`).join("") : `<div class="warnbox">${worker ? "Пока заказчик ничего не заявил к приёмке." : "Пока работник ничего не заявил к приёмке."}</div>`}`;
},

prices(){
  const st = priceStats();
  const empty = (D.works || []).filter(w => !(Number(w.price_contractor_usd) > 0));
  const dogovor = (D.settings && D.settings['Договор_USD']) || 0;
  const rows = empty.slice(0, 40).map(w =>
    '<div class="work"><div class="t">' + esc(w.name) + '</div>' +
    '<div class="m">' + esc(String(w.room||'').split(' (')[0]) + ' · ' + esc(w.section) + ' · ' +
    (w.unit === 'компл' ? 'комплект' : w.qty + ' ' + esc(w.unit)) +
    (w.price_alloc_usd ? ' · по договору ' + fmt(w.price_alloc_usd) + ' USD' : '') + '</div></div>').join('');
  return '' +
    '<div class="hello">Цены Юрия</div>' +
    '<div class="sub">Задано ' + st.set + ' из ' + st.all + (st.empty ? (' · не задано ' + st.empty) : ' · всё заполнено') + '</div>' +
    '<div class="stat">' +
      '<div class="r"><span class="k">Сумма заданных цен</span><span class="v">' + fmt(st.sumSet) + ' USD</span></div>' +
      '<div class="r"><span class="k">Договор, для ориентира</span><span class="v">' + fmt(dogovor) + ' USD</span></div>' +
    '</div>' +
    '<div class="warnbox">Скажите ставку голосом — панель посчитает цены сама.<br>' +
      '<span style="opacity:.7;font-size:13px">Например: «сдир потолков по доллару за квадрат, а в спальне по два» или «за всю электрику 300 долларов».</span>' +
      '<div style="margin-top:10px"><button onclick="startVoice()" style="width:100%;padding:12px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">🎤 Сказать ставку</button></div>' +
    '</div>' +
    '<div class="stat">' +
      '<div class="r"><span class="k">Разнести сумму пропорционально договору</span><span class="v"></span></div>' +
      '<div class="r"><input id="spSum" type="number" inputmode="decimal" value="' + (dogovor || '') + '" style="width:100%;padding:12px;border-radius:12px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:16px"></div>' +
      '<div class="r" style="display:flex;gap:8px">' +
        '<button onclick="spreadPrices(true)" style="flex:1;padding:12px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Только пустым</button>' +
        '<button onclick="spreadPrices(false)" style="flex:1;padding:12px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">По всем работам</button>' +
      '</div>' +
    '</div>' +
    (st.empty ? ('<div class="sub" style="margin-top:14px">Без цены' + (empty.length > 40 ? (' (первые 40 из ' + empty.length + ')') : '') + ':</div>' + rows) : '');
},

book(){
  const cat    = D.catalog || { kinds: [], price: [] };
  const byCode = {}; (cat.kinds || []).forEach(k => { byCode[k.code] = k; });
  const rows   = (cat.price || []);
  const st     = bookStats();
  const money  = n => (Number(n) || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const groups = {};
  rows.forEach(p => {
    const k = byCode[p.code] || {};
    const g = k.section || 'Прочее';
    (groups[g] = groups[g] || []).push(p);
  });

  const blocks = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ru')).map(g => {
    const items = groups[g].map(p => {
      const k = byCode[p.code] || {};
      const val = (p.price_usd === null || p.price_usd === undefined || p.price_usd === '') ? '' : p.price_usd;
      const hint = k.base_usd ? ('ориентир ' + money(k.base_usd)) : 'цена за единицу';
      return '<div class="work">' +
        '<div class="t">' + esc(p.name || k.name || p.code) + '</div>' +
        '<div class="m">' + esc(p.code) + ' · за ' + esc(k.unit || p.unit || 'ед') + ' · ' + esc(hint) + '</div>' +
        '<div class="m" style="margin-top:6px">' +
          '<input type="number" step="0.01" inputmode="decimal" data-code="' + esc(p.code) + '" value="' + esc(val) + '"' +
          ' onchange="savePrice(this)" placeholder="' + (k.base_usd ? Number(k.base_usd).toFixed(2) : '0.00') + '"' +
          ' style="width:120px;padding:8px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px"> USD' +
        '</div></div>';
    }).join('');
    return '<div class="sub" style="margin-top:14px">' + esc(g) + '</div>' + items;
  }).join('');

  return '' +
    '<div class="hello">Прайс исполнителя</div>' +
    '<div class="sub" id="bookCap">Задано ' + st.set + ' из ' + st.all + (st.empty ? (' · не задано ' + st.empty) : ' · всё заполнено') + '</div>' +
    '<div class="stat"><span class="k">Цена ставится за единицу вида работы и хранится в общей базе, а не в этом объекте: на следующем объекте задавать её заново не нужно. Объём подставится из профиля помещения.</span></div>' +
    (rows.length ? blocks : '<div class="stat"><span class="k">В прайсе пока нет ни одной позиции.</span></div>');
},

profile(){
  const room = profRoom();
  const cat  = D.catalog || { kinds: [], price: [] };

  if(!room){
    const items = (D.rooms || []).map(r => {
      const miss = [];
      if(!(Number(r.windows) >= 0)) miss.push('окна');
      if(!(Number(r.doors) >= 0)) miss.push('двери');
      return '<div class="work" onclick="PROF.room=\'' + esc(r.code) + '\'; render(true)" style="cursor:pointer">' +
        '<div class="t">' + esc(r.name) + '</div>' +
        '<div class="m">пол ' + fmt(r.floor_m2) + ' · стены ' + fmt(r.wall_m2) + ' · потолок ' + fmt(r.ceiling_m2) + ' · периметр ' + fmt(r.perimeter_m) +
        (miss.length ? ' · не заданы: ' + miss.join(', ') : '') + '</div></div>';
    }).join('');
    return '<div class="hello">Профиль ремонта</div>' +
      '<div class="sub">Выберите помещение</div>' +
      '<div class="stat"><span class="k">К помещению применяются виды работ, объём считается из его размеров, цена — из прайса исполнителя. Готовые позиции добавляются в смету.</span></div>' +
      items;
  }

  const inPrice = (cat.price || []).map(p => p.code);
  const pool = (cat.kinds || []).filter(k => k.active !== false && (inPrice.length ? inPrice.indexOf(k.code) >= 0 : true));
  const groups = {};
  pool.forEach(k => { const g = k.section || 'Прочее'; (groups[g] = groups[g] || []).push(k); });

  const blocks = Object.keys(groups).sort((a,b) => a.localeCompare(b,'ru')).map(g => {
    const items = groups[g].map(k => {
      const on = !!PROF.picked[k.code];
      const auto = profVol(k, room);
      const vol = on ? PROF.picked[k.code].vol : auto;
      const rate = profPrice(k.code);
      const sum = (Number(vol) > 0 && rate) ? Math.round(Number(vol) * rate * 100) / 100 : 0;
      return '<div class="work" style="' + (on ? 'border-left:3px solid #30d158;padding-left:9px' : '') + '">' +
        '<div class="t" onclick="profToggle(\'' + esc(k.code) + '\')" style="cursor:pointer">' + (on ? '✅ ' : '⬜ ') + esc(k.name) + '</div>' +
        '<div class="m">' + esc(k.code) + ' · ' + esc(k.unit || '') + ' · ' + (rate ? (fmt(rate) + ' USD за единицу') : 'цена не задана') +
          (auto === null ? ' · объём вводится вручную' : '') + '</div>' +
        (on ? ('<div class="m" style="margin-top:6px">объём: ' +
          '<input type="number" step="0.01" inputmode="decimal" data-code="' + esc(k.code) + '" value="' + (vol === null ? '' : vol) + '"' +
          ' onchange="profSetVol(this)" style="width:100px;padding:6px;border-radius:8px;border:1px solid #3a3a3c;background:#000;color:#fff"> ' + esc(k.unit || '') +
          (sum ? ('  →  ' + fmt(sum) + ' USD') : '') +
          (PROF.picked[k.code].manual ? ' · изменено вручную' : '') + '</div>') : '') +
        '</div>';
    }).join('');
    return '<div class="sub" style="margin-top:14px">' + esc(g) + '</div>' + items;
  }).join('');

  return '' +
    '<div class="hello">' + esc(room.name) + '</div>' +
    '<div class="sub" id="profSum">' + profTotalText() + '</div>' +
    '<div class="stat">' +
      '<div class="r" style="display:flex;gap:8px">' +
        '<button onclick="profBuild()" style="flex:1;padding:12px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Добавить в смету</button>' +
        '<button onclick="PROF.room=null; PROF.picked={}; render(true)" style="flex:1;padding:12px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Другое помещение</button>' +
      '</div>' +
    '</div>' +
    (pool.length ? blocks : '<div class="stat"><span class="k">Справочник пуст.</span></div>');
},

terms(){
  const t = timeCalc();
  const s = t.sched;
  const by = s.by;
  const crit = t.critical.slice().sort((a, b) => (s.ef[a] || 0) - (s.ef[b] || 0));
  const line = code => {
    const w = by[code]; if(!w) return '';
    return '<div class="work"><div class="t">' + esc(w.name) + '</div>' +
      '<div class="m">' + esc(code) + ' · ' + esc(String(w.room || '').split(' (')[0]) + ' · ' +
      (Number(w.dur) || 0.5) + ' дн · финиш на ' + (s.ef[code] || 0) + '-й день · ' + esc(w.status || '') + '</div></div>';
  };
  const soon = (D.works || []).filter(w => w.status !== 'Готово' && w.code)
    .sort((a, b) => (s.ef[a.code] || 0) - (s.ef[b.code] || 0)).slice(0, 12);
  const late = t.diff === null ? '' : (t.diff >= 0
    ? ('<div class="r"><span class="k">Опережение</span><span class="v">' + t.diff + ' дн</span></div>')
    : ('<div class="r"><span class="k">Отставание</span><span class="v">' + Math.abs(t.diff) + ' дн</span></div>'));
  return '' +
    '<div class="hello">Сроки</div>' +
    '<div class="sub">Оценка ' + t.real + ' дн при бригаде из ' + t.crew + ' человек</div>' +
    '<div class="stat">' +
      '<div class="r"><span class="k">Технологический минимум (критический путь)</span><span class="v">' + t.total + ' дн</span></div>' +
      '<div class="r"><span class="k">Всего работы</span><span class="v">' + t.sumDur + ' чел-дн</span></div>' +
      '<div class="r"><span class="k">При бригаде ' + t.crew + ' чел.</span><span class="v">' + t.byCrew + ' дн</span></div>' +
      (t.elapsed !== null ? ('<div class="r"><span class="k">Прошло с начала работ</span><span class="v">' + t.elapsed + ' дн</span></div>') : '') +
      '<div class="r"><span class="k">Пройдено по плану</span><span class="v">' + t.reached + ' дн</span></div>' +
      late +
    '</div>' +
    '<div class="stat"><span class="k">Критический путь — цепочка, которая определяет срок целиком: задержка любой её работы двигает финиш день в день. Остальные работы имеют запас.</span></div>' +
    '<div class="sub" style="margin-top:14px">Критический путь · ' + crit.length + ' работ</div>' + crit.map(line).join('') +
    '<div class="sub" style="margin-top:14px">Ближайшие по плану</div>' + soon.map(w => line(w.code)).join('');
},

checks(){
  const list = checkList();
  const mats = (D.materials || []).map(m => m.name).filter(Boolean);
  const wait = Number((D.settings || {})['Не_подтверждено_сум']) || 0;
  const opts = ['<option value="">— выберите материал —</option>']
    .concat(mats.map(m => '<option value="' + esc(m) + '">' + esc(m) + '</option>')).join('');
  const items = list.map(d => {
    const id = esc(d.id);
    return '<div class="work">' +
      '<div class="t">Чек от ' + esc(d.who || '') + '</div>' +
      '<div class="m">' + esc(d.at || '') + ' · ' + esc(d.status || '') + ' · снимок остался в чате бота</div>' +
      '<div class="m" style="margin-top:8px">' +
        '<select id="mat_' + id + '" style="width:100%;padding:10px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px">' + opts + '</select>' +
      '</div>' +
      '<div class="m" style="margin-top:8px;display:flex;gap:8px;align-items:center">' +
        '<input id="sum_' + id + '" type="number" inputmode="decimal" placeholder="сумма, сум" style="flex:1;padding:10px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px">' +
        '<button id="btn_' + id + '" onclick="bindCheck(\'' + id + '\')" style="padding:10px 14px;border-radius:10px;border:0;background:#0a84ff;color:#fff;font-size:15px">Привязать</button>' +
      '</div></div>';
  }).join('');
  return '' +

/* ══════════════════════════════════════════════════════════════
   ГОЛОСОВОЙ ВВОД — запись прямо в приложении, разбор на сервере.
   Ничего не уходит в ленту бота: запись, распознавание и
   подтверждение живут во встроенном окне.
   Контракт сервера POST {API}/voice  (FormData: audio, initData|key):
     ответ { ok:true, recognized:"…", items:[ {sheet,code,name,room,
             field,field_label,value,value_label} ] }
     items.length === 0  → ничего внятного не распознано (выбраковка)
     items.length === 1  → одно подтверждение
     items.length  >  1  → мультивыбор «N из M»
   ══════════════════════════════════════════════════════════════ */
let mediaRec = null, chunks = [], vTimer = null, vSec = 0, vStream = null, vItems = [];
const vmask  = document.getElementById("vmask");
const vsheet = document.getElementById("vsheet");

function openVSheet(html){ vsheet.innerHTML = html; vmask.classList.add("on"); }
function closeVSheet(){ vmask.classList.remove("on"); }

async function startVoice(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined"){
    toast("Запись голоса недоступна в этом клиенте", "bad"); return;
  }
  try{
    vStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    openVSheet(`
      <div class="vh">Нужен доступ к микрофону</div>
      <div class="vs">Разрешите приложению запись, чтобы диктовать правки.</div>
      <div class="vrow"><button class="vbtn-cancel" onclick="closeVSheet()">Закрыть</button></div>`);
    return;
  }
  chunks = [];
  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus"
             : MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm"
             : MediaRecorder.isTypeSupported("audio/ogg;codecs=opus") ? "audio/ogg;codecs=opus" : "";
  try{
    mediaRec = new MediaRecorder(vStream, mime ? { mimeType: mime } : undefined);
  }catch(e){ mediaRec = new MediaRecorder(vStream); }
  mediaRec.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  mediaRec.onstop = onRecStop;
  mediaRec._send = false;
  mediaRec.start();
  vSec = 0;
  renderRecUI();
  vTimer = setInterval(() => { vSec++; const t = document.getElementById("vtime"); if(t) t.textContent = fmtTime(vSec); }, 1000);
}

function renderRecUI(){
  openVSheet(`
    <div class="vh">Говорите</div>
    <div class="vs">Например: «покраска потолка в спальне готова» или «куплено 5 мешков цемента»</div>
    <div class="vrec">
      <div class="vmic rec">🎙️</div>
      <div class="vtime" id="vtime">0:00</div>
      <div class="vwave"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="vrow">
      <button class="vbtn-cancel" onclick="stopVoice(false)">Отмена</button>
      <button class="vbtn-ok" onclick="stopVoice(true)">Готово</button>
    </div>`);
}

function stopVoice(send){
  if(vTimer){ clearInterval(vTimer); vTimer = null; }
  if(mediaRec && mediaRec.state !== "inactive"){ mediaRec._send = send; mediaRec.stop(); }
  if(vStream){ vStream.getTracks().forEach(t => t.stop()); vStream = null; }
  if(!send) closeVSheet();
}

async function onRecStop(){
  if(!mediaRec._send){ return; }
  const blob = new Blob(chunks, { type: (chunks[0] && chunks[0].type) || "audio/webm" });
  if(!blob.size){ showVError("Не расслышал — попробуйте ещё раз."); return; }
  openVSheet(`<div class="vh">Распознаю…</div><div class="vspin"></div>
    <div class="vs" style="text-align:center">Отправляю запись на разбор</div>`);
  try{
    const fd = new FormData();
    fd.append("audio", blob, "voice.webm");
    fd.append("initData", INIT);
    fd.append("key", KEY);                       // legacy / отладка вне Telegram
    const r = await fetch(`${API}/voice`, { method: "POST", body: fd });
    const raw = (await r.text()).trim();
    if(r.status === 401 || r.status === 403) throw new Error("Доступ не подтверждён.");
    if(!raw) throw new Error("Не удалось разобрать запись. Попробуйте ещё раз.");
    let d; try{ d = JSON.parse(raw); }catch{ throw new Error("Сервер вернул неожиданный ответ."); }
    showVResult(d);
  }catch(e){ showVError(e.message); }
}

function showVError(msg){
  tg?.HapticFeedback?.notificationOccurred("error");
  openVSheet(`
    <div class="vh">Не получилось</div>
    <div class="vs">${esc(msg)}</div>
    <div class="vrow">
      <button class="vbtn-cancel" onclick="closeVSheet()">Закрыть</button>
      <button class="vbtn-ok" onclick="startVoice()">Записать заново</button>
    </div>`);
}

/* Показ распознанного. items===[] → выбраковка (ничего не поняли). */
function showVResult(d){
  const items = Array.isArray(d.items) ? d.items : [];
  vItems = items.map(x => ({ ...x, _sel: true }));

  if(items.length === 0){
    tg?.HapticFeedback?.notificationOccurred("warning");
    openVSheet(`
      <div class="vh">Не разобрал</div>
      <div class="vs">Не понял, какую работу или трату вы имели в виду.</div>
      ${d.recognized ? `<div class="vquote">Расслышал: <b>${esc(d.recognized)}</b></div>` : ""}
      <div class="vrow">
        <button class="vbtn-cancel" onclick="closeVSheet()">Закрыть</button>
        <button class="vbtn-ok" onclick="startVoice()">Сказать иначе</button>
      </div>`);
    return;
  }

  const multi = items.length > 1;
  const quote = d.recognized ? `<div class="vquote">Расслышал: <b>${esc(d.recognized)}</b></div>` : "";
  const rows = vItems.map((it, i) => {
    const claim = it.field === "Статус" && it.value === "Готово";
    return `
    <div class="vitem sel" data-i="${i}" onclick="toggleVItem(${i})">
      <div class="vchk">✓</div>
      <div style="flex:1;min-width:0">
        <div class="vt">${esc(it.name || it.code || "")}</div>
        ${it.room ? `<div class="vd">${esc(it.room)}</div>` : ""}
        <div class="vv">${claim
          ? `<b>Заявить готовность</b> — уйдёт ${D.role==="worker" ? "заказчику" : "работнику"} на приёмку`
          : `${esc(it.field_label || it.field || "")}: <b>${esc(it.value_label ?? it.value ?? "")}</b>`}</div>
      </div>
    </div>`;
  }).join("");

  openVSheet(`
    <div class="vh">${multi ? "Проверьте — распознано несколько" : "Проверьте и подтвердите"}</div>
    <div class="vs">${multi ? "Отметьте, что записать, и подтвердите." : "Запишу это изменение в таблицу."}</div>
    ${quote}
    <div id="vlist">${rows}</div>
    <div class="vrow">
      <button class="vbtn-cancel" onclick="closeVSheet()">Отмена</button>
      <button class="vbtn-ok" id="vapply" onclick="applyVoice()">${multi ? "Записать выбранные" : "Да, записать"}</button>
    </div>`);
}

function toggleVItem(i){
  vItems[i]._sel = !vItems[i]._sel;
  const el = document.querySelector(`.vitem[data-i="${i}"]`);
  if(el) el.classList.toggle("sel", vItems[i]._sel);
}

/* Применяем выбранные — по одной записи через тот же /update. */
async function applyVoice(){
  const chosen = vItems.filter(x => x._sel);
  if(!chosen.length){ toast("Ничего не отмечено", "wait"); return; }
  const btn = document.getElementById("vapply");
  if(btn){ btn.disabled = true; btn.textContent = "Записываю…"; }
  let done = 0, fail = 0;
  for(const it of chosen){
    const ok = await upd(it.sheet, it.code, it.field, it.value);
    ok ? done++ : fail++;
  }
  closeVSheet();
  if(fail === 0) toast(done > 1 ? `Записано: ${done}` : "Записано");
  else toast(`Записано ${done}, не удалось ${fail}`, fail && !done ? "bad" : "");
}

function fmtTime(s){ const m = Math.floor(s / 60); const ss = String(s % 60).padStart(2, "0"); return `${m}:${ss}`; }

/* ── ВЫХОД В ЧАТ С БОТОМ (только для фото чека) ────────────── */
function toBot(){
  if(tg){ tg.close(); }
  else { toast("Откройте через Telegram — там ждёт бот", "wait"); }
}

/* ── ЖИВОЕ ОБНОВЛЕНИЕ ──────────────────────────────────────────
   Панель — инструмент взаимного подтверждения: заявка одной стороны
   должна появляться у другой без ручной перезагрузки. Тихо перечитываем
   /data; если данные изменились и пользователь не занят вводом или
   голосовым окном — обновляем текущий экран.                          */
let _sig = "";
function _snapshot(d){
  try{
    return JSON.stringify({
      w:(d.works||[]).map(x => x.code+":"+x.status+":"+(x.progress||0)+":"+(x.price_contractor_usd??"")),
      m:(d.materials||[]).map(x => x.name+":"+(x.in||0)+":"+(x.out||0)),
      s:d.settings, p:(d.payments||[]).length
    });
  }catch{ return ""; }
}
async function refresh(){
  const el = document.activeElement;
  const busy = (el && ["INPUT","SELECT","TEXTAREA"].includes(el.tagName)) || vmask.classList.contains("on");
  if(busy) return;                       // не мешаем вводу/голосовому окну
  try{
    const auth = INIT ? `initData=${encodeURIComponent(INIT)}` : `key=${encodeURIComponent(KEY)}`;
    const r = await fetch(`${API}/data?${auth}`, { cache:"no-store" });
    if(!r.ok) return;
    const raw = (await r.text()).trim();
    if(!raw) return;
    let nd; try{ nd = JSON.parse(raw); }catch{ return; }
    if(!nd || !nd.role) return;
    const sig = _snapshot(nd);
    if(!_sig){ _sig = sig; return; }
    if(sig === _sig) return;              // ничего не изменилось — не моргаем
    _sig = sig; D = nd; render();
  }catch{}
}

/* ── СТАРТ ────────────────────────────────────────────────── */
tg?.ready();
tg?.expand();
load();
setInterval(refresh, 15000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });
window.addEventListener("focus", refresh);
</script>
