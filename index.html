/* Расчёт пакета. В режиме «процентом» каждая работа дешевеет ровно на процент —
   так подпись не врёт ни на одной строке; общий итог складывается из строк.
   В режиме «итоговой суммой» распределение пропорционально текущим ценам,
   а копейки округления добираются последней строкой, чтобы сумма была ровно
   заданной: иначе договор разошёлся бы с суммой работ. */
function dscCalc(){
  const list = dscPicked();
  if(!list.length) return null;
  const base = Math.round(list.reduce((s, w) => s + workPrice(w), 0) * 100) / 100;
  if(!(base > 0)) return null;
  const rows = [];
  if(DSC.mode === 'pct'){
    const p = Number(DSC.pct);
    if(!(p > 0)) return null;
    if(p >= 100) return { err:'Скидка 100 % — это уже не скидка, а снятие работ (вид «убрать»)' };
    list.forEach(w => {
      const was = workPrice(w);
      const now = Math.round(was * (100 - p)) / 100;
      rows.push({ code:w.code, name:w.name, room:dscRoomName(w), was:was, now:now, d:Math.round((now - was) * 100) / 100 });
    });
  }else{
    const t = Number(DSC.sum);
    if(!(t > 0)) return null;
    if(t >= base) return { err:'Итог не ниже текущей суммы — это повышение цены, его заявляют видом «цена»' };
    let acc = 0;
    list.forEach((w, i) => {
      const was = workPrice(w);
      let now;
      if(i === list.length - 1){ now = Math.round((t - acc) * 100) / 100; }
      else { now = Math.round(t * was / base * 100) / 100; acc = Math.round((acc + now) * 100) / 100; }
      rows.push({ code:w.code, name:w.name, room:dscRoomName(w), was:was, now:now, d:Math.round((now - was) * 100) / 100 });
    });
  }
  const bad = rows.find(r => !(r.now > 0));
  if(bad) return { err:'Слишком мало: на «' + bad.name + '» не остаётся цены — такие работы снимают видом «убрать»' };
  const target = Math.round(rows.reduce((s, r) => s + r.now, 0) * 100) / 100;
  const cut = Math.round((base - target) * 100) / 100;
  if(!(cut > 0)) return { err:'Скидка нулевая — договор не изменится' };
  return { rows:rows, base:base, target:target, cut:cut, pct:Math.round(cut / base * 1000) / 10 };
}

function dscPreview(){
  const c = dscCalc();
  if(!c) return '<span class="k" style="opacity:.6">Отметьте работы и задайте скидку — здесь появится, что именно уйдёт на согласование.</span>';
  if(c.err) return '<span class="k" style="color:var(--bad)">' + esc(c.err) + '</span>';
  const lines = c.rows.slice(0, 6).map(r =>
    '<div class="r"><span class="k" style="font-size:13px;opacity:.75">' + esc(r.name) + ' · ' + esc(r.room) + '</span>' +
    '<span class="v" style="font-size:13px">' + usd(r.was) + ' → ' + usd(r.now) + '</span></div>').join('');
  const more = c.rows.length > 6
    ? '<div class="r"><span class="k" style="font-size:13px;opacity:.55">и ещё ' + (c.rows.length - 6) + '…</span><span class="v"></span></div>' : '';
  return '<div class="r"><span class="k">Работ в пакете</span><span class="v">' + c.rows.length + '</span></div>' +
    '<div class="r"><span class="k">Было</span><span class="v">' + usd(c.base) + ' $</span></div>' +
    '<div class="r"><span class="k">Станет</span><span class="v">' + usd(c.target) + ' $</span></div>' +
    '<div class="r"><span class="k">Скидка</span><span class="v" style="color:var(--ok)">−' + usd(c.cut) + ' $ · ' + c.pct + ' %</span></div>' +
    '<div class="r"><span class="k">Договор станет</span><span class="v">' + usd(Math.round((dealSum() - c.cut) * 100) / 100) + ' $</span></div>' +
    lines + more;
}

/* Отправка пакета — один запрос /append на все строки: заявка либо ушла целиком,
   либо не ушла вовсе. Частично заявленная скидка не имела бы смысла. */
async function dscSubmit(){
  if(!dscCan()){ toast('Скидку на договорные цены предлагает заказчик', 'err'); return; }
  const c = dscCalc();
  if(!c){ toast('Отметьте работы и задайте скидку', 'err'); return; }
  if(c.err){ toast(c.err, 'err'); return; }
  if(c.rows.length > DSC_MAX){ toast('За один раз не больше ' + DSC_MAX + ' работ', 'err'); return; }
  if(DSC_BUSY) return;
  DSC_BUSY = true;
  const pk = 'PK-' + Date.now().toString(36).toUpperCase();
  const head = DSC.mode === 'pct'
    ? ('скидка ' + c.pct + ' % на ' + c.rows.length + ' работ')
    : ('итог ' + usd(c.target) + ' $ за ' + c.rows.length + ' работ');
  const stamp = chgStamp();
  const rows = c.rows.map((r, i) => ({
    'id': 'CH-' + pk.slice(3) + '-' + String(i + 1).padStart(2, '0'),
    'Время': stamp,
    'Инициатор': D.who,
    'Вид': 'цена',
    'Код_работы': r.code,
    'Что_меняем': 'Цена работы',
    'Было': usd(r.was) + ' USD',
    'Стало': usd(r.now) + ' USD',
    'Дельта_USD': r.d,
    'Дельта_дней': 0,
    'Статус': 'Заявлено',
    'Решил': '',
    'Комментарий': '[' + pk + '] ' + head + (DSC.comment ? (' · ' + DSC.comment) : ''),
  }));
  toast('Отправляю пакет на согласование…', 'wait');
  try{
    const r = await fetch(API + '/append', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ initData:INIT, key:KEY, sheet:'11_Изменения', rows:rows })
    });
    const t = (await r.text()).trim();
    if(!r.ok || !t) throw new Error('Не удалось отправить пакет');
    toast('Скидка заявлена — ' + rows.length + ' работ ждут ответа второй стороны');
    await load();
    back();
  }catch(e){ toast(e.message, 'err'); }
  finally{ DSC_BUSY = false; }
}

/* ── Пакеты в списке изменений ───────────────────────────────── */

const dscPk = c => { const m = String((c && c.comment) || '').match(/^\[(PK-[A-Z0-9]+)\]/); return m ? m[1] : ''; };
function dscGroup(list){
  const packs = {}, single = [], order = [];
  (list || []).forEach(c => {
    const p = dscPk(c);
    if(p){ if(!packs[p]){ packs[p] = []; order.push(p); } packs[p].push(c); }
    else single.push(c);
  });
  return { packs:packs, order:order, single:single };
}
function dscPackSum(list){
  const was = Math.round(list.reduce((s, c) => s + dscNum(c.was), 0) * 100) / 100;
  const cut = Math.round(list.reduce((s, c) => s + (Number(c.d_usd) || 0), 0) * 100) / 100;
  return { was:was, cut:cut, now:Math.round((was + cut) * 100) / 100 };
}
function dscActs(c, mode){
  const bt = 'flex:1;padding:12px;border:0;border-radius:10px;color:#fff;font-weight:600;font-size:15px';
  /* Точка отсчёта решается своими функциями: у неё вместе со статусом пишется
     время фиксации, иначе черта осталась бы без даты. [чат 019] */
  const isRef = String(c.kind || '').trim() === REF_KIND;
  if(mode === 'theirs') return '<div class="row" style="gap:8px;margin-top:10px">' +
    '<button style="' + bt + ';background:var(--ok)" onclick="' + (isRef ? 'refAccept' : 'chgAccept') + '(\'' + esc(c.id) + '\')">' + (isRef ? 'Подтвердить' : 'Принять') + '</button>' +
    '<button style="' + bt + ';background:var(--bad)" onclick="' + (isRef ? 'refDispute' : 'chgDispute') + '(\'' + esc(c.id) + '\')">Оспорить</button></div>';
  if(mode === 'mine') return '<div class="m" style="color:var(--warn);margin-top:6px">⏳ Ждёт ответа второй стороны</div>';
  if(mode === 'apply') return '<div class="row" style="margin-top:10px">' +
    '<button style="' + bt + ';background:#0a84ff" onclick="chgApply(\'' + esc(c.id) + '\')">' +
      (String(c.kind || '').trim() === TMC_KIND ? 'Внести в табель' : 'Внести в смету') + '</button></div>';
  return '';
}
function dscPackCard(pk, list, mode){
  const first = list[0] || {};
  const head = String(first.comment || '').replace(/^\[[^\]]*\]\s*/, '') || 'скидка пакетом';
  const s = dscPackSum(list);
  const bt = 'flex:1;padding:12px;border:0;border-radius:10px;color:#fff;font-weight:600;font-size:15px';
  const items = list.map(c => {
    const w = (D.works || []).find(x => x.code === c.code);
    return '<div class="m" style="opacity:.75">' + esc(w ? w.name : c.code) + ' · ' +
      esc(String(c.was || '')) + ' → ' + esc(String(c.now || '')) +
      (mode === 'done' ? (' · ' + esc(chgSt(c))) : '') + '</div>';
  }).join('');
  let acts = '';
  if(mode === 'theirs') acts = '<div class="row" style="gap:8px;margin-top:10px">' +
    '<button style="' + bt + ';background:var(--ok)" onclick="dscPackDecide(\'' + esc(pk) + '\',\'accept\')">Принять пакет</button>' +
    '<button style="' + bt + ';background:var(--bad)" onclick="dscPackDecide(\'' + esc(pk) + '\',\'dispute\')">Оспорить пакет</button></div>';
  if(mode === 'mine') acts = '<div class="m" style="color:var(--warn);margin-top:6px">⏳ Ждёт ответа второй стороны</div>';
  if(mode === 'apply') acts = '<div class="row" style="margin-top:10px">' +
    '<button style="' + bt + ';background:#0a84ff" onclick="dscPackApply(\'' + esc(pk) + '\')">Внести пакет в смету</button></div>';
  return '<div class="work">' +
    '<div class="t">Скидка · ' + esc(head) + '</div>' +
    '<div class="m">' + esc(pk) + ' · заявил ' + esc(first.by || '') + ' · ' + esc(first.at || '') + '</div>' +
    '<div class="m">было: ' + usd(s.was) + ' $ → станет: ' + usd(s.now) + ' $</div>' +
    '<div class="m" style="color:var(--ok)">−' + usd(Math.abs(s.cut)) + ' $ к договору · работ: ' + list.length + '</div>' +
    items + acts + '</div>';
}
function dscList(list, mode, card){
  const g = dscGroup(list);
  const packs = g.order.map(pk => dscPackCard(pk, g.packs[pk], mode)).join('');
  const single = g.single.map(c => card(c, dscActs(c, mode))).join('');
  return packs + single;
}

/* Решение по пакету — построчно, с прогрессом: /update правит одну ячейку за
   запрос, а замок не даёт запустить второй круг по тем же строкам (грабля 012). */
async function dscRun(title, items, fn){
  if(DSC_BUSY){ toast('Дождитесь окончания предыдущего действия', 'err'); return; }
  DSC_BUSY = true;
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px;color:#fff;font-size:16px';
  box.innerHTML = '<div style="background:#1c1c1e;border-radius:16px;padding:20px;min-width:240px;text-align:center">' + esc(title) +
    '<div id="dscN" style="opacity:.7;font-size:14px;margin-top:8px">0 из ' + items.length + '</div></div>';
  document.body.appendChild(box);
  let ok = 0, fail = 0, last = '';
  for(const it of items){
    try{ await fn(it); ok++; }
    catch(e){ fail++; last = e.message || String(e); }
    const el = box.querySelector('#dscN');
    if(el) el.textContent = (ok + fail) + ' из ' + items.length;
  }
  box.remove();
  DSC_BUSY = false;
  await load();
  toast(fail ? ('Прошло ' + ok + ', не удалось ' + fail + (last ? (' — ' + last) : '')) : ('Готово: ' + ok + ' из ' + items.length), fail ? 'err' : 'ok');
}

/* Применение одной принятой заявки цены — без тостов и перезагрузки:
   в пакете это делается в цикле, а данные перечитываются один раз в конце. */
async function chgApplyOne(c){
  const w = (D.works || []).find(x => x.code === c.code);
  if(!w) throw new Error('Работа ' + c.code + ' не найдена');
  await writeCell('01_Работы', c.code, 'Цена_аллокация_USD', Math.round((workPrice(w) + (Number(c.d_usd) || 0)) * 100) / 100);
  await writeCell('11_Изменения', c.id, 'Статус', 'Применено');
}

async function dscPackDecide(pk, how){
  const list = chgPending().filter(c => dscPk(c) === pk);
  if(!list.length){ toast('Пакет уже решён', 'err'); return; }
  if(String(list[0].by || '') === String(D.who)){ toast('Свой пакет принимает вторая сторона', 'err'); return; }
  const accept = how === 'accept';
  const mine = dscCan();
  await dscRun(accept ? 'Принимаю пакет…' : 'Оспариваю пакет…', list, async c => {
    await writeCell('11_Изменения', c.id, 'Статус', accept ? 'Принято' : 'Оспорено');
    await writeCell('11_Изменения', c.id, 'Решил', D.who);
    if(accept && mine) await chgApplyOne(c);
  });
}

async function dscPackApply(pk){
  const list = chgToApply().filter(c => dscPk(c) === pk);
  if(!list.length){ toast('Нечего вносить', 'err'); return; }
  if(!dscCan()){ toast('В смету вносит заказчик', 'err'); return; }
  await dscRun('Вношу пакет в смету…', list, async c => { await chgApplyOne(c); });
}

/* Виды заявок — по факту прихода цены, а не по роли. В 019 бригадиру не отдавали
   разнесение (price_alloc_usd), и виды, дельту которых без него не посчитать, ему
   не показывались: заявка ушла бы с дельтой от нуля и раздула бы договор. С чата 022
   сервер отдаёт цену работы и бригадиру — своя цена есть знание исполнителя, а не наш
   секрет, — поэтому условие переехало с роли на наличие поля: пришла цена — виды открыты,
   не пришла (старый сервер, урезанный контур) — прежняя защита остаётся в силе. */
const CH_KINDS_NO_ALLOC = ['добавить', 'срок'];
const hasAlloc = () => (D && Array.isArray(D.works)) && D.works.some(w => w.price_alloc_usd !== undefined && w.price_alloc_usd !== null);
const chgKindsFor = () => (hasAlloc() ? CH_KINDS : CH_KINDS_NO_ALLOC);

/* ══════════════════════════════════════════════════════════════
   СТАРТОВЫЕ ОСТАТКИ МАТЕРИАЛОВ — этап C3 [чат 019]
   На встрече пара вводит материалы по памяти. Человек помнит не историю
   закупа, а то, что лежит на объекте, поэтому основной режим — «остаток
   по факту»: он пишется в колонку «Остаток», и сервер считает её главнее
   вычитания «куплено − ушло» (маяк §7: принимается по факту остатков,
   без анализа процесса и адекватности расходов). Второй режим — «куплено
   и ушло» — для тех строк, где память полная.
   Записи уходят одним /append: строка либо появилась целиком, либо нет.
   ══════════════════════════════════════════════════════════════ */
const MAT_MAX = 60;
const MAT_UNITS = ['мешок','шт','м','м2','м3','л','кг','лист','рулон','упак','компл'];
const matRow = () => ({ name:'', unit:'', rest:'', in:'', out:'', price:'', who:'' });
let MAT = { mode:'rest', rows:[matRow()] };
let MAT_BUSY = false;

/* Материалы правит тот, кому сервер разрешает запись в 03_Материалы:
   заказчик, владелец и бригадир. У рядового работника своего экрана нет. */
const matCanEdit = () => ['admin','owner','foreman'].includes(D.kind) || ['admin','owner','foreman'].includes(D.role);
const matNorm = s => String(s == null ? '' : s).trim().toLowerCase();
const matNumOk = v => v !== '' && v != null && Number(v) >= 0 && !isNaN(Number(v));

function matOpen(){ MAT = { mode:'rest', rows:[matRow()] }; go('matnew'); }
function matMode(m){ MAT.mode = m; render(); }
function matAdd(){ if(MAT.rows.length < MAT_MAX){ MAT.rows.push(matRow()); render(); } else toast('Больше ' + MAT_MAX + ' строк за раз не берём', 'err'); }
function matDel(i){ MAT.rows.splice(i, 1); if(!MAT.rows.length) MAT.rows.push(matRow()); render(); }
function matSet(i, field, el){
  MAT.rows[i][field] = String(el.value == null ? '' : el.value).replace(',', '.').trim();
  const box = document.getElementById('matPrev');
  if(box) box.innerHTML = matPreview();
}

/* Разбор введённого. Дубль имени — не мелочь: правки материалов ищут строку
   по названию, и второй «Ротбанд» сделал бы правку неоднозначной. */
function matCalc(){
  const have = (D.materials || []).map(m => matNorm(m.name));
  const seen = {}, rows = [], bad = [];
  MAT.rows.forEach((r, i) => {
    const nm = String(r.name || '').trim();
    if(!nm && !r.rest && !r.in && !r.out) return;            /* пустая строка — просто пропуск */
    if(!nm){ bad.push({ i:i, why:'без названия' }); return; }
    const key = matNorm(nm);
    if(have.includes(key)){ bad.push({ i:i, why:'такой материал уже есть в списке' }); return; }
    if(seen[key]){ bad.push({ i:i, why:'повторяется в этой же форме' }); return; }
    seen[key] = 1;
    if(MAT.mode === 'rest'){
      if(!matNumOk(r.rest)){ bad.push({ i:i, why:'не указан остаток' }); return; }
    }else{
      if(!matNumOk(r.in)){ bad.push({ i:i, why:'не указано «куплено»' }); return; }
      if(r.out !== '' && !matNumOk(r.out)){ bad.push({ i:i, why:'«ушло» не число' }); return; }
    }
    if(r.price !== '' && !matNumOk(r.price)){ bad.push({ i:i, why:'цена не число' }); return; }
    rows.push({
      name: nm, unit: String(r.unit || '').trim(), who: String(r.who || '').trim(),
      rest: MAT.mode === 'rest' ? Number(r.rest) : null,
      in:   MAT.mode === 'rest' ? null : Number(r.in),
      out:  MAT.mode === 'rest' ? null : (r.out === '' ? null : Number(r.out)),
      price: r.price === '' ? null : Number(r.price),
    });
  });
  const rate = Number((D.settings || {})['Курс_сум_за_USD']) || 0;
  const sumUzs = Math.round(rows.reduce((s, r) => {
    const qty = MAT.mode === 'rest' ? r.rest : r.in;
    return s + ((r.price != null && qty != null) ? r.price * qty : 0);
  }, 0));
  return { rows:rows, bad:bad, sumUzs:sumUzs, sumUsd: rate > 0 ? Math.round(sumUzs / rate * 100) / 100 : null };
}

function matPreview(){
  const c = matCalc();
  const bad = c.bad.map(b => '<div class="r"><span class="k" style="font-size:13px;color:var(--bad)">строка ' + (b.i + 1) + ': ' + esc(b.why) + '</span><span class="v"></span></div>').join('');
  if(!c.rows.length) return (bad || '<span class="k" style="opacity:.6">Впишите материалы — здесь появится, что уйдёт в таблицу.</span>');
  return '<div class="r"><span class="k">Строк к записи</span><span class="v">' + c.rows.length + '</span></div>' +
    (c.sumUzs ? ('<div class="r"><span class="k">Закуп на сумму</span><span class="v">' + fmt(c.sumUzs) + ' сум' + (c.sumUsd ? (' ≈ ' + usd(c.sumUsd) + ' $') : '') + '</span></div>') : '') +
    c.rows.slice(0, 8).map(r => '<div class="r"><span class="k" style="font-size:13px;opacity:.75">' + esc(r.name) + '</span><span class="v" style="font-size:13px">' +
      (MAT.mode === 'rest' ? ('остаток ' + r.rest) : ('куплено ' + r.in + (r.out != null ? (' · ушло ' + r.out) : ''))) + ' ' + esc(r.unit) + '</span></div>').join('') +
    bad;
}

async function matSubmit(){
  if(!matCanEdit()){ toast('Материалы вводит заказчик или бригадир', 'err'); return; }
  const c = matCalc();
  if(!c.rows.length){ toast(c.bad.length ? 'Поправьте отмеченные строки' : 'Нечего записывать', 'err'); return; }
  if(MAT_BUSY) return;

/* ══════════════════════════════════════════════════════════════
   ТОЧКА ОТСЧЁТА — этап C4 [чат 019]
   «Все предложения приняты второй стороной, и это стало точкой отсчёта»
   (маяк §7). Отдельной сущности в данных не заводим: точка отсчёта — это
   предложение, принятое второй стороной, а механизм для этого уже есть —
   заявка в 11_Изменения. Заявка вида «точка» несёт снимок стартового
   состояния (работы, договор, срок, материалы, бригада) в поле «Стало»
   машинно-читаемой строкой и нулевые дельты: она ничего не меняет в деньгах,
   она фиксирует черту. Дата фиксации дописывается в комментарий при принятии —
   так у черты есть автор, время и след, как у любого другого согласования.
   ══════════════════════════════════════════════════════════════ */
const REF_KIND = 'точка';
let REF_BUSY = false;

const refIsClient = () => ['admin','owner'].includes(D.role);

/* Разнесение суммы договора по работам [чат 029].
   Вес работы — её нынешняя цена: при сборке сметы панель проставляет
   объём × ставку справочника, и это и есть структура сметы. Приведение к
   названной сумме сохраняет пропорции и меняет только масштаб — ровно то,
   что происходит на встрече, когда пара договаривается «за всё столько-то».
   Работы без цены в дележе не участвуют: делить между «16 м²» и «3 шт»
   нечего, и выдумывать им вес — значит назначить цену наугад. */
function allocPlan(total){
  const sum = Math.round((Number(total) || 0) * 100) / 100;
  const live = (D.works || []).filter(w => w.code && w.status !== 'Снято');
  const priced = live.filter(w => (Number(w.price_alloc_usd) || 0) > 0);
  const nopr = live.filter(w => !((Number(w.price_alloc_usd) || 0) > 0));
  const base = Math.round(priced.reduce((s, w) => s + Number(w.price_alloc_usd), 0) * 100) / 100;
  if(!(sum > 0) || !priced.length || !(base > 0)) return { ok: false, sum, base, priced: [], nopr, k: 0 };
  const k = sum / base;
  const rows = priced.map(w => ({
    code: w.code, name: w.name, room: w.room,
    was: Math.round(Number(w.price_alloc_usd) * 100) / 100,
    now: Math.round(Number(w.price_alloc_usd) * k * 100) / 100,
  }));
  /* Копейки округления добираются последней строкой: сумма работ обязана
     совпасть с договором до цента, иначе экран денег начнёт спорить сам с собой. */
  const got = Math.round(rows.reduce((s, r) => s + r.now, 0) * 100) / 100;
  const tail = Math.round((sum - got) * 100) / 100;
  if(tail !== 0 && rows.length) rows[rows.length - 1].now = Math.round((rows[rows.length - 1].now + tail) * 100) / 100;
  return { ok: true, sum, base, k, rows, nopr, tail };
}

/* Снимок текущего состояния: то, что стороны фиксируют как стартовое. */
function refSnap(){
  const works = (D.works || []).filter(w => w.code && w.status !== 'Снято');
  const tm = timeCalc();
  const mats = (D.materials || []);
  const crew = Number((D.settings || {})['Рабочих_в_бригаде']);
  return {
    works: works.length,
    alloc: Math.round(works.reduce((s, w) => s + (Number(w.price_alloc_usd) || 0), 0) * 100) / 100,
    deal: dealSum(),
    days: tm.real,
    mat: mats.length,
    have: mats.filter(m => (m.rest ?? 0) > 0).length,
    crew: crew > 0 ? crew : null,
  };
}
const refPack = s => ['works=' + s.works, 'deal=' + s.deal, 'days=' + s.days,
                      'mat=' + s.mat, 'have=' + s.have, 'crew=' + (s.crew == null ? '' : s.crew)].join(';');
function refParse(str){
  const o = {};
  String(str == null ? '' : str).split(';').forEach(p => { const i = p.indexOf('='); if(i > 0) o[p.slice(0, i).trim()] = p.slice(i + 1).trim(); });
  return o;
}
const refHuman = s => s.works + ' работ · ' + usd(s.deal) + ' $ · ' + s.days + ' дн · ' +
  s.mat + ' материалов' + (s.crew ? (' · ' + s.crew + ' чел') : ' · бригада не задана');

const refAll     = () => chgAll().filter(c => String(c.kind || '').trim() === REF_KIND);
const refPending = () => refAll().find(c => chgSt(c) === 'Заявлено') || null;
function refLive(){
  const l = refAll().filter(c => CH_LIVE.includes(chgSt(c)));
  return l.length ? l[l.length - 1] : null;
}
const refFixedAt = c => { const m = String((c && c.comment) || '').match(/зафиксировано\s+(\d{4}-\d{2}-\d{2}\s\d{2}:\d{2})/); return m ? m[1] : ''; };

/* Что изменилось с момента фиксации. Сравниваем машинную часть снимка,
   а не человеческую подпись: подпись — для чтения, снимок — для сверки. */
function refDiff(){
  const live = refLive();
  if(!live) return null;
  const then = refParse(live.now), now = refSnap();
  const num = v => (v === '' || v == null) ? null : Number(v);
  const rows = [
    { k:'Работ',       was:num(then.works), now:now.works, dec:0 },
    { k:'Договор, $',  was:num(then.deal),  now:now.deal,  dec:2 },
    { k:'Срок, дн',    was:num(then.days),  now:now.days,  dec:1 },
    { k:'Материалов',  was:num(then.mat),   now:now.mat,   dec:0 },
    { k:'Рабочих',     was:num(then.crew),  now:now.crew,  dec:0 },
  ].map(r => Object.assign(r, { same: (r.was == null && r.now == null) || Number(r.was) === Number(r.now) }));
  return { live:live, at:refFixedAt(live), rows:rows, changed:rows.filter(r => !r.same).length };
}

function spreadPrices(onlyEmpty){
  const inp = document.getElementById('spSum');
  const sum = Number(String(inp ? inp.value : '').replace(',', '.'));
  if (!(sum > 0)) { toast('Введите сумму больше нуля', 'err'); return; }
  const targets = (D.works || []).filter(w => onlyEmpty ? !(Number(w.price_contractor_usd) > 0) : true);
  const base = targets.reduce((s, w) => s + (Number(w.price_alloc_usd) || 0), 0);
  if (!(base > 0)) { toast('Не от чего считать пропорцию', 'err'); return; }
  const list = targets.map(w => ({ code: w.code, name: w.name,
    value: Math.round(sum * (Number(w.price_alloc_usd) || 0) / base * 100) / 100 })).filter(x => x.value > 0);
  const total = list.reduce((s, x) => s + x.value, 0);
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px';
  box.innerHTML =
    '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;font-size:15px">' +
      '<div style="font-weight:700;margin-bottom:8px">Разнести ' + fmt(sum) + ' USD</div>' +
      '<div style="opacity:.7;font-size:14px;margin-bottom:12px">Пропорционально договорной цене работ.<br>Позиций: <b>' + list.length + '</b>, сумма после округления: <b>' + fmt(total) + ' USD</b><br>' +
      (onlyEmpty ? 'Затрагиваются только работы без цены.' : 'Перезапишутся все цены, включая заданные.') + '</div>' +
      '<div style="display:flex;gap:8px">' +
        '<button id="spNo" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +

  document.body.appendChild(box);

async function upd(sheet, code, field, value, opts){
  // Работник не пишет «Готово» напрямую (ни голосом, ни вручную):
  // любое его «Готово» становится ЗАЯВКОЙ на приёмку заказчику.
  const claimed = (!(opts&&opts.confirm) && field === "Статус" && value === "Готово");
  /* Мягкая проверка зависимостей: если предшественник ещё не принят —
     спрашиваем, но не запрещаем (карта связей черновая).            */
  if (claimed && sheet === "01_Работы" && !(opts && opts.skipDeps)) {
    const _w = (D.works || []).find(x => x.code === code);
    const _b = depBlockers(_w);
    if (_b.length) {
      const _go = await depAsk(_w, _b);
      if (!_go) { toast("Отменено", "err"); return false; }
    }
  }
  if(claimed) value = (D.role === "worker") ? "Заявлено" : "На приёмке у работника";
  toast(claimed ? "Отправляю на приёмку…" : "Сохраняю…", "wait");
  try{
    const r = await fetch(`${API}/update`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: INIT, key: KEY, sheet, code, field, value })
    });
    /* При отказе сервер отдаёт пустой ответ с кодом 200 (n8n throw → пустое тело).
       Поэтому «успех» = ok И непустое тело; пустое тело трактуем как отказ.      */
    const t = (await r.text()).trim();
    if(!r.ok || !t){
      throw new Error(t.includes("403") ? "Это поле только для чтения" : "Не удалось сохранить");
    }
    patch(sheet, code, field, value);
    tg?.HapticFeedback?.notificationOccurred("success");
    toast(claimed ? (D.role === "worker" ? "Заявлено — ждёт приёмки заказчиком" : "Отправлено работнику на подтверждение") : "Сохранено");
    return true;
  }catch(e){
    tg?.HapticFeedback?.notificationOccurred("error");
    toast(e.message, "bad");
    load();                                   // откатить экран к правде сервера
    return false;
  }
}

/* локально отразить правку — чтобы прогресс и суммы пересчитались сразу */
function patch(sheet, code, field, value){
  if(sheet === "01_Работы"){
    const w = D.works.find(x => x.code === code);
    if(!w) return;
    if(field === "Статус")        w.status   = value;
    if(field === "Готовность_%")  w.progress = Number(value) || 0;
    if(field === "Цена_Юрия_USD") w.price_contractor_usd = value === "" ? null : Number(value);
    if(field === "Цена_аллокация_USD") w.price_alloc_usd = value === "" ? null : Number(value);
    if(field === "Комментарий")   w.comment  = value;
    if(w.status === "Готово") w.progress = 100;
  }
  if(sheet === "03_Материалы"){
    const m = D.materials.find(x => x.name === code);
    if(!m) return;
    if(field === "Куплено")       m.in  = Number(value) || 0;
    if(field === "Израсходовано") m.out = Number(value) || 0;
    m.rest = (m.in || 0) - (m.out || 0);
  }
}

  /* 13_Элементы [чат 031] — схема проёмов. У нового объекта заводится сразу,
     у существующих остаётся необязательным: сервер не требует его в need_setup,
     иначе все объекты разом стали бы «не подготовленными». */
  { sheet: "13_Элементы", header: ["id","Сторона_A","Сторона_B","Тип_план","Тип_факт","Судьба","Название","Ширина_м","Высота_м","Примечание","Обновлено"] },
];
let OBJ_BUSY = false;
function renderSetup(d){
  const miss = String((d && d.missing) || "").trim();
  app.innerHTML = '<div class="hello">Объект не подготовлен</div>'
    + '<div class="sub">в таблице объекта не хватает листов</div>'
    + (miss ? '<div class="warnbox">Сервер не нашёл лист: <b>' + esc(miss) + '</b></div>' : "")
    + '<div class="stat"><span class="k">Кнопка ниже создаст недостающие листы объекта (' + OBJ_SHEETS.length + ' штук) с правильными шапками. Существующие листы не тронутся — их данные останутся как есть.</span></div>'
    + '<button class="tile pri" style="width:100%;margin-top:10px" onclick="objectSheets()"><span class="nm">Подготовить листы объекта</span></button>'
    + '<div id="setupnote"></div>'
    + '<div class="sub" style="margin-top:12px">Заводить листы может только администратор объекта.</div>';
}
async function objectSheets(){
  if(OBJ_BUSY) return;
  OBJ_BUSY = true;
  toast("Готовлю листы…", "wait");
  const made = [], had = [], fail = [];
  try{
    for(const s of OBJ_SHEETS){
      try{
        const r = await fetch(API + "/sheet", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: INIT, key: KEY, sheet: s.sheet, header: s.header })
        });
        const txt = (await r.text()).trim();
        let ok = false;
        try{ ok = !!(txt && JSON.parse(txt).ok); }catch(e){}
        (ok ? made : had).push(s.sheet);
      }catch(e){ fail.push(s.sheet); }
    }
  } finally { OBJ_BUSY = false; }
  const note = document.getElementById("setupnote");
  if(fail.length && !made.length && !had.length){
    toast("Нет связи с сервером — листы не созданы", "err");
    if(note) note.innerHTML = '<div class="warnbox">Сервер не ответил ни на один запрос. Проверьте интернет и попробуйте ещё раз.</div>';
    return;
  }
  toast("Создано: " + made.length
    + (had.length ? " · уже были: " + had.length : "")
    + (fail.length ? " · сбой связи: " + fail.length : ""));
  /* Ни один лист не создан — причина одна из двух, и обе честнее назвать,
     чем перезагружать панель в тот же тупик [чат 018]. */
  if(!made.length){
    if(note) note.innerHTML = '<div class="warnbox">Ни один лист не создан. Либо все стандартные листы объекта уже есть — тогда серверу не хватает листа вне стандартного набора, скажите об этом администратору. Либо у вас нет прав заводить листы.</div>';
    return;
  }
  setTimeout(() => location.reload(), 1600);
}

/* ══════════════════════════════════════════════════════════════
   ЛИСТЫ БРИГАДЫ [чат 012] — разовая подготовка общей базы.
   Четыре листа контура бригады (Работники · Наряды · Табель ·
   Отчёты_бригады) создаются через POST /remont/sheet с base:"common",
   по одному и строго последовательно: параллельные addSheet на одну
   таблицу конфликтуют. Шапки — ровно те, что читает GET-ветка API
   по параметру crew; менять их отдельно от кода ноды нельзя.
   Существующий лист сервер не пересоздаёт: ответ приходит без ok —
   считаем «видимо, уже был» (не ошибка); упавший fetch — сбой связи,
   его за «уже был» не выдаём. Замок CREW_BUSY: без него двойной тап
   (клики копятся в очереди событий, пока идут запросы) запускал
   второй круг — воспроизведено при первом живом нажатии [чат 012].
   После полного прохода плитка исчезает (CREW_DONE). Бригада может
   состоять из одного человека (решение 012): пустые листы — норма.
   ══════════════════════════════════════════════════════════════ */
const CREW_SHEETS = [
  { sheet: "Работники",      header: ["Бригадир","Имя","Telegram_ID","Телефон","Статус","Ставка_час_USD","Добавлен","Отключён","Примечание"] },
  { sheet: "Наряды",         header: ["id","Бригадир","Работник","Дата","Объект","Занятость","Задание","Статус","Создан"] },
  { sheet: "Табель",         header: ["id","Работник","Объект","Дата","Событие","Время","Отметил","Статус","Подтвердил","Комментарий"] },
  { sheet: "Отчёты_бригады", header: ["id","Дата","Работник","Тип","Код","Значение","Комментарий","Статус","Стало","Решил","Время"] },
];
let CREW_BUSY = false, CREW_DONE = false;
async function crewSheets(){
  if(CREW_BUSY) return;
  if(!confirm("Подготовить листы бригады в общей базе (4 листа)?")) return;
  CREW_BUSY = true;
  toast("Готовлю листы…", "wait");
  const made = [], had = [], fail = [];
  try{
    for(const s of CREW_SHEETS){
      try{
        const r = await fetch(API + "/sheet", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: INIT, key: KEY, sheet: s.sheet, header: s.header, base: "common" })
        });
        const txt = (await r.text()).trim();
        let ok = false;
        try{ ok = !!(txt && JSON.parse(txt).ok); }catch(e){}
        (ok ? made : had).push(s.sheet);
      }catch(e){ fail.push(s.sheet); }
    }
  } finally { CREW_BUSY = false; }
  CREW_DONE = !fail.length;
  if(fail.length && !made.length && !had.length){
    toast("Нет связи с сервером — листы не созданы", "err");
  } else {
    toast("Создано: " + made.length
      + (had.length ? " · видимо, уже были: " + had.length : "")
      + (fail.length ? " · сбой связи: " + fail.length : ""));
  }
  render();
}

/* ══════════════════════════════════════════════════════════════
   БРИГАДА [чат 012, экраны — чат 013] — контур бригадира и работника.
   Данные контура грузятся ОТДЕЛЬНЫМ запросом с параметром crew и живут
   в CREW_DATA, а не в D: поллинг каждые 15 секунд перезаписывает D
   целиком и затёр бы их. Обновление — заходом на экран или кнопкой.
   Бригада может состоять из одного человека (решение 012): пустой
   реестр — норма, бригадир работает сам; экраны прямо это говорят.
   Цепочка доверия (разбор 09): работник заявляет → бригадир
   подтверждает или правит → только после этого запись факт учёта.
   Ставка работника заказчику и самому работнику не показывается.  */
let CREW_DATA = null, CREW_LOAD = false;

async function crewLoad(){
  const auth = INIT ? "initData=" + encodeURIComponent(INIT) : "key=" + encodeURIComponent(KEY);
  const r = await fetch(API + "/data?" + auth + "&crew=1", { cache: "no-store" });
  const raw = (await r.text()).trim();
  let j = null; try{ j = JSON.parse(raw); }catch(e){}
  if(!j || !j.crew) throw new Error("нет данных бригады");
  CREW_DATA = j.crew;
  CREW_TS = Date.now();
  return CREW_DATA;
}
/* Один вход для всех экранов контура: свежие данные, затем переход. */
async function openCrewScreen(k){
  if(CREW_LOAD) return;
  CREW_LOAD = true;
  try{
    toast("Загружаю бригаду…", "wait");
    await crewLoad();
    toast("Готово");
    if(stack[stack.length - 1] === k) render(); else go(k);
  }catch(e){ toast("Не удалось загрузить бригаду", "err"); }
  finally{ CREW_LOAD = false; }
}
function openCrew(){ return openCrewScreen("crew"); }

/* Живые данные бригады (кандидат прогона 014): экраны контура тихо
   подтягивают свежее сами. Тик пропускается, когда идёт ввод или запись —
   перерисовка не должна красть фокус и сбрасывать поля. */
let CREW_TS = 0;
const CREW_LIVE = ["crew", "crew_orders", "crew_time", "crew_reports", "crew_cal", "crew_my"];
function crewFresh(){
  try{
    if(document.visibilityState !== "visible") return;
    if(!D || !D.kind) return;
    const scr = stack[stack.length - 1];
    const need = (D.kind === "hand" && scr === "home") || CREW_LIVE.indexOf(scr) >= 0;
    if(!need) return;
    if(Date.now() - CREW_TS < 75000) return;
    if(CREW_LOAD || HM || HM_BUSY || HR_BUSY) return;
    const a = document.activeElement;
    if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
    CREW_TS = Date.now(); /* тики не наслаиваются */
    crewLoad().then(() => render()).catch(() => {});
  }catch(e){}
}
setInterval(crewFresh, 30000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") crewFresh(); });

/* Тихая запись ячейки контура: без локального patch (данные в CREW_DATA
   правим сами по месту). Пустое тело при 200 = отказ (граблина 6).   */
async function crewCell(sheet, code, field, value){
  const r = await fetch(API + "/update", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData: INIT, key: KEY, sheet: sheet, code: code, field: field, value: value }) });
  const t = (await r.text()).trim();
  if(!r.ok || !t) throw new Error("Не удалось сохранить (" + field + ")");
  return true;
}
async function crewAppend(sheet, rows){
  const r = await fetch(API + "/append", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData: INIT, key: KEY, sheet: sheet, rows: rows }) });
  const t = (await r.text()).trim();
  let ok = false; try{ ok = !!(t && JSON.parse(t).ok); }catch(e){}
  if(!r.ok || !ok) throw new Error("Сервер не принял запись");
  return true;
}

/* Даты и время — всегда в поясе объекта (+5), как chgStamp: телефоны
   работников могут жить в любом поясе, а табель — в ташкентском.     */
function crewToday(){ return chgStamp().slice(0, 10); }
function crewNow(){ return chgStamp().slice(11, 16); }
function dShift(iso, n){
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function dLabel(iso){
  const t = crewToday();
  if(iso === t) return "сегодня";
  if(iso === dShift(t, 1)) return "завтра";
  if(iso === dShift(t, -1)) return "вчера";
  const d = new Date(iso + "T00:00:00Z");
  const wd = ["вс","пн","вт","ср","чт","пт","сб"][d.getUTCDay()] || "";
  return iso.slice(8, 10) + "." + iso.slice(5, 7) + " " + wd;
}
function crewId(pfx){ return pfx + "-" + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 36).toString(36).toUpperCase(); }
const CREW_BTN  = 'style="padding:10px 14px;border-radius:10px;border:0;background:#0a84ff;color:#fff;font-size:14px"';
const CREW_BTN2 = 'style="padding:10px 14px;border-radius:10px;border:0;background:#3a3a3c;color:#fff;font-size:14px"';
const CREW_BTNR = 'style="padding:10px 14px;border-radius:10px;border:0;background:#e5484d;color:#fff;font-size:14px"';
const CREW_INP  = 'style="width:100%;padding:12px;border-radius:12px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px"';

/* ── Приглашения и реестр (как в 012) ── */
function invGen(){
  const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";   // без похожих O/0, I/1, L
  const buf = new Uint32Array(8);
  crypto.getRandomValues(buf);
  return [...buf].map(x => A[x % A.length]).join("");
}
function invLink(code){ return "https://t.me/ss_remont_bot?startapp=inv_" + code; }
function invShare(code){
  const link = invLink(code);
  const text = "Приглашение в бригаду. Откройте ссылку: " + link + "\nЕсли ссылка не открыла панель — нажмите в боте кнопку «Смета» и введите код: " + code;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => toast("Приглашение скопировано — перешлите работнику"))
      .catch(() => toast("Не удалось скопировать — выделите текст на экране", "err"));
  } else toast("Выделите и скопируйте текст на экране", "err");
}
let CREW_ADD_BUSY = false;

  const phone = String((document.getElementById("cw_phone") || {}).value || "").trim();
  if(!name){ toast("Введите имя работника", "err"); return; }
  if(((CREW_DATA || {}).workers || []).some(w => String(w.name || "").trim().toLowerCase() === name.toLowerCase())){

      "Бригадир": D.who, "Имя": name, "Телефон": phone,
      "Статус": "приглашён", "Добавлен": chgStamp(), "Код_приглашения": code,
    }]);
    toast("Приглашение создано");
    await openCrewScreen("crew");
  }catch(e){ toast("Не удалось создать приглашение", "err"); }

}

/* Отключение работника = Статус «отключён» + снятие будущих нарядов.
   Строка не удаляется: на ней висят табель и подтверждённые отчёты
   (разбор 09 §3.1). Полное гашение строки в 09_Доступы — за заказчиком:
   у бригадира нет прав на лист доступов, и это правильно.            */
let CW_OFF_BUSY = false;
async function cwOff(i){
  const w = (((CREW_DATA || {}).workers) || [])[i];
  if(!w || CW_OFF_BUSY) return;
  if(!confirm("Отключить работника «" + w.name + "»? Наряды вперёд снимутся (начатый сегодняшний день останется), история цела.")) return;
  CW_OFF_BUSY = true;
  try{
    toast("Отключаю…", "wait");
    await crewCell("Работники", w.name, "Статус", "отключён");
    await crewCell("Работники", w.name, "Отключён", crewToday());
    const today = crewToday();
    /* Сегодняшний наряд снимается, только если день не начат: есть отметки
       табеля — день считается рабочим и остаётся (уточнение прогона 014). */
    const dayStarted = (((CREW_DATA || {}).time) || []).some(x =>
      String(x.worker || "").trim() === String(w.name).trim() &&
      String(x.date || "") === today && String(x.status || "") !== "отклонено");
    const future = ((CREW_DATA || {}).orders || []).filter(o =>
      String(o.worker || "").trim() === String(w.name).trim() &&
      String(o.status || "") === "назначен" &&
      (String(o.date || "") > today || (String(o.date || "") === today && !dayStarted)));
    for(const o of future){ await crewCell("Наряды", o.id, "Статус", "отменён"); o.status = "отменён"; }
    w.status = "отключён"; w.off = crewToday();
    toast("Отключён" + (future.length ? " · снято нарядов: " + future.length : ""));
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ CW_OFF_BUSY = false; }
}
async function cwOn(i){
  const w = (((CREW_DATA || {}).workers) || [])[i];
  if(!w || CW_OFF_BUSY) return;
  CW_OFF_BUSY = true;
  try{
    toast("Возвращаю…", "wait");
    await crewCell("Работники", w.name, "Статус", "активен");
    await crewCell("Работники", w.name, "Отключён", "");
    w.status = "активен"; w.off = "";
    toast("Работник снова активен");
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ CW_OFF_BUSY = false; }
}

/* ── НАРЯДЫ (бригадир): кто где завтра ── */
let ORD_BUSY = false, ORD_PAST = false;
function ordActive(){ return (((CREW_DATA || {}).orders) || []).filter(o => String(o.status || "") !== "отменён"); }
async function ordCreate(){
  const g = id => String((document.getElementById(id) || {}).value || "").trim();
  const worker = g("or_worker"), from = g("or_from"), to = g("or_to") || from;
  const load0 = g("or_load"), hours = g("or_hours"), object = g("or_object"), task = g("or_task");
  if(!worker){ toast("Выберите работника", "err"); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(from)){ toast("Укажите дату", "err"); return; }
  if(to < from){ toast("Дата «по» раньше даты «с»", "err"); return; }
  if(!task){ toast("Напишите задание", "err"); return; }
  const load = load0 === "часы" ? ("часы " + (Number(hours) || 4)) : load0;
  const days = [];
  for(let d = from; d <= to && days.length < 31; d = dShift(d, 1)) days.push(d);
  if(days.length > 14 && !confirm("Наряд на " + days.length + " дней подряд — создать?")) return;
  /* Конфликт (разбор 09 §3.2): два «весь день» на одну дату — предупреждаем,
     но не запрещаем: бывает переброска в середине дня. */
  const busyDays = days.filter(d => ordActive().some(o =>
    String(o.worker || "").trim() === worker && String(o.date || "") === d &&
    String(o.load || "") === "весь день" && load === "весь день"));
  if(busyDays.length && !confirm(worker + " уже занят весь день: " + busyDays.map(dLabel).join(", ") + ". Всё равно назначить?")) return;
  if(ORD_BUSY) return;
  ORD_BUSY = true;
  try{
    toast("Создаю наряд…", "wait");
    const rows = days.map(d => ({
      "id": crewId("NR"), "Бригадир": D.who, "Работник": worker, "Дата": d,
      "Объект": object, "Занятость": load, "Задание": task,
      "Статус": "назначен", "Создан": chgStamp(),
    }));
    await crewAppend("Наряды", rows);
    toast("Наряд создан" + (rows.length > 1 ? " на " + rows.length + " дн" : ""));
    await crewLoad(); render();
  }catch(e){ toast(e.message, "err"); }
  finally{ ORD_BUSY = false; }
}
async function ordCancel(i){
  const o = (((CREW_DATA || {}).orders) || [])[i];
  if(!o || ORD_BUSY) return;
  if(!confirm("Отменить наряд: " + (o.worker || "") + ", " + dLabel(String(o.date || "")) + "?")) return;
  ORD_BUSY = true;
  try{
    toast("Отменяю…", "wait");
    await crewCell("Наряды", o.id, "Статус", "отменён");
    o.status = "отменён";
    toast("Наряд отменён");
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ ORD_BUSY = false; }
}

/* ── ТАБЕЛЬ (бригадир): подтверждение отметок ── */
let TM_BUSY = false, TM_FIX = null, TM_ALL = false;
async function tmDecide(i, mode){
  const t = (((CREW_DATA || {}).time) || [])[i];
  if(!t || TM_BUSY) return;
  if(mode === "reject" && !confirm("Отклонить отметку «" + (t.event || "") + " " + (t.time || "") + "» (" + (t.worker || "") + ")?")) return;
  let newTime = "";
  if(mode === "fix"){
    newTime = String((document.getElementById("tm_" + i) || {}).value || "").trim();
    if(!/^\d{2}:\d{2}$/.test(newTime)){ toast("Время — в формате ЧЧ:ММ", "err"); return; }
  }
  if(TM_BUSY) return;
  TM_BUSY = true;
  try{
    toast("Сохраняю…", "wait");
    if(mode === "fix"){
      await crewCell("Табель", t.id, "Время", newTime);
      await crewCell("Табель", t.id, "Статус", "исправлено");
      t.time = newTime; t.status = "исправлено";
    } else if(mode === "reject"){
      await crewCell("Табель", t.id, "Статус", "отклонено");
      t.status = "отклонено";
    } else {
      await crewCell("Табель", t.id, "Статус", "подтверждено");
      t.status = "подтверждено";
    }
    await crewCell("Табель", t.id, "Подтвердил", D.who);
    t.confirmed = D.who;
    TM_FIX = null;
    toast(mode === "reject" ? "Отметка отклонена" : "Отметка " + (mode === "fix" ? "исправлена" : "подтверждена"));
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ TM_BUSY = false; }
}
/* ── ЧАСЫ БРИГАДИРА (заказчик) [чат 026, маяк §15] ──
   «Бригадир сам себе бригадир, но финально подтвердить дни работы, а вернее
   часы, должен заказчик». Механика решения — та же, что у бригадира с отметками
   бригады: подтвердить · исправить время · отклонить, запись в тот же лист
   «Табель». Список свой (c.ftime) и функция своя: у бригадирского пути уже есть
   живой прогон, и вешать на него вторую роль — плодить общие поломки. */
let FT_BUSY = false, FT_FIX = null, FT_ALL = false;
async function ftDecide(i, mode){
  const t = (((CREW_DATA || {}).ftime) || [])[i];
  if(!t || FT_BUSY) return;
  if(mode === "reject" && !confirm("Отклонить отметку «" + (t.event || "") + " " + (t.time || "") + "» (" + (t.worker || "") + ")?")) return;
  let newTime = "";
  if(mode === "fix"){
    newTime = String((document.getElementById("ft_" + i) || {}).value || "").trim();
    if(!/^\d{2}:\d{2}$/.test(newTime)){ toast("Время — в формате ЧЧ:ММ", "err"); return; }
  }
  FT_BUSY = true;
  try{
    toast("Сохраняю…", "wait");
    if(mode === "fix"){
      await crewCell("Табель", t.id, "Время", newTime);
      await crewCell("Табель", t.id, "Статус", "исправлено");
      t.time = newTime; t.status = "исправлено";
    } else if(mode === "reject"){
      await crewCell("Табель", t.id, "Статус", "отклонено");
      t.status = "отклонено";
    } else {
      await crewCell("Табель", t.id, "Статус", "подтверждено");
      t.status = "подтверждено";
    }
    await crewCell("Табель", t.id, "Подтвердил", D.who);
    t.confirmed = D.who;
    FT_FIX = null;
    toast(mode === "reject" ? "Отметка отклонена" : "Отметка " + (mode === "fix" ? "исправлена" : "подтверждена"));
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ FT_BUSY = false; }
}
/* Блок часов бригадира на экране «Бригада» у заказчика. Пустой список — не
   ошибка: бригадир мог ещё ни разу не отметиться, и говорить об этом надо
   прямо, а не пустым местом. */
function ftBlock(c){
  const rows = ((c || {}).ftime) || [];
  if(!rows.length) return '<div class="stat"><span class="k">Бригадир пока не отмечал свои часы. Когда отметит, решение появится здесь.</span></div>';
  const wait = rows.filter(x => String(x.status || "") === "заявлено");
  const view = FT_ALL ? rows : rows.filter(x => String(x.date || "") >= dShift(crewToday(), -7));
  const groups = {};
  view.forEach(x => { const d = String(x.date || "?"); (groups[d] = groups[d] || []).push(x); });
  const idxOf = x => rows.indexOf(x);
  const card = x => {
    const i = idxOf(x);
    const open = String(x.status || "") === "заявлено";
    return '<div class="work"><div class="t">' + esc(String(x.worker || "")) + " · " + esc(String(x.event || "")) + " · " + esc(String(x.time || "")) + "</div>" +
      '<div class="m">' + (x.object ? esc(String(x.object)) + " · " : "") + esc(String(x.status || "")) +
        (x.confirmed ? " · решил " + esc(String(x.confirmed)) : "") + "</div>" +
      (open ? (FT_FIX === i ?
        '<div class="m" style="margin-top:8px;display:flex;gap:8px;align-items:center">' +
          '<input id="ft_' + i + '" type="time" value="' + attr(String(x.time || "")) + '" style="flex:1;padding:10px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px">' +
          '<button onclick="ftDecide(' + i + ',\'fix\')" ' + CREW_BTN + ">Сохранить</button>" +
          '<button onclick="FT_FIX=null;render()" ' + CREW_BTN2 + ">✕</button>" +
        "</div>" :
        '<div class="m" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">' +
          '<button onclick="ftDecide(' + i + ',\'ok\')" ' + CREW_BTN + ">Подтвердить</button>" +
          '<button onclick="FT_FIX=' + i + ';render()" ' + CREW_BTN2 + ">Исправить время</button>" +
          '<button onclick="ftDecide(' + i + ',\'reject\')" ' + CREW_BTNR + ">Отклонить</button>" +
        "</div>") : "") +
      tmcUI(x) +
      "</div>";
  };
  const list = Object.keys(groups).sort().reverse().map(d =>
    '<div class="sub" style="margin-top:14px">' + dLabel(d) + "</div>" + groups[d].map(card).join("")).join("");
  return '<div class="sub" style="margin-top:16px">Часы бригадира</div>' +
    '<div class="stat"><span class="k">' + (wait.length ? (wait.length + " ждут вашего решения") : "все часы бригадира решены") + "</span></div>" +
    '<div class="filt"><button class="' + (FT_ALL ? "on" : "") + '" onclick="FT_ALL=!FT_ALL;render()">' + (FT_ALL ? "Только последняя неделя" : "Показать всё") + "</button></div>" +
    (view.length ? list : '<div class="stat"><span class="k">За последнюю неделю отметок нет.</span></div>');
}

/* ── ПРАВКА РЕШЁННЫХ ЧАСОВ [чат 027, маяк §15] ──
   «Последующие изменения этой информации так же: запрос и подтверждение или
   опровержение». Решённую отметку (подтверждена или исправлена) больше нельзя
   переписать тихо — правка идёт заявкой вида «часы» в 11_Изменения: ссылка на
   отметку в «Код_работы», время в «Было» → «Стало», дельты нулевые, поэтому
   договор она не двигает (тот же приём, что у вида «точка», решение 019).
   Новой сущности в данных не заводим — механизм согласования в системе один
   на всё: заявил → вторая сторона приняла или оспорила (решение 006).
   Применяет принявшая сторона: право писать «Время» в «Табеле» есть и у
   заказчика (поля решения, чат 026), и у бригадира — значит ждать третьего
   не нужно, а «принято, но не применено» перестало бы значить хоть что-то. */
const TMC_KIND = 'часы';
const TMC_DONE = ['подтверждено', 'исправлено'];   /* решённые отметки: только их правят заявкой */
let TMC_FORM = null;      /* id отметки с открытой формой правки */
let TMC_BUSY = false;     /* замок от повторного входа [грабля 012] */

/* Час без ведущего нуля — обычное дело для значения, пришедшего из листа:
   Google хранит время числом и отдаёт отображаемое «8:20» (грабля 19, на ней
   падала регистрация в 014). Сравнивать и подставлять в поле ввода можно
   только приведённое к ЧЧ:ММ, иначе «правка 8:20 → 08:20» пройдёт как
   настоящая. Показываем при этом то, что пришло: это данные листа. */
const tmcHM = v => {
  const m = String(v == null ? '' : v).trim().match(/^(\d{1,2}):(\d{2})/);
  return m ? (m[1].length < 2 ? '0' : '') + m[1] + ':' + m[2] : '';
};
const tmcDone = t => TMC_DONE.includes(String((t && t.status) || '').trim());
const tmcAll  = () => chgAll().filter(c => String(c.kind || '').trim() === TMC_KIND);
const tmcFor  = id => tmcAll().filter(c => String(c.code || '') === String(id));
const tmcOpen = id => tmcFor(id).filter(c => chgSt(c) === 'Заявлено')[0] || null;
const tmcLast = id => tmcFor(id).filter(c => ['Применено', 'Оспорено'].includes(chgSt(c))).slice(-1)[0] || null;
/* Отметку ищем во всех трёх списках: свои часы бригадира (my_time), часы
   бригадира глазами заказчика (ftime) и табель бригады (time). */
const tmcRow  = id => ((((CREW_DATA || {}).my_time) || [])
  .concat(((CREW_DATA || {}).ftime) || [], ((CREW_DATA || {}).time) || []))
  .filter(x => String(x.id) === String(id))[0] || null;

async function tmcSubmit(id){
  if(TMC_BUSY) return;
  const t = tmcRow(id);
  if(!t){ toast('Отметка не найдена', 'err'); return; }
  const nt = String((document.getElementById('tmc_' + id) || {}).value || '').trim();
  if(!/^\d{2}:\d{2}$/.test(nt)){ toast('Время — в формате ЧЧ:ММ', 'err'); return; }
  if(nt === tmcHM(t.time)){ toast('Время то же самое — менять нечего', 'err'); return; }
  if(tmcOpen(id)){ toast('По этой отметке уже заявлена правка', 'err'); return; }
  const why = String((document.getElementById('tmcw_' + id) || {}).value || '').trim();
  TMC_BUSY = true;
  try{
    toast('Отправляю на согласование…', 'wait');
    await crewAppend('11_Изменения', [{
      'id': 'CH-' + Date.now().toString(36).toUpperCase(),
      'Время': chgStamp(),
      'Инициатор': D.who,
      'Вид': TMC_KIND,
      'Код_работы': String(id),
      'Что_меняем': 'Часы: ' + String(t.worker || '') + ' · ' + String(t.date || '') + ' · ' + String(t.event || ''),
      'Было': tmcHM(t.time) || String(t.time || ''),
      'Стало': nt,
      'Дельта_USD': 0,
      'Дельта_дней': 0,
      'Статус': 'Заявлено',
      'Решил': '',
      'Комментарий': why,
    }]);
    TMC_FORM = null;
    toast('Правка заявлена — ждёт решения второй стороны');
    await load();
    await crewLoad();
  }catch(e){ toast(e.message, 'err'); }
  finally{ TMC_BUSY = false; }
}

/* Разметка правки под карточкой отметки — одна на оба контура: у бригадира
   («Мой день») и у заказчика («Часы бригадира») путь один и тот же, и вешать
   на него две разные разметки значило бы чинить потом в двух местах. */
function tmcUI(t){
  if(!t || !tmcDone(t)) return '';
  const id = String(t.id || '');
  const op = tmcOpen(id);
  if(op){
    const line = '<div class="m" style="margin-top:6px;color:var(--warn)">✎ правка времени: ' +
      esc(String(op.was || '')) + ' → ' + esc(String(op.now || '')) +
      (op.comment ? (' · ' + esc(String(op.comment))) : '') + '</div>';
    if(String(op.by || '') === String(D.who))
      return line + '<div class="m" style="color:var(--warn)">⏳ Ждёт ответа второй стороны</div>';
    return line + '<div class="m" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button onclick="chgAccept(\'' + esc(String(op.id)) + '\')" ' + CREW_BTN + '>Принять правку</button>' +
      '<button onclick="chgDispute(\'' + esc(String(op.id)) + '\')" ' + CREW_BTNR + '>Оспорить правку</button></div>';
  }
  const last = tmcLast(id);
  const hist = last ? ('<div class="m" style="opacity:.65">правка ' + esc(String(last.was || '')) + ' → ' +
    esc(String(last.now || '')) + ' · ' + esc(chgSt(last)) + '</div>') : '';
  if(TMC_FORM === id)
    return hist +
      '<div class="m" style="margin-top:8px;display:flex;gap:8px;align-items:center">' +
        '<input id="tmc_' + attr(id) + '" type="time" value="' + attr(tmcHM(t.time)) + '" style="flex:1;padding:10px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px">' +
        '<button onclick="tmcSubmit(\'' + esc(id) + '\')" ' + CREW_BTN + '>Заявить</button>' +
        '<button onclick="TMC_FORM=null;render()" ' + CREW_BTN2 + '>✕</button>' +
      '</div>' +
      '<div style="margin-top:8px"><input id="tmcw_' + attr(id) + '" type="text" placeholder="почему меняем — необязательно" style="width:100%;padding:10px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:14px"></div>';
  return hist + '<div class="m" style="margin-top:8px">' +
    '<button onclick="TMC_FORM=\'' + esc(id) + '\';render()" ' + CREW_BTN2 + '>Изменить время</button></div>';
}

/* Человекодни: уникальные пары дата+работник по подтверждённым отметкам —
   та же формула, что в GET-ноде для заказчика. */
function tmMandays(rows){
  const seen = {};
  rows.forEach(r => {
    if(["подтверждено", "исправлено"].includes(String(r.status || ""))){
      seen[String(r.date || "") + "|" + String(r.worker || "")] = 1;
    }
  });
  return Object.keys(seen).length;
}

/* ── ОТЧЁТЫ (бригадир): буфер работ и материалов от работников ──
   Принять как есть → «принято»; поправить значение → «исправлено»,
   исходное остаётся в «Значение», версия бригадира — в «Стало»:
   через месяц в споре важно, что именно сказал работник (разбор 09).
   Только принятое уходит в учёт объекта: работа → Готовность_%,
   материал → Израсходовано (+= значение).                          */
let RP_BUSY = false;
async function rpDecide(i, mode){
  const p = (((CREW_DATA || {}).reports) || [])[i];
  if(!p || RP_BUSY) return;
  if(mode === "reject" && !confirm("Отклонить отчёт " + (p.worker || "") + "?")) return;
  let val = String(p.value || "").trim();
  if(mode === "accept"){
    val = String((document.getElementById("rp_" + i) || {}).value || "").trim().replace(",", ".");
    if(val === "" || isNaN(Number(val))){ toast("Значение — число", "err"); return; }
  }
  if(RP_BUSY) return;
  RP_BUSY = true;
  try{
    toast("Сохраняю…", "wait");
    if(mode === "reject"){
      await crewCell("Отчёты_бригады", p.id, "Статус", "отклонено");
      p.status = "отклонено";
    } else {
      const changed = String(val) !== String(p.value ?? "").trim().replace(",", ".");
      if(changed){
        await crewCell("Отчёты_бригады", p.id, "Стало", val);
        await crewCell("Отчёты_бригады", p.id, "Статус", "исправлено");
        p.corrected = val; p.status = "исправлено";
      } else {
        await crewCell("Отчёты_бригады", p.id, "Статус", "принято");
        p.status = "принято";
      }
    }
    await crewCell("Отчёты_бригады", p.id, "Решил", D.who);
    p.solved = D.who;
    /* Перенос в учёт объекта — после фиксации решения: если он упадёт,
       решение уже записано, а учёт бригадир поправит руками по подсказке. */
    let carried = true;
    if(mode !== "reject"){
      try{
        if(String(p.type || "") === "работа"){
          const w = (D.works || []).find(x => x.code === String(p.code || "").trim());
          if(w){
            const prog = Math.max(0, Math.min(100, Number(val)));
            await crewCell("01_Работы", w.code, "Готовность_%", prog);
            patch("01_Работы", w.code, "Готовность_%", prog);
            if(prog >= 100) toast("Готовность 100% — заявите приёмку на экране «Работы»", "wait");
          } else toast("Работа «" + String(p.code || "") + "» не найдена в смете — учёт не тронут", "err");
        } else {
          const name = String(p.code || "").trim();
          const m = (D.materials || []).find(x => String(x.name || "").trim() === name);
          if(m){
            const total = (Number(m.out) || 0) + Number(val);
            await crewCell("03_Материалы", name, "Израсходовано", total);
            patch("03_Материалы", name, "Израсходовано", total);
          } else {
            await crewAppend("03_Материалы", [{ "Материал": name, "Израсходовано": val, "Источник": "отчёт бригады" }]);
          }
        }
      }catch(e2){ carried = false; toast("Решение записано, но учёт не обновился — поправьте с экрана работ или материалов", "err"); }
    }
    if(carried) toast(mode === "reject" ? "Отчёт отклонён" : "Отчёт принят — учёт обновлён");
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ RP_BUSY = false; }
}

/* ── РАБОТНИК (hand): свой день, календарь, отчёты ── */
let HM = null, HM_BUSY = false, HR_BUSY = false, HR_TYPE = "работа";
/* Черновики обеих вкладок отчёта: переключение вкладки не теряет ввод,
   отправка забирает все заполненные части (кандидат прогона 014). */
let HR_DRAFT = { "работа": { code: "", val: "", comment: "" }, "материал": { mat: "", val: "", comment: "" } };
function hrSet(field, el){ HR_DRAFT[HR_TYPE][field] = String(el.value == null ? "" : el.value); }
function hrTab(v){ HR_TYPE = v; render(); }
function handMyOrders(){ return ordActive(); }   // сервер уже отдал hand только его наряды
function handObject(){
  const today = crewToday();
  /* Наряд без объекта — не ответ [чат 026]: раньше первая же сегодняшняя строка
     возвращала пустую строку, и «Объект» в табеле оставался пустым, хотя объект
     был известен из соседних записей. */
  const t = handMyOrders().find(o => String(o.date || "") === today && String(o.object || "").trim());
  if(t) return String(t.object || "");
  const past = handMyOrders().filter(o => String(o.date || "") <= today).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  if(past.length && String(past[past.length - 1].object || "").trim()) return String(past[past.length - 1].object || "");
  /* У бригадира наряда на себя нет [чат 026]: он их выдаёт, а не получает,
     и его строка табеля уходила в лист с пустым «Объектом». Берём объект из
     последней отметки — сначала своей, потом бригадной: это тот же объект,
     просто записанный кем-то другим. */
  const seen = ((((CREW_DATA || {}).my_time) || []).concat((((CREW_DATA || {}).time) || [])))
    .filter(x => String(x.object || "").trim())
    .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
  return seen.length ? String(seen[seen.length - 1].object || "") : "";
}
/* Кому уходит моя отметка [чат 026, маяк §15]: у работника её решает бригадир,
   у бригадира — заказчик («бригадир сам себе бригадир, но финально подтвердить
   часы должен заказчик»). Подпись обязана называть верного адресата: она —
   единственное, из чего человек понимает, кто теперь ждёт решения. */
function markGoesTo(){ return (D && (D.kind === "foreman" || D.role === "foreman")) ? "заказчику" : "бригадиру"; }
function markHint(){ return markGoesTo() === "заказчику" ? "уйдёт заказчику на подтверждение" : "уйдёт бригадиру на подтверждение"; }
function handMark(ev){ HM = { ev: ev, mode: "now" }; render(); }
/* Кнопки и голос считают момент одной функцией: разойдись они — ночная
   отметка кнопкой и голосом легла бы в разные сутки. [чат 028] */
function handMarkMoment(){
  if(!HM) return null;
  if(HM.mode === "custom"){
    const el = document.getElementById("hm_time");
    const v = String(el ? (el.value || "") : (HM.at || crewNow())).trim();
    return /^\d{1,2}:\d{2}$/.test(v) ? handMoment({ at: v }) : null;
  }
  return handMoment({ shift_min: { now: 0, m10: 10, m30: 30, m60: 60 }[HM.mode] || 0 });
}
function handMarkTime(){ const m = handMarkMoment(); return m ? m.time : ""; }
/* Что именно запишется — видно до нажатия «Записать»: и время, и день.
   Введённое своё время держим в HM.at: панель перерисовывается поллингом,
   и без этого набранное пропадало бы на очередном обновлении. */
function hmWhen(){
  const m = handMarkMoment();
  if(!m) return "Время — в формате ЧЧ:ММ";
  return "Запишется: " + (m.date === crewToday() ? "сегодня" : dLabel(m.date)) + " " + m.time;
}
function hmHint(){
  const el = document.getElementById("hm_time");
  if(el && HM) HM.at = el.value;
  const box = document.getElementById("hm_when");
  if(box) box.textContent = hmWhen();
}
async function handMarkGo(){
  if(!HM || HM_BUSY) return;
  const mo = handMarkMoment();

async function handReport(){
  if(HR_BUSY) return;
  /* Уходят ВСЕ заполненные вкладки, а не только открытая (кандидат прогона 014). */
  const w = HR_DRAFT["работа"], m = HR_DRAFT["материал"];
  const wFilled = !!(w.code || String(w.val).trim());
  const mFilled = !!(String(m.mat).trim() || String(m.val).trim());
  if(!wFilled && !mFilled){ toast("Заполните работу или материал", "err"); return; }
  const rows = [], errs = [];
  if(wFilled){
    const n = Number(String(w.val).replace(",", "."));
    if(!w.code) errs.push("работа: выберите из списка");
    else if(!(n >= 0 && n <= 100)) errs.push("работа: готовность — число от 0 до 100");
    else rows.push({ t: "работа", c: w.code, v: String(n), k: String(w.comment || "").trim() });
  }
  if(mFilled){
    const v = String(m.val).replace(",", ".").trim();
    if(!String(m.mat).trim()) errs.push("материал: напишите, какой");
    else if(v === "" || isNaN(Number(v))) errs.push("материал: количество — число");
    else rows.push({ t: "материал", c: String(m.mat).trim(), v: v, k: String(m.comment || "").trim() });
  }
  if(errs.length){ toast(errs.join(" · "), "err"); return; }
  HR_BUSY = true;
  try{
    toast("Отправляю бригадиру…", "wait");
    await crewAppend("Отчёты_бригады", rows.map((r, i) => ({
      "id": crewId("RP") + (rows.length > 1 ? "-" + (i + 1) : ""),
      "Дата": crewToday(), "Работник": D.who,
      "Тип": r.t, "Код": r.c, "Значение": r.v, "Комментарий": r.k,
      "Статус": "новый", "Стало": "", "Решил": "", "Время": crewNow(),
    })));
    toast("Отчёт ушёл бригадиру: " + rows.map(r => r.t).join(" + "));
    HR_DRAFT = { "работа": { code: "", val: "", comment: "" }, "материал": { mat: "", val: "", comment: "" } };
    await crewLoad(); render();
  }catch(e){ toast(e.message, "err"); }
  finally{ HR_BUSY = false; }
}

/* ── НАВИГАЦИЯ (стек, ровно один уровень вглубь) ───────────── */
/* Вертикальная позиция экрана [чат 021]. Раньше любая перерисовка бросала
   страницу наверх: поллинг раз в 15 секунд сбрасывал прокрутку посреди чтения
   длинного списка, а возврат со второго уровня открывал экран с начала, хотя
   человек ушёл с его середины. Позиция хранится по ключу экрана в памяти
   вкладки — переживать перезагрузку ей незачем. */
const SCROLL = {};
function scrollSave(){ try{ SCROLL[stack[stack.length - 1]] = window.scrollY || 0; }catch(e){} }
function go(k){ scrollSave(); stack.push(k); render(true); }
function back(){ if(stack.length > 1){ scrollSave(); stack.pop(); render(true); } }

function render(toTop){
  const k = stack[stack.length - 1];
  const keep = window.scrollY || 0;               // где человек стоял до перерисовки
  app.innerHTML = (SCREENS[k] || SCREENS.home)();
  uzApply(app);                                   // языковой слой E1 [чат 020]
  if(k === "object" && objPlan()) setTimeout(objShowPlan, 0);   // картинка плана грузится отдельным запросом [чат 016]
  /* Переход (toTop) открывает экран там, где его оставили в прошлый раз;
     перерисовка от данных не двигает страницу вовсе. Восстановление отложено
     на кадр: сразу после подстановки разметки высота документа ещё старая,
     и scrollTo упёрся бы в неё [чат 021]. */
  const want = toTop ? (SCROLL[k] || 0) : keep;
  if(want || toTop){
    const put = () => window.scrollTo(0, want);
    put();
    if(typeof requestAnimationFrame === "function") requestAnimationFrame(put); else setTimeout(put, 0);
  }
  if(tg){
    if(stack.length > 1){ tg.BackButton.show(); tg.BackButton.onClick(back); }
    else tg.BackButton.hide();
  }
}
