profile(){
  const room = profRoom();
  const cat  = D.catalog || { kinds: [], price: [] };

  if(!room){
    const all = profTotalAll();
    const items = (D.rooms || []).map(r => {
      const t = profTotal(r.code);
      /* Пустое поле листа — не «ноль проёмов»: Number(null) даёт 0, и подсказка
         «не заданы» молчала с чата 007. Пустоту проверяем до приведения к числу [чат 017]. */
      const empty = v => v === null || v === undefined || v === '' || !(Number(v) >= 0);
      const miss = [];
      if(empty(r.windows)) miss.push('окна');
      if(empty(r.doors)) miss.push('двери');
      return '<div class="work" onclick="PROF.room=\'' + esc(r.code) + '\'; render(true)" style="cursor:pointer' + (t.n ? ';border-left:3px solid #30d158;padding-left:9px' : '') + '">' +
        '<div class="t">' + (t.n ? '✅ ' : '') + esc(r.name) + '</div>' +
        '<div class="m">' + (t.n ? ('в плане ' + t.n + ' работ · ' + fmt(t.sum) + ' USD' + (t.blank ? (' · без объёма: ' + t.blank) : '') + ' · ') : '') +
        'пол ' + fmt(r.floor_m2) + ' · стены ' + fmt(r.wall_m2) + ' · потолок ' + fmt(r.ceiling_m2) + ' · периметр ' + fmt(r.perimeter_m) +
        (miss.length ? ' · не заданы: ' + miss.join(', ') : '') + '</div></div>';
    }).join('');
    return '<div class="hello">Профиль ремонта</div>' +
      '<div class="sub">' + (all.n ? esc(profTotalAllText()) : 'Выберите помещение или продиктуйте работы') + '</div>' +
      '<div class="stat"><span class="k">К помещению применяются виды работ, объём считается из его размеров, цена — из прайса исполнителя. Пройдите помещения подряд — смета соберётся одним действием в конце.</span></div>' +
      '<div class="stat"><div class="r"><button onclick="qzStart()" style="flex:1;padding:12px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">🧭 Пройти вопросами</button></div>' +
      '<div class="r" style="margin-top:8px"><button onclick="startVoice(\'repair\')" style="flex:1;padding:12px;border-radius:12px;border:0;background:#1c1c1e;color:#fff;font-size:15px;border:1px solid #3a3a3c">🎤 Продиктовать работы</button></div>' +
        '<div class="r"><span class="k" style="font-size:13px;opacity:.75">Например: «в спальне потолок выровнять и покрасить, стены под обои» — помещение подставится из сказанного.</span></div></div>' +
      (all.n ? ('<div class="stat"><div class="r" style="display:flex;gap:8px">' +
        '<button onclick="profBuild()" style="flex:2;padding:13px;border-radius:12px;border:0;background:#30d158;color:#000;font-size:15px;font-weight:600">Собрать смету: ' + all.n + ' работ · ' + fmt(all.sum) + ' USD</button>' +
        '<button onclick="if(confirm(\'Очистить план?\')){ PROF.plan = {}; render(true); }" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Очистить</button>' +
      '</div>' + (all.blank ? '<div class="r"><span class="k" style="font-size:13px;color:#ff9f0a">Без объёма: ' + all.blank + ' — заполните или снимите, иначе смету не собрать.</span></div>' : '') + '</div>') : '') +
      items;
  }

  /* [чат 096, дефект найден чтением в 094] Фолбэк «прайса нет — показать весь
     классификатор» задумывался для НОВОГО бригадира, у которого прайса ещё нет.
     Прежнее условие смотрело на число АКТИВНЫХ строк, поэтому бригадир, погасивший
     у себя все виды, получал полный список вместо пустого — «запретить всё» давало
     обратный эффект. Различаем «строк нет вовсе» и «строки есть, активных ноль». */
  const priceRows = (cat.price || []);
  const inPrice = priceRows.filter(p => p.active !== false).map(p => p.code); // [чат 011] только активный прайс
  const priceEmpty = priceRows.length === 0;                                  // прайса нет вовсе
  const priceAllOff = !priceEmpty && inPrice.length === 0;                    // всё погашено намеренно
  const pool = (cat.kinds || []).filter(k => k.active !== false && k.area !== 'объектная' && (priceEmpty ? true : inPrice.indexOf(k.code) >= 0)); // [чат 011] объектные строки сметы в профиль не попадают
  const picked = profPicked();
  const already = profInEstimate(room.code);   // [чат 017] что по этому помещению уже стоит в смете
  const groups = {};
  pool.forEach(k => { const g = k.section || 'Прочее'; (groups[g] = groups[g] || []).push(k); });

  /* Пустой список должен объясняться, иначе он читается как поломка [096]. */
  const poolNote = priceAllOff
    ? '<div class="stat"><span class="k">В вашем прайсе исполнителя нет ни одной активной строки, поэтому выбирать нечего. Включите нужные виды в прайсе — они появятся здесь.</span></div>'
    : '';
  const blocks = Object.keys(groups).sort((a,b) => a.localeCompare(b,'ru')).map(g => {
    const items = groups[g].map(k => {
      const on = !!picked[k.code];
      const auto = profVol(k, room);
      const hint = elemVolHint(k, room);   // [чат 033] откуда взялось число
      const mhint = modHint(k, room);      // [чат 060] поправки помещения: полоса, вычеты, коэффициент
      const vol = on ? picked[k.code].vol : auto;
      const rate = profPriceRoom(k.code, room.code);
      const sum = (Number(vol) > 0 && rate) ? Math.round(Number(vol) * rate * 100) / 100 : 0;
      const dup = !!already[String(k.code).toUpperCase()];
      return '<div class="work" style="' + (on ? 'border-left:3px solid #30d158;padding-left:9px' : '') + '">' +
        '<div class="t" onclick="profToggle(\'' + esc(k.code) + '\')" style="cursor:pointer">' + (on ? '✅ ' : '⬜ ') + esc(k.name) + '</div>' +
        '<div class="m">' + esc(k.code) + ' · ' + esc(k.unit || '') + ' · ' + (rate ? (fmt(rate) + ' USD за единицу') : 'цена не задана') +
          (auto === null ? ' · объём вводится вручную' : '') +
          (hint ? (' · ' + esc(hint)) : '') +
          (mhint ? (' · <span style="color:#0a84ff">' + esc(mhint) + '</span>') : '') +
          (dup ? ' · <span style="color:#ff9f0a">уже в смете</span>' : '') +
          (!on && profCanSkip(k.code) ? ' · <span style="opacity:.75">этап пропускаем</span>' : '') + '</div>' +
        (on && picked[k.code].skip ? profSkipUI(k.code) : '') +
        (on && !picked[k.code].skip ? ('<div class="m" style="margin-top:6px">объём: ' +
          '<input type="number" step="0.01" inputmode="decimal" data-code="' + esc(k.code) + '" value="' + (vol === null ? '' : vol) + '"' +
          ' onchange="profSetVol(this)" style="width:100px;padding:6px;border-radius:8px;border:1px solid #3a3a3c;background:#000;color:#fff"> ' + esc(k.unit || '') +
          (sum ? ('  →  ' + fmt(sum) + ' USD') : '') +
          (picked[k.code].manual ? ' · изменено вручную' : '') + '</div>') : '') +
        (on && !picked[k.code].skip ? profSkipUI(k.code) : '') +
        '</div>';
    }).join('');
    return '<div class="sub" style="margin-top:14px">' + esc(g) + '</div>' + items;
  }).join('');

  return '' +
    '<div class="hello">' + esc(room.name) + '</div>' +
    '<div class="sub" id="profSum">' + profTotalText() + '</div>' +
    '<div class="stat">' +
      '<div class="r" style="display:flex;gap:8px">' +
        '<button onclick="PROF.room=null; render(true)" style="flex:1;padding:12px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Готово · к списку помещений</button>' +
      '</div>' +
      '<div class="r" style="margin-top:8px"><button onclick="startVoice(\'repair\')" style="flex:1;padding:12px;border-radius:12px;border:0;background:#1c1c1e;color:#fff;font-size:15px;border:1px solid #3a3a3c">🎤 Продиктовать работы</button></div>' +
      '<div class="r"><span class="k" style="font-size:13px;opacity:.75">Выбор сохраняется: пройдите остальные помещения, смета соберётся одной кнопкой на общем экране.</span></div>' +
    '</div>' +
    poolNote +
    (pool.length ? blocks
      : (priceAllOff ? '' : '<div class="stat"><span class="k">Справочник пуст.</span></div>'));
},

terms(){
  const t = timeCalc();
  const s = t.sched;
  const by = s.by;
  const bn = termsBottleneck();
  const crit = t.critical.slice().sort((a, b) => (s.ef[a] || 0) - (s.ef[b] || 0));
  const line = code => {
    const w = by[code]; if(!w) return '';
    return '<div class="work"><div class="t">' + esc(w.name) + '</div>' +
      '<div class="m">' + esc(code) + ' · ' + esc(String(w.room || '').split(' (')[0]) + ' · ' +
      (Number(w.dur) || 0.5) + ' дн · финиш на ' + (t.plan.fin[code] !== undefined ? Math.round((t.plan.fin[code]) * 10) / 10 : (s.ef[code] || 0)) + '-й день · ' + esc(w.status || '') + (pauseOf(w) > 0 ? ' · после — пауза ' + pauseOf(w) + ' дн' : '') + '</div></div>';
  };
  const soon = (D.works || []).filter(w => w.status !== 'Готово' && w.status !== 'Пропущен' && w.code)
    .sort((a, b) => (t.plan.fin[a.code] || 0) - (t.plan.fin[b.code] || 0)).slice(0, 12);
  const late = t.diff === null ? '' : (t.diff >= 0
    ? ('<div class="r"><span class="k">Опережение</span><span class="v">' + t.diff + ' дн</span></div>')
    : ('<div class="r"><span class="k">Отставание</span><span class="v">' + Math.abs(t.diff) + ' дн</span></div>'));
  /* Что держит срок. Показываем только то, что реально сокращает: строка
     «второй кафельщик — 0 дн» создаёт впечатление выбора там, где выбора нет.
     Разделы с нулевым выигрышем названы одной строкой — не спрятаны: человек
     должен видеть, что про них не забыли, а посчитали. */
  const gain = bn.rows.filter(r => r.gain > 0);
  const flat = bn.rows.filter(r => r.gain <= 0).map(r => r.sec);
  const gainBox = (gain.length || bn.roomGain > 0)
    ? ('<div class="sub" style="margin-top:14px">Что держит срок</div><div class="stat">' +
        gain.map(r => '<div class="r"><span class="k">' + esc(r.sec) + ' · ещё один фронт</span>' +
          '<span class="v">−' + r.gain + ' дн</span></div>').join('') +
        (bn.roomGain > 0 ? ('<div class="r"><span class="k">Ещё одна работа в помещении</span><span class="v">−' + bn.roomGain + ' дн</span></div>') : '') +
      '</div>' +
      (flat.length ? ('<div class="stat"><span class="k" style="font-size:13px;opacity:.75">' +
        '<span>Срок не сокращают:</span> <span>' + esc(flat.join(' · ')) + '</span> ' +
        '<span>— эти разделы не на критическом пути, добавлять в них людей бесполезно.</span></span></div>') : ''))
    : '<div class="stat"><span class="k" style="font-size:13px;opacity:.75">Ни один дополнительный фронт срок не сокращает: работы упираются в технологию, а не во фронты.</span></div>';
  /* Параметры фронтов правит заказчик; бригадиру лист настроек закрыт. */
  const canEdit = D.role !== 'worker' && capStored();
  const capBox = canEdit
    ? ('<div class="stat">' +
        '<div class="r"><span class="k">Работ в помещении одновременно</span>' +
          '<span class="v"><input id="capRoom" type="number" min="1" step="1" value="' + t.caps.room + '" style="width:64px;padding:6px;border-radius:8px;border:0;background:#2c2c2e;color:#fff;font-size:15px;text-align:center"></span></div>' +
        '<div class="r"><span class="k">Фронтов на раздел</span>' +
          '<span class="v"><input id="capSec" type="number" min="1" step="1" value="' + t.caps.sec + '" style="width:64px;padding:6px;border-radius:8px;border:0;background:#2c2c2e;color:#fff;font-size:15px;text-align:center"></span></div>' +
        '<div class="r"><button id="capBtn" onclick="termsSaveCaps()" style="width:100%;padding:12px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Записать фронты</button></div>' +
        /* Голос на «Сроках» [чат 084, G4]. Видимость — по тому же canEdit, что и форма:
           лист 07_Настройки закрыт бригадиру с 019, и кнопку, которую сервер отобьёт,
           ему не показывают. Разбор идёт режимом caps, запись — штатным writeCell
           через окно подтверждения: своего пути записи у голоса здесь нет. */
        '<div class="r"><button id="capVoiceBtn" onclick="startVoice(\'caps\')" style="width:100%;padding:12px;border-radius:12px;border:0;background:#2c2c2e;color:#fff;font-size:15px">🎤 Сказать голосом</button></div>' +
      '</div>')
    : (capStored() ? '' : '<div class="stat"><span class="k" style="font-size:13px;opacity:.75">Фронты пока не заданы в настройках объекта — считаю по одному. Это умолчание, а не измерение.</span></div>');
  return '' +
    '<div class="hello">Сроки</div>' +
    '<div class="sub">Оценка ' + t.real + ' дн · в помещении ' + t.caps.room + ', на раздел ' + t.caps.sec + '</div>' +
    '<div class="stat">' +
      '<div class="r"><span class="k">Технологический минимум (критический путь)</span><span class="v">' + t.total + ' дн</span></div>' +
      (t.pauses > 0 ? ('<div class="r"><span class="k">в т.ч. технологические паузы</span><span class="v">+' + t.pauses + ' дн</span></div>') : '') +
      '<div class="r"><span class="k">Срок с ограничением параллельности</span><span class="v">' + t.real + ' дн</span></div>' +
      '<div class="r"><span class="k">Всего работы</span><span class="v">' + t.sumDur + ' чел-дн</span></div>' +
      (t.elapsed !== null ? ('<div class="r"><span class="k">Прошло с начала работ</span><span class="v">' + t.elapsed + ' дн</span></div>') : '') +
      '<div class="r"><span class="k">Пройдено по плану</span><span class="v">' + t.reached + ' дн</span></div>' +
      late +
    '</div>' +
    (t.stuck ? ('<div class="stat"><span class="k" style="font-size:13px;opacity:.75">Не удалось поставить в план работ: ' + t.stuck + ' — в карте связей кольцо, работа ждёт сама себя.</span></div>') : '') +
    '<div class="stat"><span class="k">Критический путь — цепочка, которая определяет срок целиком: задержка любой её работы двигает финиш день в день. Остальные работы имеют запас. Срок объекта больше минимума, потому что работы не идут все разом: в одном помещении и у одного раздела фронт ограничен.</span></div>' +
    gainBox +
    capBox +
    (t.pcov ? '' : '<div class="stat"><span class="k">Технологические паузы (стяжка сохнет 28 дн, штукатурка 7 дн…) пока не влияют на расчёт: у работ текущей сметы нет привязки к видам справочника. Она появляется у работ, добавленных через «Профиль ремонта».</span></div>') +
    '<div class="sub" style="margin-top:14px">Критический путь · ' + crit.length + ' работ</div>' + crit.map(line).join('') +
    '<div class="sub" style="margin-top:14px">Ближайшие по плану</div>' + soon.map(w => line(w.code)).join('');
},

crew(){
  const c = CREW_DATA;
  if(!c) return '<div class="hello">Бригада</div><div class="sub">Данные не загрузились — вернитесь и зайдите ещё раз</div>';
  /* Заказчику — объём, а не имена (разбор 09 §7.2): сколько людей и
     человекодней по подтверждённым отметкам. Для питания и темпа. */
  if(c.role === "client"){
    return '<div class="hello">Бригада</div><div class="sub">по подтверждённым отметкам табеля</div>' +
      '<div class="stat">' +
        '<div class="r"><span class="k">Людей на объекте (всего)</span><span class="v">' + (Number(c.people) || 0) + "</span></div>" +
        '<div class="r"><span class="k">Человекодней отработано</span><span class="v">' + (Number(c.mandays) || 0) + "</span></div>" +
      "</div>" +
      /* Вход в приглашения у заказчика [чат 088]. До этой правки плитка жила
         только в сетке бригадира, и решение 060 «заказчик приглашает бригадира»
         из панели было недоступно, хотя сервер под него выкачен ещё в 087.
         Форма та же, что у бригадира, но без типа «в бригаду»: бригада — его
         контур, а заказчику нужны «в приложение» и «на объект». */
      '<div class="grid" style="margin-bottom:12px">' +
        '<button class="tile" onclick="openInvites()"><span class="ic">🎟️</span><span class="nm">Приглашения</span><div class="h">коды и отзыв</div></button>' +
        '<button class="tile" onclick="openCrewScreen(\'crew\')"><span class="ic">🔄</span><span class="nm">Обновить</span></button>' +
      "</div>" +
      '<div class="stat"><span class="k">Отметки работников подтверждает бригадир, а его собственные часы — вы. Поимённый состав бригады остаётся его делом: вам виден объём.</span></div>' +
      ftBlock(c) +
      invForm(CREW_INP, { crew: false });
  }
  if(c.role !== "foreman")
    return '<div class="hello">Бригада</div><div class="sub">Экран доступен бригадиру</div>';
  const ws = c.workers || [];
  const inp = 'style="width:100%;padding:12px;border-radius:12px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px"';
  const waitTm = (c.time || []).filter(x => String(x.status || "") === "заявлено").length;
  const waitRp = (c.reports || []).filter(x => String(x.status || "") === "новый").length;
  const todayN = ordActive().filter(o => String(o.date || "") === crewToday()).length;
  const item = (w, i) => {
    const st = String(w.status || "");
    const inv = (st === "приглашён" && w.invite) ? w.invite : "";
    const off = st === "отключён";
    return '<div class="work' + (off ? " done" : "") + '"><div class="t">' + esc(w.name) + "</div>" +
      '<div class="m">' + esc(st || "—") + (w.phone ? " · " + esc(w.phone) : "") +
        (w.added ? " · добавлен " + esc(String(w.added).slice(0, 10)) : "") +
        (off && w.off ? " · отключён " + esc(String(w.off).slice(0, 10)) : "") + "</div>" +
      (inv ? '<div class="m" style="margin-top:8px">Код приглашения: <b style="letter-spacing:2px">' + esc(inv) + "</b> (действует сутки)<br>" +
        '<span style="word-break:break-all">' + esc(invLink(inv)) + "</span></div>" +
        '<div class="m" style="margin-top:8px"><button onclick="invShare(\'' + attr(inv) + '\')" ' + CREW_BTN + ">Скопировать приглашение</button></div>" : "") +
      '<div class="m" style="margin-top:8px">' +
        (off ? '<button onclick="cwOn(' + i + ')" ' + CREW_BTN2 + ">Вернуть в бригаду</button>"
             : '<button onclick="cwOff(' + i + ')" ' + CREW_BTN2 + ">Отключить</button>") +
      "</div></div>";
  };
  return '' +
    '<div class="hello">Бригада</div>' +
    '<div class="sub">' + (ws.length ? ("Работников: " + ws.length) : "Пока вы работаете один — это нормально") + "</div>" +
    '<div class="grid" style="margin-bottom:12px">' +
      '<button class="tile" onclick="go(\'crew_orders\')"><span class="ic">🗓️</span><span class="nm">Наряды</span><div class="h">' + (todayN ? "сегодня в поле: " + todayN : "кто где завтра") + "</div></button>" +
      '<button class="tile' + (waitTm ? " pri" : "") + '" onclick="go(\'crew_time\')"><span class="ic">⏱️</span><span class="nm">Табель</span><div class="h">' + (waitTm ? waitTm + " ждут решения" : "отметки бригады") + "</div></button>" +
      '<button class="tile' + (waitRp ? " pri" : "") + '" onclick="go(\'crew_reports\')"><span class="ic">📨</span><span class="nm">Отчёты</span><div class="h">' + (waitRp ? waitRp + " новых" : "работы и материалы") + "</div></button>" +
      '<button class="tile" onclick="openInvites()"><span class="ic">🎟️</span><span class="nm">Приглашения</span><div class="h">коды и отзыв</div></button>' +
      '<button class="tile" onclick="openCrewScreen(\'crew\')"><span class="ic">🔄</span><span class="nm">Обновить</span></button>' +
    "</div>" +
    '<div class="stat"><span class="k">Работник добавляется приглашением: создайте его, перешлите ссылку — человек откроет её, подтвердит себя, и система подключит его сама. Руками Telegram-ID не вводится.</span></div>' +
    ws.map(item).join("") +
    invForm(inp);
},

/* Наряды: кто где и когда. Наряд на несколько дней — N строк, не диапазон:
   так проще считать табель и отменять один день из трёх (разбор 09 §3.2). */
crew_orders(){
  const c = CREW_DATA;
  if(!c || c.role !== "foreman") return '<div class="hello">Наряды</div><div class="sub">Экран доступен бригадиру</div>';
  const today = crewToday();
  const all = ordActive().slice().sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
  const view = all.filter(o => ORD_PAST ? (String(o.date || "") >= dShift(today, -14)) : (String(o.date || "") >= today));
  const groups = {};
  view.forEach(o => { const d = String(o.date || "?"); (groups[d] = groups[d] || []).push(o); });
  const idxOf = o => (((CREW_DATA || {}).orders) || []).indexOf(o);
  const wasThere = o => (c.time || []).some(x =>
    String(x.worker || "").trim() === String(o.worker || "").trim() &&
    String(x.date || "") === String(o.date || "") && String(x.event || "") === "пришёл" &&
    String(x.status || "") !== "отклонено");
  const card = o => {
    const past = String(o.date || "") < today;   // сегодняшний наряд «прогулом» не пугаем — день ещё идёт
    return '<div class="work"><div class="t">' + esc(String(o.worker || "")) + " · " + esc(String(o.load || "")) + "</div>" +
      '<div class="m">' + (o.object ? esc(String(o.object)) + " · " : "") + esc(String(o.task || "")) + "</div>" +
      (past && !wasThere(o) ? '<div class="m" style="color:var(--warn)">⚠ Отметки «пришёл» нет — молчание не значит «всё нормально»</div>' : "") +
      (String(o.date || "") >= today ? '<div class="m" style="margin-top:8px"><button onclick="ordCancel(' + idxOf(o) + ')" ' + CREW_BTN2 + ">Отменить</button></div>" : "") +
      "</div>";
  };
  const list = Object.keys(groups).sort().map(d =>
    '<div class="sub" style="margin-top:14px">' + dLabel(d) + " · " + groups[d].length + "</div>" + groups[d].map(card).join("")).join("");
  const workers = (c.workers || []).filter(w => String(w.status || "") !== "отключён");
  const lastObj = all.length ? String(all[all.length - 1].object || "") : "";
  const form = workers.length ?
    '<div class="card"><div class="lbl">Новый наряд</div>' +
      '<div style="margin:8px 0"><select id="or_worker" ' + CREW_INP + ">" +
        workers.map(w => '<option value="' + attr(w.name) + '">' + esc(w.name) + (String(w.status || "") === "приглашён" ? " (ещё не вошёл)" : "") + "</option>").join("") + "</select></div>" +
      '<div style="display:flex;gap:8px;margin:8px 0">' +
        '<div style="flex:1"><div class="lbl">с</div><input id="or_from" type="date" value="' + dShift(today, 1) + '" ' + CREW_INP + "></div>" +
        '<div style="flex:1"><div class="lbl">по (можно ту же)</div><input id="or_to" type="date" value="' + dShift(today, 1) + '" ' + CREW_INP + "></div>" +
      "</div>" +
      '<div style="display:flex;gap:8px;margin:8px 0">' +
        '<select id="or_load" style="flex:1;padding:12px;border-radius:12px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px" onchange="document.getElementById(\'or_hours_box\').style.display = this.value === \'часы\' ? \'block\' : \'none\'">' +
          ["весь день", "до обеда", "после обеда", "часы"].map(x => "<option>" + x + "</option>").join("") + "</select>" +
        '<div id="or_hours_box" style="flex:1;display:none"><input id="or_hours" type="number" min="1" max="12" placeholder="сколько часов" ' + CREW_INP + "></div>" +
      "</div>" +
      '<div style="margin:8px 0"><input id="or_object" placeholder="Объект" value="' + attr(lastObj) + '" ' + CREW_INP + "></div>" +
      '<div style="margin:8px 0"><input id="or_task" placeholder="Задание («демонтаж в спальне»)" ' + CREW_INP + "></div>" +
      '<button class="tile pri" style="width:100%" onclick="ordCreate()"><span class="nm">Назначить</span></button>' +
    "</div>" :
    '<div class="stat"><span class="k">В бригаде пока никого — вы работаете один, наряды не нужны. Появится работник — здесь вы распределите, кто где и когда.</span></div>';
  return '<div class="hello">Наряды</div>' +
    '<div class="sub">' + (view.length ? ("назначений: " + view.length) : "впереди пусто") + "</div>" +
    '<div class="filt"><button class="' + (ORD_PAST ? "on" : "") + '" onclick="ORD_PAST=!ORD_PAST;render()">' + (ORD_PAST ? "Скрыть прошлые" : "Показать прошлые (14 дн)") + "</button></div>" +
    form + list;
},

/* Табель: отметки работников. В человекодни идут только подтверждённые —
   заявленное решает бригадир: подтвердить · исправить время · отклонить. */
crew_time(){
  const c = CREW_DATA;
  if(!c || c.role !== "foreman") return '<div class="hello">Табель</div><div class="sub">Экран доступен бригадиру</div>';
  const rows = (c.time || []);
  const wait = rows.filter(x => String(x.status || "") === "заявлено");
  /* Человекодни объекта включают и самого бригадира [чат 026]: он работает
     руками, и до §15 его труд не считался вовсе. Решает его часы заказчик,
     поэтому в подсчёт они входят на тех же правах — по статусу, а не по роли. */
  const md7 = tmMandays(rows.concat(c.my_time || []).filter(x => String(x.date || "") >= dShift(crewToday(), -7)));
  const view = TM_ALL ? rows : rows.filter(x => String(x.date || "") >= dShift(crewToday(), -7));
  const groups = {};
  view.forEach(x => { const d = String(x.date || "?"); (groups[d] = groups[d] || []).push(x); });
  const idxOf = x => rows.indexOf(x);
  const card = x => {
    const i = idxOf(x);
    const st = String(x.status || "");
    const open = st === "заявлено";
    return '<div class="work"><div class="t">' + esc(String(x.worker || "")) + " · " + esc(String(x.event || "")) + " · " + esc(String(x.time || "")) + "</div>" +
      '<div class="m">' + (x.object ? esc(String(x.object)) + " · " : "") + esc(st) +
        (x.confirmed ? " · решил " + esc(String(x.confirmed)) : "") + "</div>" +
      (open ? (TM_FIX === i ?
        '<div class="m" style="margin-top:8px;display:flex;gap:8px;align-items:center">' +
          '<input id="tm_' + i + '" type="time" value="' + attr(String(x.time || "")) + '" style="flex:1;padding:10px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px">' +
          '<button onclick="tmDecide(' + i + ',\'fix\')" ' + CREW_BTN + ">Сохранить</button>" +
          '<button onclick="TM_FIX=null;render()" ' + CREW_BTN2 + ">✕</button>" +
        "</div>" :
        '<div class="m" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">' +
          '<button onclick="tmDecide(' + i + ',\'ok\')" ' + CREW_BTN + ">Подтвердить</button>" +
          '<button onclick="TM_FIX=' + i + ';render()" ' + CREW_BTN2 + ">Исправить время</button>" +
          '<button onclick="tmDecide(' + i + ',\'reject\')" ' + CREW_BTNR + ">Отклонить</button>" +
        "</div>") : "") +
      "</div>";
  };
  const list = Object.keys(groups).sort().reverse().map(d =>
    '<div class="sub" style="margin-top:14px">' + dLabel(d) + "</div>" + groups[d].map(card).join("")).join("");
  return '<div class="hello">Табель</div>' +
    '<div class="sub">' + (wait.length ? (wait.length + " ждут решения") : "все отметки решены") + "</div>" +
    '<div class="stat">' +
      '<div class="r"><span class="k">Человекодней за 7 дней (подтверждённых)</span><span class="v">' + md7 + "</span></div>" +
    "</div>" +
    '<div class="stat"><span class="k">Отмечается сам работник, отвечаете за данные вы: в человекодни и заказчику идёт только подтверждённое. Исправленное время сохраняет след — исходное останется в истории листа.</span></div>' +
    '<div class="filt"><button class="' + (TM_ALL ? "on" : "") + '" onclick="TM_ALL=!TM_ALL;render()">' + (TM_ALL ? "Только последняя неделя" : "Показать всё") + "</button></div>" +
    (view.length ? list : '<div class="stat"><span class="k">Отметок пока нет. Работник отмечается кнопками на своём главном экране.</span></div>');
},

/* Мой день (бригадир) [чат 026, маяк §15]. Бригадир работает руками, и обед
   на него распространяется так же, как на бригаду. Промежуточного подтверждения
   у его отметок нет — они уходят прямо заказчику. Разметка здесь своя, а не
   общая с экраном работника: контур работника прожит вживую (014, 021), и
   переписывать его ради переиспользования — риск больше выгоды. */
crew_my(){
  const c = CREW_DATA;
  if(!c || c.role !== "foreman") return '<div class="hello">Мой день</div><div class="sub">Экран доступен бригадиру</div>';
  const rows = (c.my_time || []);
  const today = crewToday();
  const mine = rows.filter(x => String(x.date || "") === today);
  const waitN = rows.filter(x => String(x.status || "") === "заявлено").length;
  const marks = mine.length ?
    '<div class="stat">' + mine.map(x =>
      '<div class="r"><span class="k">' + esc(String(x.event || "")) + " " + esc(String(x.time || "")) + '</span><span class="v" style="font-size:13px;color:var(--hint)">' +
      (x.status === "подтверждено" || x.status === "исправлено" ? "✓ " : "") + esc(String(x.status || "")) + "</span></div>" + tmcUI(x)).join("") + "</div>"
    : '<div class="stat"><span class="k">Сегодня вы ещё не отмечались.</span></div>';
  const hmBox = HM ? (() => {
    const now = crewNow();
    const opt = (m, lbl) => '<button onclick="HM.mode=\'' + m + '\';render()" style="padding:9px 12px;border-radius:10px;border:0;font-size:14px;background:' +
      (HM.mode === m ? "#0a84ff" : "#3a3a3c") + ';color:#fff">' + lbl + "</button>";
    return '<div class="warnbox"><b>' + esc(HM.ev) + "</b> — когда?" +
      '<div style="display:flex;gap:7px;flex-wrap:wrap;margin:10px 0">' +
      opt("now", "сейчас " + now) + opt("m10", "−10 мин") + opt("m30", "−30 мин") + opt("m60", "−1 час") +
      opt("custom", "своё время") + "</div>" +
      (HM.mode === "custom" ? '<div style="margin-bottom:10px"><input id="hm_time" type="time" value="' + (HM.at || now) + '" oninput="hmHint()" ' + CREW_INP + "></div>" : "") +
      '<div id="hm_when" style="color:var(--hint);font-size:13px;margin-bottom:8px">' + hmWhen() + "</div>" +
      '<div style="color:var(--hint);font-size:12px;margin-bottom:10px">Задним числом — в пределах суток: после полуночи отметка ляжет вчерашним днём.</div>' +
      '<div style="color:var(--warn);font-size:13px;font-weight:600;margin-bottom:10px">⏳ Ещё не записано — выберите время и нажмите «Записать»</div>' +
      '<div style="display:flex;gap:8px">' +
      '<button onclick="HM=null;render()" style="flex:1;padding:12px;border-radius:10px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
      '<button onclick="handMarkGo()" style="flex:1;padding:12px;border-radius:10px;border:0;background:#0a84ff;color:#fff;font-size:15px">Записать</button>' +
      "</div></div>";
  })() : "";
  const btn = (ev, ic, nm) => '<button class="tile pri" onclick="handMark(\'' + ev + '\')"><span class="ic">' + ic + '</span><span class="nm">' + nm + "</span></button>";
  const past = rows.filter(x => String(x.date || "") !== today).slice(-12).reverse();
  const hist = past.length ? ('<div class="sub" style="margin-top:14px">Прежние отметки</div>' + past.map(x =>
    '<div class="work"><div class="t">' + esc(String(x.event || "")) + " · " + esc(String(x.time || "")) + "</div>" +
    '<div class="m">' + dLabel(String(x.date || "")) + " · " + esc(String(x.status || "")) +
      (x.confirmed ? " · решил " + esc(String(x.confirmed)) : "") + "</div>" + tmcUI(x) + "</div>").join("")) : "";
  return '<div class="hello">Мой день</div>' +
    '<div class="sub">' + (waitN ? (waitN + " ждут заказчика") : "все ваши отметки решены") + "</div>" +
    marks + hmBox +
    '<div class="grid">' +
    btn("пришёл", "🏁", "Пришёл") + btn("обед начало", "🍲", "Обед") +
    btn("обед конец", "🔁", "Вернулся") + btn("ушёл", "🏠", "Ушёл") +
    '<button class="tile pri" onclick="startVoice()"><span class="ic">🎤</span><span class="nm">Голосом</span><div class="h">пришёл · обед · ушёл</div></button>' +
    '<button class="tile" onclick="openCrewScreen(\'crew_my\')"><span class="ic">🔄</span><span class="nm">Обновить</span></button>' +
    "</div>" +
    '<div class="stat"><span class="k">Ваши часы подтверждает заказчик: промежуточного решения у ваших отметок нет. Отметки бригады решаете вы сами — на экране «Табель». Решённую отметку тихо не переписать: «Изменить время» отправит правку заказчику на подтверждение.</span></div>' +
    hist;
},

/* Отчёты бригады: буфер, а не факт учёта — та же конструкция, что чеки.
   Пока бригадир не решил, в 01_Работы и 03_Материалы ничего не меняется. */
crew_reports(){
  const c = CREW_DATA;
  if(!c || c.role !== "foreman") return '<div class="hello">Отчёты</div><div class="sub">Экран доступен бригадиру</div>';
  const rows = (c.reports || []);
  const fresh = rows.filter(x => String(x.status || "") === "новый");
  const done = rows.filter(x => String(x.status || "") !== "новый").slice(-15).reverse();
  const idxOf = x => rows.indexOf(x);
  const wname = code => {
    const w = (D.works || []).find(v => v.code === String(code || "").trim());
    return w ? w.name : String(code || "");
  };
  const title = x => String(x.type || "") === "работа"
    ? esc(wname(x.code)) + " — готовность " + esc(String(x.value ?? "")) + " %"
    : esc(String(x.code || "")) + " — израсходовано " + esc(String(x.value ?? ""));

    const i = idxOf(x);
    const st = String(x.status || "");
    return '<div class="work"><div class="t">' + esc(String(x.worker || "")) + " · " + esc(String(x.type || "")) + "</div>" +
      '<div class="m">' + title(x) + "</div>" +
      '<div class="m">' + esc(String(x.date || "")) + (x.at ? " " + esc(String(x.at)) : "") +
        (x.comment ? " · " + esc(String(x.comment)) : "") + "</div>" +
      (st === "новый" ?
        '<div class="m" style="margin-top:8px;display:flex;gap:8px;align-items:center">' +
          '<input id="rp_' + i + '" type="number" inputmode="decimal" value="' + attr(String(x.value ?? "")) + '" style="flex:1;padding:10px;border-radius:10px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px">' +

          '<button onclick="rpDecide(' + i + ',\'reject\')" ' + CREW_BTNR + ">✕</button>" +
        "</div>" +
        '<div class="m" style="margin-top:4px;color:var(--hint)">Поправите число — в учёт уйдёт ваша версия, слова работника останутся рядом.</div>' :
        '<div class="m" style="color:var(--hint)">' + esc(st) + (x.corrected !== "" && x.corrected != null && String(x.corrected) !== String(x.value) ? " · принято как " + esc(String(x.corrected)) : "") +
          (x.solved ? " · решил " + esc(String(x.solved)) : "") + "</div>") +
      "</div>";
  };
  return '<div class="hello">Отчёты бригады</div>' +
    '<div class="sub">' + (fresh.length ? (fresh.length + " новых") : "новых нет") + "</div>" +
    '<div class="stat"><span class="k">Это буфер: слова работника становятся фактом учёта только после вашего решения. Принятая работа уходит в готовность сметы, материал — в расход.</span></div>' +
    (fresh.length ? fresh.map(card).join("") : "") +
    (done.length ? '<div class="sub" style="margin-top:14px">Решённые</div>' + done.map(card).join("") : "") +
    (!rows.length ? '<div class="stat"><span class="k">Отчётов пока нет. Работник отправляет их со своего экрана «Отчёт бригадиру».</span></div>' : "");
},

/* Календарь работника: прошлая неделя и всё будущее — наряды и свои отметки. */
crew_cal(){
  const c = CREW_DATA;
  if(!c) return '<div class="hello">Календарь</div><div class="sub">нет данных — вернитесь на главный экран</div>';
  const from = dShift(crewToday(), -7);
  const days = {};
  handMyOrders().forEach(o => { const d = String(o.date || ""); if(d >= from){ (days[d] = days[d] || { o: [], t: [] }).o.push(o); } });
  (c.time || []).forEach(x => { const d = String(x.date || ""); if(d >= from){ (days[d] = days[d] || { o: [], t: [] }).t.push(x); } });
  const keys = Object.keys(days).sort();
  const today = crewToday();
  const blocks = keys.map(d => {
    const v = days[d];
    return '<div class="sub" style="margin-top:14px">' + dLabel(d) + "</div>" +
      v.o.map(o => '<div class="work"><div class="t">' + esc(String(o.load || "")) + (o.object ? " · " + esc(String(o.object)) : "") + "</div>" +
        '<div class="m">' + esc(String(o.task || "")) + "</div></div>").join("") +
      (v.t.length ? '<div class="work">' + v.t.map(x =>
        '<div class="m">' + esc(String(x.event || "")) + " " + esc(String(x.time || "")) + " · " + esc(String(x.status || "")) + "</div>").join("") + "</div>" : "");
  }).join("");
  return '<div class="hello">Мой календарь</div>' +
    '<div class="sub">неделя назад и всё, что назначено вперёд</div>' +
    (keys.length ? blocks : '<div class="stat"><span class="k">Пока пусто: нарядов нет, отметок нет.</span></div>') +
    (keys.every(d => d < today) && keys.length ? '<div class="stat"><span class="k">Вперёд пока ничего не назначено.</span></div>' : "");
},

/* Отчёт работника бригадиру: работа (готовность %) или материал (расход). */
hand_rep(){
  const c = CREW_DATA || {};
  const my = (c.reports || []).slice(-10).reverse();
  const works = (D.works || []).filter(w => String(w.status || "") !== "Снято");
  const mats = (D.materials || []).map(m => String(m.name || "")).filter(Boolean);
  const dW = HR_DRAFT["работа"], dM = HR_DRAFT["материал"];
  const dirty = { "работа": !!(dW.code || String(dW.val).trim() || String(dW.comment || "").trim()),
                  "материал": !!(String(dM.mat).trim() || String(dM.val).trim() || String(dM.comment || "").trim()) };
  const tab = (v, lbl) => '<button onclick="hrTab(\'' + v + '\')" style="flex:1;padding:11px;border-radius:11px;border:0;font-size:14px;background:' +
    (HR_TYPE === v ? "#0a84ff" : "#3a3a3c") + ';color:#fff">' + lbl + (dirty[v] && HR_TYPE !== v ? " ✎" : "") + "</button>";
  const wname = code => { const w = (D.works || []).find(v => v.code === String(code || "").trim()); return w ? w.name : String(code || ""); };
  const form = HR_TYPE === "работа" ?
    '<div style="margin:8px 0"><select id="hr_work" onchange="hrSet(\'code\',this)" ' + CREW_INP + '><option value="">— какая работа —</option>' +
      works.map(w => '<option value="' + attr(w.code) + '"' + (dW.code === w.code ? " selected" : "") + '>' + esc(String(w.room || "").split(" (")[0]) + " · " + esc(w.name) + (w.progress ? " (" + w.progress + " %)" : "") + "</option>").join("") + "</select></div>" +
    '<div style="margin:8px 0"><input id="hr_val" type="number" inputmode="numeric" min="0" max="100" placeholder="готовность теперь, %" value="' + attr(dW.val) + '" oninput="hrSet(\'val\',this)" ' + CREW_INP + "></div>" +
    '<div style="margin:8px 0"><input id="hr_comment" placeholder="Комментарий (не обязательно)" value="' + attr(dW.comment) + '" oninput="hrSet(\'comment\',this)" ' + CREW_INP + "></div>" :
    '<div style="margin:8px 0"><input id="hr_mat" list="hr_mats" placeholder="какой материал" value="' + attr(dM.mat) + '" oninput="hrSet(\'mat\',this)" ' + CREW_INP + ">" +
      '<datalist id="hr_mats">' + mats.map(m => '<option value="' + attr(m) + '">').join("") + "</datalist></div>" +
    '<div style="margin:8px 0"><input id="hr_val" type="number" inputmode="decimal" placeholder="сколько израсходовано" value="' + attr(dM.val) + '" oninput="hrSet(\'val\',this)" ' + CREW_INP + "></div>" +
    '<div style="margin:8px 0"><input id="hr_comment" placeholder="Комментарий (не обязательно)" value="' + attr(dM.comment) + '" oninput="hrSet(\'comment\',this)" ' + CREW_INP + "></div>";
  const myList = my.map(x =>
    '<div class="work"><div class="t">' + esc(String(x.type || "")) + " · " +
      (String(x.type || "") === "работа" ? esc(wname(x.code)) : esc(String(x.code || ""))) + "</div>" +
    '<div class="m">' + esc(String(x.date || "")) + " · " + esc(String(x.value ?? "")) +
      (String(x.status || "") === "исправлено" && x.corrected != null && x.corrected !== "" ? " → принято как " + esc(String(x.corrected)) : "") +
      " · " + esc(String(x.status || "")) + "</div></div>").join("");
  return '<div class="hello">Отчёт бригадиру</div>' +
    '<div class="sub">что сделал, что израсходовал — без денег</div>' +
    '<div class="card"><div style="display:flex;gap:8px;margin-bottom:4px">' + tab("работа", "Работа") + tab("материал", "Материал") + "</div>" +
      form +
      '<button class="tile pri" style="width:100%" onclick="handReport()"><span class="nm">Отправить бригадиру</span></button>' +
      (dirty["работа"] && dirty["материал"] ? '<div class="m" style="text-align:center;margin-top:7px;color:var(--hint)">Уйдут обе части: работа и материал</div>' : "") +
    "</div>" +

    (my.length ? '<div class="sub" style="margin-top:14px">Мои отчёты</div>' + myList : "");

      '<button onclick="elemBuild()" style="width:100%;margin-top:10px;padding:11px;border-radius:11px;border:0;background:#0a84ff;color:#fff;font-size:15px">Построить схему проёмов</button></div>'

             (egaps.length > 4 ? " и ещё " + (egaps.length - 4) : ""))
          : "План и факт сходятся везде") + '</div>' +
        '<div class="m" style="margin-top:6px;opacity:.75">Судьба задана у ' + els.filter(e => e.fate).length + ' из ' + els.length +
        '. Объём работ по дверям и окнам считается по этим проёмам.</div>' +
        /* Схема-граф [чат 033]: расположение придумывает программа — связи
           верны, география условна. Тык по линии открывает правку проёма. */
        graphSvg() +
        '<div class="m" style="opacity:.7">Линия сплошная — дверь, пунктиром — открытый проём, перечёркнутая — заложено. Оранжевым — расхождение с планом БТИ, красным — сносим, синим — ставим. Тык по линии открывает проём, по плашке — помещение.</div>' +

      '</div>';

    '<div class="hello">Объект</div>' +

    "</div>" +
    planBox +
    schemaBox +
    exportBox() +
    objSwitchBox() +
    newObjBox() +
    (gap.length ? ('<div class="warnbox" id="objGap">' +
      '<div>Пока не заданы окна и двери, объёмы работ по откосам, подоконникам и наличникам считаются наугад.</div>' +
      gap.map(r => '<div onclick="objGoRoom(\'' + esc(r.code) + '\')" style="margin-top:6px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.06);cursor:pointer">' +

      '<div style="margin-top:10px;display:flex;gap:8px">' +
        '<button onclick="qzStart()" style="flex:1;padding:10px;border-radius:10px;border:0;background:#0a84ff;color:#fff;font-size:14px">Пройти вопросами</button>' +
        '<button onclick="startVoice(\'rooms\')" style="flex:1;padding:10px;border-radius:10px;border:1px solid #3a3a3c;background:#1c1c1e;color:#fff;font-size:14px">Продиктовать проёмы</button>' +
      '</div></div>') : "") +
    (() => {
      const f = floorOrder();
      if(!f) return '<div class="stat"><span class="k">Отметьте у помещений, из чего в них попадают — по этой схеме считается порядок заливки полов: залить всё разом нельзя, к дальней комнате не подойти.</span></div>';
      return '<div class="stat">' +
        '<div class="r"><span class="k">Порядок заливки полов</span><span class="v"></span></div>' +
        '<div class="m">' + f.order.map((r, i) => (i + 1) + ". " + esc(String(r.name || r.code).split(" (")[0])).join(" · ") + "</div>" +

/* Экран выборочной скидки [чат 019]. Работы группируются по помещениям,
   принятые в списке не появляются вовсе — их цена заморожена решением 006. */

/* Экран точки отсчёта [чат 019]. */
refpoint(){
  const s = refSnap();
  const pend = refPending();
  const dif = refDiff();
  const mine = pend && String(pend.by || '') === String(D.who);
  const bt = 'padding:13px;border-radius:12px;border:0;color:#fff;font-size:15px';

  const snapBox = '<div class="stat">' +
    '<div class="r"><span class="k">Работ в смете</span><span class="v">' + s.works + '</span></div>' +
    '<div class="r"><span class="k">Договор действующий</span><span class="v">' + usd(s.deal) + ' $</span></div>' +
    '<div class="r"><span class="k">Расчётный срок</span><span class="v">' + s.days + ' дн</span></div>' +
    '<div class="r"><span class="k">Материалов на объекте</span><span class="v">' + s.have + ' из ' + s.mat + '</span></div>' +
    '<div class="r"><span class="k">Рабочих в бригаде</span><span class="v">' + (s.crew ? s.crew : 'не задано') + '</span></div>' +
  '</div>';

  let head = '', acts = '';
  if(pend && !mine){
    head = '<div class="sub">' + esc(pend.by) + ' предлагает зафиксировать стартовое состояние — ваше решение</div>' +
      '<div class="stat"><span class="k" style="font-size:13px;opacity:.8">' + esc(pend.comment || '') + '</span></div>';
    acts = '<div class="stat"><div class="r" style="display:flex;gap:8px">' +
      '<button onclick="refAccept(\'' + esc(pend.id) + '\')" style="flex:1;' + bt + ';background:var(--ok)">Подтвердить</button>' +
      '<button onclick="refDispute(\'' + esc(pend.id) + '\')" style="flex:1;' + bt + ';background:var(--bad)">Не согласен</button>' +
    '</div></div>';
  }else if(pend && mine){
    head = '<div class="sub">⏳ ждёт подтверждения второй стороны</div>' +
      '<div class="stat"><span class="k" style="font-size:13px;opacity:.8">' + esc(pend.comment || '') + '</span></div>';
  }else if(dif){
    head = '<div class="sub">зафиксирована ' + esc(dif.at || String(dif.live.at || '')) + ' · ' +
      esc(String(dif.live.by || '')) + ' → ' + esc(String(dif.live.solved || '')) + '</div>' +
      '<div class="stat">' +
        '<div class="r"><span class="k">Тогда зафиксировали</span><span class="v"></span></div>' +
        dif.rows.map(r => '<div class="r"><span class="k" style="font-size:13px;opacity:.75">' + esc(r.k) + '</span>' +
          '<span class="v" style="font-size:13px;' + (r.same ? '' : 'color:var(--warn)') + '">' +
          (r.was == null ? '—' : r.was.toFixed(r.dec)) + (r.same ? '' : ' → ' + (r.now == null ? '—' : Number(r.now).toFixed(r.dec))) +
          '</span></div>').join('') +
        '<div class="r"><span class="k" style="font-size:13px;opacity:.6">' +
          (dif.changed ? ('с точки отсчёта изменилось: ' + dif.changed) : 'с точки отсчёта ничего не изменилось') +
        '</span><span class="v"></span></div>' +
      '</div>';
    if(refIsClient()) acts = '<div class="stat"><div class="r">' +
      '<button onclick="refSubmit()" style="width:100%;' + bt + ';background:#3a3a3c">Предложить новую точку отсчёта</button>' +
    '</div></div>';
  }else{
    head = '<div class="sub">черта, от которой живут баланс и шкала сроков</div>' +
      '<div class="stat"><span class="k" style="font-size:13px;opacity:.8">Пока не зафиксирована. Когда состав, цены, сроки и остатки материалов сойдутся, любая сторона предлагает зафиксировать это как стартовое состояние — вторая подтверждает, и черта проведена.</span></div>';
    acts = '<div class="stat"><div class="r">' +
      '<button onclick="refSubmit()" style="width:100%;' + bt + ';background:#0a84ff">Предложить точку отсчёта</button>' +
    '</div></div>';
  }

  const hist = refAll().filter(c => chgSt(c) === 'Оспорено').slice(-3).reverse()
    .map(c => '<div class="work"><div class="t">Не принято · ' + esc(String(c.at || '')) + '</div>' +
      '<div class="m">' + esc(String(c.comment || '')) + '</div>' +
      '<div class="m" style="opacity:.7">решил: ' + esc(String(c.solved || '')) + '</div></div>').join('');

  return '<div class="hello">Точка отсчёта</div>' + head + snapBox + acts +
    (hist ? ('<div class="sub" style="margin-top:14px">Прошлые попытки</div>' + hist) : '');
},

/* ══════════════════════════════════════════════════════════════
   ГОЛОСОВОЙ ВВОД — запись прямо в приложении, разбор на сервере.
   Ничего не уходит в ленту бота: запись, распознавание и
   подтверждение живут во встроенном окне.
   Контракт сервера POST {API}/voice  (FormData: audio, initData|key):
     ответ { ok:true, recognized:"…", items:[ {sheet,code,name,room,
             field,field_label,value,value_label} ] }
     items.length === 0  → ничего внятного не распознано (выбраковка)
     items.length === 1  → одно подтверждение
     items.length  >  1  → мультивыбор «N из M»
   Для работника (kind=hand) сервер отвечает { ok, recognized,
     mode:'hand', actions:[ {kind:'time',event,shift_min,at} |
     {kind:'work',code,name,room,percent,comment} |
     {kind:'material',name,qty,comment} ] } — запись идёт прежними
   каналами: Табель и Отчёты_бригады через crewAppend [чат 015].
   ══════════════════════════════════════════════════════════════ */
let mediaRec = null, chunks = [], vTimer = null, vSec = 0, vStream = null, vItems = [];
let vMode = "";   // сценарий разбора: "" — правки учёта, "rooms" — обмеры помещений [чат 016]
/* Код активного вопроса мастер-опроса [чат 059]. Пустой = поведение прежнее
   побайтно: поле в запрос не кладётся вовсе (мина 022 — пустой параметр
   гасит результат молча, поэтому «нет вопроса» кодируется отсутствием). */
let vQ = "";
const vmask  = document.getElementById("vmask");
const vsheet = document.getElementById("vsheet");

/* ═════════════════════════════════════════════════════════════════
   МАСТЕР-ОПРОС · система ведёт человека вопросами (Н8, разбор 23)
   Шаги Г-2 (движок такта и генератор очереди), Г-3 (деревья вопросов
   и словарь), Г-4 (свод, круг отложенных, вход из «жёлтого окна»).

   Опрос — ОБЁРТКА над существующими трактами, а не новый канал записи
   (§2 п. 1): ответ уходит тем же `/voice` с контекстом вопроса `q`
   (сервер понимает его с 058) и записывается теми же окнами
   подтверждения и теми же `writeCell`/`upd`, что вольная диктовка.
   Ни одной новой ветки записи, ни одного нового права.

   Состояние сеанса вычисляется, а не хранится (§6, решение 031):
   очередь — это дыры данных, пересчитанные после каждой записи.
   В памяти вкладки живут только отметки «позже» и позиция обхода;
   цена перезапуска названа честно — отложенные вернутся раньше срока.
   ═════════════════════════════════════════════════════════════════ */

let QZ = { on:false, pos:0, later:{}, log:[], ring:false, seenRing:{} };

const QZ_MAX_LOG = 12;

/* ── Порядок обхода: как человек идёт по квартире ──────────────────
   Тот же порядок, что у заливки полов (016/033) — от входа вглубь;
   когда связей нет, порядок листа. */
function qzRooms(){
  const list = roomList();
  let f = null;
  try{ f = floorOrder(); }catch(e){ f = null; }
  if(f && Array.isArray(f.order) && f.order.length){
    const byCode = {};
    list.forEach(r => { byCode[r.code] = r; });
    const seen = {};
    const out = [];
    /* Заливка идёт от дальней комнаты к выходу; обход человека — наоборот,
       от входа вглубь. Разворачиваем, а не заводим второй порядок. */
    f.order.slice().reverse().forEach(r => {
      const rr = byCode[r.code] || r;
      if(rr && !seen[rr.code]){ seen[rr.code] = 1; out.push(rr); }
    });
    list.forEach(r => { if(!seen[r.code]){ seen[r.code] = 1; out.push(r); } });
    return out;
  }
  return list;
}

const qzNeed = v => v === null || v === undefined || String(v).trim() === "";
const qzName = r => String((r && (r.name || r.code)) || "").split(" (")[0];

/* Элементы, которые спрашиваются в этом помещении: внутренний проём
   принадлежит паре, но спрашивается один раз — за первой стороной (033). */
function qzElems(code){
  return elemAll().filter(e => e.a === code);
}

function qzElemName(e, code){
  const nm = String(e.name || "").trim();
  if(nm) return nm.split(" (")[0];
  return String(e.fact || e.plan || "проём") + " · " + elemSideName(e, code);
}

/* ── Г-3. Деревья вопросов: правило дыры → вопрос ──────────────────
   Каждый вопрос — запись «условие дыры → текст → режим и контекст →
   куда пишется ответ». Новая тема добавляет строку правил, а не правит
   движок (§2 п. 6). Текст — озвучиваемая форма: одна строка, с примером
   там, где формат ответа неочевиден. */
function qzQueue(){
  const out = [];
  const rooms = qzRooms();

  /* 4.0 Состав помещений — только у пустого объекта. */
  if(!rooms.length){
    out.push({
      id: "rooms:new", room: null, mode: "rooms", input: "voice",
      text: "Перечислите комнаты квартиры — как вы их называете",
      hint: "Например: «спальня, зал, кухня, коридор, ванная»"
    });
    return out;
  }

  rooms.forEach(r => {
    const rc = r.code, rn = qzName(r);

    /* 4.1 Обмеры: контур → высота. Площадь и периметр считает код по
       контуру (052) — их не спрашиваем отдельно. */
    if(qzNeed(r.floor_m2) && qzNeed(r.perimeter_m)){
      out.push({
        id: "contour:" + rc, room: rc, mode: "rooms", input: "voice",
        text: "Мы в помещении «" + rn + "». Пройдём по полу от двери: диктуйте длину каждой стены в сантиметрах, а где стена поворачивает налево — так и скажите: «поворот налево»",
        hint: "Прямоугольная комната — достаточно двух сторон: «пять двадцать на три семнадцать»"
      });
    }
    if(qzNeed(r.height_m)){
      const last = qzLastHeight(rc);
      out.push({
        id: "height:" + rc, room: rc, mode: "rooms", input: "num",
        sheet: "06_Помещения", code: rc, col: "Высота_м", unit: "м",
        text: "Высота потолка в помещении «" + rn + "»?",
        hint: "Можно сказать «два восемьдесят один» или вписать числом",
        same: last
      });
    }
    if(qzNeed(r.windows)){
      out.push({
        id: "windows:" + rc, room: rc, mode: "rooms", input: "num", zero: true,
        sheet: "06_Помещения", code: rc, col: "Окон_шт",
        text: "Сколько окон в помещении «" + rn + "»?",
        hint: "Если ни одного — нажмите «Нет»"
      });
    }
    if(qzNeed(r.doors)){
      out.push({
        id: "doors:" + rc, room: rc, mode: "rooms", input: "num", zero: true,
        sheet: "06_Помещения", code: rc, col: "Дверей_шт",
        text: "Сколько дверей в помещении «" + rn + "»?",
        hint: "Если ни одной — нажмите «Нет»"
      });
    }

    /* 4.2 Проёмы: размеры → подоконник → судьба. */
    qzElems(rc).forEach(e => {
      if(String(e.fact || "") === "нет") return;    // заложенному размеры не нужны
      if(qzNeed(e.w) || qzNeed(e.h)){
        out.push({
          id: "size:" + e.id, room: rc, mode: "rooms", input: "wh",
          sheet: "13_Элементы", code: e.id, elem: e.id,
          text: qzElemName(e, rc) + ": ширина и высота?",
          hint: "Порядок — сперва ширина, потом высота; в сантиметрах или метрах"
        });
      }
      /* Подоконник спрашиваем только когда сервер отдаёт это поле:
         нет поля — нет вопроса (путь «её ещё нет», 031). */
      if(String(e.fact || "") === "окно" && ("sill" in e) && qzNeed(e.sill)){
        out.push({
          id: "sill:" + e.id, room: rc, mode: "rooms", input: "num",
          sheet: "13_Элементы", code: e.id, col: "Низ_м", unit: "м", elem: e.id,
          text: "На какой высоте от пола начинается " + qzElemName(e, rc).toLowerCase() + " — подоконник?",
          hint: "Окно под потолок — так и скажите"
        });
      }
      if(qzNeed(e.fate) && String(e.fact || "") !== "нет"){
        out.push({
          id: "fate:" + e.id, room: rc, mode: "rooms", input: "choice",
          sheet: "13_Элементы", code: e.id, col: "Судьба", elem: e.id,
          choices: (typeof ELEM_FATES !== "undefined" ? ELEM_FATES : []),
          text: qzElemName(e, rc) + ": что делаем в ремонте?",
          hint: "Не трогаем · заменить · демонтировать · заложить · пробить · перенести · установить"
        });
      }
    });

    /* 5.1 Работы по помещению — профиль ремонта. */
    if(!qzHasWorks(rc)){
      out.push({
        id: "works:" + rc, room: rc, mode: "repair", input: "voice",
        text: "Что делаем в помещении «" + rn + "»?",
        hint: "Говорите как привыкли: «стены под обои, потолок натяжной, пол ламинат»"
      });
    }

    /* 5.2 Пропуски этапов — вопрос собирается ИЗ УСЛОВИЯ справочника. */
    qzSkipAsk(rc).forEach(q => out.push(q));
  });

  return out;
}

/* Высота, названная в этом объекте раньше — для ответа «как везде». */
function qzLastHeight(skipCode){
  const r = roomList().filter(x => x.code !== skipCode && !qzNeed(x.height_m))[0];
  return r ? String(r.height_m) : "";
}

/* Работы помещения: строка сметы или отметка в профиле текущего сеанса. */
function qzHasWorks(rc){
  const inEstimate = (D.works || []).some(w => String(w.code || "").indexOf(rc + "-") === 0);
  if(inEstimate) return true;
  const picked = (typeof PROF === "object" && PROF && PROF.plan && PROF.plan[rc]) || null;
  return !!(picked && Object.keys(picked).length);
}

/* Вопросы о пропуске: вид отмечен в профиле, у вида есть условие
   `Пропуск_при`, решения ещё нет. По умолчанию этап включён (016) —
   вопрос лишь делает выбор явным, молчание ничего не пропускает. */
function qzSkipAsk(rc){
  const out = [];
  const picked = (typeof PROF === "object" && PROF && PROF.plan && PROF.plan[rc]) || null;
  if(!picked) return out;
  const kinds = ((D.catalog || {}).kinds) || [];
  Object.keys(picked).forEach(code => {
    const it = picked[code] || {};
    if(it.skip) return;                                  // решение уже принято
    if(QZ.seenRing["skip:" + code + "@" + rc]) return;   // «делаем» — тоже решение
    let reasons = [];
    try{ reasons = profSkipList(code); }catch(e){ reasons = []; }
    if(!reasons.length) return;
    const k = kinds.find(x => x.code === code) || {};
    out.push({
      id: "skip:" + code + "@" + rc, room: rc, mode: null, input: "skip",
      kindCode: code, choices: reasons,
      text: "«" + String(k.name || code) + "» можно пропустить, если " + reasons.join(" или ") + ". Пропускаем или делаем?",
      hint: "Пропуск оставит след в смете: строка с причиной и нулевой ценой"
    });
  });
  return out;
}

/* ── Движок очереди: отложенное уходит в хвост, а не пропадает ───── */
function qzList(){
  const all = qzQueue();
  const main = all.filter(q => !QZ.later[q.id]);
  const late = all.filter(q => QZ.later[q.id]);
  return main.concat(late);      // круг отложенных — в конце обхода (§6)
}

function qzCur(){
  const l = qzList();
  if(!l.length) return null;
  if(QZ.pos >= l.length) QZ.pos = l.length - 1;
  if(QZ.pos < 0) QZ.pos = 0;
  return l[QZ.pos];
}

function qzTotal(){ return qzList().length; }

async function qzStart(){
  try{
    if(!D.catalog){ toast("Загружаю справочник…"); }
    await loadCatalog();
  }catch(e){ /* без справочника опрос всё равно ведёт обмеры */ }
  if(typeof PROF !== "object" || !PROF || !PROF.plan) PROF = { room: null, plan: {} };
  QZ = { on:true, pos:0, later:{}, log:[], ring:false, seenRing:{} };
  qzSyncRoom();
  go("quiz");
}

/* Открытое помещение профиля должно совпадать с помещением вопроса:
   по нему сервер подставляет адрес, если его не назвали вслух (017). */
function qzSyncRoom(){
  const q = qzCur();
  if(q && q.room && typeof PROF === "object" && PROF){ PROF.room = q.room; }
}

function qzNext(){
  const l = qzList();
  if(QZ.pos < l.length - 1){ QZ.pos++; qzSyncRoom(); render(); }
  else { QZ.pos = Math.max(0, l.length - 1); qzSyncRoom(); render(); }
}
function qzPrev(){
  if(QZ.pos > 0){ QZ.pos--; qzSyncRoom(); render(); }
}
function qzLater(){
  const q = qzCur();
  if(!q) return;
  QZ.later[q.id] = 1;
  qzNote("Отложено: " + qzShort(q));
  /* Вопрос ушёл в хвост — позиция остаётся на месте, на ней уже следующий. */
  const l = qzList();
  if(QZ.pos >= l.length) QZ.pos = Math.max(0, l.length - 1);
  qzSyncRoom();
  render();
}
function qzStop(){
  QZ.on = false;
  toast("Опрос закрыт — записанное сохранено");
  go("home");
}

function qzShort(q){
  return String(q.text || "").replace(/^Мы в помещении «[^»]*»\.\s*/, "").slice(0, 60);
}

function qzNote(s){
  QZ.log.unshift(String(s));
  if(QZ.log.length > QZ_MAX_LOG) QZ.log.length = QZ_MAX_LOG;
}

/* ── Такт: ответ голосом ──────────────────────────────────────────
   Тот же startVoice, но с кодом активного вопроса: сервер сузит промпт
   и не станет звать классификатор намерения (058). */
function qzVoice(){
  const q = qzCur();
  if(!q) return;
  qzSyncRoom();          // адрес записи = помещение вопроса [чат 059]
  startVoice(q.mode || "rooms", q.id);
}

/* Ответ текстом — та же реплика, только набранная: уходит тем же
   разбором с тем же контекстом (поле ввода остаётся всегда, 029). */
async function qzSay(){
  const q = qzCur();
  const el = document.getElementById("qzsay");
  const text = String((el && el.value) || "").trim();
  if(!q) return;
  if(!text){ toast("Скажите или впишите ответ", "wait"); return; }
  if(qzCommand(text)) return;
  vMode = String(q.mode || "rooms");
  vQ = String(q.id || "");
  openVSheet('<div class="vh">Разбираю…</div><div class="vspin"></div>' +
    '<div class="vs" style="text-align:center">' + esc(text) + "</div>");
  try{
    /* Помещение берётся из САМОГО вопроса, а не из состояния профиля:
       вопрос знает свой адрес по построению, а PROF.room — это то, где
       человек стоял в профиле, и они могут разойтись [чат 059]. */
    const body = { initData: INIT, key: KEY, text: text, mode: vMode, lang: LANG,
      room: q.room || ((typeof PROF === "object" && PROF && PROF.room) ? PROF.room : "") };
    if(vQ) body.q = vQ;
    const r = await fetch(`${API}/voice`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(body)
    });
    const raw = (await r.text()).trim();
    if(r.status === 401 || r.status === 403) throw new Error("Доступ не подтверждён.");
    if(!raw) throw new Error("Не удалось разобрать. Попробуйте сказать иначе.");
    let d; try{ d = JSON.parse(raw); }catch{ throw new Error("Сервер вернул неожиданный ответ."); }
    showVResult(d);
  }catch(e){ showVError(e.message); }
}

/* Команды человека внутри опроса разбираются ДО содержимого (§6). */
function qzCommand(text){
  const t = String(text || "").toLowerCase().replace(/[.!,]/g, " ").replace(/\s+/g, " ").trim();
  if(!t) return false;
  if(/^(позже|потом|пропусти|пропустить|не знаю|незнаю|later)$/.test(t)){ qzLater(); return true; }
  if(/^(назад|обратно|back)$/.test(t)){ qzPrev(); return true; }
  if(/^(дальше|далее|следующий|next)$/.test(t)){ qzNext(); return true; }
  if(/^(хватит|закончим|стоп|выход|всё)$/.test(t)){ qzStop(); return true; }
  return false;
}

/* Числовой ответ пишется тем же путём, что кнопка «Записать» в карточке
   помещения — штатный `/update` через writeCell (никакого нового канала). */
async function qzNum(zero){
  const q = qzCur();
  if(!q) return;
  const el = document.getElementById("qznum");
  let raw = zero ? "0" : String((el && el.value) || "").trim();
  if(!zero && !raw){ toast("Впишите число или ответьте голосом", "wait"); return; }
  const v = qzParseNum(raw, q);
  if(v === null){ toast("Не понял число", "err"); return; }
  await qzWrite(q, q.col, v, (q.col === "Высота_м" ? "высота " : "") + v);
}

/* Метры и сантиметры: «281» в поле высоты — это 2,81 м. Панель пишет
   в лист числом с запятой (локаль листа), как все прочие записи. */
function qzParseNum(raw, q){
  let s = String(raw).replace(",", ".").replace(/[^\d.]/g, "");
  if(!s) return null;
  let n = Number(s);
  if(!isFinite(n)) return null;
  if(q && q.unit === "м" && n > 20) n = n / 100;      // сказали в сантиметрах
  n = Math.round(n * 1000) / 1000;
  return String(n).replace(".", ",");
}

async function qzWH(){
  const q = qzCur();
  if(!q) return;
  const w = document.getElementById("qzw"), h = document.getElementById("qzh");
  const wv = qzParseNum(String((w && w.value) || ""), { unit: "м" });
  const hv = qzParseNum(String((h && h.value) || ""), { unit: "м" });
  if(wv === null || hv === null){ toast("Нужны оба числа — ширина и высота", "wait"); return; }
  if(QZ_BUSY) return;
  QZ_BUSY = true;
  try{
    await writeCell(q.sheet, q.code, "Ширина_м", wv);
    await writeCell(q.sheet, q.code, "Высота_м", hv);
    qzNote("Записано: " + qzShort(q) + " → " + wv + " × " + hv);
    await qzAfterWrite();
  }catch(e){ toast(e.message, "err"); }
  QZ_BUSY = false;
}

async function qzChoice(val){
  const q = qzCur();
  if(!q) return;
  await qzWrite(q, q.col, String(val), String(val));
}

let QZ_BUSY = false;

async function qzWrite(q, col, value, note){
  if(QZ_BUSY) return;
  QZ_BUSY = true;
  try{
    await writeCell(q.sheet, q.code, col, String(value));
    qzNote("Записано: " + qzShort(q) + " → " + String(note));
    await qzAfterWrite();
  }catch(e){ toast(e.message, "err"); }
  QZ_BUSY = false;
}

/* Пропуск этапа: решение живёт в профиле сеанса, как и у кнопок
   профиля (058) — след в смете появляется при сборке. */
function qzSkipDo(reason){
  const q = qzCur();
  if(!q || q.input !== "skip") return;
  const rc = q.room;
  if(typeof PROF === "object" && PROF) PROF.room = rc;
  try{ profSkip(q.kindCode, reason); }catch(e){ toast(e.message, "err"); return; }
  qzNote("Пропущен этап: " + String(q.kindCode) + " · " + String(reason));
  qzSyncRoom();
  render();
}
function qzSkipKeep(){
  const q = qzCur();
  if(!q || q.input !== "skip") return;
  QZ.seenRing[q.id] = 1;                   // «делаем» — тоже ответ, вопрос закрыт
  qzNote("Оставлен в работе: " + String(q.kindCode));
  qzSyncRoom();
  render();
}
function qzSkipOwn(el){
  const v = String((el && el.value) || "").trim();
  if(!v){ toast("Впишите причину — иначе пропуск не объяснить"); return; }
  qzSkipDo(v);
}

/* После любой записи очередь пересчитывается от свежих данных: отвеченный
   вопрос перестаёт быть дырой и исчезает сам (§6 — состояние вычисляется). */
async function qzAfterWrite(){
  try{ await load(); }catch(e){}
  const l = qzList();
  if(QZ.pos >= l.length) QZ.pos = Math.max(0, l.length - 1);
  qzSyncRoom();
  render();
}

/* Хвост голосового тракта: если идёт опрос — сдвинуть очередь. */
function qzVoiceDone(){
  if(!QZ.on) return;
  const l = qzList();
  if(QZ.pos >= l.length) QZ.pos = Math.max(0, l.length - 1);
  qzSyncRoom();
  if(stack[stack.length - 1] === "quiz") render();
}

/* ── Г-4. Свод ────────────────────────────────────────────────────
   Опрос кончился, когда дыр не осталось: это и есть критерий, а не
   счётчик заданных вопросов. */
function qzSummaryHtml(){
  const rooms = qzRooms();
  const rows = rooms.map(r => {
    const rc = r.code;
    const picked = (typeof PROF === "object" && PROF && PROF.plan && PROF.plan[rc]) || {};
    const n = Object.keys(picked).length;
    const skipped = Object.keys(picked).filter(c => (picked[c] || {}).skip).length;
    const works = (D.works || []).filter(w => String(w.code || "").indexOf(rc + "-") === 0).length;
    return '<div class="r"><span class="k">' + esc(qzName(r)) + '</span><span class="v">' +
      (works ? works + " в смете" : (n ? n + " отмечено" : "—")) +
      (skipped ? " · пропусков " + skipped : "") + "</span></div>";
  }).join("");
  const planCount = (() => {
    let n = 0;
    const plan = (typeof PROF === "object" && PROF && PROF.plan) || {};
    Object.keys(plan).forEach(rc => { n += Object.keys(plan[rc] || {}).length; });
    return n;
  })();
  return '<div class="stat">' +
    '<div class="r"><span class="k">Вопросов не осталось</span><span class="v">✓</span></div>' +
    '<div class="m">Все дыры, которые опрос умеет видеть, закрыты. Что не спрошено — то вычисляется: площадь и периметр из контура, стены и потолок из обмеров, расхождение плана с фактом из схемы проёмов.</div>' +
    "</div>" +
    '<div class="stat">' + rows + "</div>" +
    (planCount
      ? '<div class="stat"><div class="m">В профиле ремонта отмечено видов: <b>' + planCount + "</b>. Смету по ним собирает кнопка на экране профиля — опрос ничего не записывает молча.</div>" +
        '<div class="m" style="margin-top:8px"><button onclick="go(\'profile\')" style="width:100%;padding:12px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Перейти к профилю ремонта</button></div></div>'
      : "") +
    '<div class="m" style="margin-top:10px"><button onclick="qzStop()" style="width:100%;padding:12px;border-radius:12px;border:1px solid #3a3a3c;background:#1c1c1e;color:#fff;font-size:15px">Закончить опрос</button></div>';
}

/* ── Г-5. Озвучивание вопроса (TTS) ───────────────────────────────
   Решение Дмитрия [чат 060]: переключатель «авто/ручной», по умолчанию
   РУЧНОЙ. Разбор 23 §9 назвал цену автозапуска записи заранее: микрофон
   включается сам, а запись звука необратима — поэтому «авто» это выбор
   человека, а не умолчание системы.

   Ручной — вопрос читается кнопкой 🔊, микрофон включает человек.
   Авто    — вопрос читается сам один раз при появлении, и по окончании
             чтения включается запись (у вопросов, где ответ голосом
             вообще предусмотрен, то есть q.mode задан).

   Озвучивается та же строка, что видна на экране (§9: текст вопроса =
   озвучиваемая форма), языком интерфейса — новых языковых сущностей
   двусторонность не заводит. */
const QZ_TTS_KEY = "remont_tts";
let QZ_TTS = "manual";
try{
  const s = localStorage.getItem(QZ_TTS_KEY);
  if(s === "auto" || s === "manual") QZ_TTS = s;
}catch(e){}

function qzTtsOk(){
  return typeof window !== "undefined" && !!window.speechSynthesis &&
         typeof window.SpeechSynthesisUtterance === "function";
}

function qzTtsLang(){ return LANG === "uz" ? "uz-UZ" : "ru-RU"; }

/* Идёт ли сейчас запись или разбор — авто не перебивает начатое. */
function qzTtsBusy(){
  try{ if(mediaRec && mediaRec.state === "recording") return true; }catch(e){}
  try{
    const sh = document.getElementById("vsheet");
    if(sh && sh.style && sh.style.display && sh.style.display !== "none") return true;
  }catch(e){}
  return false;
}

function qzTtsStop(){
  try{ if(qzTtsOk()) window.speechSynthesis.cancel(); }catch(e){}
}

/* Переключатель. Смена режима не пишется ни в какие данные объекта —
   это настройка клиента, живёт рядом с языком интерфейса. */
function qzTtsSet(mode){
  QZ_TTS = (mode === "auto") ? "auto" : "manual";
  try{ localStorage.setItem(QZ_TTS_KEY, QZ_TTS); }catch(e){}
  if(QZ_TTS === "manual"){ qzTtsStop(); }
  else { if(QZ) QZ.spoken = ""; }   // включили авто — текущий вопрос прочитать
  render();
}

/* Озвучиваемая форма: одна строка без вёрстки, вопрос плюс подсказка. */
function qzSpeakText(q){
  const t = String((q && q.text) || "").replace(/\s+/g, " ").trim();
  const h = String((q && q.hint) || "").replace(/\s+/g, " ").trim();
  return h ? (t + " " + h) : t;
}

function qzSpeak(text, after){
  if(!qzTtsOk()){
    toast("Озвучка недоступна в этом клиенте", "bad");
    if(after) after(false);
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text || ""));
    u.lang = qzTtsLang();
    let done = false;
    const fin = ok => { if(done) return; done = true; if(after) after(ok); };
    u.onend = () => fin(true);
    u.onerror = () => fin(false);
    window.speechSynthesis.speak(u);
  }catch(e){ if(after) after(false); }
}

/* Кнопка 🔊: читает активный вопрос. Повторное нажатие читает заново. */
function qzSayOut(){
  const q = qzCur();
  if(!q) return;
  if(QZ) QZ.spoken = String(q.id || "");
  qzSpeak(qzSpeakText(q), null);
}

/* Авто-режим. Вызывается после отрисовки экрана опроса; один вопрос
   читается один раз — признак прочитанного держится по коду вопроса,
   поэтому перерисовка экрана (поллинг, тост, ввод) речь не повторяет. */
function qzAuto(){
  if(QZ_TTS !== "auto") return;
  if(!QZ || !QZ.on) return;
  if(typeof stack !== "undefined" && stack[stack.length - 1] !== "quiz") return;
  if(qzTtsBusy()) return;
  const q = qzCur();
  if(!q) return;
  const id = String(q.id || "");
  if(QZ.spoken === id) return;
  QZ.spoken = id;
  qzSpeak(qzSpeakText(q), spoken => {
    /* Запись включается только вслед за прозвучавшим вопросом: если синтез
       сорвался, человек вопроса не слышал — включать ему микрофон молча
       нельзя (разбор 23 §9: неожиданная запись хуже лишнего тапа). */
    if(!spoken){ toast("Вопрос не озвучился — ответьте кнопкой", "wait"); return; }
    if(QZ_TTS !== "auto" || !QZ || !QZ.on) return;
    if(typeof stack !== "undefined" && stack[stack.length - 1] !== "quiz") return;
    const cur = qzCur();
    if(!cur || String(cur.id || "") !== id) return;  // вопрос сменился, пока читали
    if(!cur.mode) return;                            // ответ голосом не предусмотрен
    if(qzTtsBusy()) return;
    qzVoice();
  });
}

/* ── Экран опроса ─────────────────────────────────────────────── */
function qzScreen(){
  const q = qzCur();
  const total = qzTotal();
  const later = Object.keys(QZ.later).length;
  const head = '<div class="hello">Опрос</div>';

  if(!q){
    return head + '<div class="sub">пройдено · дыр не осталось</div>' + qzSummaryHtml();
  }

  const idx = Math.min(QZ.pos + 1, total);
  const isLate = !!QZ.later[q.id];
  const room = q.room ? (roomList().find(r => r.code === q.room) || null) : null;

  const answer = (() => {
    if(q.input === "num"){
      return '<div style="display:flex;gap:8px;align-items:center;margin-top:12px">' +
          '<input id="qznum" type="number" inputmode="decimal" placeholder="' + attr(q.unit === "м" ? "число в метрах или сантиметрах" : "число") + '" ' +
            'style="flex:1;padding:12px;border-radius:12px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:16px">' +
          '<button onclick="qzNum(false)" style="padding:12px 16px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Записать</button>' +
          (q.zero ? '<button onclick="qzNum(true)" style="padding:12px 14px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Нет</button>' : "") +
        "</div>" +
        (q.same ? '<div class="m" style="margin-top:6px"><button onclick="qzSame()" style="padding:8px 12px;border-radius:10px;border:1px solid #3a3a3c;background:#1c1c1e;color:#fff;font-size:13px">Как везде — ' + esc(q.same) + " м</button></div>" : "");
    }
    if(q.input === "wh"){
      const inp = (id, ph) => '<input id="' + id + '" type="number" inputmode="decimal" placeholder="' + attr(ph) + '" ' +
        'style="flex:1;padding:12px;border-radius:12px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:16px">';
      return '<div style="display:flex;gap:8px;align-items:center;margin-top:12px">' + inp("qzw", "ширина") + inp("qzh", "высота") +
        '<button onclick="qzWH()" style="padding:12px 16px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Записать</button></div>';
    }
    if(q.input === "choice"){
      return '<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">' +
        (q.choices || []).map(v => '<button onclick="qzChoice(' + JSON.stringify(v).replace(/"/g, "&quot;") + ')" ' +
          'style="padding:10px 14px;border-radius:11px;border:0;background:#3a3a3c;color:#fff;font-size:15px">' + esc(v) + "</button>").join("") +
        "</div>";
    }
    if(q.input === "skip"){
      return '<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">' +
          '<button onclick="qzSkipKeep()" style="padding:10px 14px;border-radius:11px;border:0;background:#0a84ff;color:#fff;font-size:15px">Делаем</button>' +
          (q.choices || []).map(v => '<button onclick="qzSkipDo(' + JSON.stringify(v).replace(/"/g, "&quot;") + ')" ' +
