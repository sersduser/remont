<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ремонт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:   var(--tg-theme-bg-color, #17212b);
  --sec:  var(--tg-theme-secondary-bg-color, #232e3c);
  --txt:  var(--tg-theme-text-color, #ffffff);
  --hint: var(--tg-theme-hint-color, #7d8b99);
  --btn:  var(--tg-theme-button-color, #5288c1);
  --btxt: var(--tg-theme-button-text-color, #ffffff);
  --ok:#4dcd5e; --warn:#f5a623; --bad:#e5484d; --link:#6ab3f3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  padding:calc(14px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 14px 40px;overscroll-behavior-y:contain}

.hello{font-size:19px;font-weight:600}
.sub{font-size:12px;color:var(--hint);margin-bottom:14px}

.stat{background:var(--sec);border-radius:12px;padding:13px 15px;margin-bottom:12px}
.stat .r{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;gap:10px}
.stat .k{font-size:13px;color:var(--hint)}
.stat .v{font-size:16px;font-weight:600;white-space:nowrap}
.stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)} .stat .v.bad{color:var(--bad)}
.bar{height:6px;background:rgba(125,139,153,.25);border-radius:3px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .4s}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sec);border:none;border-radius:14px;padding:18px 10px;color:var(--txt);
  cursor:pointer;text-align:center;font:inherit;transition:transform .1s}
.tile:active{transform:scale(.96)}
.tile .ic{font-size:27px;display:block;margin-bottom:6px}
.tile .nm{font-size:13px;font-weight:600;line-height:1.25}
.tile .h{font-size:11px;color:var(--hint);margin-top:3px}
.tile.pri{background:var(--btn);color:var(--btxt)}
.tile.pri .h{opacity:.85;color:inherit}

.card{background:var(--sec);border-radius:12px;padding:14px;margin-bottom:10px}
.card .lbl{font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;gap:10px;
  border-bottom:1px solid rgba(125,139,153,.16)}
.li:last-child{border:none}
.li .n{font-size:14px;flex:1;min-width:0}
.li .d{font-size:11px;color:var(--hint);margin-top:2px}
.li .v{font-size:14px;font-weight:600;white-space:nowrap}

select,input{background:var(--bg);border:1px solid rgba(125,139,153,.3);color:var(--txt);
  padding:8px 10px;border-radius:9px;font:inherit;font-size:14px;width:100%}
input[type=number]{text-align:center}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row label{font-size:12px;color:var(--hint);flex:0 0 96px}

.filt{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt button{background:var(--sec);border:none;color:var(--hint);padding:7px 13px;border-radius:20px;
  font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.filt button.on{background:var(--btn);color:var(--btxt)}

.work{background:var(--sec);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.work.done{opacity:.55}
.work .t{font-size:14px;font-weight:500;line-height:1.3}
.work .m{font-size:11px;color:var(--hint);margin-top:3px}

.warnbox{background:rgba(245,166,35,.13);border:1px solid rgba(245,166,35,.32);border-radius:12px;
  padding:13px;margin-bottom:12px;font-size:14px;line-height:1.5}
.warnbox b{color:var(--warn)}
.mainbtn{width:100%;background:var(--btn);color:var(--btxt);border:none;border-radius:11px;
  padding:13px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;margin-top:11px}

.load{text-align:center;padding:70px 20px;color:var(--hint)}
.err{background:rgba(229,72,77,.13);border:1px solid rgba(229,72,77,.4);border-radius:12px;
  padding:15px;font-size:14px;line-height:1.55}
.toast{position:fixed;left:14px;right:14px;bottom:18px;background:var(--ok);color:#06240c;
  padding:12px;border-radius:11px;text-align:center;font-weight:600;font-size:14px;
  opacity:0;transform:translateY(12px);transition:.22s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
.toast.bad{background:var(--bad);color:#fff}
.toast.wait{background:var(--sec);color:var(--hint)}
.toast.err{background:var(--bad);color:#fff}

/* ── ГОЛОСОВОЙ ВВОД: модальное окно, индикатор, результат ── */
.vmask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;
  justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:.2s}
.vmask.on{opacity:1;pointer-events:auto}
.vsheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(20px);transition:.24s}
.vmask.on .vsheet{transform:none}
.vsheet .vh{font-size:17px;font-weight:600;margin-bottom:4px}
.vsheet .vs{font-size:12px;color:var(--hint);margin-bottom:14px}

.vrec{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0 6px}
.vmic{width:84px;height:84px;border-radius:50%;background:var(--btn);display:flex;align-items:center;
  justify-content:center;font-size:38px}
.vmic.rec{animation:pulse 1.2s ease-out infinite;background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}100%{box-shadow:0 0 0 26px rgba(229,72,77,0)}}
.vtime{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.vwave{display:flex;gap:3px;align-items:center;height:20px}
.vwave i{width:3px;background:var(--hint);border-radius:2px;animation:wv 1s ease-in-out infinite}
.vwave i:nth-child(2){animation-delay:.15s}.vwave i:nth-child(3){animation-delay:.3s}
.vwave i:nth-child(4){animation-delay:.45s}.vwave i:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{height:6px}50%{height:20px}}

.vrow{display:flex;gap:10px;margin-top:16px}
.vrow button{flex:1;border:none;border-radius:11px;padding:13px;font:inherit;font-size:15px;
  font-weight:600;cursor:pointer}
.vbtn-ok{background:var(--btn);color:var(--btxt)}
.vbtn-cancel{background:var(--sec);color:var(--txt)}
.vbtn-bad{background:var(--bad);color:#fff}

.vitem{display:flex;gap:11px;align-items:flex-start;background:var(--sec);border-radius:11px;
  padding:12px;margin-bottom:8px;cursor:pointer}
.vitem .vchk{width:22px;height:22px;border-radius:6px;border:2px solid var(--hint);flex:0 0 22px;
  margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
.vitem.sel .vchk{background:var(--ok);border-color:var(--ok)}
.vitem .vt{font-size:14px;font-weight:500;line-height:1.3}
.vitem .vd{font-size:12px;color:var(--hint);margin-top:2px}
.vitem .vv{font-size:13px;margin-top:3px}
.vitem .vv b{color:var(--ok)}
.vquote{background:var(--sec);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--hint);
  margin-bottom:12px;line-height:1.45}
.vquote b{color:var(--txt);font-weight:500}
.vspin{width:34px;height:34px;border:3px solid rgba(125,139,153,.3);border-top-color:var(--btn);
  border-radius:50%;animation:spin .8s linear infinite;margin:8px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app"><div class="load">Загружаю…</div></div>
<div class="toast" id="toast"></div>

<!-- Модальное окно голосового ввода -->
<div class="vmask" id="vmask"><div class="vsheet" id="vsheet"></div></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   Адрес n8n. Уже прописан — менять не надо.
   ═══════════════════════════════════════════════════════════════ */
const API = "https://n8n.nc-lab.uz/webhook/remont";

/* Идентификация — по ЛИЧНОСТИ из Telegram (initData), а не по ключу в ссылке.
   Сервер проверяет подпись Telegram его публичным ключом (токен бота не нужен)
   и определяет роль по Telegram-ID из листа 09_Доступы. Подменить роль с клиента
   или подставить чужой ключ нельзя. KEY оставлен запасным входом на переходный
   период и для отладки в обычном браузере (вне Telegram initData недоступен).   */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const INIT = (tg && tg.initData) || "";                              // подписанные данные Telegram
const KEY  = new URLSearchParams(location.search).get("key") || "";  // legacy / отладка вне Telegram

/* Код приглашения в бригаду [чат 012]: приходит в подписанном start_param
   (ссылка t.me/бота?startapp=inv_КОД) или руками через ?invite / поле ввода.
   Сервер доверяет только тому коду, который сам достаёт из initData или body —
   здесь код нужен лишь чтобы показать его в поле и не заставлять печатать. */
const INVITE = String((tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("invite") || "").replace(/^inv_/i, "").toUpperCase();

let D = null;                       // данные с сервера
let stack = ["home"];               // стек навигации
let fRoom = "";                     // активный фильтр по комнате
let hideDone = false;               // глобальный фильтр «скрыть готовое»
const app = document.getElementById("app");
const fmt = n => (Number(n) || 0).toLocaleString("ru-RU", { maximumFractionDigits: 0 });

/* Бот пишет в таблицу произвольные названия материалов. Одна кавычка в имени
   сломала бы разметку — поэтому всё, что пришло с сервера, экранируем.        */
const esc  = t => String(t ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const attr = t => esc(t);

/* ── ЗАГРУЗКА ─────────────────────────────────────────────── */
async function load(){
  try{
    const auth = INIT ? `initData=${encodeURIComponent(INIT)}`
                      : `key=${encodeURIComponent(KEY)}`;
    const r = await fetch(`${API}/data?${auth}`, { cache: "no-store" });
    const BAD = "Доступ не подтверждён — откройте панель через бота в Telegram.";
    if(r.status === 401 || r.status === 403) throw new Error(BAD);
    if(!r.ok) throw new Error("Сервер не отвечает (HTTP " + r.status + ")");
    /* При неверном ключе n8n обрывает цепочку и отдаёт пустое тело с кодом 200.
       Данные не утекают, но и JSON не приходит — трактуем это как отказ в доступе. */
    const raw = (await r.text()).trim();
    if(!raw) throw new Error(BAD);
    try{ D = JSON.parse(raw); }catch{ throw new Error(BAD); }
    if(!D || !D.role) throw new Error(BAD);
    render();
    _sig = _snapshot(D);            // калибровка живого обновления
    /* Работник живёт данными контура бригады — тянем их при каждой полной
       загрузке: load() зовётся и при старте, и при откате после ошибки [чат 013] */
    if (D.kind === "hand") crewLoad().then(() => render()).catch(() => {});
  }catch(e){
    /* Незнакомый Telegram — возможно, это работник с приглашением [чат 012]:
       вместо тупика показываем экран регистрации по коду. */
    if(INIT && /не подтверждён/.test(String(e.message || ""))){ renderInvite(); return; }
    app.innerHTML = `<div class="err"><b>Не удалось загрузить.</b><br>${e.message}
      <br><br><span style="color:var(--hint);font-size:13px">Проверьте интернет и откройте ещё раз.</span></div>`;
  }
}

/* ══════════════════════════════════════════════════════════════
   ПРИГЛАШЕНИЕ В БРИГАДУ [чат 012] — регистрация работника.
   Двухфазный разговор с POST /remont/register: check возвращает,
   кого нашли по коду («Вы — Петя, бригада Суботина?»), confirm=1
   вписывает Telegram_ID в Работники и строку в 09_Доступы.
   Ошибки сервер отдаёт пустым телом (граблина 6) — панель честно
   говорит «не подошёл», не различая причин. Замок от двойного тапа. */
let INV_BUSY = false, INV_CODE = "";
const INV_INP = 'style="width:100%;padding:12px;border-radius:12px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:18px;letter-spacing:3px;text-align:center;text-transform:uppercase"';
function renderInvite(s){
  s = s || {};
  const code0 = s.code !== undefined ? s.code : INVITE;
  let body = "";
  if(s.phase === "found"){
    body = '<div class="stat"><span class="k">Код принят. Вы — <b>' + esc(s.name) + '</b>, бригада: <b>' + esc(s.foreman) + '</b>?</span></div>' +
      '<button class="tile pri" style="width:100%;margin-bottom:10px" onclick="invConfirm()"><span class="nm">Да, это я — подключить</span></button>' +
      '<button class="tile" style="width:100%" onclick="renderInvite({code:\'\'})"><span class="nm">Нет, ввести другой код</span></button>';
  } else if(s.phase === "done"){
    body = '<div class="stat"><span class="k">Готово, ' + esc(s.name) + '! Вы в бригаде. Открываю панель…</span></div>';
  } else {
    body = '<div class="stat"><span class="k">Введите код приглашения от бригадира. Если вы открыли панель по ссылке-приглашению, код уже подставлен.</span></div>' +
      '<div style="margin:10px 0"><input id="invcode" value="' + attr(code0) + '" ' + INV_INP + ' placeholder="КОД"></div>' +
      (s.err ? '<div class="warnbox">' + esc(s.err) + '</div>' : "") +
      '<button class="tile pri" style="width:100%" onclick="invCheck()"><span class="nm">Проверить код</span></button>';
  }
  app.innerHTML = '<div class="hello">Приглашение в бригаду</div>' +
    '<div class="sub">объект «Ремонт»</div>' + body;
}
async function invCheck(){
  const code = String((document.getElementById("invcode") || {}).value || "").trim().toUpperCase();
  if(!/^[A-Z0-9]{6,12}$/.test(code)){ renderInvite({err: "Код — буквы и цифры, обычно 8 знаков.", code}); return; }
  if(INV_BUSY) return;
  INV_BUSY = true;
  try{
    const r = await fetch(API + "/register", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: INIT, code }) });
    const t = (await r.text()).trim();
    let j = null; try{ j = JSON.parse(t); }catch(e){}
    if(j && j.ok && j.phase === "check"){ INV_CODE = code; renderInvite({phase: "found", name: j.name, foreman: j.foreman}); }
    else renderInvite({err: "Код не подошёл: он мог истечь, быть использован или ваш Telegram уже подключён. Попросите у бригадира новую ссылку.", code});
  }catch(e){ renderInvite({err: "Нет связи с сервером — попробуйте ещё раз.", code}); }
  finally{ INV_BUSY = false; }
}
async function invConfirm(){
  if(INV_BUSY) return;
  INV_BUSY = true;
  try{
    const r = await fetch(API + "/register", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: INIT, code: INV_CODE, confirm: "1" }) });
    const t = (await r.text()).trim();
    let j = null; try{ j = JSON.parse(t); }catch(e){}
    if(j && j.ok && j.phase === "confirm"){ renderInvite({phase: "done", name: j.name}); setTimeout(() => location.reload(), 1600); }
    else renderInvite({err: "Не получилось подключить — попробуйте ещё раз или запросите новую ссылку.", code: INV_CODE});
  }catch(e){ renderInvite({err: "Нет связи с сервером — попробуйте ещё раз.", code: INV_CODE}); }
  finally{ INV_BUSY = false; }
}

/* ── ЗАПИСЬ ───────────────────────────────────────────────────
   Не перечитываем всё после каждой правки — правим локально.
   Иначе на 102 работах экран моргает и уезжает наверх.        */
/* ═══ Зависимости работ · мягкое предупреждение ═══════════════════════
   Предшественники берутся из колонки «Зависит_от» листа 01_Работы
   (приходит в поле deps). Зависимость снята, когда предшественник
   «Готово» или «Снято». Предупреждение НЕ блокирует: карта связей
   черновая, и ошибка в ней не должна стопорить реальную работу.     */
function depCodes(w){
  const raw = String((w && w.deps) || "").trim();
  if (!raw || raw === "—" || raw === "-") return [];
  return raw.split(",").map(s => s.trim()).filter(Boolean);
}
function depBlockers(w){
  if (!D || !D.works || !w) return [];
  return depCodes(w)
    .map(c => D.works.find(x => x.code === c))
    .filter(p => p && p.status !== "Готово" && p.status !== "Снято");
}
function depAsk(w, blockers){
  return new Promise(resolve => {
    const rows = blockers.map(b =>
      '<div style="margin:8px 0;padding:8px 10px;background:rgba(255,255,255,.07);border-radius:10px">' +
      '<b>' + esc(b.name) + '</b><br><span style="opacity:.65;font-size:13px">' +
      esc(String(b.room || "").split(" (")[0]) + ' · ' + esc(b.status) + '</span></div>').join("");
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px";
    box.innerHTML =
      '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:80vh;overflow:auto;font-size:15px">' +
        '<div style="font-weight:700;margin-bottom:8px">⚠ Предыдущее ещё не принято</div>' +
        '<div style="opacity:.7;font-size:14px;margin-bottom:6px">«' + esc(w.name) + '» обычно делается после того, как принято:</div>' +
        rows +
        '<div style="opacity:.6;font-size:13px;margin:10px 0 14px">Это подсказка, а не запрет. Если на объекте порядок другой — продолжайте.</div>' +
        '<div style="display:flex;gap:8px">' +
          '<button id="depNo" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
          '<button id="depYes" style="flex:1;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Всё равно заявить</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(box);
    box.querySelector("#depNo").onclick  = () => { box.remove(); resolve(false); };
    box.querySelector("#depYes").onclick = () => { box.remove(); resolve(true);  };
  });
}

/* Баланс от приёмки: сколько из выданного аванса уже отработано принятыми
   работами. null — если считать не из чего (нет ни оплат, ни приёмки).  */
function advCalc(field){
  const acc  = accSum(field);
  const S2   = D.settings || {};
  const paid = Number(S2["Оплачено_за_работу_USD"] ?? (D.my_money && D.my_money.received_usd) ?? 0);
  if (!paid && !acc) return null;
  if (!paid)        return { k:"Принято работ",             main: fmt(acc) + " $",
                             sub:"Оплат пока не поступало", pct:0, color:"var(--ok)" };
  if (acc < paid)   return { k:"Отработано аванса",         main: fmt(acc) + " из " + fmt(paid) + " $",
                             sub:"Осталось отработать " + fmt(paid - acc) + " $",
                             pct: Math.max(1, Math.round(acc / paid * 100)), color:"var(--warn)" };
  if (acc === paid) return { k:"Аванс отработан полностью", main: fmt(paid) + " $",
                             sub:"Расчёты сошлись", pct:100, color:"var(--ok)" };
  return              { k:"Аванс отработан, к доплате",     main: fmt(acc - paid) + " $",
                        sub:"Принято на " + fmt(acc) + " $ при оплаченных " + fmt(paid) + " $",
                        pct:100, color:"var(--ok)" };
}

/* ═══ Цены Юрия: подсказка, разнесение, пакетная запись ═══════════════
   Пока колонка «Цена_Юрия_USD» пуста, работник не видит своей витрины
   приёмки. Панель показывает, сколько позиций осталось, принимает ставку
   голосом и умеет разнести общую сумму пропорционально договору.      */
function priceStats(){

}
/* ══════════════════════════════════════════════════════════════
   ПРАЙС ИСПОЛНИТЕЛЯ — цены по видам работ из общей базы [чат 007]
   Справочник и прайс лежат в отдельной таблице, общей для всех
   объектов: цена задаётся один раз за вид работы и переезжает на

   сервер отдаёт справочник только когда панель просит его явно.
   ══════════════════════════════════════════════════════════════ */
async function loadCatalog(force){
  if(D.catalog && !force) return true;
  const auth = INIT ? 'initData=' + encodeURIComponent(INIT) : 'key=' + encodeURIComponent(KEY);
  const r = await fetch(API + '/data?' + auth + '&catalog=1', { cache: 'no-store' });
  const raw = (await r.text()).trim();
  if(!r.ok || !raw) throw new Error('Не удалось загрузить справочник');
  let j; try{ j = JSON.parse(raw); }catch(e){ throw new Error('Не удалось загрузить справочник'); }
  D.catalog = j.catalog || { kinds: [], price: [] };
  return true;
}

/* ══════════════════════════════════════════════════════════════
   ПРОФИЛЬ РЕМОНТА — сборка сметы из обмеров и прайса [чат 007]
   К помещению применяются виды работ; объём считается из его размеров
   по колонке «База_объёма» справочника, цена — из прайса исполнителя.
   Итог дописывается строками в 01_Работы через POST /remont/append.
   ══════════════════════════════════════════════════════════════ */
let PROF = { room: null, picked: {} };   // выбранное помещение и отмеченные виды

async function openProfile(){
  try{
    if(!D.catalog) toast('Загружаю справочник…');
    await loadCatalog();
    PROF = { room: null, picked: {} };
    go('profile');

function profRoom(){ return (D.rooms || []).find(r => r.code === PROF.room) || null; }

// Сколько единиц работы даёт помещение по базе объёма из справочника
function profVol(kind, room){
  if(!kind || !room) return null;
  const part = b => {
    if(b === 'пол')       return room.floor_m2;
    if(b === 'потолок')   return room.ceiling_m2;
    if(b === 'стены')     return room.wall_m2;
    if(b === 'периметр')  return room.perimeter_m;
    if(b === 'окна')      return room.windows;
    if(b === 'двери')     return room.doors;
    if(b === 'помещение' || b === 'объект') return 1;
    return null;
  };
  const base = String(kind.base || '').trim();
  if(!base || base === 'вручную') return null;
  let sum = 0;
  for(const p of base.split('+')){
    const v = part(p.trim());
    if(v === null || v === undefined || v === '') return null;   // нет данных — просим ввести руками
    sum += Number(v) || 0;
  }
  return Math.round(sum * 100) / 100;
}

function profPrice(code){
  const p = ((D.catalog || {}).price || []).find(x => x.code === code);
  if(p && Number(p.price_usd) > 0) return Number(p.price_usd);
  const k = ((D.catalog || {}).kinds || []).find(x => x.code === code);
  return (k && Number(k.base_usd) > 0) ? Number(k.base_usd) : 0;   // прайс пуст — ориентир из справочника
}

function profToggle(code){
  if(PROF.picked[code]) delete PROF.picked[code];
  else {
    const kind = ((D.catalog || {}).kinds || []).find(x => x.code === code);
    PROF.picked[code] = { vol: profVol(kind, profRoom()), manual: false };
  }
  render();
}

function profSetVol(el){
  const code = el.getAttribute('data-code');
  const v = String(el.value ?? '').trim().replace(',', '.');
  if(!PROF.picked[code]) return;
  PROF.picked[code].vol = v === '' ? null : Number(v);
  PROF.picked[code].manual = true;
  const box = document.getElementById('profSum');
  if(box) box.textContent = profTotalText();
}

function profTotal(){
  let n = 0, sum = 0, blank = 0;
  for(const code of Object.keys(PROF.picked)){
    const it = PROF.picked[code];
    n++;
    if(it.vol === null || !(Number(it.vol) > 0)) { blank++; continue; }
    sum += Number(it.vol) * profPrice(code);
  }
  return { n, sum: Math.round(sum * 100) / 100, blank };
}
function profTotalText(){
  const t = profTotal();
  return t.n ? ('Выбрано ' + t.n + ' · на ' + fmt(t.sum) + ' USD' + (t.blank ? (' · без объёма: ' + t.blank) : '')) : 'Ничего не выбрано';
}

// Сборка сметы: выбранные виды превращаются в строки листа 01_Работы [чат 007]
async function profBuild(){
  const room = profRoom();
  if(!room) { toast('Сначала выберите помещение'); return; }
  const codes = Object.keys(PROF.picked);
  if(!codes.length) { toast('Ничего не выбрано'); return; }
  const noVol = codes.filter(c => !(Number((PROF.picked[c]||{}).vol) > 0));
  if(noVol.length){ toast('Без объёма: ' + noVol.length + ' — заполните или снимите'); return; }

  const kinds = (D.catalog || {}).kinds || [];
  const kindOf = c => kinds.find(k => k.code === c) || {};

  // Новые коды строк: продолжаем нумерацию помещения, чтобы не столкнуться с существующими
  const used = (D.works || []).filter(w => String(w.code || '').indexOf(room.code + '-') === 0)
    .map(w => parseInt(String(w.code).split('-')[1], 10) || 0);
  let next = (used.length ? Math.max.apply(null, used) : 0) + 1;
  const newCode = {};
  codes.forEach(c => { newCode[c] = room.code + '-' + String(next++).padStart(2, '0'); });

  const rows = codes.map(c => {
    const k = kindOf(c);
    const vol = Number(PROF.picked[c].vol);
    const rate = profPrice(c);
    // Типовые зависимости вида превращаются в ссылки на строки этого же помещения —
    // те предшественники, которые здесь не выбраны, просто опускаются.
    const deps = String(k.deps || '').split(',').map(x => x.trim()).filter(x => x && newCode[x]).map(x => newCode[x]);
    return {
      'Код': newCode[c],
      'Помещение': room.name,
      'Раздел': k.section || '',
      'Работа': k.name || c,
      'Ед': k.unit || '',
      'Объём': vol,
      'Ставка_USD': rate || '',
      'Категория': 'База',
      'Цена_аллокация_USD': rate ? Math.round(vol * rate * 100) / 100 : '',
      'Статус': 'Не начато',
      'Готовность_%': 0,
      'Источник': 'профиль ремонта',
      'Примечание': 'вид ' + c,
      'Зависит_от': deps.length ? deps.join(', ') : '—',
    };
  });

  const t = profTotal();
  if(!confirm('Добавить ' + rows.length + ' работ в смету на ' + fmt(t.sum) + ' USD? Помещение: ' + room.name)) return;

  try{
    const r = await fetch(API + '/append', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: INIT, key: KEY, sheet: '01_Работы', rows: rows })
    });
    const txt = (await r.text()).trim();
    if(!r.ok || !txt) throw new Error('Не удалось добавить работы');
    toast('Добавлено работ: ' + rows.length);
    PROF.picked = {};
    await load();
  }catch(e){ toast(e.message, 'err'); }
}

/* ══════════════════════════════════════════════════════════════
   СРОКИ — критический путь и шкала «опережение / отставание» [чат 007]
   Длительности приезжают в поле dur (черновая оценка из ставки чел-часа),
   связи — в поле deps. По ним считается самая длинная цепочка: она и есть
   срок объекта. Работы вне этой цепочки имеют запас и на финиш не влияют.
   ══════════════════════════════════════════════════════════════ */
/* Техпаузы [чат 012]. «Техпауза_дней» — календарное время ПОСЛЕ работы
   (стяжка сохнет, штукатурка стоит), прежде чем могут стартовать зависимые.
   Живёт в справочнике видов; связь работы с видом — пометка «вид X»
   в Примечании, её ставит конструктор смет. У унаследованных работ пилота
   пометки нет: их паузы неизвестны и считаются нулём, охват честно показан
   на экране. Паузы не тратят человекодни — оценка «по рукам» не растёт. */
function pauseOf(w){
  const kinds = (D.catalog || {}).kinds;
  if(!kinds || !w || !w.note) return 0;
  const m = String(w.note).match(/вид\s+([A-Za-z]+-\d+)/i);
  if(!m) return 0;
  const k = kinds.find(x => x.code === m[1]);
  return (k && Number(k.pause) > 0) ? Number(k.pause) : 0;
}
async function openTerms(){
  try{
    if(!D.catalog){ toast('Загружаю справочник…'); await loadCatalog(); }
  }catch(e){ /* без справочника паузы просто нулевые */ }
  go('terms');
}

function schedule(usePauses){
  const ws = (D.works || []).filter(w => w.code);
  const by = {}; ws.forEach(w => { by[w.code] = w; });
  const dur = w => (Number(w.dur) > 0 ? Number(w.dur) : 0.5);
  const pz = c => usePauses ? pauseOf(by[c]) : 0;
  const depsOf = w => String(w.deps || '').split(',').map(s => s.trim())
    .filter(s => s && s !== '—' && by[s]);

  const ef = {};                       // ранний финиш, в днях от старта
  const calc = (code, seen) => {
    if(ef[code] !== undefined) return ef[code];
    if(seen[code]) return 0;           // страховка от цикла в карте связей
    seen[code] = 1;
    const w = by[code]; if(!w) return 0;
    const ds = depsOf(w);
    const start = ds.length ? Math.max.apply(null, ds.map(d => calc(d, Object.assign({}, seen)) + pz(d))) : 0;
    ef[code] = Math.round((start + dur(w)) * 100) / 100;
    return ef[code];
  };
  ws.forEach(w => calc(w.code, {}));
  const total = ws.length ? Math.max.apply(null, ws.map(w => ef[w.code] || 0)) : 0;

  const succ = {};                     // последователи
  ws.forEach(w => depsOf(w).forEach(d => { (succ[d] = succ[d] || []).push(w.code); }));
  const lf = {};                       // поздний финиш
  const late = (code, seen) => {
    if(lf[code] !== undefined) return lf[code];
    if(seen[code]) return total;
    seen[code] = 1;
    const ss = succ[code] || [];
    lf[code] = ss.length
      ? Math.min.apply(null, ss.map(s => late(s, Object.assign({}, seen)) - dur(by[s]))) - pz(code)
      : total;
    return lf[code];
  };
  ws.forEach(w => late(w.code, {}));
  const slack = {}; ws.forEach(w => { slack[w.code] = Math.round(((lf[w.code] || 0) - (ef[w.code] || 0)) * 100) / 100; });
  const critical = ws.filter(w => Math.abs(slack[w.code]) < 0.01).map(w => w.code);
  return { ef, lf, slack, total, critical, by };
}

// Где мы во времени: сравниваем пройденное по плану с прошедшими днями
function timeCalc(){
  const s = schedule(true);
  const s0 = schedule(false);
  const done = (D.works || []).filter(w => w.status === 'Готово' && w.code);
  const reached = done.length ? Math.max.apply(null, done.map(w => s.ef[w.code] || 0)) : 0;
  const dates = (D.works || []).map(w => String(w.updated || '').slice(0, 10)).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  const start = dates.length ? new Date(dates[0] + 'T00:00:00') : null;
  const elapsed = start ? Math.max(0, Math.round((Date.now() - start.getTime()) / 86400000)) : null;
  const diff = (elapsed === null) ? null : Math.round((reached - elapsed) * 10) / 10;
  // Критический путь — это технологический минимум: столько займёт ремонт, если
  // на каждую готовую к работе позицию хватает людей. Реальный срок упирается в руки:
  // сумма всех длительностей, делённая на размер бригады. Берём больший из двух.
  const sumDur = (D.works || []).reduce((a, w) => a + (Number(w.dur) > 0 ? Number(w.dur) : 0.5), 0);
  const crew = Number((D.settings || {})['Рабочих_в_бригаде']) || 2;
  const byCrew = Math.round((sumDur / crew) * 10) / 10;
  const real = Math.max(Math.round(s.total * 10) / 10, byCrew);
  return { total: Math.round(s.total * 10) / 10, reached: Math.round(reached * 10) / 10, elapsed, diff,
           critical: s.critical, sched: s, startDate: dates[0] || null,
           sumDur: Math.round(sumDur * 10) / 10, crew, byCrew, real,
           pauses: Math.round((s.total - s0.total) * 10) / 10,
           pcov: (D.works || []).filter(w => pauseOf(w) > 0).length };
}

/* ══════════════════════════════════════════════════════════════
   ИЗМЕНЕНИЯ СОСТАВА РАБОТ — подвижный договор [чат 008]
   Решения чата 006: заявляют обе стороны · состав и цена согласуются
   одним действием · цена уже принятых работ замораживается.

   Договор в 07_Настройки остаётся БАЗОЙ и не переписывается. Действующая
   сумма = база + принятые изменения, считается на лету. Так у каждой
   прибавки есть автор, время и след в 11_Изменения, а перезаписанное
   число этого не даёт: по нему не восстановить, из чего оно сложилось.
   ══════════════════════════════════════════════════════════════ */
/* Дробные деньги: fmt() режет копейки, а дельта изменения обязана сходиться
   с договором до цента. usd() показывает копейки только когда они есть. */
const usd = n => {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return Math.abs(v % 1) < 0.005 ? fmt(v) : v.toLocaleString('ru-RU', { minimumFractionDigits:2, maximumFractionDigits:2 });
};
const CH_LIVE  = ['Принято', 'Применено'];        // изменения, вошедшие в договор
const CH_KINDS = ['добавить', 'убрать', 'цена', 'объём', 'срок'];

const chgAll     = () => (D.changes || []);
const chgSt      = c => String((c && c.status) || '').trim();
const chgLive    = () => chgAll().filter(c => CH_LIVE.includes(chgSt(c)));
const chgPending = () => chgAll().filter(c => chgSt(c) === 'Заявлено');
const chgMine    = () => chgPending().filter(c => String(c.by || '') === String(D.who));
const chgTheirs  = () => chgPending().filter(c => String(c.by || '') !== String(D.who));
const chgToApply = () => chgAll().filter(c => chgSt(c) === 'Принято');
const chgDone    = () => chgAll().filter(c => ['Применено', 'Оспорено'].includes(chgSt(c)));

/* Действующий договор. База — то, что лежит в 07_Настройки (заказчику приходит
   в settings, работнику — в my_money). Дельта — сумма принятых изменений. */
function dealBase(){
  const S = D.settings || {};
  return Number(S['Договор_USD'] != null ? S['Договор_USD'] : ((D.my_money || {}).contract_usd || 0)) || 0;
}
function dealDelta(){ return Math.round(chgLive().reduce((a, c) => a + (Number(c.d_usd) || 0), 0) * 100) / 100; }
function dealSum(){ return Math.round((dealBase() + dealDelta()) * 100) / 100; }
function paidSum(){
  const S = D.settings || {};
  return Number(S['Оплачено_за_работу_USD'] != null ? S['Оплачено_за_работу_USD'] : ((D.my_money || {}).received_usd || 0)) || 0;
}
function dealRest(){ return Math.round((dealSum() - paidSum()) * 100) / 100; }
function dealDaysDelta(){ return Math.round(chgLive().reduce((a, c) => a + (Number(c.d_days) || 0), 0) * 10) / 10; }
function dealNote(){
  const d = dealDelta();
  if(!d) return '';
  return 'база ' + usd(dealBase()) + ' ' + (d > 0 ? '+' : '−') + ' изменения ' + usd(Math.abs(d));
}

/* Форма заявки. Живёт вне render(), поэтому переключение вида не теряет ввод. */
let CHG = { kind:'цена', code:'', room:'', section:'', name:'', unit:'', vol:'', rate:'', price:'', days:'', comment:'' };

function chgOpen(){
  CHG = { kind:'цена', code:'', room:'', section:'', name:'', unit:'', vol:'', rate:'', price:'', days:'', comment:'' };
  go('chgnew');
}
function chgSet(field, el){

  const box = document.getElementById('chgPreview');
  if(box) box.innerHTML = chgPreview();
}
function chgPickKind(v){ CHG.kind = v; render(); }
function chgPickWork(el){ CHG.code = el.value; render(); }

function chgWork(){ return (D.works || []).find(w => w.code === CHG.code) || null; }
const workPrice = w => Number((w && w.price_alloc_usd) || 0) || 0;
const workDur   = w => Number((w && w.dur) || 0) || 0;

/* Работы, доступные для изменения: принятые заморожены решением чата 006 —
   цена «Готово» не пересматривается, изменения действуют вперёд. */
function chgOpenWorks(){
  return (D.works || []).filter(w => w.status !== 'Готово' && w.status !== 'Снято');
}

function chgCalc(){
  const k = CHG.kind;
  if(k === 'добавить'){
    const vol = Number(CHG.vol) || 0, rate = Number(CHG.rate) || 0;
    if(!CHG.name || !CHG.room) return null;
    const sum = Math.round(vol * rate * 100) / 100;
    return { what:'Добавить работу', was:'—',
             now:[CHG.name, CHG.room, CHG.section || 'Изменение', CHG.unit || 'компл', vol, rate].join(' | '),
             d_usd:sum, d_days:Number(CHG.days) || 0,
             human:CHG.name + ' · ' + vol + ' ' + (CHG.unit || 'компл') + ' × ' + usd(rate) + ' = ' + usd(sum) + ' USD' };
  }
  const w = chgWork();
  if(!w) return null;
  if(k === 'убрать')
    return { what:'Убрать работу', was:usd(workPrice(w)) + ' USD', now:'снято',
             d_usd:-workPrice(w), d_days:-workDur(w),
             human:'из договора уйдёт ' + usd(workPrice(w)) + ' USD и ' + workDur(w) + ' дн' };
  if(k === 'цена'){
    if(CHG.price === '') return null;
    const np = Number(CHG.price) || 0;
    return { what:'Цена работы', was:usd(workPrice(w)) + ' USD', now:usd(np) + ' USD',
             d_usd:Math.round((np - workPrice(w)) * 100) / 100, d_days:0,
             human:'было ' + usd(workPrice(w)) + ' → станет ' + usd(np) + ' USD' };
  }
  if(k === 'объём'){
    if(CHG.vol === '') return null;
    const nv = Number(CHG.vol) || 0;
    const rate = Number(w.qty) > 0 ? workPrice(w) / Number(w.qty) : 0;
    const np = Math.round(nv * rate * 100) / 100;
    return { what:'Объём работы', was:w.qty + ' ' + (w.unit || ''), now:nv + ' ' + (w.unit || ''),
             d_usd:Math.round((np - workPrice(w)) * 100) / 100, d_days:0,
             human:'по ставке ' + usd(Math.round(rate * 100) / 100) + ' за единицу цена станет ' + usd(np) + ' USD' };
  }
  if(k === 'срок'){
    if(CHG.days === '') return null;
    const nd = Number(CHG.days) || 0;
    return { what:'Длительность', was:workDur(w) + ' дн', now:nd + ' дн',
             d_usd:0, d_days:Math.round((nd - workDur(w)) * 10) / 10,
             human:'было ' + workDur(w) + ' → станет ' + nd + ' дн' };
  }
  return null;
}

/* Время в поясе объекта: сервер n8n живёт не по Ташкенту (грабля чата 006),
   поэтому метку ставит панель, а не сервер. */
function chgStamp(){
  const d = new Date(Date.now() + (5 * 60 + new Date().getTimezoneOffset()) * 60000);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

async function chgSubmit(){
  const c = chgCalc();
  if(!c){ toast('Заполните поля заявки', 'err'); return; }
  if(CHG.kind !== 'добавить' && !CHG.code){ toast('Выберите работу', 'err'); return; }
  if(!c.d_usd && !c.d_days){ toast('Изменение ничего не меняет', 'err'); return; }

  // код строки для новой работы: продолжаем нумерацию помещения
  let code = CHG.code;
  if(CHG.kind === 'добавить'){
    const room = (D.rooms || []).find(r => r.name === CHG.room);
    const pref = room ? room.code : 'NEW';
    const used = (D.works || []).filter(w => String(w.code || '').indexOf(pref + '-') === 0)
      .map(w => parseInt(String(w.code).split('-')[1], 10) || 0);
    code = pref + '-' + String((used.length ? Math.max.apply(null, used) : 0) + 1).padStart(2, '0');
  }

  const row = {
    'id': 'CH-' + Date.now().toString(36).toUpperCase(),
    'Время': chgStamp(),
    'Инициатор': D.who,
    'Вид': CHG.kind,
    'Код_работы': code,
    'Что_меняем': c.what,
    'Было': c.was,
    'Стало': c.now,
    'Дельта_USD': c.d_usd || 0,
    'Дельта_дней': c.d_days || 0,
    'Статус': 'Заявлено',
    'Решил': '',
    'Комментарий': CHG.comment || '',
  };
  toast('Отправляю на согласование…', 'wait');
  try{
    const r = await fetch(API + '/append', {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ initData:INIT, key:KEY, sheet:'11_Изменения', rows:[row] })
    });
    const t = (await r.text()).trim();
    if(!r.ok || !t) throw new Error('Не удалось отправить заявку');
    toast('Заявлено — ждёт ответа второй стороны');
    await load();
    back();
  }catch(e){ toast(e.message, 'err'); }

/* Применение принятой заявки к 01_Работы. Цена считается от дельты, а не
   разбором текста: дельта — то, что стороны согласовали, и именно она
   должна сойтись с договором. */
async function chgApply(id, quiet){
  const c = chgAll().find(x => String(x.id) === String(id));
  if(!c) return;
  const k = String(c.kind || '').trim();
  const w = (D.works || []).find(x => x.code === c.code);
  try{
    if(k === 'добавить'){
      const p = String(c.now || '').split('|').map(x => x.trim());
      const vol = Number(p[4]) || 0, rate = Number(p[5]) || 0;
      const r = await fetch(API + '/append', {
        method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ initData:INIT, key:KEY, sheet:'01_Работы', rows:[{
          'Код': c.code, 'Помещение': p[1] || '', 'Раздел': p[2] || 'Изменение', 'Работа': p[0] || '',
          'Ед': p[3] || '', 'Объём': vol, 'Ставка_USD': rate || '',
          'Категория': 'Изменение',
          'Цена_аллокация_USD': Math.round(vol * rate * 100) / 100,
          'Статус': 'Не начато', 'Готовность_%': 0,
          'Длительность_дней': (Number(c.d_days) > 0 ? Number(c.d_days) : ''),
          'Источник': 'изменение ' + c.id, 'Зависит_от': '—',
        }] })
      });
      const t = (await r.text()).trim();
      if(!r.ok || !t) throw new Error('Не удалось добавить работу в смету');
    }else if(k === 'убрать'){
      await writeCell('01_Работы', c.code, 'Статус', 'Снято');
    }else if(k === 'цена'){
      if(!w) throw new Error('Работа ' + c.code + ' не найдена');
      await writeCell('01_Работы', c.code, 'Цена_аллокация_USD', Math.round((workPrice(w) + (Number(c.d_usd) || 0)) * 100) / 100);
    }else if(k === 'объём'){
      if(!w) throw new Error('Работа ' + c.code + ' не найдена');
      await writeCell('01_Работы', c.code, 'Объём', parseFloat(String(c.now)) || 0);
      await writeCell('01_Работы', c.code, 'Цена_аллокация_USD', Math.round((workPrice(w) + (Number(c.d_usd) || 0)) * 100) / 100);
    }else if(k === 'срок'){
      if(!w) throw new Error('Работа ' + c.code + ' не найдена');
      await writeCell('01_Работы', c.code, 'Длительность_дней', parseFloat(String(c.now)) || 0);
    }
    await writeCell('11_Изменения', c.id, 'Статус', 'Применено');
    toast(quiet ? 'Принято и внесено в смету' : 'Внесено в смету');
    await load();
  }catch(e){
    toast('Принято, но применить не удалось: ' + e.message, 'err');
    await load();
  }
}

async function writeCell(sheet, code, field, value){
  const r = await fetch(API + '/update', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData: INIT, key: KEY, sheet: sheet, code: code, field: field, value: value })
  });
  const txt = (await r.text()).trim();
  if (!r.ok || !txt) throw new Error('Не удалось сохранить ' + code);
  patch(sheet, code, field, value);
  return true;
}
async function applyPrices(list){
  if (!list.length) { toast('Нечего записывать', 'err'); return; }
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px;color:#fff;font-size:16px';
  box.innerHTML = '<div style="background:#1c1c1e;border-radius:16px;padding:20px;min-width:240px;text-align:center">Записываю цены…<div id="prN" style="opacity:.7;font-size:14px;margin-top:8px">0 из ' + list.length + '</div></div>';
  document.body.appendChild(box);

  for (const it of list) {
    try { await writeCell('01_Работы', it.code, 'Цена_Юрия_USD', String(it.value)); ok++; }

function spreadPrices(onlyEmpty){
  const inp = document.getElementById('spSum');
  const sum = Number(String(inp ? inp.value : '').replace(',', '.'));
  if (!(sum > 0)) { toast('Введите сумму больше нуля', 'err'); return; }
  const targets = (D.works || []).filter(w => onlyEmpty ? !(Number(w.price_contractor_usd) > 0) : true);
  const base = targets.reduce((s, w) => s + (Number(w.price_alloc_usd) || 0), 0);
  if (!(base > 0)) { toast('Не от чего считать пропорцию', 'err'); return; }
  const list = targets.map(w => ({ code: w.code, name: w.name,
    value: Math.round(sum * (Number(w.price_alloc_usd) || 0) / base * 100) / 100 })).filter(x => x.value > 0);
  const total = list.reduce((s, x) => s + x.value, 0);
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:18px';
  box.innerHTML =
    '<div style="background:#1c1c1e;color:#fff;border-radius:16px;padding:18px;max-width:420px;width:100%;font-size:15px">' +
      '<div style="font-weight:700;margin-bottom:8px">Разнести ' + fmt(sum) + ' USD</div>' +
      '<div style="opacity:.7;font-size:14px;margin-bottom:12px">Пропорционально договорной цене работ.<br>Позиций: <b>' + list.length + '</b>, сумма после округления: <b>' + fmt(total) + ' USD</b><br>' +
      (onlyEmpty ? 'Затрагиваются только работы без цены.' : 'Перезапишутся все цены, включая заданные.') + '</div>' +
      '<div style="display:flex;gap:8px">' +
        '<button id="spNo" style="flex:1;padding:13px;border-radius:12px;border:0;background:#3a3a3c;color:#fff;font-size:15px">Отмена</button>' +
        '<button id="spYes" style="flex:1;padding:13px;border-radius:12px;border:0;background:#0a84ff;color:#fff;font-size:15px">Записать</button>' +
      '</div></div>';
  document.body.appendChild(box);
  box.querySelector('#spNo').onclick = () => box.remove();
  box.querySelector('#spYes').onclick = () => { box.remove(); applyPrices(list); };
}

async function upd(sheet, code, field, value, opts){
  // Работник не пишет «Готово» напрямую (ни голосом, ни вручную):
  // любое его «Готово» становится ЗАЯВКОЙ на приёмку заказчику.
  const claimed = (!(opts&&opts.confirm) && field === "Статус" && value === "Готово");
  /* Мягкая проверка зависимостей: если предшественник ещё не принят —
     спрашиваем, но не запрещаем (карта связей черновая).            */
  if (claimed && sheet === "01_Работы" && !(opts && opts.skipDeps)) {
    const _w = (D.works || []).find(x => x.code === code);
    const _b = depBlockers(_w);
    if (_b.length) {
      const _go = await depAsk(_w, _b);
      if (!_go) { toast("Отменено", "err"); return false; }
    }
  }
  if(claimed) value = (D.role === "worker") ? "Заявлено" : "На приёмке у работника";
  toast(claimed ? "Отправляю на приёмку…" : "Сохраняю…", "wait");
  try{
    const r = await fetch(`${API}/update`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: INIT, key: KEY, sheet, code, field, value })
    });
    /* При отказе сервер отдаёт пустой ответ с кодом 200 (n8n throw → пустое тело).
       Поэтому «успех» = ok И непустое тело; пустое тело трактуем как отказ.      */
    const t = (await r.text()).trim();
    if(!r.ok || !t){
      throw new Error(t.includes("403") ? "Это поле только для чтения" : "Не удалось сохранить");
    }
    patch(sheet, code, field, value);
    tg?.HapticFeedback?.notificationOccurred("success");
    toast(claimed ? (D.role === "worker" ? "Заявлено — ждёт приёмки заказчиком" : "Отправлено работнику на подтверждение") : "Сохранено");
    return true;
  }catch(e){
    tg?.HapticFeedback?.notificationOccurred("error");
    toast(e.message, "bad");
    load();                                   // откатить экран к правде сервера
    return false;
  }
}

/* локально отразить правку — чтобы прогресс и суммы пересчитались сразу */
function patch(sheet, code, field, value){
  if(sheet === "01_Работы"){
    const w = D.works.find(x => x.code === code);
    if(!w) return;
    if(field === "Статус")        w.status   = value;
    if(field === "Готовность_%")  w.progress = Number(value) || 0;
    if(field === "Цена_Юрия_USD") w.price_contractor_usd = value === "" ? null : Number(value);
    if(field === "Комментарий")   w.comment  = value;
    if(w.status === "Готово") w.progress = 100;
  }
  if(sheet === "03_Материалы"){
    const m = D.materials.find(x => x.name === code);
    if(!m) return;
    if(field === "Куплено")       m.in  = Number(value) || 0;
    if(field === "Израсходовано") m.out = Number(value) || 0;
    m.rest = (m.in || 0) - (m.out || 0);
  }
}

/* ══════════════════════════════════════════════════════════════
   ЛИСТЫ БРИГАДЫ [чат 012] — разовая подготовка общей базы.
   Четыре листа контура бригады (Работники · Наряды · Табель ·
   Отчёты_бригады) создаются через POST /remont/sheet с base:"common",
   по одному и строго последовательно: параллельные addSheet на одну
   таблицу конфликтуют. Шапки — ровно те, что читает GET-ветка API
   по параметру crew; менять их отдельно от кода ноды нельзя.
   Существующий лист сервер не пересоздаёт: ответ приходит без ok —
   считаем «видимо, уже был» (не ошибка); упавший fetch — сбой связи,
   его за «уже был» не выдаём. Замок CREW_BUSY: без него двойной тап
   (клики копятся в очереди событий, пока идут запросы) запускал
   второй круг — воспроизведено при первом живом нажатии [чат 012].
   После полного прохода плитка исчезает (CREW_DONE). Бригада может
   состоять из одного человека (решение 012): пустые листы — норма.
   ══════════════════════════════════════════════════════════════ */
const CREW_SHEETS = [
  { sheet: "Работники",      header: ["Бригадир","Имя","Telegram_ID","Телефон","Статус","Ставка_час_USD","Добавлен","Отключён","Примечание"] },
  { sheet: "Наряды",         header: ["id","Бригадир","Работник","Дата","Объект","Занятость","Задание","Статус","Создан"] },
  { sheet: "Табель",         header: ["id","Работник","Объект","Дата","Событие","Время","Отметил","Статус","Подтвердил","Комментарий"] },
  { sheet: "Отчёты_бригады", header: ["id","Дата","Работник","Тип","Код","Значение","Комментарий","Статус","Стало","Решил","Время"] },
];
let CREW_BUSY = false, CREW_DONE = false;
async function crewSheets(){
  if(CREW_BUSY) return;
  if(!confirm("Подготовить листы бригады в общей базе (4 листа)?")) return;
  CREW_BUSY = true;
  toast("Готовлю листы…", "wait");
  const made = [], had = [], fail = [];
  try{
    for(const s of CREW_SHEETS){
      try{
        const r = await fetch(API + "/sheet", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: INIT, key: KEY, sheet: s.sheet, header: s.header, base: "common" })
        });
        const txt = (await r.text()).trim();
        let ok = false;
        try{ ok = !!(txt && JSON.parse(txt).ok); }catch(e){}
        (ok ? made : had).push(s.sheet);
      }catch(e){ fail.push(s.sheet); }
    }
  } finally { CREW_BUSY = false; }
  CREW_DONE = !fail.length;
  if(fail.length && !made.length && !had.length){
    toast("Нет связи с сервером — листы не созданы", "err");
  } else {
    toast("Создано: " + made.length
      + (had.length ? " · видимо, уже были: " + had.length : "")
      + (fail.length ? " · сбой связи: " + fail.length : ""));
  }
  render();
}

/* ══════════════════════════════════════════════════════════════
   БРИГАДА [чат 012, экраны — чат 013] — контур бригадира и работника.
   Данные контура грузятся ОТДЕЛЬНЫМ запросом с параметром crew и живут
   в CREW_DATA, а не в D: поллинг каждые 15 секунд перезаписывает D
   целиком и затёр бы их. Обновление — заходом на экран или кнопкой.
   Бригада может состоять из одного человека (решение 012): пустой
   реестр — норма, бригадир работает сам; экраны прямо это говорят.
   Цепочка доверия (разбор 09): работник заявляет → бригадир
   подтверждает или правит → только после этого запись факт учёта.
   Ставка работника заказчику и самому работнику не показывается.  */
let CREW_DATA = null, CREW_LOAD = false;

async function crewLoad(){
  const auth = INIT ? "initData=" + encodeURIComponent(INIT) : "key=" + encodeURIComponent(KEY);
  const r = await fetch(API + "/data?" + auth + "&crew=1", { cache: "no-store" });
  const raw = (await r.text()).trim();
  let j = null; try{ j = JSON.parse(raw); }catch(e){}
  if(!j || !j.crew) throw new Error("нет данных бригады");
  CREW_DATA = j.crew;
  CREW_TS = Date.now();
  return CREW_DATA;
}
/* Один вход для всех экранов контура: свежие данные, затем переход. */
async function openCrewScreen(k){
  if(CREW_LOAD) return;
  CREW_LOAD = true;
  try{
    toast("Загружаю бригаду…", "wait");
    await crewLoad();
    toast("Готово");
    if(stack[stack.length - 1] === k) render(); else go(k);
  }catch(e){ toast("Не удалось загрузить бригаду", "err"); }
  finally{ CREW_LOAD = false; }
}

/* Живые данные бригады (кандидат прогона 014): экраны контура тихо
   подтягивают свежее сами. Тик пропускается, когда идёт ввод или запись —
   перерисовка не должна красть фокус и сбрасывать поля. */
let CREW_TS = 0;
const CREW_LIVE = ["crew", "crew_orders", "crew_time", "crew_reports", "crew_cal"];
function crewFresh(){
  try{
    if(document.visibilityState !== "visible") return;
    if(!D || !D.kind) return;
    const scr = stack[stack.length - 1];
    const need = (D.kind === "hand" && scr === "home") || CREW_LIVE.indexOf(scr) >= 0;
    if(!need) return;
    if(Date.now() - CREW_TS < 75000) return;
    if(CREW_LOAD || HM || HM_BUSY || HR_BUSY) return;
    const a = document.activeElement;
    if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
    CREW_TS = Date.now(); /* тики не наслаиваются */
    crewLoad().then(() => render()).catch(() => {});
  }catch(e){}
}
setInterval(crewFresh, 30000);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") crewFresh(); });

/* Тихая запись ячейки контура: без локального patch (данные в CREW_DATA
   правим сами по месту). Пустое тело при 200 = отказ (граблина 6).   */
async function crewCell(sheet, code, field, value){
  const r = await fetch(API + "/update", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData: INIT, key: KEY, sheet: sheet, code: code, field: field, value: value }) });
  const t = (await r.text()).trim();
  if(!r.ok || !t) throw new Error("Не удалось сохранить (" + field + ")");
  return true;
}
async function crewAppend(sheet, rows){
  const r = await fetch(API + "/append", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData: INIT, key: KEY, sheet: sheet, rows: rows }) });
  const t = (await r.text()).trim();
  let ok = false; try{ ok = !!(t && JSON.parse(t).ok); }catch(e){}
  if(!r.ok || !ok) throw new Error("Сервер не принял запись");
  return true;
}

/* Даты и время — всегда в поясе объекта (+5), как chgStamp: телефоны
   работников могут жить в любом поясе, а табель — в ташкентском.     */
function crewToday(){ return chgStamp().slice(0, 10); }
function crewNow(){ return chgStamp().slice(11, 16); }
function dShift(iso, n){
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function dLabel(iso){
  const t = crewToday();
  if(iso === t) return "сегодня";
  if(iso === dShift(t, 1)) return "завтра";
  if(iso === dShift(t, -1)) return "вчера";
  const d = new Date(iso + "T00:00:00Z");
  const wd = ["вс","пн","вт","ср","чт","пт","сб"][d.getUTCDay()] || "";
  return iso.slice(8, 10) + "." + iso.slice(5, 7) + " " + wd;
}
function crewId(pfx){ return pfx + "-" + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 36).toString(36).toUpperCase(); }
const CREW_BTN  = 'style="padding:10px 14px;border-radius:10px;border:0;background:#0a84ff;color:#fff;font-size:14px"';

function invGen(){
  const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";   // без похожих O/0, I/1, L
  const buf = new Uint32Array(8);
  crypto.getRandomValues(buf);
  return [...buf].map(x => A[x % A.length]).join("");
}
function invLink(code){ return "https://t.me/ss_remont_bot?startapp=inv_" + code; }
function invShare(code){

/* Отключение работника = Статус «отключён» + снятие будущих нарядов.
   Строка не удаляется: на ней висят табель и подтверждённые отчёты
   (разбор 09 §3.1). Полное гашение строки в 09_Доступы — за заказчиком:
   у бригадира нет прав на лист доступов, и это правильно.            */
let CW_OFF_BUSY = false;
async function cwOff(i){
  const w = (((CREW_DATA || {}).workers) || [])[i];
  if(!w || CW_OFF_BUSY) return;
  if(!confirm("Отключить работника «" + w.name + "»? Наряды вперёд снимутся (начатый сегодняшний день останется), история цела.")) return;
  CW_OFF_BUSY = true;
  try{
    toast("Отключаю…", "wait");
    await crewCell("Работники", w.name, "Статус", "отключён");
    await crewCell("Работники", w.name, "Отключён", crewToday());
    const today = crewToday();
    /* Сегодняшний наряд снимается, только если день не начат: есть отметки
       табеля — день считается рабочим и остаётся (уточнение прогона 014). */
    const dayStarted = (((CREW_DATA || {}).time) || []).some(x =>
      String(x.worker || "").trim() === String(w.name).trim() &&
      String(x.date || "") === today && String(x.status || "") !== "отклонено");
    const future = ((CREW_DATA || {}).orders || []).filter(o =>
      String(o.worker || "").trim() === String(w.name).trim() &&
      String(o.status || "") === "назначен" &&
      (String(o.date || "") > today || (String(o.date || "") === today && !dayStarted)));
    for(const o of future){ await crewCell("Наряды", o.id, "Статус", "отменён"); o.status = "отменён"; }
    w.status = "отключён"; w.off = crewToday();
    toast("Отключён" + (future.length ? " · снято нарядов: " + future.length : ""));
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ CW_OFF_BUSY = false; }
}
async function cwOn(i){

/* ── НАРЯДЫ (бригадир): кто где завтра ── */
let ORD_BUSY = false, ORD_PAST = false;
function ordActive(){ return (((CREW_DATA || {}).orders) || []).filter(o => String(o.status || "") !== "отменён"); }
async function ordCreate(){
  const g = id => String((document.getElementById(id) || {}).value || "").trim();
  const worker = g("or_worker"), from = g("or_from"), to = g("or_to") || from;
  const load0 = g("or_load"), hours = g("or_hours"), object = g("or_object"), task = g("or_task");
  if(!worker){ toast("Выберите работника", "err"); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(from)){ toast("Укажите дату", "err"); return; }
  if(to < from){ toast("Дата «по» раньше даты «с»", "err"); return; }
  if(!task){ toast("Напишите задание", "err"); return; }
  const load = load0 === "часы" ? ("часы " + (Number(hours) || 4)) : load0;
  const days = [];
  for(let d = from; d <= to && days.length < 31; d = dShift(d, 1)) days.push(d);
  if(days.length > 14 && !confirm("Наряд на " + days.length + " дней подряд — создать?")) return;
  /* Конфликт (разбор 09 §3.2): два «весь день» на одну дату — предупреждаем,
     но не запрещаем: бывает переброска в середине дня. */
  const busyDays = days.filter(d => ordActive().some(o =>
    String(o.worker || "").trim() === worker && String(o.date || "") === d &&
    String(o.load || "") === "весь день" && load === "весь день"));
  if(busyDays.length && !confirm(worker + " уже занят весь день: " + busyDays.map(dLabel).join(", ") + ". Всё равно назначить?")) return;
  if(ORD_BUSY) return;
  ORD_BUSY = true;
  try{
    toast("Создаю наряд…", "wait");
    const rows = days.map(d => ({
      "id": crewId("NR"), "Бригадир": D.who, "Работник": worker, "Дата": d,
      "Объект": object, "Занятость": load, "Задание": task,
      "Статус": "назначен", "Создан": chgStamp(),
    }));
    await crewAppend("Наряды", rows);
    toast("Наряд создан" + (rows.length > 1 ? " на " + rows.length + " дн" : ""));
    await crewLoad(); render();
  }catch(e){ toast(e.message, "err"); }
  finally{ ORD_BUSY = false; }
}

/* ── ТАБЕЛЬ (бригадир): подтверждение отметок ── */
let TM_BUSY = false, TM_FIX = null, TM_ALL = false;
async function tmDecide(i, mode){
  const t = (((CREW_DATA || {}).time) || [])[i];
  if(!t || TM_BUSY) return;
  if(mode === "reject" && !confirm("Отклонить отметку «" + (t.event || "") + " " + (t.time || "") + "» (" + (t.worker || "") + ")?")) return;
  let newTime = "";
  if(mode === "fix"){
    newTime = String((document.getElementById("tm_" + i) || {}).value || "").trim();
    if(!/^\d{2}:\d{2}$/.test(newTime)){ toast("Время — в формате ЧЧ:ММ", "err"); return; }
  }
  if(TM_BUSY) return;
  TM_BUSY = true;
  try{
    toast("Сохраняю…", "wait");
    if(mode === "fix"){
      await crewCell("Табель", t.id, "Время", newTime);
      await crewCell("Табель", t.id, "Статус", "исправлено");
      t.time = newTime; t.status = "исправлено";
    } else if(mode === "reject"){
      await crewCell("Табель", t.id, "Статус", "отклонено");
      t.status = "отклонено";
    } else {
      await crewCell("Табель", t.id, "Статус", "подтверждено");
      t.status = "подтверждено";
    }
    await crewCell("Табель", t.id, "Подтвердил", D.who);
    t.confirmed = D.who;
    TM_FIX = null;
    toast(mode === "reject" ? "Отметка отклонена" : "Отметка " + (mode === "fix" ? "исправлена" : "подтверждена"));
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ TM_BUSY = false; }
}
/* Человекодни: уникальные пары дата+работник по подтверждённым отметкам —
   та же формула, что в GET-ноде для заказчика. */
function tmMandays(rows){
  const seen = {};
  rows.forEach(r => {
    if(["подтверждено", "исправлено"].includes(String(r.status || ""))){
      seen[String(r.date || "") + "|" + String(r.worker || "")] = 1;
    }
  });
  return Object.keys(seen).length;
}

/* ── ОТЧЁТЫ (бригадир): буфер работ и материалов от работников ──
   Принять как есть → «принято»; поправить значение → «исправлено»,
   исходное остаётся в «Значение», версия бригадира — в «Стало»:
   через месяц в споре важно, что именно сказал работник (разбор 09).
   Только принятое уходит в учёт объекта: работа → Готовность_%,
   материал → Израсходовано (+= значение).                          */
let RP_BUSY = false;
async function rpDecide(i, mode){
  const p = (((CREW_DATA || {}).reports) || [])[i];
  if(!p || RP_BUSY) return;
  if(mode === "reject" && !confirm("Отклонить отчёт " + (p.worker || "") + "?")) return;
  let val = String(p.value || "").trim();
  if(mode === "accept"){
    val = String((document.getElementById("rp_" + i) || {}).value || "").trim().replace(",", ".");
    if(val === "" || isNaN(Number(val))){ toast("Значение — число", "err"); return; }
  }
  if(RP_BUSY) return;
  RP_BUSY = true;
  try{
    toast("Сохраняю…", "wait");
    if(mode === "reject"){
      await crewCell("Отчёты_бригады", p.id, "Статус", "отклонено");
      p.status = "отклонено";
    } else {
      const changed = String(val) !== String(p.value ?? "").trim().replace(",", ".");
      if(changed){
        await crewCell("Отчёты_бригады", p.id, "Стало", val);
        await crewCell("Отчёты_бригады", p.id, "Статус", "исправлено");
        p.corrected = val; p.status = "исправлено";
      } else {
        await crewCell("Отчёты_бригады", p.id, "Статус", "принято");
        p.status = "принято";
      }
    }
    await crewCell("Отчёты_бригады", p.id, "Решил", D.who);
    p.solved = D.who;
    /* Перенос в учёт объекта — после фиксации решения: если он упадёт,
       решение уже записано, а учёт бригадир поправит руками по подсказке. */
    let carried = true;
    if(mode !== "reject"){
      try{
        if(String(p.type || "") === "работа"){
          const w = (D.works || []).find(x => x.code === String(p.code || "").trim());
          if(w){
            const prog = Math.max(0, Math.min(100, Number(val)));
            await crewCell("01_Работы", w.code, "Готовность_%", prog);
            patch("01_Работы", w.code, "Готовность_%", prog);
            if(prog >= 100) toast("Готовность 100% — заявите приёмку на экране «Работы»", "wait");
          } else toast("Работа «" + String(p.code || "") + "» не найдена в смете — учёт не тронут", "err");
        } else {
          const name = String(p.code || "").trim();
          const m = (D.materials || []).find(x => String(x.name || "").trim() === name);
          if(m){
            const total = (Number(m.out) || 0) + Number(val);
            await crewCell("03_Материалы", name, "Израсходовано", total);
            patch("03_Материалы", name, "Израсходовано", total);
          } else {
            await crewAppend("03_Материалы", [{ "Материал": name, "Израсходовано": val, "Источник": "отчёт бригады" }]);
          }
        }
      }catch(e2){ carried = false; toast("Решение записано, но учёт не обновился — поправьте с экрана работ или материалов", "err"); }
    }
    if(carried) toast(mode === "reject" ? "Отчёт отклонён" : "Отчёт принят — учёт обновлён");
    render();
  }catch(e){ toast(e.message, "err"); }
  finally{ RP_BUSY = false; }
}

/* ── РАБОТНИК (hand): свой день, календарь, отчёты ── */
let HM = null, HM_BUSY = false, HR_BUSY = false, HR_TYPE = "работа";
/* Черновики обеих вкладок отчёта: переключение вкладки не теряет ввод,
   отправка забирает все заполненные части (кандидат прогона 014). */
let HR_DRAFT = { "работа": { code: "", val: "", comment: "" }, "материал": { mat: "", val: "", comment: "" } };
function hrSet(field, el){ HR_DRAFT[HR_TYPE][field] = String(el.value == null ? "" : el.value); }
function hrTab(v){ HR_TYPE = v; render(); }
function handMyOrders(){ return ordActive(); }   // сервер уже отдал hand только его наряды
function handObject(){
  const today = crewToday();
  const t = handMyOrders().find(o => String(o.date || "") === today);
  if(t) return String(t.object || "");
  const past = handMyOrders().filter(o => String(o.date || "") <= today).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  return past.length ? String(past[past.length - 1].object || "") : "";
}
function handMark(ev){ HM = { ev: ev, mode: "now" }; render(); }
function handMarkTime(){
  if(!HM) return "";
  const now = crewNow();
  if(HM.mode === "custom"){
    const v = String((document.getElementById("hm_time") || {}).value || "").trim();
    return /^\d{2}:\d{2}$/.test(v) ? (v > now ? now : v) : "";
  }
  const shift = { now: 0, m10: 10, m30: 30, m60: 60 }[HM.mode] || 0;
  const mins = Math.max(0, Number(now.slice(0, 2)) * 60 + Number(now.slice(3, 5)) - shift);
  const p = n => String(n).padStart(2, "0");
  return p(Math.floor(mins / 60)) + ":" + p(mins % 60);
}
async function handMarkGo(){
  if(!HM || HM_BUSY) return;
  const t = handMarkTime();
  if(!t){ toast("Время — в формате ЧЧ:ММ, не позже текущего", "err"); return; }
  const today = crewToday();
  const dup = (((CREW_DATA || {}).time) || []).some(x =>
    String(x.date || "") === today && String(x.event || "") === HM.ev && String(x.status || "") !== "отклонено");
  if(dup && !confirm("Отметка «" + HM.ev + "» сегодня уже есть. Добавить ещё одну?")) return;
  HM_BUSY = true;
  try{
    toast("Записываю…", "wait");
    await crewAppend("Табель", [{
      "id": crewId("TB"), "Работник": D.who, "Объект": handObject(), "Дата": today,
      "Событие": HM.ev, "Время": t, "Отметил": D.who, "Статус": "заявлено",
      "Подтвердил": "", "Комментарий": "",
    }]);
    toast("Отмечено: " + HM.ev + " " + t + " — уйдёт бригадиру на подтверждение");
    HM = null;
    await crewLoad(); render();
  }catch(e){ toast(e.message, "err"); }
  finally{ HM_BUSY = false; }
}
async function handReport(){
  if(HR_BUSY) return;
  /* Уходят ВСЕ заполненные вкладки, а не только открытая (кандидат прогона 014). */
  const w = HR_DRAFT["работа"], m = HR_DRAFT["материал"];
  const wFilled = !!(w.code || String(w.val).trim());
  const mFilled = !!(String(m.mat).trim() || String(m.val).trim());
  if(!wFilled && !mFilled){ toast("Заполните работу или материал", "err"); return; }
  const rows = [], errs = [];
  if(wFilled){
    const n = Number(String(w.val).replace(",", "."));
    if(!w.code) errs.push("работа: выберите из списка");
    else if(!(n >= 0 && n <= 100)) errs.push("работа: готовность — число от 0 до 100");
    else rows.push({ t: "работа", c: w.code, v: String(n), k: String(w.comment || "").trim() });
  }
  if(mFilled){
    const v = String(m.val).replace(",", ".").trim();
    if(!String(m.mat).trim()) errs.push("материал: напишите, какой");
    else if(v === "" || isNaN(Number(v))) errs.push("материал: количество — число");
    else rows.push({ t: "материал", c: String(m.mat).trim(), v: v, k: String(m.comment || "").trim() });
  }
  if(errs.length){ toast(errs.join(" · "), "err"); return; }
  HR_BUSY = true;
  try{

function toast(msg, kind){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast on" + (kind ? " " + kind : "");

/* ── НАВИГАЦИЯ (стек, ровно один уровень вглубь) ───────────── */
function go(k){ stack.push(k); render(true); }
function back(){ if(stack.length > 1){ stack.pop(); render(true); } }

function render(toTop){
  const k = stack[stack.length - 1];
  app.innerHTML = (SCREENS[k] || SCREENS.home)();
  if(toTop) window.scrollTo(0, 0);
  if(tg){
    if(stack.length > 1){ tg.BackButton.show(); tg.BackButton.onClick(back); }
    else tg.BackButton.hide();
  }
}

const progress = () => D.works.length
  ? D.works.reduce((s,w) => s + (w.progress || 0), 0) / D.works.length : 0;

/* Деньги от приёмки. «Принято» — только статус «Готово» (подтверждено заказчиком).
   «В работе» — незавершённые, пропорционально проценту готовности (справочно).
   Поле: заказчику — договорная разнесённая цена, работнику — его цена. */
const accSum = f => D.works.filter(w => w.status === "Готово")
  .reduce((s,w) => s + (Number(w[f]) || 0), 0);
const wipSum = f => D.works.filter(w => w.status !== "Готово" && (w.progress || 0) > 0)
  .reduce((s,w) => s + (Number(w[f]) || 0) * (w.progress || 0) / 100, 0);
